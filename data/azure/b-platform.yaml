provider: azure
bucket: b
product: Microsoft Foundry Agent Service
aliases:
  - Azure AI Foundry Agent Service
  - Azure AI Agent Service
  - Foundry Agent Service
notes: >
  RENAMED: docs now say "Microsoft Foundry", not "Azure AI Foundry". The canonical URL is
  learn.microsoft.com/en-us/azure/foundry/agents/overview and ms.service is
  "microsoft-foundry". Keep the older aliases searchable.
  "Foundry Agent Service is a managed platform for building, deploying, and scaling AI
  agents. Build with any framework, any supported model from the Foundry model catalog, and
  a single entry point for model inference and tools."
  Overview ms.date 2026-10-26 (re-read 2026-11-23). Changes since the August read: a third
  agent type, voice-based prompt agents ("Voice agents are generally available, with some
  features still in preview"); an opt-in "Microsoft Copilot harness (preview)" for prompt
  agents; Agent optimizer now labelled preview; A2A v1.0 GA; the overview's blanket "memory
  and web search are in preview" sentence was removed; Azure AI Search is now branded
  "Foundry IQ (Azure AI Search)".

capabilities:
  managed_agent_runtime:
    product: Agent Runtime
    status: ga
    notes: >
      "Hosts and scales prompt agents and Hosted agents. Manages conversations, tool
      calls, and agent lifecycle."
      THREE AGENT TYPES (was two in August) — a structural difference from other clouds:
      - Prompt agents: "Define instructions, a model, and tools, and Foundry runs the agent
        for you with no code or infrastructure to manage." Cost model: "Per-call inference
        + tool usage".
      - Voice-based prompt agents: "real-time voice agents whose orchestration Foundry
        manages", connected through Voice Live.
      - Hosted agents: your container or zip ("Foundry builds the image for you when you
        bring a .zip file"). Cost model: "Per-call inference + tool usage + container
        compute".
      Explicit GA statement, found on the quotas page (a DIFFERENT source from this cell's
      overview page — see runtime_regions;
      https://learn.microsoft.com/en-us/azure/foundry/agents/concepts/limits-quotas-regions),
      still present 2026-11-23:
      "Foundry Agent Service is generally available (GA). Some sub-features are in public
      preview and might have different constraints."
      Note the second sentence carefully — GA is the SERVICE, not every sub-feature; memory,
      the Copilot harness, and the agent optimizer are preview.
    source: https://learn.microsoft.com/en-us/azure/foundry/agents/overview
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  managed_agent_harness:
    product: Microsoft Copilot harness
    status: preview
    notes: >
      "The Copilot harness is an optional managed runtime for prompt agents. Foundry operates
      the harness and its execution environment. Your resource remains a prompt agent, and
      you continue to invoke it through the Responses API. You don't deploy or maintain
      harness code." When to use it: "Use the Copilot harness when your prompt agent needs
      supported multi-step tool, skill, file, or command workflows and you want Foundry to
      operate the runtime." When to use a hosted agent instead: "Use a hosted agent when you
      need to own the framework, orchestration, middleware, runtime policy, dependencies, or
      process model."
      Pre-wired pieces: a per-conversation workspace and a sandbox. "Foundry provides a
      service-managed, isolated execution environment, called a sandbox, for operations such
      as processing files and running commands." Skills, Toolbox tools and generated files
      are configured on the agent definition rather than coded.
      Stage: the page carries the standard "Items marked preview in this article are
      currently in preview" banner, and says "You select the harness during agent creation
      and can't switch an existing agent during the initial public preview."
      Constraints: "Bring your own model (BYOM) isn't currently supported with the Copilot
      harness." Opt-in is a creation-time choice ("Select Use the Microsoft Copilot
      harness"), and the azd flow needs AZD_ALPHA_ENABLE_AGENTS_MANAGED_HARNESS=true.
      Region and setting limits are on a different page,
      https://learn.microsoft.com/en-us/azure/foundry/agents/concepts/limits-quotas-regions:
      "The Copilot harness is available in a subset of the regions that support prompt
      agents." That is 22 regions (Paraphrase.). The harness also owns sampling and context
      settings: temperature, tool_choice, max_tool_calls, truncation and context_management
      must not be set by the caller (Paraphrase.).
      Close to AWS AgentCore Harness in shape: you configure a vendor-run loop and don't host
      code.
    source: https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/use-tools-skills-copilot-harness
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  voice_agents:
    product: Voice-based prompt agents (via Voice Live)
    status: ga
    notes: >
      A first-class third agent type, not just a speech API used as a tool.
      "Voice-based prompt agents support real-time, spoken conversations without requiring
      you to host voice orchestration." "Foundry Agent Service manages the agent lifecycle
      and uses Voice Live for speech recognition, turn taking, model interaction, and speech
      synthesis." "You connect to the agent over a real-time WebSocket instead of sending
      individual text requests."
      Stage: "Voice agents are generally available, with some features still in preview."
      The preview items need an opt-in header: GPT-Live sessions, inline subagents and
      Handoff, SIP bindings and transfer, telephony campaigns, and post-call delivery
      (Paraphrase.). Also: "Voice API general availability doesn't change the status of
      separately documented preview models, monitoring, evaluation, or WebRTC capabilities."
      Session limit and region table are on a different page,
      https://learn.microsoft.com/en-us/azure/foundry/agents/concepts/limits-quotas-regions:
      "Maximum voice session duration 60 minutes". Stored voice conversations and
      Microsoft-managed audio are retained for 60 days (Paraphrase.). The region table has a
      "Voice-based agents" column marked Yes in 28 of its 30 regions. Poland Central and
      Spain Central are No (Paraphrase.). "For voice-based agents, the region must support
      Agent Service and the required Voice Live capabilities for the selected model and
      channel."
    source: https://learn.microsoft.com/en-us/azure/foundry/agents/overview
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  framework_agnosticism:
    status: documented
    value:
      - Microsoft Agent Framework
      - LangGraph
      - LangChain / Deep Agents
      - OpenAI Agents SDK
      - Anthropic Agent SDK
      - Copilot SDK
      - custom code
    notes: >
      Hosted agents "are code-based agents you build with" Agent Framework, LangGraph, the
      OpenAI Agents SDK, the Anthropic Agent SDK, "or your own code." (Framework names sit in
      links on the page, so they are listed outside the quote marks.) The comparison table's
      authoring surface adds the Copilot SDK. First-party hosting integrations exist for
      "Microsoft Agent Framework or LangGraph, LangChain, or Deep Agents (Python)"; other
      frameworks use the framework-agnostic protocol libraries.
      CrewAI and LlamaIndex are NOT named.
      Third option: keep code outside Foundry entirely — "Call the Responses API directly to
      use Foundry models and tools, with no agent resource to manage."
    source: https://learn.microsoft.com/en-us/azure/foundry/agents/overview
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  managed_agent_loop:
    product: Prompt agents (Foundry)
    status: ga
    notes: >
      "You define prompt agents entirely through configuration, including instructions,
      model selection, and tools." "Either way, Foundry runs the agent for you. There's no
      application code to maintain, and no containers or packages to optimize, scale, or
      monitor for security."
      This is the managed-loop tier: you supply config (model + prompt + tools), Foundry
      runs the agent loop. An optional "Microsoft Copilot harness (preview)" can be selected
      for multi-step tool, skill, file, or command workflows; "Foundry operates the harness".
      Cost: "Per-call inference + tool usage" only — no compute charge.
      Status inherits the service-level statement on the quotas page that Foundry Agent
      Service is generally available; the Copilot harness option itself is preview.
    source: https://learn.microsoft.com/en-us/azure/foundry/agents/overview
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  openai_compatible_endpoint:
    status: documented
    product: Responses API
    notes: >
      "Already run agent code elsewhere? Call the Responses API directly to use Foundry
      models and tools, with no agent resource to manage." Hosted agents call the project
      endpoint for "standard tools like file search, code interpreter, and web search, plus
      additional tools like SharePoint, WorkIQ, and Fabric IQ".
      Calling it directly yields an "ephemeral agent" whose definition lives in your code;
      it cannot use the Copilot harness or the optimizer.
    source: https://learn.microsoft.com/en-us/azure/foundry/agents/overview
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  third_party_catalog:
    status: documented
    notes: >
      "Works with many models from the Foundry model catalog, such as GPT-4o, Llama, and
      DeepSeek. Swap models without changing your agent code."
      Full list is deferred to the Foundry portal — not enumerated here.
    source: https://learn.microsoft.com/en-us/azure/foundry/agents/overview
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  first_party_models:
    product: Foundry Models sold by Azure (Azure OpenAI + Microsoft models)
    status: documented
    value:
      - Azure OpenAI GPT series (OpenAI-built, hosted and sold by Azure)
      - MAI-Thinking-1 (preview)
      - MAI-Image (preview)
      - MAI-Voice / MAI-Transcribe (via Azure Speech)
      - Phi
      - Microsoft-Decision-1.1
    notes: >
      WHAT FIRST-PARTY MEANS HERE. The model docs don't call Azure OpenAI models
      first-party. Microsoft's category is "Foundry Models sold by Azure": "Models sold by
      Azure are also hosted by Azure and operated by Azure as part of the Foundry Models
      service. They include all Azure OpenAI models and specific, selected models from top
      providers". "These models are billed through your Azure subscription, covered by Azure
      service-level agreements, and supported by Microsoft." The only "First Party" wording
      found is a billing term, on a different page,
      https://learn.microsoft.com/en-us/azure/foundry/concepts/foundry-models-overview:
      "Foundry Models sold by Azure are billed via Azure meters as First Party Consumption
      Services." That category also covers partner models sold by Azure (Cohere, DeepSeek,
      Meta, Mistral AI, xAI), so it says who sells the model, not who built it (Paraphrase.).
      MICROSOFT-BUILT MODELS: "Microsoft models include various model groups such as Model
      Router, MAI models, Phi models, healthcare AI models, and more." Microsoft's own
      frontier text model is still preview. From a different page,
      https://learn.microsoft.com/en-us/azure/foundry/foundry-models/how-to/use-foundry-models-mai-thinking:
      "MAI-Thinking-1 (preview) is a reasoning model from Microsoft for workloads that depend
      on multi-step reasoning, such as math, coding, and enterprise scenarios." In the
      Microsoft-models table, MAI-Thinking-1 and the MAI-Image 2.5/2.6 models are Preview and
      Microsoft-Decision-1.1 is Generally available. MAI-Voice and MAI-Transcribe come through
      Azure Speech (Paraphrase.).
      OPENAI-PARTNERSHIP MODELS: the Azure OpenAI tab lists GPT-6.2, GPT-6.1, GPT-6 and
      GPT-5.x series, plus gpt-oss open-weight reasoning models, Sora and audio models
      (Paraphrase.).
      Status is `documented` because stages differ by model.
    source: https://learn.microsoft.com/en-us/azure/foundry/foundry-models/concepts/models-sold-directly-by-azure
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  byo_open_weights:
    product: Fireworks on Foundry, Foundry managed compute, provisioned throughput
    status: ga
    notes: >
      Three routes:
      1. Fireworks on Foundry. Customers can "Import and deploy custom model weights (bring
      your own model, or BYOM) onto Fireworks' on-demand GPU-backed infrastructure." It can
      also "Scale up using Provisioned throughput". Stage: "While Fireworks on Foundry is
      generally available, an administrator must enable the service within your Azure
      subscription." Odd detail: you turn it on through the Azure Preview features portal
      (the Fireworks.EnableDeploy flag) even though the service is stated GA (Paraphrase.).
      2. Managed compute for open models (Hugging Face and others), on a different page,
      https://learn.microsoft.com/en-us/azure/foundry/concepts/foundry-models-overview:
      "Model weights are deployed to dedicated virtual machines with managed compute."
      "You're billed for the virtual machine core hours the deployments use." Managed compute
      needs a hub-based project in the classic Foundry portal. Serving fine-tuned LoRA
      adapters on managed compute is still preview (Paraphrase.).
      3. Provisioned throughput (PTU) for models sold by Azure, on a different page,
      https://learn.microsoft.com/en-us/azure/foundry/openai/concepts/provisioned-throughput:
      "Provisioned throughput is a deployment type in Microsoft Foundry that provides
      dedicated model processing throughput for your deployment."
      `ga` rests on the Fireworks statement. The managed-compute route states no stage.
    source: https://learn.microsoft.com/en-us/azure/foundry/how-to/fireworks/enable-fireworks-models
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  tuning:
    product: Training in Microsoft Foundry (Managed Training, Programmed Training) + prompt caching
    status: documented
    notes: >
      "Microsoft Foundry provides two training approaches. Managed Training runs a training
      job from your data and settings. Programmed Training (preview) lets you control
      training steps in Python." "Both use Foundry-managed training infrastructure; you
      don't provision training GPUs."
      Methods under Managed Training: "Model-specific SFT, DPO, and RFT; distillation through
      teacher-generated SFT data." So distillation is a recipe built on SFT, not a separate
      service (Paraphrase.). "Programmed Training is in preview and requires explicit access
      approval."
      Training types: Standard (in-region, keeps data residency), Data zone (US only), Global
      (cheaper, data and weights copied out of region), and Developer (idle capacity, can be
      preempted, no SLA or residency guarantee) (Paraphrase.).
      Prompt caching, on a different page,
      https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/prompt-caching:
      "For supported models, cache reads are billed at a discount on input token pricing for
      Standard deployment types." "On GPT-5.6 models and later model families, cache writes
      can incur charges in addition to discounted cache reads."
      No stage is stated for Managed Training itself, hence `documented`.
    source: https://learn.microsoft.com/en-us/azure/foundry/openai/concepts/fine-tuning-considerations
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  model_routing:
    product: Model router (Foundry Models)
    status: ga
    notes: >
      "It's a routing model, trained by Microsoft on billions of interactions, that judges
      how demanding each request is and sends it to the model best suited to answer it."
      "As of November 18, 2026, model router routes across 45 models from OpenAI, Anthropic,
      Microsoft AI, xAI, DeepSeek, Meta, and Fireworks."
      Cost-tiering: three routing modes, Balanced (default), Quality and Cost, set per
      deployment (Paraphrase.). Fallback: "If the selected model returns a retryable error,
      model router fails over to the next-best model automatically, with nothing to
      configure."
      Stage: "Version 2025-11-18 is generally available and is the default for new
      deployments." Several features are preview: Auto (model set to auto), session
      affinity, per-request controls, serving from your own capacity first, the Messages
      API, and automatic model selection in AI Gateway (Paraphrase.).
      Agent use: a model-router deployment can be the model for Foundry Agent Service and for
      Agent Framework, LangGraph, OpenAI Agents SDK, Google ADK, CrewAI and the Claude Agent
      SDK (Paraphrase.). Gateway-level load balancing and failover also exist in API
      Management (see agent_gateway).
    source: https://learn.microsoft.com/en-us/azure/foundry/openai/concepts/model-router
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  code_interpreter:
    status: documented
    notes: >
      "Foundry offers built-in tools such as web search, file search, code interpreter, and
      memory". Also usable inside a toolbox.
    source: https://learn.microsoft.com/en-us/azure/foundry/agents/overview
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  tool_calling:
    product: Function calling (Foundry Agent Service; parallel calls via Foundry Models)
    status: documented
    notes: >
      "Microsoft Foundry agents support function calling, which lets you extend agents with
      custom capabilities." Your app runs the function and returns the output.
      TIME LIMIT: "Runs expire 10 minutes after creation. Submit your tool outputs before
      they expire." Portal gap: "the portal doesn't support adding, removing, or updating
      function definitions on an agent." Use the SDK or REST API.
      Parallel calls are model-dependent. From a different page,
      https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/function-calling:
      "Parallel function calls allow you to perform multiple function calls together,
      allowing for parallel execution and retrieval of results."
      Region gap: function calling is missing in Brazil South, North Central US, South Central
      US and West US (see tool_region_variance). Cap: 128 tools per agent (see
      service_limits). No stage is stated, hence `documented`.
    source: https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/tools/function-calling
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  openapi_import:
    product: OpenAPI tool (Foundry Agent Service)
    status: documented
    notes: >
      "Connect your Microsoft Foundry agents to external APIs using OpenAPI 3.0 and 3.1
      specifications." "Use anonymous, API key, or project managed identity authentication."
      Spec rule: "Each function must have an operationId (required for the OpenAPI tool)."
      AUTH CAVEAT: "OpenAPI tools don't support OAuth identity passthrough", including inside
      a toolbox. OAuth support for MCP tools does not carry over to OpenAPI tools
      (Paraphrase.). So OpenAPI calls run as the project's managed identity or a shared key,
      not as the end user.
      Alternative: API Management can expose existing REST APIs as MCP servers (see
      agent_gateway). No stage is stated, hence `documented`.
    source: https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/tools/openapi
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  ai_service_tools:
    product: Foundry Tools (Azure Speech, Language, Translator) + Agent Service built-in tools
    status: documented
    notes: >
      The Agent Service pricing page points agents at the Azure AI services. It names
      ready-to-use Speech, Language and Translator APIs (Paraphrase.) "that can be invoked by
      your agents".
      Built-in, metered tools on the same page: File Search storage, Code Interpreter, Web
      Search and Custom Search (Paraphrase.). Speech is built in for voice agents. Voice Live
      handles speech recognition and synthesis (see voice_agents). Web search runs on Web IQ
      or Grounding with Bing (see web_search_tool).
      GAP: no dedicated built-in tool type was found for Translator, Language or Document
      Intelligence. The Toolbox supported-tools list has MCP, web search, Foundry IQ, code
      interpreter, file search, OpenAPI, A2A, browser automation, Fabric IQ, Work IQ, tool
      search and Skills. Those AI services are reached through OpenAPI, MCP or function
      tools (Paraphrase of
      https://learn.microsoft.com/en-us/azure/foundry/agents/concepts/toolbox-overview).
    source: https://azure.microsoft.com/en-us/pricing/details/foundry-agent-service/
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  text_to_sql:
    product: Microsoft Fabric data agent (reached via the Fabric IQ tool, preview)
    status: ga
    notes: >
      The capability lives in Microsoft Fabric, not in Agent Service itself. "Data agent in
      Microsoft Fabric is a generally available feature that enables you to build your own
      conversational Q&A systems by using generative AI." Query generation: "Natural language
      to SQL (NL2SQL) for relational databases (Lakehouse/Warehouse)." It also generates DAX
      for semantic models and KQL for KQL databases. "Users don't need to write SQL, DAX, or
      KQL themselves." Up to five data sources per data agent (Paraphrase.).
      THE AGENT-SERVICE HOOKUP IS PREVIEW. From a different page,
      https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/tools/fabric-iq (titled
      "Connect agents to Microsoft Fabric with Fabric IQ (preview)"): "Requests use the
      identity configured for the connection and honor Fabric permissions and governance
      policies." The older tool is deprecated (scheduled for deprecation on November 6, 2026). From a different page,
      https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/tools/fabric: "The
      Microsoft Fabric data agent tool in Foundry Agent Service is scheduled for deprecation
      on November 6, 2026."
      Cost: needs paid F2 or higher Fabric capacity, or Power BI Premium P1 or higher
      (Paraphrase.).
      `ga` scores the Fabric data agent, the provider's text-to-SQL product. Calling it from a
      Foundry agent is preview.
    source: https://learn.microsoft.com/en-us/fabric/data-science/concept-data-agent
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  browser_use:
    product: Browser automation tool (Foundry Agent Service)
    status: ga
    notes: >
      "Browser automation tool is a generally available (GA) service that lets Microsoft
      Foundry agents navigate websites, read information, and interact with web applications
      through a managed remote browser. Powered by Azure Playwright Workspaces". It "exposes a
      Model Context Protocol (MCP) tool set that's optimized for browser actions", including
      "Watch with Live View and intervene with Take control" and "Run JavaScript or
      Playwright code." Session recording: "Agent builders can choose to record sessions."
      PREVIEW SUB-FEATURES: "Automate private web applications (preview)", "Private VNet
      injection (preview)", "Secret management with Azure Key Vault (Preview)". Not
      supported: CAPTCHA or bot verification, browser profiles, browser proxies, browser
      extensions.
      REGION GAPS: the tool-support-by-region table on
      azure/foundry/agents/concepts/limits-quotas-regions marks Browser Automation "no" in
      Japan West, Switzerland West and West Central US (27 of 30 agent regions). (Paraphrase.)
      A separate Computer Use tool exists with narrower regional coverage (see
      tool_region_variance).
    source: https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/tools/browser-automation
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  agent_payments:
    status: unknown
    notes: >
      No first-party Microsoft agent-payments service (wallets, x402, spending limits) was
      found on 2026-11-23. Microsoft Learn search for the terms x402, agent payments, Agent
      Payments Protocol and agentic commerce returned no Foundry, Azure or Agent
      Framework payment feature. The Foundry Agent Service overview and Foundry what's-new
      pages do not mention payments (Paraphrase.).
      The only hit is THIRD-PARTY, on this Agent Framework community-projects page: a
      community middleware (BotsRated), "Function middleware that checks the payTo of an
      x402 payment tool call against the payTo addresses BotsRated observed for that
      seller". The page warns "Microsoft doesn't own, test, or support these projects."
      That is not a Microsoft offering.
      Not `none`: Microsoft has not said it does not offer agent payments. Re-check after
      Ignite and Build.
    source: https://learn.microsoft.com/en-us/agent-framework/integrations/community-projects
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  knowledge_base:
    status: documented
    value: [file search, Foundry IQ, SharePoint, WorkIQ, Fabric IQ]
    notes: >
      Beyond standard file search, hosted agents get "additional tools like SharePoint,
      WorkIQ, and Fabric IQ". BYO resources: "Use your own Azure resources (for example,
      storage, Foundry IQ (Azure AI Search), and Azure Cosmos DB for conversation state)".
      Azure AI Search is now branded Foundry IQ.
    source: https://learn.microsoft.com/en-us/azure/foundry/agents/overview
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  mcp_server_hosting:
    status: documented
    notes: >
      "Foundry supports remote MCP servers that you can add to your agent, such as the Azure
      DevOps MCP Server" "You can also connect custom MCP servers hosted on Azure Functions
      using the Functions MCP webhook endpoint". Custom MCP servers are hosted on Azure
      Functions, not by Agent Service itself.
      The August public-preview label for the Azure DevOps MCP Server is no longer shown on
      this page.
    source: https://learn.microsoft.com/en-us/azure/foundry/agents/overview
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  mcp_registry:
    product: Toolbox
    status: documented
    notes: >
      "A toolbox groups those tools into a single, reusable unit. You curate the tools once,
      and Foundry exposes them behind one managed MCP-compatible endpoint that any agent or
      runtime can consume, regardless of framework." "Toolboxes centralize authentication,
      governance, and versioning". Versioning: "Create a new version, test it, and promote
      it to default when you're ready." The toolbox overview also documents tool search
      (tool_search / call_tool meta-tools) and Skills, labelled preview.
      Closest analogue to AgentCore Registry + Gateway combined.
    source: https://learn.microsoft.com/en-us/azure/foundry/agents/overview
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  skills_registry:
    product: Foundry Skills (versioned Skills API)
    status: preview
    notes: >
      "Skills follow the open Agent Skills format and are stored centrally in Foundry
      through the versioned Skills API." Versioning: "every update creates a new immutable
      version". Discovery: you can "attach it to a toolbox so compatible MCP clients
      discover it alongside tools", reference it from a Copilot-harness prompt agent, or
      download it into a hosted agent. A prebuilt catalog in the Foundry Toolkit for VS Code
      lists ready-made skills (docx, pptx, xlsx, pdf, design and writing packs). There you
      "select Add on a skill card to register it in your Foundry project".
      Stage: page titled "Use skills in Foundry (preview)", with the standard preview banner,
      and "All Skills API calls require Foundry-Features: Skills=V1Preview".
      FIT CAVEAT: the store is PROJECT-scoped. "A prompt agent that uses the Copilot harness
      can reference an existing skill in the same Foundry project." This page states no
      org-wide or cross-project sharing, approval workflow or governance policy, so this is
      narrower than an org-level registry like GCP Skill Registry (Paraphrase.).
      Org-wide discovery of tools (not skills) is closer to the Toolbox (see mcp_registry)
      and AI Gateway (see agent_gateway).
    source: https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/tools/skills
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  agent_skills:
    product: Foundry Skills (versioned Skills API)
    status: preview
    notes: >
      Uploadable skill packs exist. "A skill is a folder with a SKILL.md file at its root and
      can include scripts, reference material, assets, and other supporting files." Upload
      formats: "Create a skill version from inline content, a SKILL.md file, or a ZIP
      archive." "Skills follow the open Agent Skills format and are stored centrally in
      Foundry through the versioned Skills API."
      Consumers: a Copilot-harness prompt agent, a toolbox, or a hosted or local agent that
      downloads the skill (Paraphrase.). From a different page,
      https://learn.microsoft.com/en-us/azure/foundry/agents/concepts/toolbox-overview:
      "Tools define what an agent can do. Skills define how it performs a task." "Agents
      discover and load skills automatically through MCP resources at startup."
      Stage: "All Skills API calls require Foundry-Features: Skills=V1Preview". The page is
      titled "Use skills in Foundry (preview)".
      Same product as skills_registry. That row covers project-scoped storage and discovery;
      this row covers the artifact format. Comparable to BytePlus CreateSkill.
    source: https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/tools/skills
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  agent_gateway:
    product: AI gateway in Azure API Management (plus the newer Azure AI Gateway)
    status: documented
    notes: >
      "The AI gateway in Azure API Management is a set of capabilities that help you manage
      your AI backends effectively. Use these capabilities to secure, scale, monitor, and
      govern AI models, agents, and tools that back your intelligent apps and workloads."
      Agent and MCP traffic in scope: "Expose your existing REST APIs as MCP servers, and
      support passthrough to MCP servers." "Import and manage A2A agent APIs."
      WHAT IT ENFORCES (Paraphrase.): authentication and authorization, including OAuth to
      APIs and MCP servers via credential manager; token quotas and rate limits across apps;
      load balancing and failover; semantic caching; Azure AI Content Safety moderation of
      LLM prompts; and logging and monitoring of AI interactions.
      Stage: no stage is stated for the gateway itself. It is a feature set of API
      Management, "it's not a separate offering". Hence `documented`. Sub-features ARE
      labelled preview: the unified model API and "AI gateway in Microsoft Foundry
      (preview)".
      Dedicated product that coexists with API Management, with migration guides offered: Azure AI Gateway (Paraphrase of
      https://learn.microsoft.com/en-us/azure/ai-gateway/overview, last updated 2026-11-18,
      no stage stated). It is a managed gateway for AI model and MCP server traffic, a shared
      point of control for how apps and agents reach models and tools. It shares the
      Microsoft.ApiManagement resource provider but is a different resource type.
      Agent Service integration is OPT-IN PER CONNECTION. Foundry prompt agents can use
      models behind Azure AI Gateway or API Management as connected models; BYOM is not
      supported with the Copilot harness, and the Foundry UI integration is rolling out
      gradually (Paraphrase of
      https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/ai-gateway). No page
      says all Agent Service traffic routes through it by default.
    source: https://learn.microsoft.com/en-us/azure/api-management/genai-gateway-capabilities
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  web_search_tool:
    status: documented
    notes: >
      CHANGED 2026-11-23 (was `preview`): the overview sentence that put web search in
      preview has been removed, and the web search tool page carries no stage label for the
      tool itself — hence `documented`.
      "When you add web search directly to a prompt agent or a Responses API request, it uses
      Web IQ." "When you add web search to a toolbox, it still uses Grounding with Bing
      Search, not Web IQ." Data-boundary caveat: "When you connect to Web IQ, you might incur
      costs and data might be sent outside the Azure compliance boundary".
      The deep-research path uses a separately named "direct web search preview tool".
    source: https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/tools/web-search
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  long_term_memory:
    status: preview
    notes: >
      EXPLICITLY PREVIEW: "Memory is currently in public preview. Pricing and billing for
      memory and the Memory Store API can change during preview."
      Re-sourced 2026-11-23 to the memory concept page — the overview no longer states the
      stage.
    source: https://learn.microsoft.com/en-us/azure/foundry/agents/concepts/what-is-memory
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  short_term_memory:
    status: documented
    notes: >
      "session-level state persistence" for Hosted agents; Agent Runtime "Manages
      conversations". BYO Cosmos DB "for conversation state".
    source: https://learn.microsoft.com/en-us/azure/foundry/agents/overview
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  memory_namespacing:
    product: Memory (Foundry Agent Service)
    status: preview
    notes: >
      Per-end-user namespacing via scope: "You control access using the scope parameter,
      which segments memory across users to ensure secure and isolated experiences." "Each
      scope in the memory store keeps an isolated collection of memory items." With the
      memory search tool, scope can resolve from an x-memory-user-id header per call
      (Paraphrase.). "Without the header, the scope falls back to the caller's Microsoft Entra
      identity (TID and OID)." Low-level memory APIs need an explicit scope on every request
      (Paraphrase.).
      TTL: store-level default TTL in seconds. "A default_ttl_seconds value of 0 indicates no
      expiration." TTL applies only to stores created after TTL support shipped
      (Paraphrase.).
      DELETION (GDPR-relevant): "You can delete memories for a specific scope to remove
      user-specific data, or you can delete the entire memory store to remove all memories
      across all scopes." Item-level CRUD exists. No dedicated export API is named, so
      export means listing items yourself (Paraphrase.).
      SCALE CAVEAT, on a different page,
      https://learn.microsoft.com/en-us/azure/foundry/agents/concepts/what-is-memory: "Maximum
      scopes per memory store: 100" and "Maximum memories per scope: 10,000". With one scope
      per end user, one store holds 100 users, so larger apps need many stores (Paraphrase.).
      Stage: "Memory (preview) in Foundry Agent Service and the Memory Store API (preview)"
      are under preview terms.
    source: https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/memory-usage
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  session_management:
    product: Hosted agents (Foundry Agent Service)
    status: documented
    notes: >
      "A session ID identifies a logical session with persisted state, including $HOME and
      files uploaded via the /files endpoint." "Sessions are created on first use." Lifecycle
      API: "List sessions, terminate sessions, and upload or download files per session."
      Idle timeout is set per agent version, 2 to 240 minutes (default 15). Sessions are
      deleted after 30 days of inactivity. States are Active, Idle (compute released, state
      persisted) and Resumed (Paraphrase.).
      Preview layer: "The preview session compute APIs expose runtime operations: discovery,
      explicit start, exec, container log stream, ports, lifecycle-policy changes, and
      read-only egress summaries."
      Event stream: on the Responses protocol the platform manages the stream
      (ResponseEventStream with lifecycle events). On Invocations you write raw SSE yourself
      (Paraphrase.).
      Prompt agents have no session object. State is a conversation ID via the Responses API
      (Paraphrase.). No stage is stated for sessions, hence `documented`.
    source: https://learn.microsoft.com/en-us/azure/foundry/agents/concepts/hosted-agents
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  multi_tenancy:
    product: Hosted agents (per-session sandboxes + durable state store)
    status: documented
    notes: >
      Session isolation: "Hosted agents run in per-session VM-isolated sandboxes." "Sessions
      are isolated from each other."
      Per-end-user data partitioning in the state store: "A store can also partition its
      items per end user, so one store name is safe to share across the users of a
      multitenant agent." Memory uses per-user scopes the same way (see memory_namespacing).
      CAVEAT: isolation is per session and per end user, not per tenant. No doc describes a
      tenant object, per-tenant quotas or per-tenant keys on an agent endpoint
      (Paraphrase.). In basic setup, agent state sits in Microsoft-managed storage that is
      only logically separated (see data_residency). Billing is per session, so cost rises
      with concurrent users (see separately_billed_primitives).
    source: https://learn.microsoft.com/en-us/azure/foundry/agents/concepts/hosted-agents
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  checkpoint_resume:
    product: Hosted agents (resilient execution + durable state store)
    status: documented
    notes: >
      "Long-running hosted agents can keep working after the request that started them
      disconnects. They can also recover after their hosting process stops unexpectedly."
      "Foundry Agent Service and the AgentServer SDKs provide durable work identity,
      persisted inputs, lease-based recovery, and stream replay."
      LIMIT: "Recovery reenters the handler from its beginning. It isn't deterministic
      replay, and it doesn't restore local variables or an in-memory call stack." Your code
      must save its own progress and avoid repeating side effects (Paraphrase.).
      Where checkpoints go, on a different page,
      https://learn.microsoft.com/en-us/azure/foundry/agents/concepts/agent-state-store:
      "Framework checkpoints, so a bring-your-own agent framework such as LangGraph or
      Microsoft Agent Framework can resume its own graph or workflow state." "The state
      store is available only to hosted agents."
      Prompt agents have no checkpoint API, and function-call runs expire after 10 minutes
      (see tool_calling). In-process checkpointing is an Agent Framework feature (bucket A;
      see azure/a-sdk.yaml checkpoint_resume). No stage is stated, hence `documented`.
    source: https://learn.microsoft.com/en-us/azure/foundry/agents/concepts/long-running-agent-resilience
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  agent_workload_identity:
    status: documented
    notes: >
      "Each agent can have a dedicated Microsoft Entra identity, enabling secure, scoped
      access to resources and APIs without sharing credentials."
      For Hosted agents it is "Automatic, dedicated per agent".
      "Agent identities can authenticate to external MCP servers".
    source: https://learn.microsoft.com/en-us/azure/foundry/agents/overview
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  delegated_user_auth:
    status: documented
    notes: >
      "OAuth On-Behalf-Of (OBO) passthrough is supported when configured." Auth options for
      MCP/tool connections: "Key-based access", "Microsoft Entra (using the agent's managed
      identity or the project's managed identity)", "OAuth identity passthrough
      (On-Behalf-Of)", "Unauthenticated access, where appropriate".
      Ephemeral (Responses API) agents also get "On-Behalf-Of authentication".
    source: https://learn.microsoft.com/en-us/azure/foundry/agents/overview
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  tool_least_privilege:
    product: Agent identity (Microsoft Entra Agent ID) + MCP allowed_tools + Foundry tool governance policies
    status: documented
    notes: >
      Deny-by-default identity: "A newly created agent identity starts without resource
      permissions. Foundry doesn't automatically assign RBAC roles or other downstream
      permissions to it." "Apply least privilege to the identity used for each tool call."
      "Per-agent identities let you scope permissions and audit activity to individual
      agents." Legacy agents that share the project identity lack this separation
      (Paraphrase.). Delegated access: "Agent identity acting on behalf of the user is in
      preview and requires agent blueprint endpoint access."
      Per-tool allowlist on MCP, from a different page,
      https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/tools/model-context-protocol:
      "To restrict tool access, set allowed_tools to a nonempty list of tool names." TRAP:
      an empty list allows every tool on the server (Paraphrase.).
      Org-level policy, from a different page,
      https://learn.microsoft.com/en-us/azure/foundry/control-plane/overview: "Apply policies
      for model deployments, agent kinds and hosted-agent container images, approved tools,
      and network egress. Coverage and enforcement vary by policy and agent type."
      Weak spot: OpenAPI tools authenticate as the project managed identity or a key, not
      the per-agent identity (see openapi_import). No stage is stated for the identity
      model, hence `documented`.
    source: https://learn.microsoft.com/en-us/azure/foundry/agents/concepts/agent-identity
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  tool_audit_trail:
    product: Microsoft Entra Agent ID logs + Foundry tracing (Application Insights)
    status: documented
    notes: >
      Two halves, in two systems. Who got access is in Microsoft Entra sign-in logs: "These
      logs show which agent identity obtained a token for which resource, including on
      behalf of which user for delegated access." Entra audit logs record agent identity
      creation and deletion (Paraphrase.).
      What each tool call did is in tracing: "With tracing enabled, inspect tool calls per
      agent in the Application Insights resource connected to your Foundry project." The
      overview (a different page, https://learn.microsoft.com/en-us/azure/foundry/agents/overview)
      promises: "Inspect every model call, tool invocation, and decision with agent tracing".
      CAVEATS: the tool-call record exists only if tracing is enabled and an Application
      Insights resource is connected (Paraphrase.). For external tools Microsoft puts
      logging on you:
      "Review and log that access according to your organization's policies." The MCP page
      (a different page,
      https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/tools/model-context-protocol)
      says "Log approvals and tool calls for auditing and troubleshooting."
      No single who/what/when/on-whose-behalf record joins the two halves (Paraphrase.).
    source: https://learn.microsoft.com/en-us/azure/foundry/agents/concepts/agent-identity
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  guardrails:
    status: documented
    notes: >
      "Integrated content filters help mitigate prompt injection risks (including
      cross-prompt injection) and prevent unsafe outputs."
      Names the XPIA attack class explicitly — "cross-prompt injection attacks (XPIA)".
      Separate guardrails product area linked.
    source: https://learn.microsoft.com/en-us/azure/foundry/agents/overview
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  private_networking:
    status: documented
    notes: >
      "Run agents within your Azure virtual network for full network isolation and
      compliance with data residency requirements. Private networking is available for
      prompt agents. Hosted agents support bring-your-own Azure Virtual Network (BYO
      VNet), where each session runs in a VM-isolated sandbox connected to your VNet."
      Note the per-agent-type difference.
    source: https://learn.microsoft.com/en-us/azure/foundry/agents/overview
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  apm_integration:
    status: documented
    value: Application Insights
    notes: >
      "End-to-end tracing, metrics, evaluations, and Application Insights integration."
    source: https://learn.microsoft.com/en-us/azure/foundry/agents/overview
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  eval_service:
    status: documented
    notes: >
      Lifecycle step "Evaluate": "Run evaluations to measure quality and catch regressions."
      Voice agents support full-conversation evaluation only.
    source: https://learn.microsoft.com/en-us/azure/foundry/agents/overview
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  cost_attribution:
    product: Foundry cost management (Monitor > Cost, cost controls)
    status: preview
    notes: >
      "You can estimate what a workload will cost, see what each subscription, project,
      agent, and model deployment costs, cap spending before it runs over, and lower the
      cost of each request." "Cost in the Foundry portal comes from the same Azure Cost
      Management data that finance teams see in the Azure portal".
      STAGES, from the page's Status column (Paraphrase.): the per-project, per-agent and
      per-model view (Monitor > Cost) is Preview. So are the Fleet and Operations views that
      tie cost to runs, requests, tool calls and tokens. Budget alerts or blocking on spend
      or tokens (cost controls) are Preview. Cost Management analysis by meter and tag is
      GA, with the project tag in preview. AI gateway token limits per project are GA.
      Token counts per agent: from a different page,
      https://learn.microsoft.com/en-us/azure/foundry/observability/how-to/how-to-monitor-agents-dashboard,
      "This dashboard helps you understand token usage, latency, success rates, and
      evaluation outcomes for production traffic."
      GAP: no per-tenant or per-session cost view was found. Hosted agents bill each session
      separately, but no doc shows cost by session (Paraphrase.). Per-tenant metering means
      emitting your own token metrics with custom dimensions through API Management (see
      agent_gateway).
    source: https://learn.microsoft.com/en-us/azure/foundry/concepts/manage-costs
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  feedback_service:
    status: unknown
    notes: >
      No managed end-user feedback service (thumbs up/down or comments traced with
      telemetry, like GCP's Feedback service) was found for Foundry Agent Service on
      2026-11-23. Searched: the Agent Service overview, hosted agents, the tracing concept
      page, the Agent Monitoring Dashboard, the Foundry observability concept page, cost
      and governance (control plane) pages, and Learn search for end-user feedback, human
      feedback and thumbs up across Foundry and Azure Monitor / Application Insights. None
      describes an API for collecting end-user feedback (Paraphrase.).
      The dashboard covers operational and evaluation signals only: "This dashboard helps
      you understand token usage, latency, success rates, and evaluation outcomes for
      production traffic."
      Copilot Studio (bucket C) was not checked; it is a separate product. Not `none`:
      Microsoft has not said it does not offer this.
    source: https://learn.microsoft.com/en-us/azure/foundry/observability/how-to/how-to-monitor-agents-dashboard
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  agent_optimization:
    product: agent optimizer
    status: preview
    notes: >
      CHANGED 2026-11-23 (was `documented`): now explicitly labelled preview —
      "Agent optimizer (preview) evaluates agent behavior and automatically generates better
      instructions, skills, tool descriptions, and model selections for prompt agents and
      Hosted agents." Scope widened from hosted-agent instructions (August) to both agent
      types. Direct counterpart to AgentCore Optimization.
    source: https://learn.microsoft.com/en-us/azure/foundry/agents/overview
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  versioning_rollout:
    status: documented
    notes: >
      "As you iterate on your agent, versions are automatically snapshotted. Roll back to
      any previous version or compare changes between versions."
      Publishing "Promote an agent to a managed resource with a stable endpoint."
    source: https://learn.microsoft.com/en-us/azure/foundry/agents/overview
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  a2a_protocol:
    status: ga
    notes: >
      CHANGED 2026-11-23 (was `preview`): "A2A v1.0 is generally available, and v0.3
      remains in preview." Agent Service supports "the A2A protocol for agent-to-agent
      communication".
      Caveat: per the A2A how-to, requests without a version header are served v0.3
      (preview) by default, so production callers must select v1.0 explicitly.
    source: https://learn.microsoft.com/en-us/azure/foundry/agents/overview
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  multi_agent_patterns:
    product: A2A tool (Foundry Agent Service) + Foundry workflows (preview, retiring)
    status: documented
    value: [agent-as-tool delegation over A2A, sequential, group chat, human in the loop]
    notes: >
      Managed multi-agent support comes through three mechanisms, each at a different stage:
      1. Agent-to-agent delegation (GA): "The A2A tool enables agent-to-agent communication
      through a standardized protocol, allowing your Foundry agent to exchange context and
      collaborate with external agents." "Use the generally available a2a tool type for new
      integrations." Limits: text only and no streaming (Paraphrase.). As a target, a hosted
      agent accepts only single-turn A2A v1.0 SendMessage calls (see a2a_protocol).
      2. Visual workflows (preview, RETIRING). On a different page,
      https://learn.microsoft.com/en-us/azure/foundry/agents/concepts/workflow, the templates
      are Human in the loop, Sequential and Group chat (Paraphrase.). "Microsoft Foundry is
      retiring workflows on December 1, 2026." See workflow_engine.
      3. Voice agents: inline subagents and Handoff are preview opt-ins (see voice_agents).
      Supervisor, handoff and magentic patterns written as code come from Microsoft Agent
      Framework (bucket A; see azure/a-sdk.yaml multi_agent_patterns). They run here only
      when deployed as a hosted agent.
      Status is `documented`: only the A2A tool carries a GA label, and no page states a
      stage for "multi-agent" as a whole.
    source: https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/tools/agent-to-agent
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  workflow_engine:
    product: Foundry workflows (preview; retiring 2026-12-01) -> Agent Framework workflows on hosted agents
    status: preview
    notes: >
      Page titled "Build a workflow in Microsoft Foundry (Preview)". "Workflows are UI-based
      tools in Microsoft Foundry. Use them to create declarative, predefined sequences of
      actions that orchestrate agents and business logic in a visual builder." Nodes include
      if/else, go to and for each, with Power Fx expressions and a YAML view (Paraphrase.).
      "Each save creates a new, unchangeable version."
      RETIREMENT, EIGHT DAYS AFTER THIS CHECK: "Microsoft Foundry is retiring workflows on
      December 1, 2026." "After December 1, 2026, the visual designer and in-portal workflow
      execution aren't supported, but Foundry continues to run YAML-based workflow
      definitions when you deploy them as a hosted agent". Recommended paths are Agent
      Framework (declarative YAML or code), Azure Logic Apps for a visual designer, or A2A
      for simple hand-offs (Paraphrase.).
      Constraint: "Hosted agents aren't supported in the workflow designer."
      Durability and resume for the code path come from hosted-agent resilience (see
      checkpoint_resume). Workflow-agent tracing is preview (see otel_traces).
      Status `preview` follows the page title. Read it as preview, then retired. The
      managed graph engine after December 1 is Agent Framework running inside a hosted
      agent.
    source: https://learn.microsoft.com/en-us/azure/foundry/agents/concepts/workflow
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  human_in_the_loop:
    product: MCP tool approvals (Foundry Agent Service)
    status: documented
    notes: >
      Approval gates on MCP tool calls. require_approval defaults to always. It also accepts
      never, or per-tool always/never lists (Paraphrase.). With "always": "A developer needs
      to provide approval for every call." The response returns an mcp_approval_request item.
      You resume by sending an mcp_approval_response in the same conversation (Paraphrase.).
      Guidance: "Require approval for high-risk operations, especially tools that write data
      or change resources." The approval UI is yours to build. The sample says "In
      production, implement your own approval UX and policy."
      Other HITL paths: workflow human-in-the-loop nodes, on a different page,
      https://learn.microsoft.com/en-us/azure/foundry/agents/concepts/workflow: "Create
      human-in-the-loop steps (for example, approvals or clarifying questions)." That page is
      preview and retiring December 1, 2026. For hosted agents, from a different page,
      https://learn.microsoft.com/en-us/azure/foundry/agents/concepts/long-running-agent-resilience:
      "Use an agent framework checkpointer for graph state and human-in-the-loop suspension."
      Browser automation adds Live View and Take control (see browser_use).
      With function tools your own app runs the function, so it can hold the call for a
      human. But the run expires after 10 minutes, which limits slow approvals (see
      tool_calling). No stage is stated for MCP approvals, hence `documented`.
    source: https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/tools/model-context-protocol
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  distribution_to_packaged_products:
    status: documented
    notes: >
      CROSS-BUCKET BRIDGE (B -> C), unique among the five providers: "Share published
      agents through Microsoft Copilot and Teams and the Entra Agent Registry, putting your
      agents where your users already work." Supports "OpenResponses and Activity Protocols
      for Microsoft 365 publishing" plus an Invocations protocol for custom apps.
      (Wording changed from "Microsoft 365 Copilot" to "Microsoft Copilot", matching the
      Copilot app rename recorded in azure/c-outofbox.yaml.) Voice-based agents are not
      yet shown in the Teams/Copilot publishing layout.
      This is the strongest B->C integration story in the comparison.
    source: https://learn.microsoft.com/en-us/azure/foundry/agents/overview
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  authoring_mode:
    status: documented
    value: both
    notes: >
      Prompt agents: Portal-first ("create an agent interactively in the Foundry portal"),
      Code-first ("define the agent using the SDK or REST API in your deployment pipeline"),
      or the Azure Developer CLI (azd). Hosted agents are code-only.
    source: https://learn.microsoft.com/en-us/azure/foundry/agents/overview
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  runtime_regions:
    status: ga
    value:
      agent_regions: 30
      private_vnet_regions: 30
    notes: >
      30 REGIONS — the widest agent-platform footprint in this comparison (AgentCore Runtime
      reaches 20, BytePlus 2). All 30 support both the Responses API and Agents:
      Australia East, Brazil South, Canada Central, Canada East, Central US, East US,
      East US 2, France Central, Germany West Central, Italy North, Japan East, Japan West,
      Korea Central, North Central US, Norway East, Poland Central, South Africa North,
      South Central US, Southeast Asia, South India, Spain Central, Sweden Central,
      Switzerland North, Switzerland West, UAE North, UK South, West Central US,
      West Europe, West US, West US 3.
      CHANGED 2026-11-23: the "Private VNet" column (the table "also shows support for
      private Class A IP address ranges") is now Yes for all 30 — the August gap of
      regions without private Class A support is closed.
      Voice-based agents are available in 28 (not Poland Central or Spain Central).
      The Microsoft Copilot harness (preview) is limited to 22 regions.
      Endpoints are regional and "data is stored in the same region as the endpoint".
      Marked `ga` because the same page states "Foundry Agent Service is generally
      available (GA)."
    source: https://learn.microsoft.com/en-us/azure/foundry/agents/concepts/limits-quotas-regions
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  tool_region_variance:
    status: documented
    notes: >
      THE UNDER-DISCLOSED FACT THIS PROJECT EXISTS FOR — a full tool-by-region matrix, and
      the gaps are real:
      "Not all tools are available in every region. For example, file search isn't available
      in Italy North and Brazil South."
      COMPUTER USE is still the narrowest tool: supported in 9 of the 30 regions in the
      matrix (Canada Central, Central US, East US 2, Japan West, South India, Sweden
      Central, Switzerland West, West Central US, West Europe) — up from 3 in August.
      Browser Automation is absent in Japan West, Switzerland West, West Central US.
      Function calling is absent in Brazil South, North Central US, South Central US, West US.
      For network-secured (private) setups, Grounding with Bing Search has its own
      25-region list that does NOT match the 30-region agent list.
      Anyone who picks a region from the headline list and then needs Computer Use has
      roughly a 1-in-3 chance of being right.
    source: https://learn.microsoft.com/en-us/azure/foundry/agents/concepts/limits-quotas-regions
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  sovereign_cloud:
    status: documented
    value: [US Gov Virginia, US Gov Arizona]
    notes: >
      "Foundry Agent Service is also available in Azure Government (US Gov Virginia and
      US Gov Arizona) with a subset of agent types and tools."
      Note the caveat — a SUBSET, not parity. Compare AWS, whose GovCloud (US-West) carries
      Runtime, Gateway, Identity, Built-in Tools, Observability and Evaluations but not
      Harness, Memory, Optimization or Policy.
    source: https://learn.microsoft.com/en-us/azure/foundry/agents/concepts/limits-quotas-regions
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  data_residency:
    status: documented
    notes: >
      TWO SETUP MODES with materially different residency, and the choice is easy to make
      unknowingly since basic "is the default when you don't configure your own resources":
      - Basic setup "stores agent state in secure, Microsoft-managed storage that's
        logically separated" — logical, not physical, separation.
      - Standard setup "stores agent state in customer-managed, single-tenant Azure
        resources in your own subscription, which gives you full control over data residency
        and access."
      Per-data-type mapping under standard: files to Azure Blob Storage, vector stores to
      Foundry IQ (formerly listed as Azure AI Search), "Threads, conversation history,
      messages, and agent definitions" to Azure Cosmos DB.
      CONVERSATION RETENTION (both modes default to 60 days): basic setup "stores
      conversations, conversation items, and responses in Microsoft-managed Azure Cosmos DB
      for 60 days, then automatically deletes them." Standard setup: "The default TTL is 60
      days. Because you own the Cosmos DB resource, you can change the TTL." "Deleted
      conversation data can't be recovered." Basic-setup users therefore cannot extend
      retention except by copying history in their own application.
      For compliance work this row matters more than any feature row.
    source: https://learn.microsoft.com/en-us/azure/foundry/agents/concepts/limits-quotas-regions
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  service_limits:
    status: documented
    notes: >
      HARD, NON-NEGOTIABLE CEILINGS — "fixed service limits and can't be increased":
      10,000 files per agent/thread; 512 MB max file size (prompt agents); 300 GB total
      uploads; 2,000,000 tokens per file into a vector store; 100,000 messages per thread;
      1,500,000 characters per message; 128 tools registered per agent;
      1,000 versions per agent.
      THE VERSION CAP IS A DEPLOYMENT TRAP: exceeding it is terminal, not transient —
      "This error is terminal—retrying the same create call without deleting versions keeps
      failing." A CI pipeline that creates a version per deploy dies after 1,000 deploys
      until someone manually prunes.
      New since August: default concurrent hosted-agent sessions of 2,000 in seven regions
      and 1,000 elsewhere (raisable via support request); 120 connections per project;
      voice sessions capped at 60 minutes. No maximum duration for a text run is stated.
    source: https://learn.microsoft.com/en-us/azure/foundry/agents/concepts/limits-quotas-regions
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  otel_traces:
    status: ga
    notes: >
      "OpenTelemetry (OTel) provides standardized protocols for collecting and routing
      telemetry data. Foundry uses OpenTelemetry semantic conventions so traces are
      consistent across supported tools and integrations."
      "Tracing is generally available for prompt, hosted, and external agents. Workflow
      agents are in preview." (External-agent tracing moved from preview to GA since
      August.) Stored in Azure Monitor Application Insights.
    source: https://learn.microsoft.com/en-us/azure/foundry/observability/concepts/trace-agent-concept
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  pricing_axes:
    status: documented
    notes: >
      Pricing model by agent type:
      Prompt agents: "Per-call inference + tool usage" — no container compute.
      Hosted agents: "Per-call inference + tool usage + container compute".
      Voice-based prompt agents: "Voice Live and model usage; see service pricing".
      Pre-purchase: the Microsoft Agent prepurchase plan sells Agent commit units (ACUs),
      where $100 of retail Foundry/Copilot Studio usage consumes 100 ACUs; from January 1,
      2027 it is EA/CSP-only and MCA-E customers are pointed to an AI Flex Plan.
      (Paraphrase of the agent-pre-purchase cost-management page.)
      Specific per-token rates are not on this page.
    source: https://learn.microsoft.com/en-us/azure/foundry/agents/overview
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  separately_billed_primitives:
    product: Foundry Agent Service pricing
    status: documented
    notes: >
      The agent itself is free. Everything around it is metered. "There is no additional
      charge for creating or running Foundry-native agents using prompts and workflows.
      However, you will incur charges for model token consumption through Foundry Models
      and separate charges and licenses for Foundry Tools and Foundry IQ connections,
      including Azure Logic Apps connectors, Microsoft Fabric, Microsoft SharePoint,
      Grounding with Bing Search, and your own licensed data." "Hosted agents are billed
      based on the underlying container compute consumed per hour."
      Built-in tool meters, as the page rendered on 2026-11-23 (Paraphrase.; prices load by
      JavaScript): File Search storage $0.11 per GB-day with 1 GB free; Code Interpreter
      $0.033 per session; Web Search and Custom Search $14 per 1,000 transactions. The
      default region showed N/A for hosted-agent vCPU-hour and GiB-hour. Voice agents bill
      through Azure Speech pricing.
      Hosted session billing, on a different page,
      https://learn.microsoft.com/en-us/azure/foundry/agents/concepts/hosted-agents:
      "Allocation, not utilization, is billed." "Idle time before suspension is billed."
      Each session is billed separately (Paraphrase.).
      Memory, on a different page,
      https://learn.microsoft.com/en-us/azure/foundry/agents/concepts/what-is-memory:
      "You're billed for usage of the underlying chat and embedding models you configure."
      Also separate: Application Insights ingestion and retention, which the overview lists
      among voice-agent charges (Paraphrase.),
      Fabric capacity for Fabric data agents (see text_to_sql), and AI Gateway's own charges
      (see model_routing).
    source: https://azure.microsoft.com/en-us/pricing/details/foundry-agent-service/
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  free_tier_commitments:
    product: Microsoft Agent prepurchase plan, PTU reservations, Azure Marketplace
    status: documented
    notes: >
      COMMITMENT: "Prepurchase plans are commit units (CUs) bought at discounted tiers in
      your purchasing currency for a specific product." "Each prepurchase plan has a
      one-year term." One plan covers Foundry, Copilot Studio, Copilot Cowork, Fabric and
      GitHub usage (Paraphrase.). CHANNEL CHANGE: "Starting January 1, 2027, you can buy or
      renew the Microsoft Agent prepurchase plan only through an Enterprise Agreement (EA)
      or a Cloud Solution Provider (CSP) partner." MCA-E customers are pointed to an AI Flex
      Plan. Prepurchase discounts don't stack with other discounts (Paraphrase.). PTU
      reservations exist for provisioned throughput (see byo_open_weights).
      FREE TIER: no free tier for Agent Service as such. Creating and running prompt agents
      carries no charge, and the first 1 GB of File Search storage is free. Everything else
      is metered (see separately_billed_primitives). The pricing page offers the general
      Azure free account (Paraphrase of
      https://azure.microsoft.com/en-us/pricing/details/foundry-agent-service/).
      MARKETPLACE: some models are bought through Azure Marketplace. From a different page,
      https://learn.microsoft.com/en-us/azure/foundry/foundry-models/concepts/claude-models:
      "Claude models in Foundry require an Azure Marketplace subscription and bill through
      Claude Consumption Units (CCU)."
    source: https://learn.microsoft.com/en-us/azure/cost-management-billing/reservations/agent-pre-purchase
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  runtime_sla:
    status: unknown
    notes: >
      CHANGED 2026-11-23 (was `none`): the HA/DR page that previously stated Agent Service
      had no availability or state-durability SLA (ms.date now 2026-09-21) no longer
      carries that statement, and no replacement SLA statement for Agent Service was found
      on Learn. The page now describes shared responsibility instead: "Microsoft runs the
      control plane and the agent runtime infrastructure. You own the durability of
      stateful dependencies (Azure Cosmos DB, Foundry IQ, Azure Storage) when you use
      Standard agent deployment mode. In Basic mode, Microsoft manages those data components
      and recovery options are limited." and "The Microsoft-hosted components of the Agent
      Service are zone redundant."
      Preview sub-features are explicitly "provided without a service-level agreement"
      (overview page). Re-check the Microsoft Online Services SLA document before
      asserting either way.
    source: https://learn.microsoft.com/en-us/azure/foundry/how-to/high-availability-resiliency
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  launch_stage_investigation:
    product: Foundry Agent Service
    status: ga
    notes: >
      Convention (2026-11-23 fact-check): this meta-row carries the headline product's stated stage, the same rule as byteplus/b-platform, alibaba/b-platform and aws/d-devtools. The headline stage is the service-level GA sentence quoted next.
      WHERE AZURE STATES STAGES (2026-11-23 sweep). Service level, on this quotas page:
      "Foundry Agent Service is generally available (GA). Some sub-features are in public
      preview and might have different constraints."
      Feature level: per-feature Learn pages, through a preview marker in the page title and the
      standard preview banner
      (Paraphrase.). Explicit GA sentences were found on the browser automation, voice
      agents (overview), A2A tool, model router (version 2025-11-18), Fireworks on Foundry,
      and Fabric data agent pages. The cost and FinOps page has its own Status column
      (Paraphrase.).
      RETIREMENTS also sit on feature pages, not in a central feed: Foundry workflows retire
      December 1, 2026 (see workflow_engine). The Fabric data agent tool was scheduled for
      deprecation on November 6, 2026 (see text_to_sql).
      NO STAGE STATED for Toolbox, function calling, the OpenAPI tool, MCP tool approvals,
      hosted-agent sessions and the state store, Managed Training, or the Foundry Models
      catalog as a whole. Those rows are `documented`. Narrow preview labels inside those
      pages (the .NET SDK, long-running MCP operations, session compute APIs) are not
      stretched to the whole feature (Paraphrase.).
      SLA: no Agent Service runtime SLA statement found (see runtime_sla).
    source: https://learn.microsoft.com/en-us/azure/foundry/agents/concepts/limits-quotas-regions
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  long_running_agents:
    product: Background Responses + Hosted Agents
    status: documented
    notes: >
      Two mechanisms for long-running agents:
      1. Background Responses — agents "start processing a request and return a continuation
      token that can be used to poll for results or resume interrupted streams." Python
      agents "backed by the OpenAI Responses API, Azure OpenAI Responses API, or Microsoft
      Foundry support background responses".
      2. Hosted Agents — VM-isolated per-session sandboxes with persisted $HOME and /files.
      (Paraphrase of the hosted-agents concept page: idle timeout configurable 2-240
      minutes, default 15; sessions deleted after 30 days of inactivity.)
      No explicit time cap on individual executions documented.
    source: https://learn.microsoft.com/en-us/agent-framework/agents/background-responses
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  iac_coverage:
    status: documented
    notes: >
      "In this quickstart, you deploy a Microsoft Foundry resource and project by using a
      Microsoft Bicep template."
      "For production-ready Bicep templates that cover common Foundry deployment scenarios,
      see the infrastructure-setup-bicep folder in the Foundry samples repository."
      Bicep + Azure CLI + ARM explicitly supported. Terraform not mentioned in
      Foundry-specific docs (would work via azurerm provider but not explicitly documented).
    source: https://learn.microsoft.com/en-us/azure/foundry/how-to/create-resource-template
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  certifications:
    status: documented
    notes: >
      Inherits Azure's compliance portfolio. "Microsoft Azure, Dynamics 365, and other
      Microsoft cloud services undergo rigorous independent third-party SOC 2 Type 2 audits
      conducted by a reputable certified public accountant (CPA) firm." Services in scope are
      listed in the attestation report, not on this page. ISO 27001, HIPAA, GDPR documented
      at the platform level. No Foundry Agent Service-specific certification page found —
      coverage is via Azure's umbrella rather than a per-service attestation like AWS
      provides.
    source: https://learn.microsoft.com/en-us/azure/compliance/offerings/offering-soc-2
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  training_data_policy:
    status: documented
    notes: >
      Strongest possible commitment — five explicit NOT statements:
      "Your prompts (inputs) and completions (outputs), your embeddings, and your training
      data: are NOT available to other customers. are NOT available to OpenAI or other
      providers of Models sold by Azure. are NOT used by providers of Models sold by Azure
      to improve their models or services. are NOT used to train any generative AI foundation
      models without your permission or instruction. Customer Data, Prompts, and Completions
      are NOT used to improve Microsoft or third-party products or services without your
      explicit permission or instruction."
      Models are stateless: "no prompts or completions are stored in the model."
      Azure hosts models in its own environment — "do NOT interact with any services
      operated by providers" (e.g., OpenAI's ChatGPT or API are separate).
    source: https://learn.microsoft.com/en-us/azure/foundry/responsible-ai/openai/data-privacy
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"
