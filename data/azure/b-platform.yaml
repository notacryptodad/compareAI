provider: azure
bucket: b
product: Microsoft Foundry Agent Service
aliases:
  - Foundry Agent Service
  - Azure AI Foundry Agent Service
  - Azure AI Agent Service
notes: >
  Microsoft Foundry Agent Service is the current Microsoft Learn name. The service is a
  managed platform for building, deploying, and scaling agents, with prompt, voice-based
  prompt, and hosted agent types plus direct Responses API use. (Paraphrase.)

capabilities:
  managed_agent_runtime:
    product: Agent Runtime
    status: ga
    notes: >
      Microsoft states that Foundry Agent Service is generally available. The overview
      describes Agent Runtime as hosting and scaling prompt and hosted agents and managing
      conversations, tool calls, and lifecycle. (Paraphrase.)
    source: https://learn.microsoft.com/en-us/azure/foundry/agents/concepts/limits-quotas-regions
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  framework_agnosticism:
    status: documented
    value: [Microsoft Agent Framework, LangGraph, OpenAI Agents SDK, Anthropic Agent SDK, Copilot SDK, custom code]
    notes: >
      Hosted agents can use Microsoft Agent Framework, LangGraph, OpenAI Agents SDK,
      Anthropic Agent SDK, Copilot SDK, or custom code. The current page also documents
      framework-specific hosting integrations. (Paraphrase.)
    source: https://learn.microsoft.com/en-us/azure/foundry/agents/overview
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  managed_agent_loop:
    product: Prompt agents
    status: documented
    notes: >
      Prompt agents let users configure instructions, a model, and tools while Foundry runs
      the agent without application code or infrastructure to maintain. The service's GA
      statement does not separately label prompt agents, so this capability remains
      documented rather than an inferred GA sub-feature. (Paraphrase.)
    source: https://learn.microsoft.com/en-us/azure/foundry/agents/overview
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  openai_compatible_endpoint:
    status: documented
    product: Responses API
    notes: >
      The Responses API is a single entry point for model inference and tools and can be
      called by an agent that runs elsewhere. The current overview describes it as an
      ephemeral-agent pattern when the definition remains in application code. (Paraphrase.)
    source: https://learn.microsoft.com/en-us/azure/foundry/agents/overview
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  third_party_catalog:
    status: documented
    notes: >
      Foundry Agent Service supports many models in the Foundry model catalog, with examples
      including GPT-4o, Llama, and DeepSeek. Microsoft directs users to the portal for the
      current region-specific list. (Paraphrase.)
    source: https://learn.microsoft.com/en-us/azure/foundry/agents/overview
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  code_interpreter:
    status: documented
    notes: >
      Code interpreter is listed among Foundry's built-in agent tools. Current regional and
      model support can vary. (Paraphrase.)
    source: https://learn.microsoft.com/en-us/azure/foundry/agents/overview
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  knowledge_base:
    status: documented
    value: [file search, Foundry IQ, SharePoint, WorkIQ, Fabric IQ]
    notes: >
      The current overview lists file search plus SharePoint, WorkIQ, and Fabric IQ as
      platform tools or integrations. Microsoft now documents Foundry IQ separately as the
      current retrieval/data foundation name. (Paraphrase.)
    source: https://learn.microsoft.com/en-us/azure/foundry/agents/overview
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  mcp_server_hosting:
    status: documented
    notes: >
      Foundry supports remote MCP servers and custom MCP servers hosted through Azure
      Functions' MCP webhook endpoint. The current overview lists Azure DevOps MCP Server
      connectivity and multiple authentication modes. (Paraphrase.)
    source: https://learn.microsoft.com/en-us/azure/foundry/agents/overview
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  mcp_registry:
    product: Toolbox
    status: documented
    notes: >
      Foundry Toolboxes are reusable, versioned collections of tools exposed through one
      managed MCP-compatible endpoint. The current overview describes centralized
      authentication, governance, and version promotion. (Paraphrase.)
    source: https://learn.microsoft.com/en-us/azure/foundry/agents/overview
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  web_search_tool:
    status: documented
    notes: >
      Web search is listed as a built-in Foundry tool. The current overview does not assign a
      launch stage to web search, so the earlier preview label is removed rather than
      inferred. (Paraphrase.)
    source: https://learn.microsoft.com/en-us/azure/foundry/agents/overview
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  long_term_memory:
    status: documented
    notes: >
      Memory is listed among Foundry agent tools. The current overview does not assign a
      launch stage to memory, so the earlier preview label is removed rather than inferred.
      (Paraphrase.)
    source: https://learn.microsoft.com/en-us/azure/foundry/agents/overview
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  short_term_memory:
    status: documented
    notes: >
      Prompt and hosted agents manage conversation state; hosted agents additionally have
      session-level state persistence. (Paraphrase.)
    source: https://learn.microsoft.com/en-us/azure/foundry/agents/overview
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  agent_workload_identity:
    status: documented
    notes: >
      Foundry gives agents Microsoft Entra identities for scoped access. Hosted agents receive
      an automatic dedicated identity, and the identity can authenticate to external MCP
      servers. (Paraphrase.)
    source: https://learn.microsoft.com/en-us/azure/foundry/agents/overview
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  delegated_user_auth:
    status: documented
    notes: >
      The current service overview documents Microsoft Entra authentication and OAuth
      identity passthrough using On-Behalf-Of for tool connections. (Paraphrase.)
    source: https://learn.microsoft.com/en-us/azure/foundry/agents/overview
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  guardrails:
    status: documented
    notes: >
      Foundry documents integrated content filters for unsafe outputs and prompt-injection
      risks, including cross-prompt injection attacks. (Paraphrase.)
    source: https://learn.microsoft.com/en-us/azure/foundry/agents/overview
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  private_networking:
    status: documented
    notes: >
      Private networking is documented for prompt agents. Hosted agents can use a customer
      virtual network, with each session running in a VM-isolated sandbox connected to that
      network. (Paraphrase.)
    source: https://learn.microsoft.com/en-us/azure/foundry/agents/overview
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  apm_integration:
    status: documented
    value: Application Insights
    notes: >
      Application Insights remains the documented Azure Monitor destination for Foundry
      traces and observability data. (Paraphrase.)
    source: https://learn.microsoft.com/en-us/azure/foundry/observability/concepts/trace-agent-concept
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  eval_service:
    status: documented
    notes: >
      The current Agent Service lifecycle includes evaluations for measuring quality and
      catching regressions. The overview does not attach a launch stage to evaluations.
      (Paraphrase.)
    source: https://learn.microsoft.com/en-us/azure/foundry/agents/overview
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  agent_optimization:
    product: Agent optimizer
    status: preview
    notes: >
      Microsoft explicitly labels Agent optimizer as preview. The current overview says it
      can generate improved instructions, skills, tool descriptions, and model selections
      for prompt and hosted agents. (Paraphrase.)
    source: https://learn.microsoft.com/en-us/azure/foundry/agents/overview
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  versioning_rollout:
    status: documented
    notes: >
      Foundry snapshots agent versions, supports rollback and comparison, and promotes an
      agent to a managed resource with a stable endpoint. (Paraphrase.)
    source: https://learn.microsoft.com/en-us/azure/foundry/agents/overview
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  a2a_protocol:
    status: ga
    notes: >
      The current overview states that A2A version 1.0 is generally available while version
      0.3 remains in preview. The status records the current GA protocol version and keeps the
      preview caveat explicit. (Paraphrase.)
    source: https://learn.microsoft.com/en-us/azure/foundry/agents/overview
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  distribution_to_packaged_products:
    status: documented
    notes: >
      Published agents can be shared through Microsoft Copilot, Teams, and the Entra Agent
      Registry. The current documentation also names OpenResponses and Activity Protocols for
      Microsoft 365 publishing. (Paraphrase.)
    source: https://learn.microsoft.com/en-us/azure/foundry/agents/overview
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  authoring_mode:
    status: documented
    value: both
    notes: >
      Prompt agents support portal-first, SDK/REST code-first, and Azure Developer CLI paths;
      hosted agents are code-first. (Paraphrase.)
    source: https://learn.microsoft.com/en-us/azure/foundry/agents/overview
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  runtime_regions:
    status: documented
    value:
      agent_regions: 30
      responses_api_regions: 30
      private_vnet_regions: 30
      voice_agent_regions: 28
    notes: >
      The current limits table lists 30 regions for Responses API and agents. Voice-based
      agents are marked unavailable in Poland Central and Spain Central, while private VNet is
      marked available in all 30 listed regions. Region and model availability can still vary
      for individual tools and models. (Paraphrase.)
    source: https://learn.microsoft.com/en-us/azure/foundry/agents/concepts/limits-quotas-regions
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  tool_region_variance:
    status: documented
    notes: >
      Microsoft now publishes a region/model tool matrix. Current examples include file
      search unavailable in Brazil South and Italy North, computer use available only in a
      subset of regions, and function support absent in North Central US, South Central US,
      and West US. Tool support also varies by model. (Paraphrase.)
    source: https://learn.microsoft.com/en-us/azure/foundry/agents/concepts/limits-quotas-regions
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  sovereign_cloud:
    status: documented
    value: [US Gov Virginia, US Gov Arizona]
    notes: >
      Foundry Agent Service is available in Azure Government in US Gov Virginia and US Gov
      Arizona with a subset of agent types and tools. (Paraphrase.)
    source: https://learn.microsoft.com/en-us/azure/foundry/agents/concepts/limits-quotas-regions
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  data_residency:
    status: documented
    notes: >
      Basic setup stores state in Microsoft-managed storage with logical separation. Standard
      setup stores state in customer-managed Azure resources, with files in Blob Storage,
      retrieval indexes in Foundry IQ, and conversation data in Cosmos DB. Endpoints are
      regional, and the current page documents a 60-day default conversation retention for
      both setup modes, with customer control of the standard Cosmos DB TTL. (Paraphrase.)
    source: https://learn.microsoft.com/en-us/azure/foundry/agents/concepts/limits-quotas-regions
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  service_limits:
    status: documented
    notes: >
      Current fixed limits include 10,000 files per agent or thread, 512 MB per prompt-agent
      upload, 300 GB total uploads, 2,000,000 vector-store tokens per file, 100,000 messages
      per thread, 1,500,000 characters per message, 128 tools per agent, and 1,000 versions
      per agent. Hosted-agent session and image/storage limits are also documented separately.
      (Paraphrase.)
    source: https://learn.microsoft.com/en-us/azure/foundry/agents/concepts/limits-quotas-regions
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  otel_traces:
    status: ga
    notes: >
      Microsoft states that tracing is generally available for prompt, hosted, and external
      agents; workflow agents remain in preview. Foundry uses OpenTelemetry semantic
      conventions and stores traces in Azure Monitor Application Insights. (Paraphrase.)
    source: https://learn.microsoft.com/en-us/azure/foundry/observability/concepts/trace-agent-concept
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  pricing_axes:
    status: documented
    notes: >
      The current overview distinguishes prompt-agent pricing as per-call inference plus tool
      usage, hosted-agent pricing as those charges plus container compute, and voice-agent
      pricing as Voice Live and model usage. Specific rates were not revalidated here.
      (Paraphrase.)
    source: https://learn.microsoft.com/en-us/azure/foundry/agents/overview
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  runtime_sla:
    status: unknown
    notes: >
      The current pages checked in this refresh document preview features as lacking an SLA,
      but an explicit current SLA statement for the overall Agent Service runtime was not
      confirmed. Preserve unknown rather than carry forward the earlier claim. (Paraphrase.)
    source: https://learn.microsoft.com/en-us/azure/foundry/how-to/high-availability-resiliency
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  long_running_agents:
    product: Hosted Agents and Responses API
    status: documented
    notes: >
      Hosted agents support persistent session state and managed lifecycle; the Responses API
      supports ephemeral agents. The current overview does not state a single maximum runtime
      for all agent types, so no duration is inferred. (Paraphrase.)
    source: https://learn.microsoft.com/en-us/azure/foundry/agents/overview
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  iac_coverage:
    status: documented
    notes: >
      The existing Foundry Bicep deployment path remains documented. Terraform support was not
      confirmed in the current agent pages checked in this cycle. (Paraphrase.)
    source: https://learn.microsoft.com/en-us/azure/foundry/how-to/create-resource-template
    verified_on: 2026-08-09
    verified_by: "@notacryptodad"

  certifications:
    status: documented
    notes: >
      Foundry-specific certification coverage was not revalidated in this cycle. Preserve the
      previously documented Azure-platform inheritance claim without expanding it. (Paraphrase.)
    source: https://learn.microsoft.com/en-us/azure/compliance/offerings/offering-soc-2
    verified_on: 2026-08-09
    verified_by: "@notacryptodad"

  training_data_policy:
    status: documented
    notes: >
      The existing Azure OpenAI data-privacy source documents Microsoft's no-training and
      customer-data separation commitments. The current Foundry Agent Service overview does
      not replace that policy page. (Paraphrase.)
    source: https://learn.microsoft.com/en-us/azure/foundry/responsible-ai/openai/data-privacy
    verified_on: 2026-08-09
    verified_by: "@notacryptodad"
