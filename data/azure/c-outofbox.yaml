provider: azure
bucket: c
product: Microsoft 365 Copilot
aliases: [M365 Copilot, Microsoft Copilot, Microsoft Copilot Chat, Office Copilot]
notes: >
  Microsoft's current documentation uses Microsoft Copilot as the broader product name and
  retains Microsoft 365 Copilot Basic and Premium license labels. The former Microsoft 365
  Copilot Chat app is now called Microsoft Copilot Chat, and the primary app URL is moving to
  copilot.cloud.microsoft. (Paraphrase.)

capabilities:
  packaged_assistant:
    status: documented
    notes: >
      Microsoft Copilot is delivered through the Microsoft Copilot app and Microsoft 365
      applications including Word, Excel, PowerPoint, OneNote, Outlook, Teams, and Forms.
      The current documentation distinguishes Copilot Chat Basic, Microsoft 365 Copilot
      Basic, Microsoft 365 Copilot Premium, and usage-based capabilities. (Paraphrase.)
    source: https://learn.microsoft.com/en-us/copilot/plan/copilot-overview
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  permission_aware_retrieval:
    status: documented
    notes: >
      Copilot grounds responses in Microsoft Graph and organizational data that the current
      user can access. Microsoft states that access is scoped by user permissions and warns
      that tenant permissions and SharePoint oversharing remain customer responsibilities.
      (Paraphrase.)
    source: https://learn.microsoft.com/en-us/copilot/plan/microsoft-365-copilot-privacy
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  invoke_custom_agents:
    status: documented
    notes: >
      Microsoft Agents are scoped versions of Copilot that can automate business processes.
      The current licensing table distinguishes agents using web data, work data, and
      pay-as-you-go work-data agents by license and billing mode. (Paraphrase.)
    source: https://learn.microsoft.com/en-us/copilot/plan/copilot-overview
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  prebuilt_connectors:
    status: documented
    notes: >
      Copilot uses Microsoft Graph and semantic indexing for Microsoft 365 data, and current
      extensibility documentation covers Microsoft Graph connectors and agents for external
      tools and services. No current connector count is claimed. (Paraphrase.)
    source: https://learn.microsoft.com/en-us/copilot/plan/microsoft-365-copilot-privacy
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  license_bundling:
    status: documented
    notes: >
      The current license table separates Copilot Chat Basic, Microsoft 365 Copilot Basic,
      Microsoft 365 Copilot Premium, and usage-based capabilities. Basic does not include the
      Microsoft 365 Copilot add-on; Premium does. (Paraphrase.)
    source: https://learn.microsoft.com/en-us/copilot/plan/copilot-overview
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  seat_pricing:
    status: documented
    notes: >
      The current documentation confirms add-on licensing for Microsoft 365 Copilot Premium
      and separately documents usage-based billing for Copilot Cowork, Copilot Code, Autopilot,
      and other usage-based capabilities. Specific rates are not stated on the overview page.
      (Paraphrase.)
    source: https://learn.microsoft.com/en-us/copilot/plan/copilot-overview
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  dlp_tenant_isolation:
    status: documented
    notes: >
      Microsoft Purview can classify and label data, help prevent unauthorized sharing or
      leakage, and review Copilot prompts and responses. Copilot also follows Microsoft 365
      tenant permissions and role-based access controls. (Paraphrase.)
    source: https://learn.microsoft.com/en-us/copilot/plan/copilot-overview
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  model_choosable:
    status: documented
    notes: >
      The current privacy page says Microsoft offers Anthropic and OpenAI models in applicable
      Copilot experiences and that an administrator can decide whether to use them. Microsoft
      also operates Microsoft-hosted models. Availability is experience- and license-dependent.
      (Paraphrase.)
    source: https://learn.microsoft.com/en-us/copilot/plan/microsoft-365-copilot-privacy
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  training_data_policy:
    status: documented
    notes: >
      Microsoft states that prompts, responses, and Microsoft Graph data are not used to train
      foundation LLMs used by Copilot. Stored interaction data is encrypted and is not used for
      that training. Optional customer feedback may be used to improve Copilot, which is a
      separate processing path. (Paraphrase.)
    source: https://learn.microsoft.com/en-us/copilot/plan/microsoft-365-copilot-privacy
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  admin_analytics:
    status: documented
    notes: >
      The Microsoft Copilot usage report covers enabled users, active users, active-user rate,
      prompts submitted, average prompts per user, adoption by app, Copilot Chat web/work usage,
      and 7-, 28-, 90-, and 180-day views. The page was updated in November 2026. (Paraphrase.)
    source: https://learn.microsoft.com/en-us/microsoft-365/admin/activity-reports/microsoft-365-copilot-usage?view=o365-worldwide
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  index_freshness:
    status: unknown
    notes: >
      The current semantic-index page documents automatic tenant-level indexing and index
      behavior, but the specific near-real-time versus daily freshness claims in the previous
      record were not revalidated in this cycle. Preserve unknown. (Paraphrase.)
    source: https://learn.microsoft.com/en-us/microsoftsearch/semantic-index-for-copilot
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  index_residency:
    status: documented
    notes: >
      Microsoft documents regional processing and EU Data Boundary protections for Copilot.
      Customer data residency commitments are governed by Microsoft Product Terms and the Data
      Protection Addendum; non-EU queries may be processed in the US, EU, or other regions.
      (Paraphrase.)
    source: https://learn.microsoft.com/en-us/copilot/plan/microsoft-365-copilot-privacy
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  guardrails:
    status: documented
    notes: >
      Current Copilot privacy documentation describes harmful-content filtering, protected
      material detection, jailbreak mitigation, and cross-prompt injection attack classifiers.
      Coverage can vary by Copilot scenario. (Paraphrase.)
    source: https://learn.microsoft.com/en-us/copilot/plan/microsoft-365-copilot-privacy
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  authoring_mode:
    status: documented
    value: both
    notes: >
      Microsoft 365 Copilot extensibility supports low-code and pro-code agent development.
      Current Copilot documentation also describes agents as a supported extension path, while
      licensing and admin controls determine which agents users can access. (Paraphrase.)
    source: https://learn.microsoft.com/en-us/microsoft-365/copilot/extensibility/overview
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"
