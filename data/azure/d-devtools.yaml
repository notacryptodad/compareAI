provider: azure
bucket: d
product: GitHub Copilot
aliases: [Copilot, GH Copilot, GitHub Copilot CLI]
notes: >
  GitHub Copilot is GitHub's AI coding product. Current plan documentation uses GitHub AI
  Credits and usage-based billing alongside plan allowances. The product documentation does
  not assign one overall launch stage; individual features and the feature matrix can have
  separate support states. (Paraphrase.)

capabilities:
  ide_integration:
    status: documented
    value: [VS Code, Visual Studio, JetBrains, Eclipse, Xcode, NeoVim]
    notes: >
      The current feature matrix covers VS Code, Visual Studio, JetBrains, Eclipse, Xcode,
      and NeoVim. Feature support differs by IDE and the matrix itself is currently public
      preview. (Paraphrase.)
    source: https://docs.github.com/en/copilot/reference/copilot-feature-matrix
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  cli_agent:
    status: documented
    notes: >
      Current GitHub plan documentation states that all plans include Copilot CLI and the
      Copilot app. Access, models, and usage allowances remain plan- and policy-dependent.
      (Paraphrase.)
    source: https://docs.github.com/en/copilot/get-started/plans
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  agentic_coding:
    status: documented
    notes: >
      The current feature matrix marks agent mode as supported in VS Code, Visual Studio,
      JetBrains, Eclipse, and Xcode, but not NeoVim. Custom agents are preview in some IDEs.
      These support cells do not establish an overall GA claim, and the matrix itself is public
      preview. (Paraphrase.)
    source: https://docs.github.com/en/copilot/reference/copilot-feature-matrix
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  model_choice_coding:
    status: documented
    value: [GPT-5.3-Codex, GPT-5.4 nano, GPT-5.6 Luna, GPT-5.6 Sol, GPT-6 Astra, GPT-6 Luna]
    notes: >
      GitHub publishes a larger, changing model catalog. The current official pricing table
      includes the listed OpenAI models as examples and labels their release status GA. Other
      current tables include models from Anthropic, Google, and additional providers; this value
      is intentionally not exhaustive. (Paraphrase.)
    source: https://docs.github.com/en/copilot/reference/copilot-billing/models-and-pricing
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  model_choosable:
    status: documented
    notes: >
      Paid plans provide access to a selection of models, while Copilot Free and Student use
      auto model selection only according to the current plan table. Administrator policies and
      spending controls can further limit availability. (Paraphrase.)
    source: https://docs.github.com/en/copilot/get-started/plans
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  mcp_support_coding:
    status: documented
    notes: >
      The current feature matrix marks MCP as supported in VS Code, Visual Studio, JetBrains,
      Eclipse, and Xcode, and not supported in NeoVim. The matrix does not make a separate
      launch-stage claim for MCP. (Paraphrase.)
    source: https://docs.github.com/en/copilot/reference/copilot-feature-matrix
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  codebase_indexing:
    status: documented
    notes: >
      The current feature matrix marks workspace indexing as supported in VS Code, Visual
      Studio, JetBrains, and Eclipse, and not supported in Xcode or NeoVim. (Paraphrase.)
    source: https://docs.github.com/en/copilot/reference/copilot-feature-matrix
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  code_review:
    status: documented
    notes: >
      The current feature matrix marks Copilot code review as supported in VS Code, Visual
      Studio, JetBrains, and Xcode, and not supported in Eclipse or NeoVim. The matrix does
      not establish a separate overall product launch stage. (Paraphrase.)
    source: https://docs.github.com/en/copilot/reference/copilot-feature-matrix
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  code_data_retention:
    status: documented
    notes: >
      GitHub's current privacy announcement says interaction data from Copilot Free, Pro, and
      Pro+ can be used to train and improve models unless the user opts out. Business and
      Enterprise users are not affected by that consumer-account change and remain governed by
      enterprise data protections. (Paraphrase.)
    source: https://github.blog/changelog/2026-03-25-updates-to-our-privacy-statement-and-terms-of-service-how-we-use-your-data/
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  coding_seat_pricing:
    status: documented
    value:
      free: $0
      pro: $10/month
      pro_plus: $39/month
      max: $100/month
      business: $19/seat/month
      enterprise: $39/seat/month
    notes: >
      The current plans page lists Copilot Pro at $10/month, Pro+ at $39/month, Max at
      $100/month, Business at $19 per granted seat/month, and Enterprise at $39 per granted
      seat/month. It also lists monthly GitHub AI Credit allowances and separate metered usage
      when included allowances are exceeded. (Paraphrase.)
    source: https://docs.github.com/en/copilot/get-started/plans
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  coding_free_tier:
    status: documented
    notes: >
      GitHub Copilot Free remains a no-cost individual plan with limited feature access and an
      allowance of GitHub AI Credits. The current plan page lists 2,000 monthly completions for
      the Free tier and auto model selection only. (Paraphrase.)
    source: https://docs.github.com/en/copilot/get-started/plans
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  launch_stage_investigation:
    status: documented
    notes: >
      No single current first-party page labels GitHub Copilot overall as GA or preview. The
      current feature matrix is itself public preview and marks feature support with supported,
      preview, or closing-down indicators. Do not promote individual support cells into an
      overall launch-stage claim. (Paraphrase.)
    source: https://docs.github.com/en/copilot/reference/copilot-feature-matrix
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"
