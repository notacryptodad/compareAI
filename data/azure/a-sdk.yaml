  in_repo_eval:
    status: documented
    notes: >
      "Agent Framework includes a built-in evaluation framework that lets you measure agent
      quality, safety, and correctness." "In Python, the evaluation framework is part of the
      core agent_framework package. Evaluators implement the Evaluator protocol, and
      orchestration is provided through evaluate_agent() and evaluate_workflow() functions."
      "In .NET, the evaluation framework builds on Microsoft.Extensions.AI.Evaluation."
      LocalEvaluator "runs checks locally without API calls — ideal for inner-loop
      development, CI smoke tests, and fast iteration"; FoundryEvals "connects to Microsoft
      Foundry's evaluation service for cloud-based LLM-as-judge evaluation."
      RE-SOURCED 2026-11-23: the former GitHub repo source returns HTTP 404; the earlier
      "AF Labs" experimental framing is not on this Learn page and was dropped.
    source: https://learn.microsoft.com/en-us/agent-framework/agents/evaluation
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  local_dev_loop:
    status: documented
    notes: >
      "If you are exploring or developing locally, install the standard framework package
      set". Quickstart runs against plain OpenAI (OPENAI_API_KEY) as well as Azure OpenAI /
      Foundry, and "mixed shells default to OpenAI when OPENAI_API_KEY is present" — no Azure
      account required for a local loop. Ollama provides fully local model inference.
      (Paraphrase of the workflows builder-and-execution page: its Go sample builds a
      text-processing workflow that needs no model or credentials.)
    source: https://pypi.org/project/agent-framework/
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  otel_traces:
    status: documented
    notes: >
      Native OpenTelemetry instrumentation for .NET (UseOpenTelemetry) and Python
      (configure_otel_providers / enable_instrumentation), with exporters to Azure Monitor,
      OTLP, or console. "Agent Framework automatically propagates trace context to MCP
      servers". Python follows GenAI semantic conventions (latest experimental by default,
      v1.36 selectable).
    source: https://learn.microsoft.com/en-us/agent-framework/agents/observability
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  sdk_instrumentation_portability:
    status: documented
    value: any OTel backend (OTLP, Azure Monitor, console, Aspire Dashboard)
    notes: >
      Not vendor-locked. Instrumentation is plain OpenTelemetry, and "you can configure the
      OpenTelemetry exporters to send the telemetry data to your desired backend." Python:
      "We do not install exporters by default to prevent unnecessary dependencies and
      potential issues with auto instrumentation." configure_otel_providers() "Reads
      OTEL_EXPORTER_OTLP_* environment variables automatically". The .NET samples include an
      OTLP exporter and suggest the Aspire Dashboard for local development (Paraphrase.).
      Azure Monitor is shown as one example exporter, not a requirement.
    source: https://learn.microsoft.com/en-us/agent-framework/agents/observability
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  sdk_telemetry_phone_home:
    status: documented
    notes: >
      CHANGED 2026-11-23 (was `none`): the observability page now discloses a default,
      opt-out usage signal to Microsoft services. "Agent Framework also adds its package and
      version to the User-Agent of supported client requests. Approved Microsoft Foundry and
      Azure OpenAI request paths can include a process-wide feature-usage token that encodes
      framework feature categories, not prompt or response content."
      Opt-outs: "AGENT_FRAMEWORK_FEATURE_MASK_DISABLED=true - Disables only the
      feature-usage token and keeps the package/version User-Agent." and
      "AGENT_FRAMEWORK_USER_AGENT_DISABLED=true - Disables the entire Agent Framework
      User-Agent contribution, including the feature token."
      No separate analytics endpoint is described — the token rides on requests the app
      already makes to Foundry/Azure OpenAI. OpenTelemetry itself only goes to
      user-configured exporters ("We do not install exporters by default").
      "ENABLE_INSTRUMENTATION - Default is true"; "ENABLE_SENSITIVE_DATA - Default is false".
    source: https://learn.microsoft.com/en-us/agent-framework/agents/observability
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  launch_stage_investigation:
    status: documented
    value: 1.0 (.NET and Python) since 2026-04-03; Go in public preview
    notes: >
      The 1.0 announcement says "Microsoft Agent Framework has reached version 1.0 for both
      .NET and Python" and "Agent Framework 1.0 is ready for production." It never uses the
      words generally available, so the status stays `documented`. The same post says that
      after "Release Candidate in February, we locked the feature surface", and that 1.0 also
      ships "preview features that are functional and available for early adoption"
      (DevUI, the agent harness and others).
      Stage evidence found elsewhere (Paraphrase.): PyPI classifies agent-framework as
      Development Status 5 - Production/Stable; the Learn overview says Go is in public
      preview; many integration packages (A2A, OpenAI hosting, Durable Extension, Foundry
      hosting) still install with --prerelease / --pre; individual APIs (background agents,
      Agent Hooks, model routing, MCP skills) are labelled experimental on their pages.
      Checked without finding a GA statement: the Learn overview and support pages, and the
      devblogs.microsoft.com/agent-framework search for generally available (which
      only returns Semantic Kernel GA posts and the Foundry hosted-agents GA). Semantic
      Kernel's GA (2025-04-04) does not count here: it is the predecessor product, not a
      sibling of the same family such as another language SDK (taxonomy hint), so the row
      stays `documented`.
      The main GitHub repo, which would hold release notes, returns HTTP 404 (see header).
    source: https://devblogs.microsoft.com/agent-framework/microsoft-agent-framework-version-1-0/
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"
