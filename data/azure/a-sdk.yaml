provider: azure
bucket: a
product: Microsoft Agent Framework
aliases: [MAF, agent-framework, Semantic Kernel, AutoGen]
notes: >
  Microsoft Agent Framework is the current Microsoft framework for agents and multi-agent
  workflows. Current Microsoft Learn documentation describes it as the direct successor to
  Semantic Kernel and AutoGen and provides migration guides for both. It now documents
  .NET, Python, and Go surfaces; Go is explicitly public preview.

capabilities:
  sdk_languages:
    status: documented
    value: [python, csharp, go]
    notes: >
      Microsoft Learn provides Python, C#/.NET, and Go getting-started paths. Go is public
      preview and requires Go 1.26 or later; the language-specific feature set is narrower
      than the Python and .NET surfaces.
    source: https://learn.microsoft.com/en-us/agent-framework/user-guide/overview
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  authoring_mode:
    status: documented
    value: both
    notes: >
      The framework supports code-defined agents and workflows plus declarative workflows
      defined with YAML. The current docs show Python, C#, and Go programmatic builders and
      a separate declarative-workflow surface.
    source: https://learn.microsoft.com/en-us/agent-framework/user-guide/workflows/declarative-workflows
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  workflow_engine:
    status: documented
    notes: >
      Workflows connect executors and edges into directed graphs, support streaming and
      non-streaming execution, validate graphs before execution, and can pause for human
      input. Checkpoints are defined at superstep boundaries. (Paraphrase.)
    source: https://learn.microsoft.com/en-us/agent-framework/user-guide/workflows/core-concepts/workflows
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  multi_agent_patterns:
    status: documented
    notes: >
      Current documentation describes graph-based workflows that coordinate multiple agents
      or functions through explicit execution paths. It does not establish a fixed taxonomy
      of supervisor, swarm, or handoff patterns in the overview.
    source: https://learn.microsoft.com/en-us/agent-framework/user-guide/overview
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  human_in_the_loop:
    status: documented
    notes: >
      Workflow runs can halt while waiting for external input, and the framework overview
      lists human-in-the-loop scenarios for long-running state management. (Paraphrase.)
    source: https://learn.microsoft.com/en-us/agent-framework/user-guide/workflows/core-concepts/workflows
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  checkpoint_resume:
    status: documented
    notes: >
      Checkpoint-enabled workflows save execution state at superstep boundaries. The current
      workflow documentation also describes keeping a run open so an application can resume
      it after a pause.
    source: https://learn.microsoft.com/en-us/agent-framework/user-guide/workflows/core-concepts/workflows
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  cross_cloud_model_adapters:
    status: documented
    value: [Microsoft Foundry, Anthropic, Azure OpenAI, OpenAI, Ollama]
    notes: >
      The current overview explicitly names Microsoft Foundry, Anthropic, Azure OpenAI,
      OpenAI, and Ollama as supported model providers and links to a larger integration
      list. It does not document Bedrock or Gemini on this page.
    source: https://learn.microsoft.com/en-us/agent-framework/user-guide/overview
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  mcp_client:
    product: MCPStdioTool / MCPStreamableHTTPTool
    status: documented
    notes: >
      The framework documents local stdio and remote streamable-HTTP MCP clients in Python,
      MCP client integration through the official MCP C# SDK, and MCP transports in Go.
      Hosted MCP tools are also documented for Foundry-backed execution. Tool approval and
      authentication headers are configurable.
    source: https://learn.microsoft.com/en-us/agent-framework/agents/tools/local-mcp-tools
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  oss_license:
    status: unknown
    notes: >
      The current Microsoft Learn documentation does not state the repository license, and
      the repository URL was not usable for a fresh first-party verification. Preserve as
      unknown rather than carry forward the previous snapshot.

  oss_governance:
    status: documented
    value: single-vendor
    notes: >
      The current documentation is published and maintained by Microsoft and does not state
      a foundation governance model. This records the documented ownership, not a claim about
      future community governance.
    source: https://learn.microsoft.com/en-us/agent-framework/user-guide/overview
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  oss_release_cadence:
    status: documented
    notes: >
      The current official overview and documentation do not state a formal release cadence.
      Go is explicitly public preview, so language maturity is not uniform.
    source: https://learn.microsoft.com/en-us/agent-framework/user-guide/overview
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  oss_runtime_lockin:
    status: none
    notes: >
      The framework documents multiple Microsoft and third-party model providers, local
      execution, and third-party systems. It can connect to Foundry, but the docs do not
      require Foundry for framework use. Third-party data handling and service terms remain
      the application owner's responsibility. (Paraphrase.)
    source: https://learn.microsoft.com/en-us/agent-framework/user-guide/overview
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  oss_community:
    status: unknown
    notes: >
      No current repository activity or community-count snapshot was re-stamped for this
      refresh. Preserve as unknown rather than carrying forward the August snapshot.

  in_repo_eval:
    status: unknown
    notes: >
      The current overview documents integrations with evaluation services but does not
      establish a stable in-repository evaluation harness. Preserve as unknown.
    source: https://learn.microsoft.com/en-us/agent-framework/user-guide/overview
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  local_dev_loop:
    status: documented
    notes: >
      The workflow documentation includes a workflow that runs without a model or
      credentials, and the overview provides local programmatic getting-started paths.
      This supports local development before connecting a hosted model.
    source: https://learn.microsoft.com/en-us/agent-framework/user-guide/workflows/core-concepts/workflows
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  otel_traces:
    status: documented
    notes: >
      Microsoft Agent Framework documents OpenTelemetry instrumentation for agent, tool,
      and model-call activity and configuration through standard providers and exporters.
      (Paraphrase.)
    source: https://learn.microsoft.com/en-us/agent-framework/agents/observability
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  sdk_telemetry_phone_home:
    status: unknown
    notes: >
      The current observability documentation explains how to configure OpenTelemetry but
      does not establish whether an SDK sends telemetry without a user-configured exporter.
      Preserve as unknown.
    source: https://learn.microsoft.com/en-us/agent-framework/agents/observability
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"
