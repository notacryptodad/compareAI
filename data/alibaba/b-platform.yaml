provider: alibaba
bucket: b
product: Alibaba Cloud Model Studio Managed Agents
aliases: [Model Studio, DashScope, 百炼, Bailian, Managed Agents, AgentStudio]
notes: >
  The current Model Studio overview presents a model service with text, vision, speech,
  multimodal, and embedding APIs, online inference, inference scheduling, and model
  training. Model Studio also documents two different agent surfaces: the older
  application builder, whose application-development features are explicitly preview,
  and the newer Managed Agents API with agents, cloud environments, sessions, and event
  streaming. These surfaces should not be treated as one maturity level. (Paraphrase.)

capabilities:
  launch_stage_investigation:
    status: preview
    notes: >
      The official application introduction says that the Applications, Components, and
      Data features in the Application Development tab are preview features and should be
      used cautiously in production. This stage applies to that application-builder
      surface, not automatically to every Model Studio API. (Paraphrase.)
    source: https://www.alibabacloud.com/help/en/model-studio/application-introduction
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  workflow_engine:
    status: documented
    notes: >
      Model Studio documents workflow applications that use visual node orchestration to
      chain multi-step tasks into a controlled execution path. (Paraphrase.)
    source: https://www.alibabacloud.com/help/en/model-studio/application-introduction
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  multi_agent_patterns:
    product: Agent orchestration applications
    status: documented
    notes: >
      Model Studio has a separate agent-orchestration application API. The official page
      establishes orchestration as an application type but does not name supervisor,
      swarm, or another topology, so no topology is inferred. (Paraphrase.)
    source: https://help.aliyun.com/zh/model-studio/call-single-agent-application
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  long_running_agents:
    status: documented
    notes: >
      Managed Agents runs work through sessions and streams events asynchronously. The
      quickstart states that an agent, environment, and session are created separately
      and that task execution continues through the event stream. The page does not
      promise a maximum duration or a specific long-running SLA. (Paraphrase.)
    source: https://help.aliyun.com/zh/model-studio/managed-agents-quickstart
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  managed_agent_runtime:
    product: Managed Agents
    status: documented
    notes: >
      Managed Agents provides a cloud Environment for agent execution. The quickstart
      creates an Agent, a cloud Environment, and a Session, then submits work to the
      session. This is documented runtime behavior, not a GA claim. (Paraphrase.)
    source: https://help.aliyun.com/zh/model-studio/managed-agents-quickstart
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  managed_agent_loop:
    product: Managed Agents
    status: documented
    notes: >
      The Managed Agents API creates an agent with a model and system prompt, binds it to
      an environment and session, and accepts tasks through the session events API. The
      service therefore manages the agent execution loop, while the documentation does
      not state a launch stage. (Paraphrase.)
    source: https://help.aliyun.com/zh/model-studio/managed-agents-quickstart
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  session_management:
    status: documented
    notes: >
      Sessions have explicit create, event-stream, send, status, and stop-reason flows.
      The current quickstart documents multi-turn context retention and distinguishes
      normal completion, approval-required, retry-exhausted, and terminated states.
      (Paraphrase.)
    source: https://help.aliyun.com/zh/model-studio/managed-agents-quickstart
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  authoring_mode:
    status: documented
    value: [no-code, low-code]
    notes: >
      The application introduction describes agent applications as natural-language,
      no-code configuration and workflow applications as visual, low-code orchestration.
      It does not establish the older high-code wording as the current application
      builder interface. (Paraphrase.)
    source: https://www.alibabacloud.com/help/en/model-studio/application-introduction
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  first_party_models:
    status: documented
    value: [Qwen4-Max, Qwen3.7-Plus, Qwen3.8-Flash]
    notes: >
      The current Model Studio overview and pricing documentation list Qwen4-Max and the
      Qwen 3.x Max, Plus, and Flash families. The values shown here are representative
      current first-party model names, not an exhaustive catalog. (Paraphrase.)
    source: https://help.aliyun.com/zh/model-studio/what-is-model-studio
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  third_party_catalog:
    status: documented
    value: [DeepSeek, Kimi, GLM, MiniMax]
    notes: >
      The current Token Plan Team Edition page lists DeepSeek, Moonshot Kimi, Zhipu GLM,
      and MiniMax model IDs alongside Qwen and Alibaba models. Availability and model
      IDs vary by region and subscription surface. (Paraphrase.)
    source: https://help.aliyun.com/zh/model-studio/token-plan-team-overview
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  openai_compatible_endpoint:
    status: documented
    notes: >
      Model Studio documents OpenAI-compatible Responses and Chat Completions endpoints,
      with a workspace- and region-specific base URL. The current overview also shows
      compatible calls in Python, JavaScript, Java, Go, C#, and Ruby. (Paraphrase.)
    source: https://help.aliyun.com/zh/model-studio/what-is-model-studio
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  runtime_regions:
    status: unknown
    notes: >
      Current pages document region-specific endpoints and region restrictions, but the
      refreshed overview does not provide one authoritative complete region list for all
      Model Studio capabilities. Availability must therefore be checked per model and
      API surface. (Paraphrase.)
    source: https://help.aliyun.com/zh/model-studio/what-is-model-studio
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  mcp_server_hosting:
    status: unknown
    notes: >
      The MCP page documents connecting Responses API requests to an MCP server and
      points to cloud-deployed MCP services. It does not establish that Model Studio
      hosts arbitrary customer MCP servers, so this row remains unknown. (Paraphrase.)
    source: https://help.aliyun.com/zh/model-studio/mcp
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  knowledge_base:
    status: documented
    notes: >
      Agent applications can call knowledge-base retrieval, and the application
      introduction identifies knowledge-base retrieval as a built-in application
      capability. The page does not define refresh cadence or query-time ACL trimming.
      (Paraphrase.)
    source: https://www.alibabacloud.com/help/en/model-studio/application-introduction
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  code_interpreter:
    status: unknown
    notes: >
      The refreshed Managed Agents quickstart documents cloud environments but does not
      characterize them as a user-facing sandboxed code interpreter. The old high-code
      application wording is not used to infer this capability. (Paraphrase.)
    source: https://help.aliyun.com/zh/model-studio/managed-agents-quickstart
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  browser_use:
    product: UI Agent
    status: documented
    notes: >
      Model Studio documents a UI Agent that understands and operates terminal screens
      across mobile, vehicle, television, and PC environments. This supports computer
      interaction, but the page does not promise a general web-browser automation
      runtime. (Paraphrase.)
    source: https://help.aliyun.com/zh/model-studio/ui-agent-api
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  agent_workload_identity:
    status: documented
    notes: >
      Model Studio uses Alibaba Cloud accounts, RAM users, workspaces, and workspace
      API keys. The current documentation establishes workspace-scoped access control,
      but does not establish a distinct IAM principal automatically created per agent.
      (Paraphrase.)
    source: https://help.aliyun.com/zh/model-studio/model-calling-in-sub-workspace
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  guardrails:
    product: AI safety guardrails
    status: documented
    notes: >
      Model Studio supports an AI safety guardrail service for inspecting model inputs
      and outputs for sensitive or high-risk content. The current page says the service
      is available only in the China (Beijing) region and supports text and image models.
      (Paraphrase.)
    source: https://help.aliyun.com/zh/model-studio/content-security
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  otel_traces:
    status: unknown
    notes: >
      Managed Agents exposes an event stream, but the current official pages checked do
      not establish OpenTelemetry export or GenAI semantic-convention spans. (Paraphrase.)
    source: https://help.aliyun.com/zh/model-studio/managed-agents-quickstart
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  eval_service:
    status: unknown
    notes: >
      The refreshed Model Studio and Managed Agents pages do not establish a dedicated
      agent-trajectory evaluation service, LLM-as-judge workflow, or CI gate. Model
      evaluation claims are not inferred from model APIs alone. (Paraphrase.)
    source: https://help.aliyun.com/zh/model-studio/what-is-model-studio
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  pricing_axes:
    status: documented
    notes: >
      Model Studio model invocation is pay-as-you-go by default. Current pricing docs
      describe input and output token billing, tiered prices, batch discounts, and
      context-cache pricing. The Token Plan Team Edition is a separate seat-and-Credits
      subscription with shared usage packages. (Paraphrase.)
    source: https://www.alibabacloud.com/help/en/model-studio/model-pricing
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  runtime_sla:
    status: documented
    value: 99.9%
    notes: >
      The Model Studio Model Inference SLA defines a 99.9 percent monthly uptime target
      for paid model-inference service. The SLA excludes free and trial services,
      third-party inference, Model Unit, and AI subscription services. (Paraphrase.)
    source: https://www.alibabacloud.com/help/en/legal/latest/alibaba-cloud-model-studio-model-inference-service-level-agreement
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  certifications:
    status: documented
    value: [SOC 2]
    notes: >
      The official security and privacy page says Model Studio has SOC 2 compliance with
      an unqualified opinion. (Paraphrase.)
    source: https://www.alibabacloud.com/help/en/model-studio/privacy-notice
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  training_data_policy:
    status: documented
    notes: >
      Alibaba Cloud states that Model Studio will not use customer data for model
      training and that data transmitted during application building and model training
      is encrypted with AES-256. The same page says Model Studio stores data generated
      from model and application calls, so the non-training statement should not be
      read as a no-retention promise. (Paraphrase.)
    source: https://www.alibabacloud.com/help/en/model-studio/privacy-notice
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"
