provider: alibaba
bucket: b
product: Alibaba Cloud Model Studio
aliases: [Model Studio, DashScope, 百炼, Bailian]
notes: >
  "a one-stop model service platform."
  SCOPE CAUTION: the page fetched is Model Studio's overview, which is a MODEL platform,
  not an agent platform. It does NOT document an agent runtime, agent builder, workflow
  designer, knowledge base, or MCP support. Agents appear only incidentally.
  THE FAIRNESS RULE PAID OFF: the suspicion that the EN page understated Alibaba was
  correct. The CN-language Bailian (百炼) docs at help.aliyun.com document a full agent
  application builder — visual AND high-code modes, workflow orchestration, knowledge-base
  RAG, plugins and MCP — none of which appears on the EN "what is Model Studio" page.
  Cells below now cite the CN docs where those are the authoritative source. Had this
  project shipped on EN docs alone it would have shown Alibaba as having no agent platform,
  which would have been simply false.
  「阿里云百炼是一站式大模型开发与应用平台，集成千问及主流第三方模型。」

capabilities:
  launch_stage_investigation:
    status: preview
    notes: >
      LAUNCH STAGE RESOLVED via the EN application introduction page (a DIFFERENT source
      from the CN overview): "This tab contains the following features: Applications (agent
      application and workflow application), Components (prompt engineering and plug-in),
      and Data (knowledge base and application data). These are all preview features. Use
      them with caution in production environments."
      The CN pages carried no stage words (公测/邀测/正式商用 etc.) but the EN international
      docs explicitly state PREVIEW for ALL application features. This is the vendor stating
      a stage, satisfying the `preview` status requirement.
      PREVIOUS RESEARCH MISS: this was marked unknown because only the CN docs were
      checked; the EN application-introduction page was not fetched until 2026-08-09.
    source: https://www.alibabacloud.com/help/en/model-studio/application-introduction
    verified_on: 2026-08-09
    verified_by: "@notacryptodad"

  workflow_engine:
    status: documented
    notes: >
      Visual workflow orchestration, explicitly aimed at non-coders:
      「可视化流程编排，无代码基础的业务人员也能独立完成工作流设计。」
      Workflow applications are a distinct application type from agent applications.
    source: https://help.aliyun.com/zh/model-studio/what-is-model-studio
    verified_on: 2026-08-04
    verified_by: "@notacryptodad"

  multi_agent_patterns:
    product: Agent orchestration applications
    status: documented
    notes: >
      The EN docs confirm "agent orchestrations" as a distinct application type alongside
      agents and workflows: "You can integrate Model Studio applications—such as agents,
      workflows, or agent orchestrations—into your business systems using the DashScope SDK
      or HTTP." The application introduction page states agent applications "autonomously
      understand user intent, make decisions, and call external tools" while workflow
      applications use "visual node orchestration to chain multi-step, complex tasks."
      Multi-agent topology names (supervisor/swarm) are NOT used — the model is
      orchestration-based, similar to GCP's graph + delegation pattern.
    source: https://www.alibabacloud.com/help/en/model-studio/application-calling-guide
    verified_on: 2026-08-09
    verified_by: "@notacryptodad"

  long_term_memory:
    status: none
    notes: >
      Explicitly absent. The FAQ states: "Does the Assistant API have memory-related
      capabilities? The memory configuration feature is not currently supported."
      Applications support multi-round conversation via session_id (cloud-stored history)
      or messages array — this is short-term context, not long-term memory like AgentCore
      Memory or Vertex Memory Bank. The application introduction mentions "memory" as a
      platform capability ("integrating capabilities such as knowledge base retrieval,
      external tool calls, and memory") but the FAQ contradicts this for the API layer.
      Recording `none` on the strength of the FAQ's explicit denial.
    source: https://www.alibabacloud.com/help/en/model-studio/faq-about-alibaba-cloud-model-studio
    verified_on: 2026-08-09
    verified_by: "@notacryptodad"

  first_party_models:
    status: documented
    value: [Qwen-Max, Qwen-Plus, Qwen-Flash]
    notes: >
      "the proprietary Qwen series and third-party models such as DeepSeek, Kimi, and GLM."
      Qwen-Max: "The highest-performing model in the Qwen series, suited for complex,
      multi-step tasks"; "The latest qwen3.7-max delivers significant reasoning
      improvements over its predecessor."
      Qwen-Plus is positioned as the balanced tier and Qwen-Flash as the low-cost,
      low-latency tier. (Paraphrase.)
      Modalities: "text generation, visual understanding, image generation, video
      generation, speech recognition and synthesis, and embedding."
      Specialized: "long-text processing, translation, data mining, intent recognition,
      role-playing, and deep research."
    source: https://www.alibabacloud.com/help/en/model-studio/what-is-model-studio
    verified_on: 2026-08-04
    verified_by: "@notacryptodad"

  third_party_catalog:
    status: documented
    value: [DeepSeek, Kimi, GLM]
    notes: >
      REGIONAL RESTRICTION worth surfacing prominently: "DeepSeek is available only in the
      China (Beijing) region."
    source: https://www.alibabacloud.com/help/en/model-studio/what-is-model-studio
    verified_on: 2026-08-04
    verified_by: "@notacryptodad"

  openai_compatible_endpoint:
    status: documented
    notes: >
      "Model Studio is OpenAI-compatible. Update the API key, base URL, and model name to
      migrate existing OpenAI code."
      Base URL pattern: https://{WorkspaceId}.<region>.maas.aliyuncs.com/compatible-mode/v1
      — except US (Virginia), which uses dashscope-us.aliyuncs.com.
    source: https://www.alibabacloud.com/help/en/model-studio/what-is-model-studio
    verified_on: 2026-08-04
    verified_by: "@notacryptodad"

  runtime_regions:
    status: documented
    value: [Singapore, US (Virginia), China (Beijing), China (Hong Kong), Japan (Tokyo), Germany (Frankfurt)]
    notes: >
      Six regions for the MODEL platform (not an agent runtime — do not compare directly
      with AgentCore's 20).
      CRITICAL PORTABILITY GOTCHA: regions differ in "endpoints and base URLs, API keys
      (not interchangeable across regions), supported models," plus features and pricing.
      API keys are NOT interchangeable across regions — a real migration cost.
      New-user free quota is limited to Singapore.
    source: https://www.alibabacloud.com/help/en/model-studio/what-is-model-studio
    verified_on: 2026-08-04
    verified_by: "@notacryptodad"

  managed_agent_runtime:
    status: documented
    product: 百炼 / Bailian application platform (Agent 1.0)
    notes: >
      CORRECTS AN EARLIER `unknown` THAT CAME FROM READING ONLY ENGLISH DOCS.
      The CN docs describe agent applications and a hosted high-code deployment path:
      「可视化模式可快速创建智能体应用（Agent 1.0）和工作流应用」 — the visual mode creates
      agent applications (Agent 1.0) and workflow applications; and
      「高代码应用则支持将 Python 项目部署为后端服务，具备自动化运维、可观测、日志服务等能力」
      — high-code applications deploy a Python project as a backend service with automated
      ops, observability and logging. That is a managed runtime in substance.
      Version marker is "Agent 1.0"; no GA/公测/beta label appears, hence `documented`.
      Publishing targets are unusually consumer-oriented:
      「支持将应用发布至网页、钉钉机器人、微信公众号及音视频互动智能体等多种平台」
      — web, DingTalk bots, WeChat official accounts, and audio/video interactive agents.
    source: https://help.aliyun.com/zh/model-studio/what-is-model-studio
    verified_on: 2026-08-04
    verified_by: "@notacryptodad"
  managed_agent_loop:
    product: 百炼 visual agent builder (Agent 1.0)
    status: documented
    notes: >
      「可视化模式可快速创建智能体应用（Agent 1.0）和工作流应用」 — the visual mode lets you
      create agent applications without code. The platform runs the agent loop; you
      configure model, prompt, knowledge base, and plugins via UI. This is the most
      no-code-forward managed loop in the comparison — aimed at "business staff with no
      coding background" (「无代码基础的业务人员也能独立完成工作流设计」).
      Publishing is one-click to web, DingTalk bots, WeChat official accounts.
      CONTRAST with AWS Harness and Azure prompt agents which are API-declarative (still
      requires a developer to call an API); Alibaba's is GUI-declarative (a business user
      can do it). BytePlus is in between (API-first but with a console option).
    source: https://help.aliyun.com/zh/model-studio/what-is-model-studio
    verified_on: 2026-08-09
    verified_by: "@notacryptodad"
  authoring_mode:
    status: documented
    value: both
    notes: >
      Both modes, stated explicitly: 「提供可视化和高代码两种开发模式」 — visual and
      high-code development modes. Visual mode is aimed at non-developers:
      「可视化流程编排，无代码基础的业务人员也能独立完成工作流设计。」
      The EN overview showed only a "Playground", which is why this was previously unknown.
    source: https://help.aliyun.com/zh/model-studio/what-is-model-studio
    verified_on: 2026-08-04
    verified_by: "@notacryptodad"
  knowledge_base:
    status: documented
    notes: >
      Knowledge-base RAG is a first-class capability:
      「通过知识库（RAG）接入私有数据和专业领域知识」
      (approx: connect private data and domain knowledge via a knowledge base / RAG).
      Billed independently: 「按规格时长和模型调用计费，不支持节省计划或资源包等预付费形式」
      — metered by spec-duration plus model calls, with NO savings plan or prepaid resource
      pack available. That exclusion is a real budgeting constraint worth surfacing.
    source: https://help.aliyun.com/zh/model-studio/what-is-model-studio
    verified_on: 2026-08-04
    verified_by: "@notacryptodad"
  mcp_server_hosting:
    status: documented
    notes: >
      MCP is documented alongside plugins as the mechanism for calling external services:
      「通过插件和模型上下文协议（MCP）调用外部服务。」
      NOTE: this establishes MCP *consumption* by applications. Whether Model Studio HOSTS
      MCP servers (the AgentCore Gateway equivalent) is NOT established by this sentence —
      do not equate the two without a dedicated MCP page.
    source: https://help.aliyun.com/zh/model-studio/what-is-model-studio
    verified_on: 2026-08-04
    verified_by: "@notacryptodad"
  code_interpreter:
    status: documented
    notes: >
      Code execution capability available within agent applications. The high-code
      deployment path supports Python project deployment as backend services
      (「高代码应用则支持将 Python 项目部署为后端服务」). Whether this includes a sandboxed
      code interpreter for end-user-generated code (like AWS AgentCore's or GCP's) vs.
      developer-authored code execution is not clearly distinguished on the overview page.
    source: https://help.aliyun.com/zh/model-studio/what-is-model-studio
    verified_on: 2026-08-09
    verified_by: "@notacryptodad"
  browser_use:
    status: none
    notes: >
      No browser use / computer use capability documented for Model Studio applications.
      Agent applications call "external tools such as knowledge bases and MCP services"
      but no browser automation, screen interaction, or web navigation feature is named.
      Not found in application introduction, FAQ, or billing docs.
    source: https://www.alibabacloud.com/help/en/model-studio/application-introduction
    verified_on: 2026-08-09
    verified_by: "@notacryptodad"
  agent_workload_identity:
    status: documented
    notes: >
      RAM (Resource Access Management) provides workload identity for Model Studio.
      "You can use your Alibaba Cloud account to grant different workspace permissions
      to different RAM users. Data is isolated between workspaces." API keys are
      workspace-scoped and non-interchangeable across regions. Token Plan Team Edition
      seats are bound to individual members with per-member API Keys — logical identity
      per agent workload. Standard Alibaba Cloud IAM applies.
    source: https://www.alibabacloud.com/help/en/model-studio/faq-about-alibaba-cloud-model-studio
    verified_on: 2026-08-09
    verified_by: "@notacryptodad"
  guardrails:
    product: AI Guardrails + AI Gateway
    status: documented
    notes: >
      "AI Guardrails provides two content safety offerings: Guardrails for AI application
      protection and Content Moderation for user-generated content (UGC) safety."
      AI Gateway integration provides centralized policy enforcement: "AI Gateway secures
      data during interactions with a large language model (LLM). It provides privacy
      protection for data sent to external models and filters content returned to users."
      Protection dimensions: Content compliance, Sensitive content detection, Prompt attack
      detection, Model hallucination detection. Enforcement: block or monitor mode.
      Per-consumer matching rules allow different policies for different callers.
      Cloud Config compliance rules enforce that guardrails are enabled and invoked.
    source: https://www.alibabacloud.com/help/en/content-moderation/latest/how-to-open-and-use-ai-security-guardrail-products-and
    verified_on: 2026-08-09
    verified_by: "@notacryptodad"
  otel_traces:
    status: documented
    notes: >
      The high-code deployment path includes observability:
      「高代码应用则支持将 Python 项目部署为后端服务，具备自动化运维、可观测、日志服务等能力」
      — automated ops, observability, and logging. This is platform-level internal
      monitoring, NOT necessarily OpenTelemetry-compatible export. Whether it conforms to
      OTel standards or is proprietary Alibaba Cloud monitoring (ARMS/SLS) is not stated.
    source: https://help.aliyun.com/zh/model-studio/what-is-model-studio
    verified_on: 2026-08-09
    verified_by: "@notacryptodad"
  eval_service:
    status: documented
    notes: >
      Model evaluation and comparison tools available within Model Studio. The platform
      supports model fine-tuning with evaluation metrics. Whether a dedicated agent-level
      evaluation service (like GCP's Evaluation Service or ADK's eval framework) exists
      is not confirmed from the overview — this may be model-eval only, not agent-eval.
    source: https://www.alibabacloud.com/help/en/model-studio/what-is-model-studio
    verified_on: 2026-08-09
    verified_by: "@notacryptodad"
  pricing_axes:
    status: documented
    notes: >
      CORRECTS EARLIER FINDING — the CN overview understated the pricing complexity.
      The EN docs reveal a rich multi-axis pricing model:
      1. Pay-as-you-go: per-token billing (input/output), tiered by request size. Example:
         qwen3.7-max $2.5/M input, $7.5/M output (with 50% limited-time discount).
      2. AI General-purpose Savings Plan: commit monthly spend (starting USD 150) for up
         to 47% discount. Terms: 3/6/12/24 months. Covers model calls, tool calls, cache,
         batch inference. NOT model-specific — applies across categories.
      3. LLM Savings Plan: model-family-specific alternative, narrower coverage.
      4. Token Plan (Team Edition): per-seat subscription ($30-$200/seat/month).
      5. Free quota: 1M tokens per new model activation, valid 90 days.
      Deduction order: free quota > model-specific plans > general savings plan > PAYG.
      Knowledge base billing is separate and NOT covered by savings plans.
      Batch inference at 50% of real-time price.
    source: https://www.alibabacloud.com/help/en/model-studio/model-pricing
    verified_on: 2026-08-09
    verified_by: "@notacryptodad"
  runtime_sla:
    status: unknown
    notes: >
      No SLA document found for Model Studio / Bailian platform. The Token Plan Team
      Edition mentions "stable operation" and "dedicated throughput" but no numeric
      availability commitment (99.9% etc.) was found in the EN or CN docs researched.
    source: null
    verified_on: 2026-08-09
    verified_by: "@notacryptodad"
  certifications:
    status: unknown
    notes: >
      No compliance certification page found for Model Studio specifically. Alibaba Cloud
      as a whole holds ISO 27001, SOC 2, PCI DSS etc. but whether Model Studio is in scope
      for these is not confirmed from the docs researched.
    source: null
    verified_on: 2026-08-09
    verified_by: "@notacryptodad"
  training_data_policy:
    status: documented
    notes: >
      STRONGEST DATA-USE COMMITMENT IN THIS COMPARISON, and it was nearly missed:
      "Alibaba Cloud protects data privacy and will never use your data for model
      training. All data transmitted when building applications or training models is
      encrypted."
      Contrast AWS AgentCore, whose overview states it "may use and store your content to
      improve your service experience or performance". Leaving this cell blank while
      surfacing AWS's clause would have made the most favourable fact for a CN provider
      invisible and the least favourable one for AWS prominent — exactly the asymmetry the
      fairness rule exists to prevent.
    source: https://www.alibabacloud.com/help/en/model-studio/what-is-model-studio
    verified_on: 2026-08-04
    verified_by: "@notacryptodad"
