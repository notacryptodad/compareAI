  long_running_agents:
    product: 百炼 Managed Agents
    status: documented
    notes: >
      Managed Agents runs work through sessions and streams events asynchronously. The
      quickstart creates an Agent, an Environment and a Session separately, then submits a
      task: 「HTTP 200 表示输入已入队，执行会异步进入 running；结果通过已建立的 SSE 连接接收，不在 POST 响应中返回。」
      Billing is by running time only: 「Session 仅在 running 时按运行时长计费，idle 不计该运行时长费用」.
      Duration: the quickstart states no maximum run time; the Managed Agents introduction (a
      different page, help.aliyun.com/zh/model-studio/managed-agents-introduction) positions
      the service for 「多步工具调用任务可持续数分钟到数小时」 and also offers 定时任务 (scheduled or
      manually triggered runs). No hard duration limit or long-running SLA is stated on
      either page. (Paraphrase except the quoted sentences.)
    source: https://help.aliyun.com/zh/model-studio/managed-agents-quickstart
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  session_management:
    product: 百炼 Managed Agents
    status: documented
    notes: >
      Sessions have explicit create, event-stream (SSE), send, status and stop-reason flows.
      Multi-turn: 「同一 Session 支持多轮交互并保留上下文，回到 idle 不会删除会话。」 The status table
      distinguishes normal completion (「本轮正常完成，可复用同一 Session 发起下一轮。」),
      approval-required (「等待工具审批，需要处理审批或中断本轮，不是执行成功。」), retry-exhausted
      (「重试耗尽，本轮失败；发起下一轮前先查看错误。」) and terminated (「会话已终止，不能继续。」).
      Lifecycle: 「归档 Session 会终止会话并保留历史，删除 Session 会不可逆地删除元数据和历史」.
      The live stream does not replay (「SSE 推送实时事件，不回放历史。」); history catch-up after a
      disconnect is a separate documented flow. The Managed Agents introduction (a different
      page, https://help.aliyun.com/zh/model-studio/managed-agents-introduction) adds that event history is persisted server-side and sessions support
      interruption and resumption (「服务端维护会话状态，支持中断与续接」).
    source: https://help.aliyun.com/zh/model-studio/managed-agents-quickstart
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  short_term_memory:
    product: 百炼 Flow Agent apps (session_id) + Managed Agents sessions
    status: documented
    notes: >
      Both managed and bring-your-own: the multi-turn section contrasts cloud storage
      (云端存储) with self-managed history (自行管理). (Paraphrase.) Managed:
      「通过传入 session_id，系统会自动从云端加载存储的对话历史，并结合新的指令生成上下文。」
      BYO: pass messages yourself — 「优先级规则：若同时传入 session_id 和 messages，则优先使用 messages，忽略 session_id。」
      Session-scoped files: 「文件仅在当前会话有效（最长7天），关闭会话后自动过期」. Managed
      Agents sessions also keep context server-side across turns (see session_management).
      Managed session history via session_id is valid for one hour with at most 50 rounds,
      per the page's FAQ: 「有效期1小时，最大历史轮数50。」 No stage label.
    source: https://help.aliyun.com/zh/model-studio/call-single-agent-application
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  checkpoint_resume:
    product: 百炼 Managed Agents (+ AgentCore Runtime)
    status: documented
    notes: >
      Server-side session state with interrupt/resume, rather than user-visible checkpoints:
      「服务端维护会话状态，支持中断与续接」, with 「事件历史在服务端持久化」. Sandbox state can
      outlive a run: 「沙箱默认在会话空闲后回收；如需跨运行保留工作文件和环境修改，可在创建会话时开启沙箱持久化。」
      After a client disconnect the quickstart (a different page,
      https://help.aliyun.com/zh/model-studio/managed-agents-quickstart) says
      「断线或读取超时本身不能判定任务结果，结果保持 UNKNOWN」 — query session status and event
      history, and 「不自动重发任务」. AgentCore's release notes (a different page,
      https://help.aliyun.com/zh/agentcore/agentcore-release-notes) list
      「优化 Runtime 会话持久化、恢复和预热资源回收。」
      GAP: no step-level checkpoint / replay-from-step API, and no statement on resuming a
      session after a runtime crash, was found. (Paraphrase.) No stage label.
    source: https://help.aliyun.com/zh/model-studio/managed-agents-introduction
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  human_in_the_loop:
    product: 百炼 Managed Agents (tool approval) + Alibaba Cloud AgentCore
    status: documented
    notes: >
      Tool-approval gates are a first-class session state: requires_action means
      「等待工具审批，需要处理审批或中断本轮，不是执行成功。」, and the next steps point to
      session operations (「审批、中断和终止操作见会话操作」). (Paraphrase except quotes.)
      Mid-run intervention: the Managed Agents introduction (a different page,
      https://help.aliyun.com/zh/model-studio/managed-agents-introduction):
      「干预或中断：在执行过程中发送新事件引导方向，或中断当前任务。」
      AgentCore's EN product page (a different page,
      https://www.alibabacloud.com/en/product/agentcore) lists "Hybrid Orchestration:
      Coordinate workflows across human users and AI agents." and long-running task
      pause/resume. Which tools require approval (policy configuration) was not read this
      pass. No stage label.
    source: https://help.aliyun.com/zh/model-studio/managed-agents-quickstart
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"
