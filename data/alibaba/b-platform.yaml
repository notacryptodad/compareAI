provider: alibaba
bucket: b
product: Alibaba Cloud Model Studio
aliases: [Model Studio, DashScope, 百炼, Bailian, 阿里云百炼, 大模型服务平台百炼, Alibaba Cloud Model Studio Managed Agents, Managed Agents]
notes: >
  2026-11-23 RESTRUCTURE — READ THIS FIRST. Both the EN and CN "what-is-model-studio" URLs
  now serve a MODELS-ONLY page titled "Model service overview" / 「模型服务概览」 (updated
  2026-11-16). Every agent-platform sentence previously quoted from the CN overview (Agent
  1.0, visual + high-code modes, knowledge-base RAG, plugins + MCP, DingTalk/WeChat
  publishing) is GONE from that URL. The docs were split into Token Plan / Models / Agent /
  Model API / Agent API / CLI tabs, and cells below were re-sourced to the new CN Agent pages.
  WHAT THE VENDOR SHIPPED SINCE AUGUST (CN docs, help.aliyun.com/zh/model-studio/agent-overview):
  「构建与运行 Agent，按需接入知识、工具、安全与优化能力。」 The Agent tab now lists Managed
  Agent (hosted sessions/environments/tool execution), Flow Agent (the renamed visual
  agent + workflow builder, now "Agent 2.0"), Sandbox (code / browser / file), RAG, Memory,
  Connector, ParseX, MCP, Skill, Evolution (observe/evaluate/optimize) and Security.
  REGION CAVEAT: the new Managed Agents API states 「当前仅支持 cn-beijing」 and the Sandbox
  examples use cn-beijing endpoints. On the international (EN) site, application
  development is restricted to users who created Singapore-region applications before
  2025-04-21, and those features are labelled preview (see launch_stage_investigation).
  Comparisons should therefore treat most new agent features as China (Beijing) region.
  No 公测/邀测/GA label on the new CN agent pages except Connector, which states Beta.
  THE FAIRNESS RULE STILL APPLIES: the CN docs document far more than the EN docs; reading
  EN alone would understate Alibaba badly.
  「阿里云百炼是一站式大模型开发与应用平台，集成千问及主流第三方模型。」 (2026-08 tagline; no longer
  on the overview page as of 2026-11-23.)

capabilities:
  launch_stage_investigation:
    status: preview
    notes: >
      EN application introduction page (re-verified 2026-11-23): "This tab contains the
      following features: Applications (agent application and workflow application),
      Components (prompt engineering and plug-in), and Data (knowledge base and application
      data). These are all preview features. Use them with caution in production
      environments."
      NEW GATING on the same page: "Console access restrictions: Only users who created
      Alibaba Cloud Model Studio applications in the Singapore region before April 21, 2025
      can access the Application Development tab." — i.e. international application
      development is effectively closed to new customers.
      CN side: the new Agent pages (Managed Agents, Flow Agent, Sandbox, Memory, Evolution)
      carry no stage word; Connector alone states it is Beta (a different page,
      help.aliyun.com/zh/model-studio/connector/overview/). Memory states commercial billing
      began 2026-08-20 (also a different page). Net: `preview` stands on the EN statement.
    source: https://www.alibabacloud.com/help/en/model-studio/application-introduction
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  workflow_engine:
    product: Flow Agent — 工作流应用
    status: documented
    notes: >
      RE-SOURCED (the CN overview no longer covers apps). Flow Agent is
      「阿里云百炼提供的可视化应用开发平台，支持构建、调试和发布智能体应用和工作流应用。」
      Workflow applications: 「可视化节点编排（低代码），将多步骤任务串联为稳定可控、可复现的执行链路」.
      A 任务中心 tracks async background runs. Workflow apps remain a distinct type from
      agent apps.
    source: https://help.aliyun.com/zh/model-studio/flow-agent-introduction
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  multi_agent_patterns:
    product: Agent orchestration applications
    status: documented
    notes: >
      EN calling guide (reworded since 08-09): "You can integrate Model Studio applications
      (agents, workflows, or agent orchestration) into your business systems via the
      DashScope SDK or HTTP." It also documents custom parameters for "a workflow
      application or an agent orchestration application".
      The EN application introduction (a different page) describes agent applications as
      prompt-driven and workflow applications as visual node orchestration.
      Multi-agent topology names (supervisor/swarm) are NOT used — the model is
      orchestration-based, similar to GCP's graph + delegation pattern.
    source: https://www.alibabacloud.com/help/en/model-studio/application-calling-guide
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  long_term_memory:
    product: 百炼 Memory (记忆库) + Managed Agents Memory Store
    status: documented
    notes: >
      STATUS CHANGE none → documented: the vendor shipped a long-term memory service.
      「阿里云百炼记忆库 — 为大模型提供跨会话长期记忆的 API 服务」 and
      「记忆库自动从对话中提取关键信息并持久化存储，在后续对话中基于语义检索相关记忆并注入上下文」.
      Billing: 「记忆库将于 2026 年 8 月 20 日 10:00（北京时间）正式开始商业化计费。」 (commercial
      billing — not a GA statement, hence `documented`). Includes user profiles, memory
      observability and audit.
      Separately, Managed Agents has a Memory Store (「跨会话持久化的挂载资源」 — on the
      managed-agents-introduction page, a different page).
      The EN FAQ (a different page) still says, for the legacy Assistant API, that the memory
      configuration feature is not currently supported. (Paraphrase.) That denial is scoped to the Assistant API, not to the
      new CN Memory service.
    source: https://help.aliyun.com/zh/model-studio/memory/overview/
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  memory_namespacing:
    product: 百炼 Memory (记忆库)
    status: documented
    notes: >
      Per-end-user namespacing is built in: the memory entity (记忆实体) is defined as
      「记忆的隔离维度，通常用 user_id 标识」, and a memory store can be shared:
      「记忆库提供开放的 API 接口，可接入任意应用，也支持多应用共享同一记忆库。」
      Deletion and audit: the manage-memory page (a different page,
      https://help.aliyun.com/zh/model-studio/memory/manage-memory) lists and searches by
      user_id, supports edit, soft-disable and delete — 「确认删除后记忆无法恢复。」 — and
      「在记忆审计中可查询删除记录及变更前的内容。」
      GAPS vs the row hint: no TTL / automatic expiry setting and no bulk export were found
      on these pages; deletion is shown per memory node, and a delete-everything-for-user
      call was not verified. (Paraphrase except quotes.) No stage label.
    source: https://help.aliyun.com/zh/model-studio/memory/concepts
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  first_party_models:
    status: documented
    value: [qwen4-max, qwen3.7-plus, qwen3.8-flash]
    notes: >
      RE-SOURCED: the EN overview no longer carries the model positioning; the Recommended
      models page does. "Alibaba Cloud Model Studio offers Qwen and third-party models for
      text, image, audio, and video." Text tiers: qwen4-max "Complex reasoning and coding";
      qwen3.7-plus "Balanced performance, speed, and cost"; qwen3.8-flash "Fast and
      cost-effective". qwen4-max replaced qwen3.7-max as the flagship since 08-04.
      Other first-party families listed: qwen-image-3.0-pro, wan3.0-video, happyhorse video,
      qwen-audio-3.1 ASR/TTS/realtime, qwen3.8-omni-flash, text-embedding-v4, qwen3-rerank,
      plus a "decision-model-preview".
    source: https://www.alibabacloud.com/help/en/model-studio/models
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  third_party_catalog:
    status: documented
    value: [DeepSeek, GLM, Kimi, MiniMax]
    notes: >
      Recommended models page lists third-party text models deepseek-v4-pro-0813,
      deepseek-v4.1-flash, glm-5.3, kimi-k3 and MiniMax-M2.5. (Paraphrase of the list.)
      REMOVED INFO: the 08-04 note that DeepSeek is Beijing-only came from the old EN
      overview, which no longer exists in that form; it could not be re-verified and has
      been dropped rather than carried forward.
    source: https://www.alibabacloud.com/help/en/model-studio/models
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  byo_open_weights:
    product: Model Studio 模型导入 + 专属部署 / DTU; AgentRun FunModel
    status: documented
    notes: >
      Two paths, both narrower than full BYO-weights hosting. Model Studio imports YOUR
      fine-tuned adapters: 「介绍百炼从阿里云 OSS 导入 LoRA 模型的全流程操作」, but
      「当前版本支持导入 LoRA 模型，全参微调模型不可导入。」 Imported models are then deployed
      as a dedicated service (「导入成功后的模型状态为创建成功，可在我的模型列表中部署服务」).
      Open-weight hosting proper is in AgentRun (a different page,
      https://help.aliyun.com/zh/agentrun/what-is-agentrun):
      「支持通过 FunModel 将开源模型一键托管为 OpenAI 兼容 API」, covering
      「开源托管模型（vLLM/SGLang/Ollama/LMDeploy 等框架）」.
      Provisioned throughput: the EN product page (a different page,
      https://www.alibabacloud.com/en/product/modelstudio) says "Two modes, dedicated
      throughput and elastic reservation, deliver stable performance and efficient resource
      use under high concurrency." and "DTU dedicated compute delivers deterministic
      performance for high-concurrency critical paths, with capacity and cost predictable
      month to month." PAI-EAS (the classic BYO-model serving product) was not read this
      pass. No stage label.
    source: https://help.aliyun.com/zh/model-studio/model-import
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  tuning:
    product: Model Studio 模型调优 + 上下文缓存
    status: documented
    notes: >
      Fine-tuning: 「模型调优包含模型微调（SFT）、继续预训练（CPT）、模型偏好训练（DPO）和强化学习（RL）四种模型训练方式。」
      REGION CAVEAT on the same page: 「本文档仅适用于华北2（北京）地域。」 Billing by training
      tokens or prepaid / postpaid training units; API-created jobs are token-billed only.
      (Paraphrase.) Distillation is not named as a separate method; the page pitches
      replacing a larger model with a tuned lighter one
      (「使用调优后的轻量级模型替代规模更大的模型」).
      Prompt caching: the context-cache page (a different page,
      https://help.aliyun.com/zh/model-studio/context-cache) offers explicit and implicit
      modes — 「显式缓存：需要主动开启的缓存模式。」 and
      「隐式缓存：此为自动模式，无需额外配置，且无法关闭」 — with explicit-cache creation at
      125% of input price and hits at 10% (implicit hits 20%). (Paraphrase of the prices.)
      No stage label.
    source: https://help.aliyun.com/zh/model-studio/model-training-overview
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  model_routing:
    product: Model Studio 智能路由 + AI 网关 + AgentRun 模型治理
    status: documented
    notes: >
      Model Studio ships content-based routing: 「智能路由是一种通过动态分析用户请求内容，在模型备选集中自动匹配最合适模型进行处理」.
      Cost-tiering is explicit — 「精准降低成本：简单任务自动路由至轻量模型，复杂任务匹配高阶模型」 —
      with 效果优先 / 成本优先 strategies and at least two candidate models; the client calls
      an auto-model-XXXXXXXX model code. Limits: Beijing + Singapore only, text input only,
      OpenAI-compatible and Anthropic protocols (not DashScope native). (Paraphrase.)
      Rule-based routing and FALLBACK live in AI Gateway (a different page,
      https://help.aliyun.com/zh/api-gateway/ai-gateway/product-overview/what-is-an-ai-gateway):
      「AI 网关支持多种模型路由策略，包括基于模型名称、请求比例或特定请求特征（如 Header）的路由规则。」
      and 「提供负载均衡、Fallback 机制、限流策略和缓存能力」. AgentRun's model proxy (a
      different page, https://help.aliyun.com/zh/agentrun/what-is-agentrun) likewise has
      「内置多模型负载均衡、Fallback 降级、并发控制、超时控制」. No stage label.
    source: https://help.aliyun.com/zh/model-studio/model-routing
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  tool_calling:
    status: documented
    notes: >
      「Function Calling 允许模型调用外部工具（API、数据库、自定义函数等），获取信息或执行操作，突破模型自身能力的限制。」
      Parallel calls are the default: 「由于 parallel_tool_calls 默认为 true，发起 Function Calling 后，模型可在一次返回中包含多个工具调用信息。」
      Setting parallel_tool_calls to false forces one call per turn, and tool_choice
      (default auto) can force or disable a specific tool. Support varies by model — some
      third-party models (e.g. kimi-k3, MiniMax-M3.1-Flash) ignore or reject these
      parameters. (Paraphrase.) Page updated 2026-11-19. No stage label.
    source: https://help.aliyun.com/zh/model-studio/qwen-function-calling
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  openai_compatible_endpoint:
    status: documented
    notes: >
      RE-SOURCED to the Regions page. Both OpenAI- and Anthropic-compatible paths:
      "OpenAI compatible: Replace https://dashscope.aliyuncs.com/compatible-mode/v1 with
      https://llm-xxx.cn-beijing.maas.aliyuncs.com/compatible-mode/v1" and "Anthropic
      compatible: Replace https://dashscope.aliyuncs.com/apps/anthropic with
      https://llm-xxx.cn-beijing.maas.aliyuncs.com/apps/anthropic".
      Workspace-dedicated domain pattern "{WorkspaceId}.{region}.maas.aliyuncs.com" now
      applies to all six regions including US (Virginia) (us-east-1) — the earlier
      dashscope-us exception no longer appears. "The DashScope domain (dashscope.aliyuncs.com)
      will no longer support new features after September 30, 2026."
      The CN model-service overview (a different page,
      https://help.aliyun.com/zh/model-studio/what-is-model-studio) headlines
      「OpenAI/Anthropic 兼容接口调用」 with Responses, Chat Completions and Messages examples
      (curl, Python, JavaScript/TypeScript, Java, Go, C#, Ruby) against a
      WorkspaceId.cn-beijing.maas.aliyuncs.com/compatible-mode/v1/responses base URL — i.e.
      the OpenAI Responses API is supported as well as Chat Completions. (Paraphrase.)
    source: https://www.alibabacloud.com/help/en/model-studio/regions
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  runtime_regions:
    status: documented
    value: [Singapore, US (Virginia), China (Beijing), China (Hong Kong), Japan (Tokyo), Germany (Frankfurt)]
    notes: >
      Six regions for the MODEL platform (not an agent runtime — do not compare directly
      with AgentCore's 20). The new Managed Agents runtime is cn-beijing only (see
      managed_agent_runtime).
      PORTABILITY GOTCHA: "Each region has its own endpoint, API Key, and model list. These
      cannot be used across regions." Regions also differ by service deployment scope
      (e.g. "US (Virginia) supports Global and US, and Germany (Frankfurt) supports Global
      and EU") and by feature — batch inference is Supported only in Singapore and China
      (Beijing) per the feature table. (Paraphrase of the table.)
      New-user free quota is Singapore-only (stated on the model-pricing page, a different
      page).
    source: https://www.alibabacloud.com/help/en/model-studio/regions
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  tool_region_variance:
    status: documented
    notes: >
      Strong per-feature variance, scattered across pages rather than one matrix (the
      Regions page has a feature-by-region table, which did not render as text this pass).
      Verified individually: 智能路由 runs in Beijing + Singapore only, text input only
      (cited page); 百炼 Managed Agents API is cn-beijing only (managed_agent_runtime); the
      Sandbox examples use cn-beijing endpoints (code_interpreter, browser_use); model
      fine-tuning docs apply only to China (Beijing) (tuning); batch inference only in
      Singapore and China (Beijing) (runtime_regions); the native DataInspection guardrail
      header is Beijing-only (guardrails); new-user free quota is Singapore-only
      (free_tier_commitments). On the international site, application development is
      closed to new customers (launch_stage_investigation). (Paraphrase.)
      Net: picking a region other than cn-beijing silently costs most of the agent stack.
    source: https://help.aliyun.com/zh/model-studio/model-routing
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  service_limits:
    status: documented
    notes: >
      No single limits page for the agent stack; per-surface limits found. Regions page
      (cited; paraphrase of its table): request timeout 3600 s on the workspace-dedicated
      domain vs 600 s on the DashScope and trial domains; the trial domain is capped at
      RPM 1000. Rate limits (a different page,
      https://help.aliyun.com/zh/model-studio/rate-limit) are pooled per main account:
      「限流按主账号维度计算，RAM 子账号、业务空间和 API Key 调用量合并。」 with dynamic (soft)
      TPM limits for mainstream models.
      Agent-side caps: Responses API 「最多添加 10 个 MCP Server。」 (a different page,
      https://help.aliyun.com/zh/model-studio/mcp); an agent app
      「可同时添加最多 5 个 MCP 服务」 and a workflow MCP node uses one tool (a different page,
      https://help.aliyun.com/zh/model-studio/official-and-third-party-mcp); custom skills
      「整个 ZIP 包不超过 10 MB。」 (a different page,
      https://help.aliyun.com/zh/model-studio/introduction-to-skill); app-session files
      expire with the session, at most 7 days (call-single-agent-application). Agent
      Identity publishes a quota table (identity providers, workload identities, OAuth /
      API-key providers, API rates) whose numbers did not render as text this pass.
      (Paraphrase except quotes.) Managed Agents session / tool-count limits were not found.
    source: https://help.aliyun.com/zh/model-studio/regions
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  data_residency:
    status: documented
    notes: >
      Explicit two-axis model — region (where data rests) vs service deployment scope
      (where inference runs): 「地域决定接入点和数据存储位置，就近选择可降低延迟。」 and
      「服务部署范围：决定推理执行位置，有数据合规需求选择特定地理边界的部署范围，无合规需求选择全球部署范围（推理资源池更大）；」
      Cross-region behaviour is spelled out: 「接入地域将请求转发至服务部署范围内的推理节点完成计算（传输全程加密）」
      then 「推理结果回到接入地域存储，再响应给应用（用户静态数据始终存于所选地域）。」 So a
      Global scope may run inference outside the region while data at rest stays put.
      Scopes per region: Frankfurt Global/EU, Tokyo Global/Japan, Hong Kong Global/Hong
      Kong, Virginia Global/US, chosen per workspace. (Paraphrase.)
      EN product page (a different page, https://www.alibabacloud.com/en/product/modelstudio):
      "Region = API endpoint + static data location." It also lists Zero Data Retention as
      coming soon (September), not yet confirmed as shipped. Most new agent features are
      cn-beijing only (see tool_region_variance). No stage label.
    source: https://help.aliyun.com/zh/model-studio/regions
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  sovereign_cloud:
    product: Apsara Stack (飞天企业版) private / sovereign cloud — sibling product
    status: documented
    notes: >
      No GovCloud-style public region; the government offer is a private-cloud product.
      「飞天企业版是为政府和企业客户定制的私有化 Agent 云平台，帮助用户安全部署关键业务，打造核心 AI 创新。」
      It lists a 「主权 AI 云」 solution and 「从算力管理到智能体研发，一站式 AI 工作流」.
      The AgentCore SLA (a different page,
      https://terms.alicdn.com/legal-agreement/terms/b_end_product_protocol/20260907141143820/20260907141143820.html)
      excludes 「AgentCore 本地云版本」, which implies an on-premises AgentCore edition exists.
      (Paraphrase.)
      GAP: the Apsara Stack page body does not name Model Studio / 百炼 Managed Agents as
      available on it, and no 政务云 region listing for the agent services was found.
      No stage label.
    source: https://www.alibabacloud.com/zh/product/apsarastack
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  managed_agent_runtime:
    status: documented
    product: 百炼 Managed Agents
    notes: >
      NEW PRODUCT since August, replacing the old high-code-application path as the
      hosted runtime story: 「Managed Agents 是阿里云百炼的智能体托管运行时，托管会话状态、沙箱环境和工具执行。」
      Long-running and stateful: 「多步工具调用任务可持续数分钟到数小时，跨多轮交互保持上下文和文件系统状态。」
      Each session runs in 「独立沙箱，云端容器」 with server-side persisted SSE event history;
      supports interruption/resume, Memory Store, MCP, Skill and 定时任务 (scheduled tasks).
      Region: the API overview (a different page) states 「当前仅支持 cn-beijing」.
      No GA/公测/beta label — `documented`. Shape is strikingly close to Anthropic-style
      managed agents (Agent / Environment / Session / Event resources). (Paraphrase.)
    source: https://help.aliyun.com/zh/model-studio/managed-agents-introduction
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  multi_tenancy:
    product: AgentRun (Sandbox / AgentRuntime) + Alibaba Cloud AgentCore
    status: documented
    notes: >
      Isolation is documented at several levels, but the tenant unit is the workspace /
      session, not an end-user-tenant API construct. AgentRun:
      「基于安全容器（MicroVM）多级隔离（请求级、实例级、会话级）」, with session affinity
      (「会话亲和，保证同一个会话尽量落在同一实例，方便持续对话和状态管理」) and
      「Agent 运行时与 Sandbox 运行时安全隔离」.
      AgentCore's EN product page (a different page,
      https://www.alibabacloud.com/en/product/agentcore): "Strict Session Isolation:
      Sandboxes enforce rigorous data separation at the session level, preventing any
      cross-session interference or leakage."
      Model Studio itself isolates data per workspace (see agent_workload_identity) and its
      Code Interpreter sandbox uses one sandbox per analysis in multi-tenant scenarios (see
      code_interpreter). (Paraphrase.) No stage label.
    source: https://help.aliyun.com/zh/agentrun/what-is-agentrun
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  framework_agnosticism:
    product: AgentRun + Alibaba Cloud AgentCore (高代码 Agent)
    status: documented
    notes: >
      YES — but via the sibling runtimes, not 百炼 Managed Agents (which runs only the
      vendor loop). AgentRun: 「提供适配主流 Agent 框架的集成能力，可与 LangChain、AgentScope、CrewAI、Google ADK 等框架结合使用」
      and the high-code mode lets you 「使用 Python / Node.js / Java 等语言和任意框架，实现复杂逻辑和工程化落地」;
      deploy by 「上传代码包（本地/OSS）、在线编码、自定义容器镜像」.
      AgentCore's EN product page (a different page,
      https://www.alibabacloud.com/en/product/agentcore): "Deploy existing Pro-code Agents
      directly to the AgentCore runtime without any modifications." AgentCore's managed
      harness choice also includes third-party loops such as Codex and DeepSeek (see
      managed_agent_harness). (Paraphrase except quotes.) No stage label.
    source: https://help.aliyun.com/zh/agentrun/what-is-agentrun
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  managed_agent_harness:
    product: Alibaba Cloud AgentCore — 托管 Harness (separate product from Model Studio)
    status: documented
    notes: >
      NAMING TRAP: Alibaba Cloud ships its own product called AgentCore
      (智能体构建和治理平台 AgentCore) — unrelated to AWS Bedrock AgentCore, but its 托管 Harness
      is the closest Alibaba analogue to AgentCore Harness / the Copilot harness.
      「使用 AgentCore 托管 Harness 创建和运行 Agent，无需自行编写 Agent Loop 或管理 Harness 进程。」
      「Harness 是执行 Agent Loop 的引擎，负责调用模型、执行工具，并根据执行结果决定下一步操作。」
      Unusually, it is a CHOICE of harnesses, several of them third-party coding/agent loops:
      「AgentCore 提供 QwenPaw、Qoder、Codex、Pi、Hermes 和 DeepSeek Harness 六种托管 Harness；创建 Agent 时，可配置模型、角色、工具和 Skill。」
      Invoked over AG-UI with SSE replies; per-instance Session limits and Session TTL are
      configured at creation. (Paraphrase.) The Agent overview (a different page,
      https://help.aliyun.com/zh/agentcore/agent-overview) states the configure-not-code
      split: 「使用托管 Harness 时，主要工作是配置 Agent 的行为；使用高代码 Agent 时，需要自行实现这些行为，并将应用部署到 AgentCore。」
      Regions per the AgentCore product overview: cn-hangzhou, cn-shanghai, cn-shenzhen,
      cn-beijing, ap-southeast-1 (Singapore). (Paraphrase.) No GA/公测 label on the harness
      pages — `documented`.
      WHY NOT 百炼 Managed Agents HERE: Model Studio Managed Agents is also a pre-built loop
      (its intro, https://help.aliyun.com/zh/model-studio/managed-agents-introduction, says
      「专注于 Agent 逻辑，而非从零开始构建和维护代理循环、沙箱编排或工具执行基础设施。」), but it is
      already scored under managed_agent_runtime and referenced from managed_agent_loop;
      it offers one vendor loop, not a selectable harness. AgentCore 托管 Harness is the
      product the vendor itself names a harness, so it is the evidence for this row and
      nothing is double-counted. (Paraphrase.)
    source: https://help.aliyun.com/zh/agentcore/agent-instructions-managed-harness
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  voice_agents:
    product: 通义多模态交互开发套件 (multimodal-dialog applications)
    status: documented
    notes: >
      A first-class voice/video AGENT APPLICATION TYPE in Model Studio, not just a speech
      model: you create a 多模态交互应用 (App ID) and configure model, voice, prompt and
      Agents/plugins in the console. Full-duplex and interruptible:
      「端到端全流式系统，支持全双工对话，用户可随时打断，系统即时调整策略」.
      No-code config: 「支持可视化无代码配置模型/提示词/知识库/Agent/插件/设备指令等」, and
      extensible: 「支持自定义Agent/插件接入，兼容三方通信协议。」 Targeted at devices
      (glasses, robots, learning machines, phone apps) with device SDKs for Android, iOS,
      Linux and RTOS. (Paraphrase except quotes.)
      Transport: the WebRTC guide (a different page,
      https://help.aliyun.com/zh/model-studio/best-practice-webrtc-multimodal-dialog) says
      「多模态交互套件面向 AI/AR 眼镜、学习机、智能机器人等硬件场景，提供可视化应用配置、预置 Agent/插件、音色管理等完整业务能力。」
      and calls a workspace endpoint with model=multimodal-dialog (example region
      cn-beijing). (Paraphrase.)
      GAPS vs the row hint: no session-duration limit or region table was found on these
      pages, and no stage label. Lower down the stack, qwen3.8-omni-flash-realtime and
      qwen-audio realtime models are plain realtime speech APIs (ai_service_tools
      territory), not this row.
    source: https://help.aliyun.com/zh/model-studio/multimodal-products-overview
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  managed_agent_loop:
    product: 百炼 Flow Agent — 智能体应用 (Agent 2.0)
    status: documented
    notes: >
      The visual agent builder was renamed Flow Agent; the recommended app version is now
      "Agent 2.0" (「新版智能体应用（Agent 2.0，推荐）」), with Agent 1.0 kept for compatibility.
      Agent apps are 「自然语言配置（零代码），可调用知识库、MCP 服务等工具完成任务」 — the platform
      runs the loop; you configure model, prompt, knowledge base and tools in the console.
      A second, API-declarative managed loop now exists in Managed Agents (see
      managed_agent_runtime). Publishing to DingTalk etc. was not re-verified on this page.
      CONTRAST with AWS Harness and Azure prompt agents, which are API-declarative;
      Alibaba's Flow Agent is GUI-declarative (a business user can do it).
    source: https://help.aliyun.com/zh/model-studio/flow-agent-introduction
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  authoring_mode:
    status: documented
    value: both
    notes: >
      Both modes, now evidenced by two products rather than one overview sentence. Flow
      Agent: agent apps are 「自然语言配置（零代码）」 and workflow apps 「可视化节点编排（低代码）」.
      Code-first path: Managed Agents via REST plus Python/Java SDKs (on the
      managed-agents-api-overview page, a different page). The old
      「提供可视化和高代码两种开发模式」 sentence is no longer on the overview page.
    source: https://help.aliyun.com/zh/model-studio/flow-agent-introduction
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  knowledge_base:
    status: documented
    notes: >
      RE-SOURCED to the knowledge-base billing page; RAG is a first-class Agent-tab service.
      「阿里云百炼知识库服务自 2026 年 1 月 4 日起正式开始计费。」
      CORRECTION: prepaid packs now exist — 「知识库提供后付费（按量付费）和预付费资源包两种计费方式。」
      (the 08-04 note said no prepaid pack). Cost = spec runtime + model calls:
      「知识库的总费用由两部分构成：规格费用和模型调用费用。」 Two specs, 标准版 and 旗舰版; standard is
      「0.03 元 / 知识库 / 小时」.
    source: https://help.aliyun.com/zh/model-studio/billing-for-knowledge-base
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  mcp_server_hosting:
    status: documented
    notes: >
      RESOLVES THE 08-04 OPEN QUESTION — Model Studio does HOST MCP servers. Besides
      official MCP services, 「阿里云百炼还支持以下三种自定义 MCP 服务部署方式」: script deploy, import
      from AI Gateway (wrap an existing REST API), import from Alibaba Cloud OpenAPI.
      Script deploy is hosted on Function Compute: 「对于自行开发或开源社区的 MCP 服务代码，阿里云百炼支持使用函数计算 FC进行托管。」
      Local stdio servers via npx/uvx, or remote over http. Closest analogue to AgentCore
      Gateway's API-to-MCP wrapping. Separately, Connector exposes enterprise systems as MCP
      tools (Beta; see bucket C prebuilt_connectors).
      Client side: the Responses API can call MCP servers via the tools parameter — the MCP
      page (a different page, help.aliyun.com/zh/model-studio/mcp) states
      「支持配置SSE协议的 MCP Server。」 and 「最多添加 10 个 MCP Server。」
    source: https://help.aliyun.com/zh/model-studio/custom-mcp
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  mcp_registry:
    product: 百炼 MCP 广场 (official + third-party MCP catalog)
    status: documented
    notes: >
      A managed catalog of cloud-deployed MCP services that agents and workflows can use
      directly: 「阿里云百炼的官方 MCP 服务开通后即可使用。」 Discovery is via the MCP 广场:
      「进入 MCP 广场：前往阿里云百炼 MCP 页面，浏览并选择带有 One Key 标识的 MCP 服务。」
      One Key services need no separate key —
      「使用阿里云百炼 API Key（DASHSCOPE_API_KEY）即可完成鉴权，无需为该服务单独申请密钥。」 —
      and 「对于敏感数据，云部署 MCP Server 会在创建时使用 KMS 进行加密管理。」 The same
      services are callable from external clients. (Paraphrase.)
      Org-private registration: custom MCP servers deploy into the workspace (see
      mcp_server_hosting); for agent/MCP discovery across teams AI Gateway recommends Nacos
      AI Registry (see a2a_protocol). (Paraphrase.) No stage label.
    source: https://help.aliyun.com/zh/model-studio/official-and-third-party-mcp
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  openapi_import:
    product: AI 网关 (HTTP-to-MCP) + 百炼 custom MCP import
    status: documented
    notes: >
      Existing HTTP APIs become agent tools through AI Gateway: the enterprise scenario
      uses 「AI网关提供的HTTP to MCP转换能力，将现有API自动转换为MCP Server」, and
      「对于存量HTTP服务，用户可在网关中动态更新工具描述信息。」 Virtual MCP servers can
      recombine tool lists. Model Studio's custom-MCP page offers import from AI Gateway or
      from Alibaba Cloud OpenAPI (see mcp_server_hosting). (Paraphrase.)
      GAP: these pages describe converting existing HTTP APIs; uploading an OpenAPI/Swagger
      spec file as the import format is not stated on them. No stage label.
    source: https://help.aliyun.com/zh/api-gateway/ai-gateway/product-overview/what-is-an-ai-gateway
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  web_search_tool:
    product: Model Studio 联网搜索 (web_search tool)
    status: documented
    notes: >
      「启用联网搜索后，模型可从网络获取实时数据，准确回答股票价格、天气预报、最新新闻等时效性问题。」
      On the Responses API it is a built-in tool: 「通过 tools 参数添加 web_search 工具即可启用联网搜索。」
      — the same example also adds web_extractor and code_interpreter tools. Four call
      styles are documented (Responses, Chat Completions, DashScope, Anthropic-compatible),
      with turbo / max / agent search strategies that vary by model. (Paraphrase.)
      Realtime omni models and AI Gateway's Model API also offer a web-search option.
      (Paraphrase.) Page updated 2026-11-21. No stage label.
    source: https://help.aliyun.com/zh/model-studio/web-search
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  ai_service_tools:
    product: Model Studio built-in tools + official MCP services + ParseX
    status: documented
    notes: >
      Several first-party AI services are exposed as agent tools rather than only as model
      APIs. The Agent overview lists ParseX for document parsing
      (「文档解析与字段抽取。」) alongside MCP (「接入官方或自定义工具服务。」).
      Built-in Responses API tools web_search, web_extractor and code_interpreter are shown
      together on the web-search page (a different page,
      https://help.aliyun.com/zh/model-studio/web-search). Official MCP services include a
      WebParser page-parsing toolkit and Amap Maps (on the MCP pages,
      https://help.aliyun.com/zh/model-studio/mcp and
      https://help.aliyun.com/zh/model-studio/official-and-third-party-mcp). (Paraphrase.)
      GAP: speech, translation and OCR are offered as model APIs (Qwen-Audio,
      LiveTranslate, Qwen-VL) — no page found that packages them as ready-made agent tools.
      No stage label.
    source: https://help.aliyun.com/zh/model-studio/agent-overview
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  text_to_sql:
    product: Quick BI (智能小Q) — sibling product; AgentCore 智能问数 scenario
    status: documented
    notes: >
      Natural-language analytics lives in Quick BI, not in Model Studio:
      「Quick BI 是阿里云推出的大模型驱动数据分析产品，深度融合 BI 与 Agent 能力，帮助企业快速构建数据分析系统。」
      It runs natural-language questions end-to-end over connected sources and
      「支持多数据源连接、权限管控和多端共享」. (Paraphrase except quotes.)
      On the agent side, AgentCore names 智能问数 as a scenario in which an Agent Team reaches
      data sources through MCP tools (agentcore-product-overview, a different page,
      https://help.aliyun.com/zh/agentcore/agentcore-product-overview:
      「智能问数：通过自然语言提出业务问题，由 Agent Team 拆解任务，多个 Agent 经 MCP 工具接入数据源分别完成取数、建模与归因」).
      GAPS: neither page says SQL is generated, and no Model Studio text-to-SQL tool or
      warehouse connector API was verified; DataWorks Data Agent and AnalyticDB were not
      read this pass. No stage label.
    source: https://help.aliyun.com/zh/quick-bi/
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  skills_registry:
    product: Alibaba Cloud AgentCore — Skill 管理 + Skill 广场 (plus the Agent Catalog)
    status: documented
    notes: >
      A governed, versioned skill catalog at workspace / main-account level. Skills are
      created by ZIP upload, Nacos CLI or Markdown; there is a Skill 广场 to import
      third-party skills from (「切换到Skill 广场。」). Publishing is gated:
      「新建的Skill版本状态为草稿，未正式发布。在发布前需要进行内容审核。」 and
      「只有安全检测通过的Skill草稿，才能够发布。」 Version management with tags, enable/disable,
      and visibility levels 私有 / 公开读 / 公开写 — 公开读 means
      「当前主账号下的其他用户可见，但不可编辑、删除或修改可见性。」 — i.e. org (main-account)
      sharing. (Paraphrase except quotes.)
      Separately, the vendor-curated Agent Catalog (a different page,
      https://help.aliyun.com/zh/skillsportal/learn-about-the-alibaba-cloud-agent-skills-portal):
      「云 Agent 服务目录（Agent Catalog）是阿里云官方的 Agent 资产分发平台，提供官方 Agents、Skills、Plugins 与 Tools。」
      and 「云 Agent 服务目录本身免费，Skills 与 Plugins 均可免费获取。」 It holds official
      Alibaba Cloud skills only (searchable, with quality badges and download counts) for
      external clients such as Claude Code, Qoder, Cursor — a public catalog, not an org
      registry. (Paraphrase.)
      Model Studio itself has a Skill 管理 page with official skills plus custom ZIP skills
      (auto-reviewed, versioned, account-scoped names) — that is agent_skills evidence
      rather than a registry (https://help.aliyun.com/zh/model-studio/introduction-to-skill;
      paraphrase). AgentScope's MCP & Skill Hub is bucket a and not counted here.
      No stage label on any of these pages — `documented`.
    source: https://help.aliyun.com/zh/agentcore/management-skill
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  agent_skills:
    product: 百炼 Skill (Skill 管理)
    status: documented
    notes: >
      「Skill 是可添加到智能体应用的能力包，用于让智能体在对话中自动处理特定类型的任务。」 Two
      kinds: 「官方 Skill：平台预置的通用 Skill，覆盖常见文件处理场景。」 and
      「自定义 Skill：通过上传 ZIP 技能包创建。」 Packaging follows the SKILL.md convention:
      「ZIP 包根目录下必须有 SKILL.md 文件，用于定义 Skill 元信息。」 and
      「整个 ZIP 包不超过 10 MB。」 Names must be unique within the account.
      Managed Agents also mount skills (a different page,
      https://help.aliyun.com/zh/model-studio/managed-agents-introduction:
      「Skill：挂载预置的工具组合，封装端到端任务流程」). Versioned, review-gated skill
      governance sits in AgentCore Skill 管理 (see skills_registry). (Paraphrase except
      quotes.) No stage label.
    source: https://help.aliyun.com/zh/model-studio/introduction-to-skill
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  agent_gateway:
    product: AI 网关 (Cloud-native API Gateway — AI Gateway)
    status: documented
    notes: >
      A managed gateway for all three agent traffic types — model, MCP tool and agent/A2A.
      Positioned 「作为企业AI应用与模型服务、工具及其他Agent之间的核心连接组件，通过提供协议转换、安全防护、流量治理和统一观测等能力」.
      WHAT IT ENFORCES: per-consumer identity and governance
      (「推荐按消费者维度配置治理规则，如 Token 数量限制和并发数控制。」); MCP auth down to the
      single tool (「除支持MCP Server级别的调用鉴权外，还支持对单个工具进行细粒度的访问权限配置，实现基于调用方身份的精细化授权管理」);
      content guardrails (「深度集成 AI 安全护栏能力，实现对违规内容与风险输入的实时拦截」); plus
      WAF / IP allow-deny lists, KMS-held backend keys, rate limiting, fallback and
      end-to-end tracing. Agent side: 「提供 REST 到 A2A 协议的转换能力」, Nacos AI Registry
      for A2A discovery, and proxying of 百炼 / Dify / custom agent workloads. It also
      converts REST APIs to MCP servers and does tool-list routing. (Paraphrase except
      quotes.)
      Agent management (a different page,
      https://help.aliyun.com/zh/api-gateway/ai-gateway/user-guide/agent-management-access-and-observation):
      「Agent 是 AI 网关的一种管理资源，用于集中维护访问配置、汇总观测数据。」 with per-agent
      FinOps (tokens, sessions) for Dify, Claude Code, Codex, DeepSeek Harness etc.; but
      「Agent 管理仅支持新版 Serverless 网关的标准版和企业版，旧版 Serverless 网关和实例型网关暂不支持。」
      Same product the guardrails row cites (EN AI Guardrails integration page). No stage
      label — `documented`. Higress (the open-source base) was not re-verified this pass.
    source: https://help.aliyun.com/zh/api-gateway/ai-gateway/product-overview/what-is-an-ai-gateway
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  a2a_protocol:
    product: AI 网关 (+ Nacos AI Registry)
    status: documented
    notes: >
      A2A is supported at the gateway layer. AI Gateway's third traffic type is agents
      being called by users or other agents: 「此类场景下AI应用常通过A2A等协议实现应用间的通信与调用。」
      It recommends A2A-based discovery — 「推荐基于A2A协议通过Nacos AI Registry实现服务的注册与发现。」 —
      and converts existing services: 「提供 REST 到 A2A 协议的转换能力，实现存量 HTTP 应用向 A2A 协议的自动化升级。」
      GAP: no A2A endpoint was found on the 百炼 Managed Agents / Flow Agent pages
      themselves; AgentScope's A2A support is a bucket a (SDK) fact. (Paraphrase.) No stage
      label.
    source: https://help.aliyun.com/zh/api-gateway/ai-gateway/product-overview/what-is-an-ai-gateway
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  distribution_to_packaged_products:
    product: Alibaba Cloud AgentCore — 账号集成 (DingTalk / WeChat / Feishu channels)
    status: documented
    notes: >
      PARTIAL — channel publishing, not a bridge into a packaged assistant. AgentCore's
      core-function table: 「配置钉钉、微信、飞书等平台的账号集成，将 Agent 接入企业日常沟通渠道，实现对话式调用。」
      and its digital-employee scenario goes 「经 IM 渠道直连办公场景」. DingTalk is Alibaba
      Group's own workplace suite (the closest Teams analogue); WeChat and Feishu are
      third-party. (Paraphrase.)
      NOT FOUND: any documented way to publish a custom agent INTO Alibaba's packaged
      assistant (QwenWork / 千问办公). The QwenWork product page mentions admin controls for a
      custom marketplace and connectors but not custom-agent import. Model Studio's
      DingTalk / WeChat publishing appears only as docs-sidebar tutorial titles, which are
      not counted. (Paraphrase.) No stage label.
    source: https://help.aliyun.com/zh/agentcore/agentcore-product-overview
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  code_interpreter:
    product: 百炼 Sandbox — Code Interpreter Sandbox
    status: documented
    notes: >
      UPGRADED EVIDENCE: a dedicated sandbox for model-generated code now exists.
      「Code Interpreter Sandbox 面向需要运行 Python/Node 脚本、处理文件、生成结构化结果或报告产物的 Agent。」
      Built from the code-interpreter-v1 image; E2B-SDK compatible (e2b-code-interpreter
      run_code). Endpoint shown is cn-beijing. 「多租户场景下，每次分析使用独立沙箱，降低数据串扰风险。」
      This answers the 08-09 question (sandboxed end-user code vs developer-deployed code):
      it is the former.
    source: https://help.aliyun.com/zh/model-studio/sandbox-best-practice-code-interpreter
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  browser_use:
    product: 百炼 Sandbox — Browser Use Sandbox
    status: documented
    notes: >
      STATUS CHANGE none → documented: the vendor shipped a browser sandbox.
      「Browser Use Sandbox 面向需要访问网页、点击按钮、填写表单、截图归档或抓取动态页面的 Agent。」
      Based on the browser image; 「可通过 CDP 连接 Puppeteer、Playwright 或 BrowserUse」.
      Security caveat stated by the vendor: 「沙箱公网 URL 应视为访问凭证」. Endpoints shown are
      cn-beijing. No stage label.
      Related but distinct: Model Studio also documents a GUI-operating agent API (a
      different page, help.aliyun.com/zh/model-studio/ui-agent-api):
      「UI Agent 是基于终端屏幕理解操作手机/车机/电视/PC等终端的多模态智能体方案。支持跨应用操作且无需训练，即插即用。」
      It is screen-understanding device control (app_id gui-owl, version V0.0.1), not a
      hosted browser runtime, so it is not the basis of this row. (Paraphrase except the
      quote.)
    source: https://help.aliyun.com/zh/model-studio/sandbox-best-practice-browser-use
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  agent_workload_identity:
    status: documented
    notes: >
      RAM (Resource Access Management) provides identity for Model Studio, re-verified on
      the EN FAQ: "You can use your Alibaba Cloud account to grant different workspace
      permissions to different RAM users. Data is isolated between workspaces." Activation
      by a RAM identity requires the AliyunBailianFullAccess policy. API keys do not
      work across regions: "Each region has its own endpoint, API Key, and model list. These
      cannot be used across regions." (a different page,
      https://www.alibabacloud.com/help/en/model-studio/regions).
      Agent Identity (智能体身份), the separate agent-identity product and closer analogue
      to AgentCore Identity, was researched 2026-11-23 — see delegated_user_auth,
      tool_least_privilege and tool_audit_trail. (Paraphrase.)
    source: https://www.alibabacloud.com/help/en/model-studio/faq-about-alibaba-cloud-model-studio
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  delegated_user_auth:
    product: Agent Identity (智能体身份)
    status: documented
    notes: >
      A dedicated agent-identity service with on-behalf-of access and a token vault — the
      closest Alibaba analogue to AgentCore Identity.
      「阿里云 Agent Identity 提供委托授权访问（On-Behalf-Of）能力，以用户自有身份访问工具，而不是机器身份。」
      3LO flow: 「在可信用户使用 Agent 且用户完成 OAuth 授权后，Agent 临时获得访问工具的权限，且以用户身份、用户权限访问工具、资源」;
      scope is capped: 「权限降级：Agent 获得的权限，永远不会超过用户本身的权限」.
      Vault: 「所有敏感凭证（Client Secrets, API Keys, Refresh Tokens）均使用 KMS 加密存储在凭证保险箱（TokenVault）中。」
      Inbound auth integrates OIDC IdPs (RAM, IDaaS, Okta, Entra ID, Ping Identity);
      outbound credential types are STS Token, OAuth access token and API key; OAuth
      credential providers include DingTalk, Google, Entra ID and Okta. Workload identities
      can be created automatically by hosting services such as 百炼. (Paraphrase except
      quotes.) Page updated 2026-01-14. No stage label.
    source: https://help.aliyun.com/zh/agentidentity/what-is-agent-identity
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  tool_least_privilege:
    product: AI 网关 (per-tool auth) + Agent Identity (RAM policies)
    status: documented
    notes: >
      Per-tool policy is enforced at the gateway:
      「除支持MCP Server级别的调用鉴权外，还支持对单个工具进行细粒度的访问权限配置，实现基于调用方身份的精细化授权管理」,
      so that 「确保不同安全等级的工具可依据风险级别分配相应的访问权限」.
      Credential scoping via Agent Identity (a different page,
      https://help.aliyun.com/zh/agentidentity/what-is-agent-identity):
      「可配置 RAM 策略，限制特定的工作负载身份只能访问特定的凭证提供商。」 and agents start
      with no tool access (「Agent 默认不具备访问工具的能力」). End-user-level fine-grained
      control is announced, not shipped: 「同时即将支持 Agent 用户级的细粒度控制。」
      No stage label.
    source: https://help.aliyun.com/zh/api-gateway/ai-gateway/product-overview/what-is-an-ai-gateway
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  tool_audit_trail:
    product: Alibaba Cloud AgentCore + Agent Identity / ActionTrail + AgentLoop
    status: documented
    notes: >
      AgentCore (EN product page): "AgentCore records every credential operation along
      with the associated Agent Identity and Operator information, ensuring complete
      traceability and accountability." and "Its full audit logs support
      multi-dimensional retrieval by time, user, and Agent, meeting strict enterprise
      compliance requirements."
      Agent Identity (a different page,
      https://help.aliyun.com/zh/agentidentity/what-is-agent-identity) writes to
      ActionTrail: 「所有身份管理操作和凭证获取操作都将被记录到阿里云操作审计 (ActionTrail) 中，提供完整的审计追溯能力。」
      at end-user granularity: 「审计粒度达到 Agent 用户级：哪个 Agent 用户、使用什么 Agent、通过哪个 RAM 角色获取了什么凭证。」
      Per-TOOL-CALL trail: AgentLoop (a different page,
      https://help.aliyun.com/zh/agentloop/product-overview/what-is-agentloop):
      「AgentLoop 为 Agent 每一步工具调用和决策分支构建不可篡改的执行轨迹证据链。」
      CAVEAT: the ActionTrail records cover identity and credential operations; the
      who/what/when of each tool invocation comes from AgentLoop traces. (Paraphrase.)
      No stage label.
    source: https://www.alibabacloud.com/en/product/agentcore
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  private_networking:
    product: Model Studio PrivateLink + AgentRun / AgentCore
    status: documented
    notes: >
      Model Studio apps can be called privately: 「在百炼控制台为您的VPC添加私网连接（PrivateLink），并将目标业务空间与该私网连接关联。」
      The private endpoint follows a {WorkspaceId}-{VpcId}.cn-beijing.maas.aliyuncs.com
      pattern. (Paraphrase.)
      AgentRun (a different page, https://help.aliyun.com/zh/agentrun/what-is-agentrun):
      「如需在 VPC 内网访问 AgentRun 服务，可通过 PrivateLink 配置内网访问端点」 and
      「支持 VPC/IDC 网络打通，数据不出企业私域。」 The EN product page (a different page,
      https://www.alibabacloud.com/en/product/modelstudio) lists "Encryption, sandbox
      isolation, VPC/PrivateLink." AgentCore's product overview also lists PrivateLink as a
      dependent product. (Paraphrase.)
      GAP: no egress allowlist for 百炼 Managed Agents / Sandbox containers was found.
      No stage label.
    source: https://help.aliyun.com/zh/model-studio/call-single-agent-application
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  guardrails:
    product: AI Guardrails + AI Gateway
    status: documented
    notes: >
      AI Gateway integration page (reworded since 08-09): "AI Gateway protects data
      exchanged with large language models (LLMs) by applying privacy controls to outbound
      requests and content filtering to inbound responses." Check Request / Check Response
