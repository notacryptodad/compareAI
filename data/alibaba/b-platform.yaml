  training_data_policy:
    status: documented
    notes: >
      STRONGEST DATA-USE COMMITMENT IN THIS COMPARISON, and it was nearly missed:
      "Alibaba Cloud protects data privacy and will never use your data for model
      training. All data transmitted when building applications or training models is
      encrypted."
      Contrast AWS AgentCore, whose overview states it "may use and store your content to
      improve your service experience or performance". Leaving this cell blank while
      surfacing AWS's clause would have made the most favourable fact for a CN provider
      invisible and the least favourable one for AWS prominent — exactly the asymmetry the
      fairness rule exists to prevent.
    source: https://www.alibabacloud.com/help/en/model-studio/what-is-model-studio
    verified_on: 2026-08-04
    verified_by: "@notacryptodad"
