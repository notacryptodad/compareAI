  pricing_axes:
    status: documented
    notes: >
      RE-SOURCED to the savings plan page, which now carries the axis overview.
      "Model Studio uses the pay-as-you-go billing mode by default". Axes:
      1. Pay-as-you-go per-token model billing (e.g. qwen4-max International ≤1M-token tier
         $1.5/M input, $4.5/M output; batch calls at 50% of real-time — on the
         model-pricing page, a different page,
         https://www.alibabacloud.com/help/en/model-studio/model-pricing ). Context caching is a further axis on the
         same model-pricing page: "Explicit Cache creation is billed at 125% of the standard
         input unit price, and cache hits are billed at 10%"; Batch and cache discounts
         "cannot take effect at the same time".
      2. AI general-purpose savings plan: "savings of up to 47% off"; terms "3 months,
         6 months, 12 months, or 24 months"; monthly commitment "starting from 150 USD".
         Category C models (DeepSeek, Kimi, GLM, MiniMax and others) offset 1:1 with no
         discount, and only their Alibaba Direct Supply versions; Third-party versions are
         not offset. (Paraphrase.)
      3. Other model-specific savings plans.
      4. Token Plan (Personal / Team) subscriptions for AI coding and agent tools (Team:
         $20–$180/seat/month — see bucket C seat_pricing).
      5. Free quota for new users (Singapore only).
      "Deduction order: free quota > other model savings plans > AI general-purpose savings
      plan > pay-as-you-go."
      The docs sidebar on the agent overview lists separate billing pages for Managed
      Agents, Flow Agent, Sandbox, RAG, Memory, ParseX and Security (navigation titles
      only; the pages were not read this pass).
