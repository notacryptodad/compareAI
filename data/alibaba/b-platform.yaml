      Version comparison runs a baseline against up to two variants
      (「弹窗默认展示一组基准组和一组对照组，最多支持添加两组对照组。」), and an AI-generated
      prompt is reviewed before adoption — 「采纳仅更新当前编辑中的 Prompt，不会自动发布应用。」
