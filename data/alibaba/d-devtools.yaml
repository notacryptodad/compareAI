provider: alibaba
bucket: d
product: Qoder CN series
aliases: [Qoder CN, Qoder CN IDE, Qoder CN CLI, QoderWork CN, Tongyi Lingma, 通义灵码]
notes: >
  The Alibaba Cloud documentation says the former Tongyi Lingma suite was renamed to
  Qoder CN on May 20, 2026. The current family includes the Qoder CN desktop coding
  workspace, Qoder CN IDE, JetBrains plugin, Qoder CN CLI, QoderWork CN, and mobile
  companion. The current documentation also describes separate Qoder Agent SDK, Qoder
  Cloud Agents, and QoderWake products; they are not folded into this coding-tool row.
  (Paraphrase.)

capabilities:
  ide_integration:
    status: documented
    value: [Qoder CN IDE, JetBrains]
    notes: >
      The current suite documentation covers the Qoder CN IDE and JetBrains plugin. The
      billing page says the VS Code plugin is no longer actively developed, so VS Code is
      not carried forward as a current primary integration. (Paraphrase.)
    source: https://help.aliyun.com/en/lingma/billing-description
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  cli_agent:
    status: documented
    notes: >
      Qoder CLI CN is a terminal agent that can understand a repository, edit files,
      execute commands, run tests, search the web, and operate in interactive or
      non-interactive headless mode. (Paraphrase.)
    source: https://docs.qoder.cn/zh/cli/overview
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  agentic_coding:
    status: documented
    notes: >
      Qoder CLI CN plans tasks, uses tools, writes and modifies code, runs commands and
      tests, and adjusts its work from the results. The current product documentation
      also describes multi-file execution and expert-agent collaboration in the desktop
      family. (Paraphrase.)
    source: https://docs.qoder.cn/product-overview/introduction-of-qodercn
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  model_choice_coding:
    status: documented
    value: [GLM, DeepSeek, Kimi, MiniMax]
    notes: >
      Qoder CN's current product-family documentation names GLM, DeepSeek, Kimi, and
      MiniMax as supported domestic model families. It does not publish a stable versioned
      model list for every product surface. (Paraphrase.)
    source: https://docs.qoder.cn/product-overview/introduction-of-qodercn
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  model_choosable:
    status: documented
    notes: >
      Users can switch among the supported domestic model families through the model
      selector. The exact model list and access depend on the Qoder subscription and
      product surface. (Paraphrase.)
    source: https://docs.qoder.cn/product-overview/introduction-of-qodercn
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  mcp_support_coding:
    status: documented
    notes: >
      Qoder CLI CN connects to external services and custom tools through MCP. The
      current overview also lists Skills, Plugins, Subagents, hooks, and custom commands
      as extension mechanisms. Transport limits and a fixed server-count limit are not
      carried forward without current evidence. (Paraphrase.)
    source: https://docs.qoder.cn/zh/cli/overview
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  codebase_indexing:
    status: documented
    notes: >
      The current Qoder CN documentation describes whole-codebase understanding and Repo
      Wiki support. It does not state whether the implementation uses embeddings, an AST,
      or a particular search index, so the mechanism remains unspecified. (Paraphrase.)
    source: https://docs.qoder.cn/product-overview/introduction-of-qodercn
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  code_review:
    status: documented
    notes: >
      Qoder CLI CN supports code-review automation in headless mode and the product
      documentation lists PR handling among its development-automation scenarios. The
      pages do not establish a separately priced autonomous PR-review product. (Paraphrase.)
    source: https://docs.qoder.cn/zh/cli/overview
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  code_data_retention:
    status: unknown
    notes: >
      The current Qoder CN product-family documentation describes domestic deployment and
      enterprise security positioning, but the checked pages do not state code retention,
      training use, or deletion controls for every plan and product surface. (Paraphrase.)
    source: https://docs.qoder.cn/product-overview/introduction-of-qodercn
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  coding_seat_pricing:
    status: documented
    value:
      free: CNY 0
      pro: CNY 59/month
      pro_plus: CNY 169/month
      teams: CNY 99/seat/month
      enterprise: CNY 149/seat/month
      vpc: CNY 199/seat/month
    notes: >
      The current Qoder CN All-in-One pricing table lists Free, Pro, Pro+, Teams,
      Enterprise Standard, and Enterprise VPC at the values shown. Credits are the usage
      unit; enterprise editions add seat minimums and administration features. (Paraphrase.)
    source: https://help.aliyun.com/en/lingma/billing-description
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  coding_free_tier:
    status: documented
    notes: >
      The current billing page lists a free tier with limited quota, including a two-week
      Pro trial and 300 Credits, followed by a free plan with limited usage. (Paraphrase.)
    source: https://help.aliyun.com/en/lingma/billing-description
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  launch_stage_investigation:
    status: documented
    notes: >
      Qoder CN has current paid subscription editions and an active product documentation
      site. The reviewed first-party pages do not label the core suite GA, preview, or
      beta, so this remains documented rather than a launch-stage claim. (Paraphrase.)
    source: https://help.aliyun.com/en/lingma/billing-description
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"
