provider: alibaba
bucket: c
product: Alibaba Cloud Model Studio Flow Agent
aliases: [Alibaba Cloud Bailian Flow Agent, 百炼 Flow Agent, 阿里云百炼 Flow Agent, Flow Agent, Model Studio application builder, Model Studio applications, Bailian, 智能体应用, Agent 2.0, Agent 1.0, 百炼 visual application builder]
notes: >
  SCOPE JUDGEMENT, stated openly because it affects comparability: Alibaba does not appear
  to market a packaged employee-facing assistant equivalent to Microsoft 365 Copilot or
  Gemini Enterprise inside Model Studio. What it offers instead is a BUILDER aimed at
  business users — now named Flow Agent: 「Flow Agent 是阿里云百炼提供的可视化应用开发平台，支持构建、调试和发布智能体应用和工作流应用。」
  That is a genuinely different product shape: buy-and-configure rather than
  buy-and-deploy. Recording it in bucket C is the closest honest fit, but the site must not
  imply a like-for-like race with M365 Copilot — the buyer question can I buy instead of
  build? gets a partial yes here.
  2026-11-23 REFRESH: the CN what-is-model-studio URL that most cells cited now serves a
  models-only overview; cells were re-sourced to Flow Agent, Connector, privacy and Token
  Plan pages. The builder was renamed Flow Agent and its recommended version is "Agent 2.0".
  Alibaba's site nav now also lists packaged apps outside Model Studio (千问办公 / QwenWork
  「一站式AI生产力平台」, 万有无界 「企业级人与Agent协作平台」); these were NOT researched this pass
  and may be closer M365-Copilot analogues — flagged for a future pass.
  No 公测/beta/GA label on Flow Agent; Connector is labelled Beta.

capabilities:
  packaged_assistant:
    status: documented
    notes: >
      Partial fit, see the scope note above. Flow Agent targets non-developers: agent apps
      are 「自然语言配置（零代码），可调用知识库、MCP 服务等工具完成任务」, suited to
      「智能客服、知识问答、任务助理」. Recommended version is 「新版智能体应用（Agent 2.0，推荐）」.
      This is a builder, NOT a pre-populated assistant that already knows your corpus on
      day one.
    source: https://help.aliyun.com/zh/model-studio/flow-agent-introduction
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  authoring_mode:
    status: documented
    value: both
    notes: >
      Zero-code agent apps (「自然语言配置（零代码）」) and low-code workflow apps
      (「可视化节点编排（低代码）」), plus a CLI (「在终端用 bl app 列出并调用已发布的应用与工作流。」).
      The code-first path is Managed Agents (bucket B). Strongest low-code story of the CN
      providers researched.
    source: https://help.aliyun.com/zh/model-studio/flow-agent-introduction
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  prebuilt_connectors:
    product: 百炼 Connector
    status: preview
    notes: >
      STATUS CHANGE documented → preview: the vendor shipped a connector catalog and states
      its stage. 「Connector 目前处于 Beta 阶段，功能与支持的 App 列表仍在持续扩充。」
      「阿里云百炼 Connector 是把企业系统与数据接入智能体的统一连接层，在控制台完成一次授权后，即可将外部系统的能力封装为 MCP 工具供智能体调用。」
      Catalog: 「连接 20 类系统：钉钉、语雀、Salesforce on Alibaba Cloud、数据库、OSS 等，开箱可连」.
      Credentials configured once per App and reused. This closes most of the 08-04 gap vs
      Gemini Enterprise / M365 Copilot connector inventories, though the catalog is CN-
      ecosystem-centric (DingTalk, Yuque) rather than Confluence/Jira/SharePoint.
      Legacy data connections had to be migrated by 2026-09-30.
    source: https://help.aliyun.com/zh/model-studio/connector/overview/
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  web_search_tool:
    status: documented
    value: Quark Search official plugin (quark_search); model built-in web search in workflows
    notes: >
      Flow Agent apps get web search through an official plugin. The plugins page lists
      夸克搜索 (tool ID quark_search): 「使大模型可以搜索实时信息，查找公开的网络知识和信息」.
      Limits: 「夸克搜索插件目前支持检索出网页标题、关键词和摘要，但不支持直接访问网页详情。」
      Billing: 「限时免费，需申请开通」. An agent app can attach up to 10 tools.
      Workflow apps can also use the models' built-in web search (enable_search). The Flow
      Agent billing page (a different page, help.aliyun.com/zh/model-studio/flow-agent-billing)
      prices it as 「产生模型调用费用和搜索策略费用」. Agent 2.0 also has a cited-sources
      option that 「推荐与知识库和联网搜索 MCP 组合使用」 (the Agent 2.0 page, a different
      page, help.aliyun.com/zh/model-studio/new-single-agent-application). (Paraphrase
      except the quotes.)
      Sibling QwenWork (Alibaba Cloud's packaged work assistant) runs web and image search
      as a platform service. Its BYOK guide lets a customer replace that service with their
      own endpoint. (Paraphrase.)
    source: https://help.aliyun.com/zh/model-studio/plugins
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  ai_service_tools:
    status: documented
    value: [Python code interpreter, calculator, image generation, Quark search, QR code, GitHub search, "official MCP (text-to-image, text-to-video, speech synthesis)", document/image/audio/video parsing nodes]
    notes: >
      Official plugins (「组件广场中预置了阿里云百炼的官方插件，您无需配置其输入和输出参数，即可直接调用。」):
      Python 代码解释器, 计算器, 图片生成 (text_to_image), 夸克搜索, 生成二维码 and GitHub
      搜索. Image generation and Quark search are 「限时免费，需申请开通」; the rest are free.
      Third-party plugins 「涵盖了商业服务、图像视频、学习教育等多个领域」 and are bought per
      plugin. (Paraphrase except the quotes.)
      Media and speech tools come as official MCP services. The Flow Agent billing page (a
      different page, help.aliyun.com/zh/model-studio/flow-agent-billing) says
      「部分官方 MCP 按模型调用计费，如文生图、文生视频、语音合成等。」 Workflow parsing nodes
      for documents, audio and video 「使用内置大模型解析，暂不计费」. Agent 2.0 can
      pre-parse uploaded documents, images, video and audio. (Paraphrase except the quotes.)
      No standalone OCR or translation tool is listed as a plugin. In workflows, image
      parsing can instead call Qwen-VL models, billed as model calls. (Paraphrase.)
    source: https://help.aliyun.com/zh/model-studio/plugins
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  index_freshness:
    status: documented
    notes: >
      Knowledge base (RAG) is the grounding mechanism. Billing relevant to running it
      continuously: 「知识库的总费用由两部分构成：规格费用和模型调用费用。」 and, correcting the
      08-04 note, prepaid packs now exist: 「知识库提供后付费（按量付费）和预付费资源包两种计费方式。」
      Billing runs per knowledge base per hour from creation. Refresh / re-index cadence is
      not stated on this page.
      The create-knowledge-base page (a different page,
      help.aliyun.com/zh/model-studio/rag-knowledge-base) lists, as an import source,
      「从数据集的文件类目中导入，支持自动同步」 — i.e. category-based imports auto-sync — and notes
      that changing the embedding model 「会触发全量重建索引」. No sync interval, latency or
      real-time guarantee is given. (Paraphrase except the quotes.)
    source: https://help.aliyun.com/zh/model-studio/billing-for-knowledge-base
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  training_data_policy:
    status: documented
    notes: >
      Same commitment recorded in bucket B and worth repeating here, since this is the
      bucket where a buyer's data-governance reviewer will look:
      「阿里云严格保护数据隐私，绝不会将您的数据用于模型训练。」 — will never use your data for
      model training; transmitted data is AES-256 encrypted. The page also states
      「阿里云百炼将存储模型与应用调用时产生的数据」 (call data is stored, per legal requirements).
    source: https://help.aliyun.com/zh/model-studio/privacy-notice
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  permission_aware_retrieval:
    status: unknown
    notes: >
      NOT STATED at the knowledge-base retrieval layer (re-verified 2026-11-23). The
      Retrieve API uses workspace-level RAM permissions — "The AliyunBailianDataFullAccess
      policy includes the required sfm:Retrieve permission." — and SearchFilters are
      "Custom retrieval conditions (such as tags) to filter results", not end-user ACLs.
      The docs don't state whether per-document ACL filtering based on the end user's
      identity exists — this is absence of documentation, not a positive not-offered
      statement, hence `unknown`. What is documented is workspace-scoped isolation.
      (Paraphrase.) By comparison, Amazon Q Business documents filtering answers to content
      the end user has permission to access (docs.aws.amazon.com/amazonq/latest/qbusiness-ug/what-is.html).
      (Paraphrase.)
      The Connector (Beta) overview (help.aliyun.com/zh/model-studio/connector/overview/,
      checked 2026-11-23) covers one-time authorization and shared credentials per App but
      does not state whether source-system permissions are enforced per end user.
      (Paraphrase.)
      SIBLING QWENWORK (checked 2026-11-23, docs.qwenwork.ai/features/connectors and
      /enterprise-ultimate/ai-assets/connectors) uses per-user delegated authorization.
      Each user signs in to the external service, and the Agent can reach only the data and
      actions in that authorization. The admin page warns that connector visibility does
      not grant external-system data permissions. This is federated access under the user's
      own grant, not ACL trimming of a shared index. Team knowledge bases have admin-set
      access rules that are not described further. Not enough to move the row off
      `unknown`. (Paraphrase.)
      The two quoted Retrieve API strings were re-checked verbatim on the rendered page with
      headless Chromium on 2026-11-23. The page is JS-rendered for plain HTTP fetches.
    source: https://www.alibabacloud.com/help/en/model-studio/api-bailian-2023-12-29-retrieve
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  invoke_custom_agents:
    status: documented
    notes: >
      Published Flow Agent apps are invoked via API (「新版智能体应用 API」) and the
      bl app CLI (both in the page body). (Paraphrase.) The 08-04 list of publishing
      targets (web, DingTalk bots, WeChat official accounts, audio/video agents) was on the
      old overview page and was NOT re-verified on a current page. Publishing channels
      (DingTalk / WeChat / web) now appear only as docs-sidebar tutorial titles, which are
      navigation entries and not counted as evidence; they were not confirmed from page body
      text this pass. (Paraphrase.) No Slack/Teams equivalent named.
    source: https://help.aliyun.com/zh/model-studio/flow-agent-introduction
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  conversation_history:
    status: documented
    notes: >
      FLOW AGENT (Agent 2.0): short-term memory only, with a fixed window.
      「短期记忆：新版智能体支持短期记忆功能，即在多轮会话中为智能体提供上下文信息。」
      「可以设置 0 到 30 轮的上下文（0 代表不传递多轮对话记录）」. Long-term memory is not
      shipped: 「长期记忆：该功能计划在未来的迭代中支持。」 Platform retention: the privacy
      notice (a different page, help.aliyun.com/zh/model-studio/privacy-notice) says
      「阿里云百炼将存储模型与应用调用时产生的数据」. No end-user history view, retention
      period or deletion control is documented for published Flow Agent apps.
      (Paraphrase except the quotes.)
      SIBLING QWENWORK (the packaged assistant) covers the personalization half. It keeps
      per-session history. Desktop Global Memory holds a persona, custom instructions, a
      user profile and long-term memory, and the user can switch it off, back it up and
      restore it. Its privacy page says user-deleted content leaves the visible workspace
      and some data may be retained for compliance or audit. (Paraphrase.)
    source: https://help.aliyun.com/zh/model-studio/new-single-agent-application
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  seat_pricing:
    status: documented
    value:
      standard: USD 20/seat/month
      advanced: USD 75/seat/month
      premium: USD 180/seat/month
    notes: >
      PRICE AND TIER-NAME CHANGE since 08-09 (was Standard $30 / Pro $100 / Max $200 list,
      with $20 / $75 promos). Now: Standard "USD 20/seat/month" (25,000 Credits), Advanced
      "USD 75/seat/month" (100,000 Credits), Premium "USD 180/seat/month" (250,000 Credits).
      Shared usage pack "USD 700/pack" (625,000 Credits).
      "A seat is the minimum subscription unit of Token Plan Team Edition, representing a
      usage quota for one team member." Each seat is bound to one member and one API Key.
      "Token Plan Team Edition currently supports only the Singapore region."
      Tools: "supporting Qwen Code, Claude Code, Qoder, OpenClaw, and more."
      CN-SITE PARALLEL OFFERING (a different page,
      https://help.aliyun.com/zh/model-studio/token-plan-team-overview, updated 2026-11-17): the
      China-site Team Edition is priced in CNY and the page states it currently supports only
      the China (Beijing) region. Seats: 标准坐席 「¥150/坐席/月」, 高级坐席
      「¥550/坐席/月」, 尊享坐席 「¥1,298/坐席/月」 (same 25,000 / 100,000 / 250,000 Credits);
      shared usage pack 「¥5,000/个」. The `value` above records the International (USD)
      prices. (Paraphrase except the quotes.)
      PRICING SHAPE IS DIFFERENT from M365 Copilot/Gemini Enterprise: this is a TOKEN
      QUOTA plan, not an assistant access license. You get Credits to spend across models,
      not access to a pre-built assistant.
    source: https://www.alibabacloud.com/help/en/model-studio/token-plan-team-overview
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  model_choosable:
    status: documented
    notes: >
      Unlike M365 Copilot (opaque), the model is explicitly selectable — when creating an
      agent app you choose the model (「选择模型、编写提示词，创建智能体应用。」). Model Studio
      offers Qwen plus third-party DeepSeek, GLM, Kimi and MiniMax (bucket B
      third_party_catalog). A real advantage for this bucket.
    source: https://help.aliyun.com/zh/model-studio/flow-agent-introduction
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  license_bundling:
    status: none
    notes: >
      Token Plan Team Edition is a standalone subscription — not bundled with other
      Alibaba Cloud services. "Subscription periods include monthly and auto-renewing
      monthly options." (The 08-09 note of annual terms is no longer stated.) "The Team
      Edition and Personal Edition can be held simultaneously, each billed independently."
      No equivalent of Google Workspace bundling or M365 E5 inclusion.
    source: https://www.alibabacloud.com/help/en/model-studio/token-plan-team-overview
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  addon_surcharges:
    status: documented
    notes: >
      No platform fee, everything metered: 「Flow Agent 的编排能力本身不单独收费，费用来自应用实际调用的模型和组件。」
      Agent apps are billed for 「模型调用、知识库、MCP 调用」. The knowledge base is pay-as-you-go
      and its retrieved chunks add model input tokens. Some official MCP tools bill as model
      calls, and some third-party MCP fees are charged by the third party, not by Model
      Studio. In workflows, model built-in web search incurs 「产生模型调用费用和搜索策略费用」.
      Free: file upload, Prompt auto-optimization, and document/audio/video parsing
      (「暂不计费」 for now). (Paraphrase except the quotes.)
      So surcharges are per component (knowledge-base spec plus calls, per-plugin purchases
      for third-party plugins), not per connector seat. Sibling QwenWork includes
      enterprise-grade skills and connectors in the seat price and sells extra credit packs
      as its add-on. (Paraphrase; see seat_pricing for Token Plan.)
    source: https://help.aliyun.com/zh/model-studio/flow-agent-billing
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  admin_analytics:
    status: documented
    notes: >
      RE-SOURCED to Token Plan Team Edition, which now documents admin analytics (Team management): "Provides an admin console with capabilities such as seat assignment and
      reclamation, and member usage analytics." "On the Usage Analytics page, you can view
      Credits consumption trends for the past 1, 7, or 30 days, usage by model, and
      consumption details for each member."
      Per-member breakdown is for Token Plan usage; per-application analytics for Flow
      Agent apps is via Evolution observability (bucket B otel_traces).
    source: https://www.alibabacloud.com/help/en/model-studio/token-plan-team-overview
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  dlp_tenant_isolation:
    status: documented
    notes: >
      Token Plan Team Edition (Stable operation): "Multi-tenant isolation architecture
      ensures no queuing during peak usage periods." (Data security): "Conversation data is
      not used for model training, meeting enterprise-grade data privacy requirements."
      Each seat bound to one API Key — logical isolation per member.
      Workspaces provide data isolation (stated in the Model Studio FAQ, a different page).
      No DLP/PII-masking feature specific to the application builder documented — content
      moderation is via the separate AI Guardrails product.
    source: https://www.alibabacloud.com/help/en/model-studio/token-plan-team-overview
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  tool_audit_trail:
    status: documented
    product: QwenWork (Enterprise Premium admin console)
    notes: >
      Strongest evidence is in the sibling packaged assistant. "AI activity shows processing
      results and resource calls by conversation turn. Each row is one turn, not one tool
      call; a turn may contain several resource calls." Admins search "by user, email,
      conversation title, Turn ID, or Session ID", filter by department and result, and
      export CSV. Retention, from the audit overview (a different page,
      https://docs.qwenwork.ai/enterprise-ultimate/audit-logs): AI activity is "Retained for
      90 days. Each query covers at most 7 calendar days". Admin and user activity logs sit
      alongside. (Paraphrase except the quotes.)
      Gap vs the hint (who, what, when, on whose behalf): records are per turn with the
      resources used (skills, connectors, expert suites). The page does not say whether
      each tool call's arguments and results are kept. (Paraphrase.)
      FLOW AGENT itself: the Agent 2.0 debug view shows each tool call's inputs and results
      in the run trace, and the Task Center lists async tasks with input/output JSON. Neither
      is described as an audit log. Model Studio's Evolution observability is the bucket-B
      trace story. (Paraphrase.)
    source: https://docs.qwenwork.ai/enterprise-ultimate/audit-logs/ai-logs
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  feedback_service:
    status: documented
    product: QwenWork
    notes: >
      End-user feedback in the sibling packaged assistant, reviewed by admins. "User
      feedback is actively submitted by members and is viewed separately from automatically
      generated logs." Admins open Audit, then User feedback, and can forward a report to
      official support. "A report may contain the description, screenshots, user
      identifiers, task and client environment, execution steps, and request or response
      data." There is also an admin API, GET /api/openapi/v1/client-feedback. (Paraphrase
      except the quotes.)
      CAVEAT: this is issue and product feedback tied to a session, not per-answer thumbs
      rating feeding a quality loop.
      FLOW AGENT: the overview lists Prompt templates with 反馈优化 (feedback-based
      optimization). No end-user rating API for published apps was found. (Paraphrase.)
    source: https://docs.qwenwork.ai/enterprise-ultimate/audit-logs
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  guardrails:
    product: AI Guardrails
    status: documented
    notes: >
      Alibaba Cloud AI Guardrails is a separate product that integrates with Model Studio.
      "AI Guardrails provides two content safety offerings: Guardrails for AI application
      protection and Content Moderation for user-generated content (UGC) safety."
      Threat detection covers regulatory violations, PII and credentials, jailbreak and
      injection attempts, file and link risks, prompt extraction, and verification of LLM
      outputs against ground truth; configurable thresholds and risk levels. (Paraphrase.)
      Integration paths: "RESTful API for custom applications, AI Gateway for centralized
      policy enforcement, WAF for edge-level prompt blocking, Model Studio for one-click
      Tongyi integration, and third-party platforms (Dify agents, OpenClaw plug-ins)."
      Block vs monitor-only modes and per-consumer policies are documented on the AI
      Gateway integration page (bucket B guardrails), not this one.
    source: https://www.alibabacloud.com/help/en/content-moderation/latest/product-overview
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  index_residency:
    status: documented
    notes: >
      RE-SOURCED to the Regions page. "Regions determine the access point and data storage
      location." "Your static data always remains in the selected region." Inference may run
      in a broader service deployment scope (e.g. Global vs US/EU) chosen per workspace.
      Six regions: Singapore, US (Virginia), China (Beijing), China (Hong Kong), Japan
      (Tokyo), Germany (Frankfurt). Knowledge base data inherits the regional constraint.
      (Paraphrase.) Note the new CN agent services (Managed Agents, Memory, Sandbox) show
      cn-beijing endpoints only.
    source: https://www.alibabacloud.com/help/en/model-studio/regions
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  certifications:
    status: documented
    product: Alibaba Cloud Model Studio
    value: [SOC 2]
    notes: >
      Product-specific: "Alibaba Cloud Model Studio has achieved SOC 2 compliance with an
      unqualified opinion, validating our rigorous controls for Security, Availability, and
      Confidentiality." Flow Agent is part of Model Studio, so this is the closest
      product-scoped statement. The page links the compliance repository for the reports.
      Platform-wide, the Alibaba Cloud Trust Center compliance page
      (www.alibabacloud.com/trust-center/compliance) lists CSA STAR, ISO 27001 / 27017 /
      27018 / 27701, SOC 1 / 2 / 3, PCI DSS and regional schemes including MLPS 2.0 (China),
      C5 and AIC4 (Germany) and MTCS (Singapore). It does not map them to Model Studio, Flow
      Agent or QwenWork, so they are not added to the value. (Paraphrase of the list.)
      No ISO 42001 or HIPAA statement for this product was found.
    source: https://www.alibabacloud.com/help/en/model-studio/privacy-notice
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  sovereign_cloud:
    status: unknown
    product: Alibaba Cloud Model Studio Flow Agent
    notes: >
      STATUS CHANGE 2026-11-23 (fact-check, symmetry with byteplus/c-outofbox): documented
      -> unknown. The on-prem appliance below is not tied to Flow Agent or QwenWork, and no
      government region was found; it is kept as a caveat.
      No government region of the public Model Studio was found. The regions are Singapore,
      US (Virginia), China (Beijing), China (Hong Kong), Japan (Tokyo) and Germany
      (Frankfurt) (see index_residency). A search of the aliyun.com help docs for 百炼 together
      with 政务云 found no statement that Model Studio runs on Alibaba Gov Cloud.
      (Paraphrase.)
      The sovereign option is private deployment. 阿里云百炼专属版 AI Stack is a
      hardware-software appliance aimed at 「需要大模型推理及应用的政企客户」:
      「AI Stack 一体机支持本地化私有部署，确保敏感数据（如政务、金融信息）无需上传云端即可完成处理，满足行业数据主权和隐私监管要求」.
      It ships a toolchain that includes agent building (智能体搭建) and app templates. The
      page does not say this is Flow Agent itself. (Paraphrase except the quotes.)
      Sibling QwenWork Enterprise Premium lists Dedicated VPC deployment. QwenWork
      International stores user content in Singapore. (Paraphrase.)
    source: https://www.aliyun.com/solution/tech-solution/bailian-aistack
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  launch_stage_investigation:
    status: documented
    notes: >
      FLOW AGENT: no 公测 / Beta / GA label on the overview, the Agent 2.0 page, the billing
      page or the Task Center page (all updated 2026-10/11). Agent 2.0 is labelled only as
      recommended over Agent 1.0. Feature-level: Connector is Beta (see prebuilt_connectors)
