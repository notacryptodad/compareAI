provider: alibaba
bucket: c
product: Alibaba Cloud Bailian Flow Agent
aliases: [百炼 Flow Agent, Model Studio applications, Bailian, Agent 2.0, Agent 1.0]
notes: >
  Flow Agent is Alibaba Cloud Bailian's current visual application-development product,
  rather than a pre-populated employee assistant. The current page documents zero-code
  agent applications and low-code workflow applications, recommends Agent 2.0 for new
  applications, and retains Agent 1.0 for compatibility. This is a partial bucket-C fit:
  configure or build an application rather than buy a ready-indexed assistant. The
  separate English application page still labels its older Applications, Components, and
  Data tab preview and access-restricted. (Paraphrase.)

capabilities:
  packaged_assistant:
    status: documented
    notes: >
      This is a builder for creating agent and workflow applications, not a ready-made
      assistant with a pre-populated enterprise corpus. The application surface is
      (Paraphrase.)
    source: https://www.alibabacloud.com/help/en/model-studio/application-introduction
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  authoring_mode:
    status: documented
    value: [no-code, low-code]
    notes: >
      Agent applications use natural-language no-code configuration, while workflow
      applications use visual low-code node orchestration. (Paraphrase.)
    source: https://help.aliyun.com/zh/model-studio/flow-agent-introduction
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  prebuilt_connectors:
    status: unknown
    notes: >
      The application documentation mentions external tool calls and MCP services but
      does not provide a current named enterprise SaaS connector catalog. A protocol
      integration is not counted as a connector inventory. (Paraphrase.)
    source: https://help.aliyun.com/zh/model-studio/flow-agent-introduction
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  index_freshness:
    status: unknown
    notes: >
      Knowledge-base retrieval is documented, but the current application-introduction
      page does not state crawl frequency, indexing latency, or refresh guarantees.
      (Paraphrase.)
    source: https://help.aliyun.com/zh/model-studio/flow-agent-introduction
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  training_data_policy:
    status: documented
    notes: >
      Alibaba Cloud states that Model Studio will not use customer data for model
      training and encrypts data transmitted during application building and model
      training with AES-256. The same page says data generated from model and
      application calls is stored, so this is not a no-retention claim. (Paraphrase.)
    source: https://www.alibabacloud.com/help/en/model-studio/privacy-notice
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  permission_aware_retrieval:
    status: unknown
    notes: >
      The refreshed application pages establish knowledge-base retrieval but do not
      establish query-time document ACL trimming based on the asking user's identity.
      Workspace authorization is not treated as per-document permission-aware retrieval.
      (Paraphrase.)
    source: https://help.aliyun.com/zh/model-studio/flow-agent-introduction
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  invoke_custom_agents:
    status: unknown
    notes: >
      The current application-introduction page explains how to create and call agent
      applications but does not document publication targets such as DingTalk, WeChat,
      Slack, or Teams. No distribution claim is inferred from the older overview.
      (Paraphrase.)
    source: https://help.aliyun.com/zh/model-studio/flow-agent-introduction
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  seat_pricing:
    status: documented
    value:
      standard: CNY 150/seat/month
      advanced: CNY 550/seat/month
      premium: CNY 1298/seat/month
    notes: >
      The current Token Plan Team Edition lists Standard, Advanced, and Premium seats at
      CNY 150, CNY 550, and CNY 1,298 per seat per month, with 25,000, 100,000, and
      250,000 Credits respectively. The plan currently supports only China (Beijing).
      (Paraphrase.)
    source: https://help.aliyun.com/zh/model-studio/token-plan-team-overview
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  model_choosable:
    status: documented
    notes: >
      Token Plan Team Edition exposes multiple selectable Qwen, DeepSeek, Kimi, GLM,
      MiniMax, and other model IDs. The available list is a subscription and region
      detail, not a fixed opaque assistant model. (Paraphrase.)
    source: https://help.aliyun.com/zh/model-studio/token-plan-team-overview
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  license_bundling:
    status: none
    notes: >
      The Token Plan Team Edition is a separately purchased seat-and-Credits
      subscription. The official page describes its own subscription and usage-package
      rules rather than bundling it with an office suite or another assistant license.
      (Paraphrase.)
    source: https://help.aliyun.com/zh/model-studio/token-plan-team-overview
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  admin_analytics:
    status: documented
    notes: >
      Team administrators can assign seats, inspect per-seat Credits and consumption
      details, manage shared usage packages, and reset member API keys. The page does
      not establish a richer answer-quality feedback or adoption analytics system.
      (Paraphrase.)
    source: https://help.aliyun.com/zh/model-studio/token-plan-team-overview
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  dlp_tenant_isolation:
    status: documented
    notes: >
      Token Plan Team Edition binds each seat to one member and one API key, supports
      administrator controls over shared usage, and keeps Credits independently measured
      per seat. These are account and usage controls, not evidence of DLP or content
      redaction. (Paraphrase.)
    source: https://help.aliyun.com/zh/model-studio/token-plan-team-overview
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  guardrails:
    product: AI safety guardrails
    status: documented
    notes: >
      Model Studio supports an AI safety guardrail service that inspects model inputs
      and outputs for sensitive or high-risk content. The current documentation limits
      the service to China (Beijing) and supports text and image models. (Paraphrase.)
    source: https://help.aliyun.com/zh/model-studio/content-security
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  index_residency:
    status: documented
    value: [China (Beijing)]
    notes: >
      The current Token Plan Team Edition page says the service supports only China
      (Beijing). It also lists region-specific model availability, so this row does not
      generalize the Token Plan restriction to every Model Studio API. (Paraphrase.)
    source: https://help.aliyun.com/zh/model-studio/token-plan-team-overview
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"
