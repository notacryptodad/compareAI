provider: alibaba
bucket: a
product: AgentScope
aliases: [agentscope, AgentScope 2.0]
repo: https://github.com/agentscope-ai/agentscope
notes: >
  AgentScope 2.0 is the current major line. The official repository describes it as a
  production-ready agent framework, while the PyPI publisher metadata still classifies
  the package as Beta. That tension is recorded as documented rather than GA because
  the vendor does not state general availability. The package metadata identifies the
  publisher as the SysML team of Alibaba Tongyi Lab. (Paraphrase.)

capabilities:
  sdk_languages:
    status: documented
    value: [python]
    notes: >
      The installation requirement is Python 3.11 or higher. The current repository
      does not document an equivalent TypeScript, Java, or Go SDK. (Paraphrase.)
    source: https://github.com/agentscope-ai/agentscope
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  mcp_client:
    status: documented
    notes: >
      The Toolkit supports MCP servers, and the Agent Service includes an MCP and Skill
      Hub for browsing hubs, installing items into the library, and adding them to a
      workspace. This is client and hub functionality, not managed MCP-server hosting.
      (Paraphrase.)
    source: https://github.com/agentscope-ai/agentscope
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  multi_agent_patterns:
    status: documented
    value: [leader-worker, task planning]
    notes: >
      The Agent Team service provides leader-worker orchestration, built-in team tools,
      and task planning. The current news also names TeamPipeline, where a leader agent
      delegates tasks to member agents. (Paraphrase.)
    source: https://github.com/agentscope-ai/agentscope
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  long_running_agents:
    status: documented
    notes: >
      The Agent Service lists scheduled tasks, agent wakeup, and background task
      offloading. These are service capabilities shipped with the open-source project,
      not a vendor-operated cloud runtime. (Paraphrase.)
    source: https://github.com/agentscope-ai/agentscope
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  multi_tenancy:
    status: documented
    notes: >
      Agent Service provides multi-tenant and multi-session management, including
      multi-session isolation. The documentation presents this as part of the
      self-managed service deployment. (Paraphrase.)
    source: https://docs.agentscope.io/en/versions/2.0.12
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  code_interpreter:
    status: documented
    value: [local, Docker, Apple Container, Bubblewrap, E2B, OpenSandbox, Daytona, K8s]
    notes: >
      Workspace and sandbox execution supports the listed local and third-party
      backends. This is a pluggable self-managed execution design rather than one
      Alibaba-hosted code-interpreter service. (Paraphrase.)
    source: https://github.com/agentscope-ai/agentscope
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  cross_cloud_model_adapters:
    status: documented
    value: [OpenAI, Anthropic, Gemini, DashScope, DeepSeek, Moonshot, Volcengine, xAI, Ollama]
    notes: >
      The current model building block lists adapters for OpenAI, Anthropic, Gemini,
      DashScope, DeepSeek, Moonshot, Volcengine, xAI, and Ollama. This supports use with
      rival providers and local Ollama models. (Paraphrase.)
    source: https://github.com/agentscope-ai/agentscope
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  oss_license:
    status: documented
    value: Apache-2.0
    notes: >
      The repository license is Apache-2.0. (Paraphrase.)
    source: https://github.com/agentscope-ai/agentscope
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  oss_governance:
    status: documented
    value: single-vendor
    notes: >
      PyPI publisher metadata names the SysML team of Alibaba Tongyi Lab and uses an
      alibaba-inc.com address. The repository does not describe foundation governance.
      (Paraphrase.)
    source: https://pypi.org/pypi/agentscope/json
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  oss_release_cadence:
    status: documented
    notes: >
      The repository release page shows v2.0.12 published on 2026-11-16 and continued
      2.0.x maintenance releases. No formal release-cadence promise is documented.
      (Paraphrase.)
    source: https://github.com/agentscope-ai/agentscope/releases
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  oss_runtime_lockin:
    status: none
    notes: >
      The documented model adapters include several external providers and Ollama, while
      workspace execution supports multiple local and third-party backends. The current
      documentation therefore does not require an Alibaba runtime. (Paraphrase.)
    source: https://github.com/agentscope-ai/agentscope
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  oss_community:
    status: documented
    value:
      stars: 36471
    notes: >
      The repository had 36,471 GitHub stars when checked on 2026-11-22. (Paraphrase.)
    source: https://github.com/agentscope-ai/agentscope
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  authoring_mode:
    status: documented
    value: code-first
    notes: >
      AgentScope is an installable Python framework and the official quickstart builds
      agents in Python code. (Paraphrase.)
    source: https://github.com/agentscope-ai/agentscope
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  local_dev_loop:
    status: documented
    notes: >
      The repository supplies a console launcher and a self-managed Agent Service with a
      pre-built web UI. The service can be run locally from the repository. (Paraphrase.)
    source: https://github.com/agentscope-ai/agentscope
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  human_in_the_loop:
    status: documented
    notes: >
      The framework provides permission and HITL controls with tool and resource
      confirmation, plus interruption and resume in the ReAct loop. (Paraphrase.)
    source: https://github.com/agentscope-ai/agentscope
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  policy_hooks:
    status: documented
    notes: >
      Middleware hooks can run around reply, reasoning, acting, model calls, permission
      checks, context compression, and system-prompt handling. (Paraphrase.)
    source: https://github.com/agentscope-ai/agentscope
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  otel_traces:
    status: unknown
    notes: >
      The current repository and documentation describe an event system and service
      observability-related components but do not establish OpenTelemetry export or
      GenAI semantic conventions. (Paraphrase.)
    source: https://github.com/agentscope-ai/agentscope
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  in_repo_eval:
    status: unknown
    notes: >
      The current repository README does not document an evaluation harness. The older
      evaluation page was not used to carry forward a stale capability claim without a
      current version-specific confirmation. (Paraphrase.)
    source: https://docs.agentscope.io/en/versions/2.0.12
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  sdk_telemetry_phone_home:
    status: unknown
    notes: >
      The current repository documentation does not state whether the SDK collects
      telemetry or contacts an analytics endpoint. No conclusion is drawn from that
      omission. (Paraphrase.)
    source: https://github.com/agentscope-ai/agentscope
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"
