provider: alibaba
bucket: a
product: AgentScope
aliases: [agentscope, AgentScope 2.0]
repo: https://github.com/agentscope-ai/agentscope
notes: >
  Current major version is "AgentScope 2.0" (v2.0.6 on PyPI as of 2026-08-07).
  "AgentScope 2.0 is a production-ready, easy-to-use agent framework with essential
  abstractions that keep up with rising model capability."
  LAUNCH STAGE TENSION: the README says "production-ready" but the PyPI classifier reads
  "Development Status :: 4 - Beta" — NOT "5 - Production/Stable". Per project rules this
  is NOT sufficient for `ga` (no "generally available" stated). Recorded as `documented`.
  AFFILIATION NOW CONFIRMED (was unresolved through three earlier revisions).
  The PyPI package metadata for `agentscope` — the authoritative publisher record — gives
  author_email as "SysML team of Alibaba Tongyi Lab <...@alibaba-inc.com>".
  An @alibaba-inc.com corporate address plus a named Alibaba Tongyi Lab team settles it:
  this IS an Alibaba-affiliated SDK and belongs in Alibaba's bucket A.
  Why it took so long: neither the GitHub org (`agentscope-ai`, not an Alibaba org), the
  repo README, nor agentscope.io states the affiliation. agentscope.io lists Alibaba Cloud,
  Alibaba Group and Ant Group under "Trusted by Teams At" — which reads as ADOPTION, not
  ownership, and is exactly the kind of signal that should not be treated as proof.
  Package-registry metadata beat both the repo and the marketing site here; worth
  remembering as a sourcing technique for the other SDKs.
  Caveat for precision: Tongyi Lab is Alibaba Group R&D. Treat this as
  Alibaba-Group-affiliated; "Alibaba Cloud product" is a stronger claim, unevidenced.
  Bilingual docs (English + 中文主页 / README_zh.md) — good sign for the fairness rule
  about not penalizing CN providers for thin English docs.

capabilities:
  sdk_languages:
    status: documented
    value: [python]
    notes: >
      Python only. Requirement stated: Python 3.11 or higher — a higher floor than
      Strands/ADK (3.10). (Requirement paraphrased.)
      The GitHub Languages panel was not captured by our fetch (lazily loaded), which is a
      fetch limitation rather than evidence; a spot check reports Python plus Dockerfile
      and Mako.
      No TypeScript/Java/Go equivalent found.
    source: https://github.com/agentscope-ai/agentscope
    verified_on: 2026-08-04
    verified_by: "@notacryptodad"

  mcp_client:
    status: documented
    notes: >
      Multiple signals: `mcp` repo topic; news entry (2026-08) "MCP & Skill Hub
      supported — browse a hub, install into your library, add to a workspace"; news entry
      (2026-08) "GitHub MCP Registry and ClawHub supported as built-in hubs."
      Built-in MCP hub/registry integration is more than a plain MCP client — arguably the
      most opinionated MCP story of the SDKs surveyed.
    source: https://github.com/agentscope-ai/agentscope
    verified_on: 2026-08-04
    verified_by: "@notacryptodad"

  multi_agent_patterns:
    status: documented
    value: [leader-worker, task planning]
    notes: >
      "Agent Team" — "Leader–worker orchestration, built-in team tools, task planning"
      (supervisor-equivalent). 2.0 README wording is tighter than the earlier verbose form.
      Repo topics: `multi-agent`, `react-agent`.
    source: https://github.com/agentscope-ai/agentscope
    verified_on: 2026-08-09
    verified_by: "@notacryptodad"

  long_running_agents:
    status: documented
    notes: >
      Background task offloading is listed as a feature: a long-running tool can move to
      the background. Unusual for an SDK (vs a platform) to handle this. (Paraphrase.)
      Additionally, the Agent Service layer offers "scheduled tasks" per the 2.0 README
      features. (Paraphrase.)
    source: https://github.com/agentscope-ai/agentscope
    verified_on: 2026-08-09
    verified_by: "@notacryptodad"

  multi_tenancy:
    status: documented
    notes: >
      RE-VERIFIED 2026-08-07 — the README was reworded since the 08-04 pass (the word
      "tenants" was replaced), a live example of source drift the quote-checker caught.
      Current verbatim from the Serving row: "Multi-tenancy, multi-session isolation,
      FastAPI backend, pre-built Web UI".
      An SDK claiming multi-tenant serving blurs the A/B bucket line — worth a note on the
      site, since no other bucket-A entry claims this.
    source: https://github.com/agentscope-ai/agentscope
    verified_on: 2026-08-07
    verified_by: "@notacryptodad"

  code_interpreter:
    status: documented
    value: [local, Docker, Apple Container, Bubblewrap, E2B, OpenSandbox, Daytona, K8s]
    notes: >
      RE-VERIFIED 2026-08-07 — the backend list GREW since the 08-04 pass, an instance of
      source drift caught by re-checking. Current verbatim from the Workspace row:
      "Isolated tool & code execution — local, Docker, Apple Container, Bubblewrap, E2B,
      OpenSandbox, Daytona, K8s". Apple Container and Bubblewrap are new since 08-04.
      Pluggable third-party sandboxes rather than one managed service — the opposite
      design choice from AWS/GCP managed code interpreters, and now the widest backend set
      of any provider here.
    source: https://github.com/agentscope-ai/agentscope
    verified_on: 2026-08-07
    verified_by: "@notacryptodad"

  cross_cloud_model_adapters:
    status: documented
    value: [OpenAI, Anthropic, Gemini, DashScope, DeepSeek, Moonshot, xAI, Ollama]
    notes: >
      "LLM, embedding, and TTS across major providers (OpenAI, Anthropic, Gemini,
      DashScope, DeepSeek, Moonshot, xAI, Ollama)"
      Broader than the 08-04 pass found — that pass saw only DashScope because the
      model_examples directory didn't render. The 2.0 README states the full list directly.
    source: https://github.com/agentscope-ai/agentscope
    verified_on: 2026-08-09
    verified_by: "@notacryptodad"

  oss_license:
    status: documented
    value: Apache-2.0
    notes: '"AgentScope is released under Apache License 2.0."'
    source: https://github.com/agentscope-ai/agentscope
    verified_on: 2026-08-04
    verified_by: "@notacryptodad"

  oss_governance:
    status: documented
    value: single-vendor
    notes: >
      Single-vendor, resolved via the PyPI JSON API (a DIFFERENT source from the repo
      page): author_email reads SysML team of Alibaba Tongyi Lab, at an alibaba-inc.com
      address. The GitHub org name (`agentscope-ai`)
      reads independent and states no corporate owner — the org page alone is NOT sufficient
      evidence either way, which is why this sat at `unknown` until the registry was checked.
      No foundation governance.
    source: https://pypi.org/pypi/agentscope/json
    verified_on: 2026-08-04
    verified_by: "@notacryptodad"

  oss_release_cadence:
    status: documented
    notes: >
      Weekly to bi-weekly release cadence observed from PyPI history (frequent v2.0.x
      point releases). The README carries dated news entries (2026-08) confirming active,
      ongoing development. No formal published cadence statement, but the actual release
      pattern is comparable to ADK's stated bi-weekly. (Paraphrase of observed pattern.)
    source: https://github.com/agentscope-ai/agentscope
    verified_on: 2026-08-09
    verified_by: "@notacryptodad"

  oss_runtime_lockin:
    status: none
    notes: >
      No runtime lock-in. Model providers include OpenAI, Anthropic, Gemini, DeepSeek,
      Ollama alongside DashScope. Sandbox backends are all third-party (Docker, E2B, K8s,
      etc.). DashScope is the default (analogous to Strands' Bedrock default) but not
      required — same pattern, same verdict (`none`).
    source: https://github.com/agentscope-ai/agentscope
    verified_on: 2026-08-09
    verified_by: "@notacryptodad"

  oss_community:
    status: documented
    value:
      stars: 28700
    notes: >
      ~28.7k stars as of 2026-08-09. The highest-starred SDK in this comparison (ADK ~21k,
      MAF ~14k, Strands ~6.8k). Contributor/issue-response data not captured this pass.
    source: https://github.com/agentscope-ai/agentscope
    verified_on: 2026-08-09
    verified_by: "@notacryptodad"
  authoring_mode:
    status: documented
    value: code-first
    source: https://github.com/agentscope-ai/agentscope
    verified_on: 2026-08-04
    verified_by: "@notacryptodad"
  local_dev_loop:
    status: documented
    notes: >
      Pre-built Web UI for local development and testing. Also supports local model
      execution via Ollama integration. The "Serving" feature ("Multi-tenancy,
      multi-session isolation, FastAPI backend, pre-built Web UI") provides a full local
      dev environment without cloud dependencies.
    source: https://github.com/agentscope-ai/agentscope
    verified_on: 2026-08-09
    verified_by: "@notacryptodad"
  human_in_the_loop:
    status: documented
    notes: >
      "Reasoning-acting loop with structured output, realtime interruption & resume, and
      batched (sequential / concurrent) tool acting"
      Plus dedicated feature: "Permission & HITL" — "Fine-grained control over tools and
      resources, confirmation, bypass mode"
      This is explicit interrupt/resume AND approval gates — both halves of the row.
    source: https://github.com/agentscope-ai/agentscope
    verified_on: 2026-08-09
    verified_by: "@notacryptodad"
  policy_hooks:
    status: documented
    notes: >
      "Middleware" — "Composable hooks across the loop — reply, reasoning, acting, model
      calling, permission checking, context compression, system prompt"
      Seven named hook points covering the full agent loop. More granular than Strands'
      hooks/steering/guardrails model.
    source: https://github.com/agentscope-ai/agentscope
    verified_on: 2026-08-09
    verified_by: "@notacryptodad"
  otel_traces:
    status: none
    notes: >
      No OpenTelemetry integration found. Searched the repo README, feature list, and
      news entries — zero mentions of OpenTelemetry, OTel, tracing, or distributed tracing.
      The high-code deployment on Bailian has observability but that is the platform's
      internal monitoring (bucket B), not an SDK-level OTel export. (Paraphrase.)
    source: https://github.com/agentscope-ai/agentscope
    verified_on: 2026-08-09
    verified_by: "@notacryptodad"
  in_repo_eval:
    status: documented
    notes: >
      Full evaluation framework documented: "AgentScope's Evaluation Module is designed to
      be the CI/CD pipeline for your Agents. It transforms the vague art of 'prompt
      engineering' into a measurable engineering discipline." Components: Benchmark (Task +
      Metric), Solution (adapter pattern), Evaluator (orchestrator). Two evaluators:
      GeneralEvaluator (sequential) and RayEvaluator (parallel/distributed via Ray).
      Built-in benchmark: ACEBench ("comprehensive multi-domain evaluation framework for
      testing AI agents' tool usage and collaboration capabilities"). Supports LLM-as-a-Judge
      via OpenJudge integration (50+ pre-built graders). Trajectory analysis for process
      evaluation. This is the RICHEST eval framework of any SDK in this comparison —
      more complete than ADK's eval (which has simulation but no distributed runner) and
      far beyond MAF's experimental AF Labs benchmarking.
    source: https://docs.agentscope.io/v1/observe-and-evaluate/evaluation
    verified_on: 2026-08-09
    verified_by: "@notacryptodad"
  sdk_telemetry_phone_home:
    status: none
    notes: >
      No telemetry or phone-home behavior found. Searched the repo README, setup docs,
      and configuration — zero mentions of analytics collection, usage reporting, or
      opt-in/opt-out telemetry. Clean install does not contact any analytics endpoint.
    source: https://github.com/agentscope-ai/agentscope
    verified_on: 2026-08-09
    verified_by: "@notacryptodad"
