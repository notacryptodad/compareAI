provider: byteplus
bucket: d
product: TRAE
aliases: [TRAE, Trae AI, TraeCode, TRAE Teams]
notes: >
  Refreshed 2026-11-22 against the current official TRAE IDE, pricing, and BytePlus TRAE
  Teams pages. The current international product brands itself TRAE; the BytePlus
  enterprise page calls the enterprise offering TRAE Teams. The previous $10 Pro price,
  unverified model list, and unsupported VS Code-foundation wording were removed.
  (Paraphrase.)

capabilities:
  ide_integration:
    status: documented
    value: [TRAE IDE, plugin]
    notes: >
      The official TRAE site presents TRAE as an IDE covering ideation, design, coding,
      and testing. The BytePlus enterprise page lists IDE and plugin integration methods;
      it also labels CLI as coming soon. No specific editor compatibility list is claimed
      here. (Paraphrase.)
    source: https://www.trae.ai/ide/
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  cli_agent:
    status: documented
    notes: >
      The current BytePlus TRAE Teams page lists IDE, plugin, or CLI integration, with CLI
      explicitly marked coming soon. This records the documented roadmap state rather than
      claiming that a generally available standalone CLI exists. (Paraphrase.)
    source: https://www.byteplus.com/en/product/trae
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  agentic_coding:
    status: documented
    notes: >
      The current TRAE IDE page describes SOLO as its most advanced coding agent. It says
      SOLO can take a task with context and tools, plan and execute a complete solution,
      and work with built-in, custom, and sub-agents. The page also describes parallel
      projects and agents. (Paraphrase.)
    source: https://www.trae.ai/ide/
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  model_choice_coding:
    status: documented
    notes: >
      The current TRAE Teams page advertises access to frontier models and the ability to
      connect custom enterprise models. It does not enumerate a stable model list on the
      reviewed page, so the former hard-coded model names were removed. (Paraphrase.)
    source: https://www.byteplus.com/en/product/trae
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  model_choosable:
    status: documented
    notes: >
      TRAE Teams documents multi-model support, including frontier models and custom
      enterprise models. The official page does not state that every model is available
      on every individual plan. (Paraphrase.)
    source: https://www.byteplus.com/en/product/trae
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  mcp_support_coding:
    status: documented
    notes: >
      The current TRAE IDE page explicitly documents Model Context Protocol support for
      agents to access external resources on demand. The same page describes built-in
      preview-tab browser interaction, console-log access, and debugging; that is not
      upgraded to a managed browser-use claim for this coding-tool row. (Paraphrase.)
    source: https://www.trae.ai/ide/
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  codebase_indexing:
    status: documented
    notes: >
      The current TRAE Teams page says enterprise indexing supports up to 100,000 files
      and 150 million lines of code with real-time incremental updates. It also describes
      dedicated GPU clusters for low-latency response under high concurrency. (Paraphrase.)
    source: https://www.byteplus.com/en/product/trae
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  code_review:
    status: unknown
    notes: >
      The reviewed current TRAE pages describe coding, testing, tools, agents, and
      enterprise controls but do not establish a dedicated pull-request or inline AI code
      review feature. (Paraphrase.)
    source: https://www.trae.ai/ide/
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  code_data_retention:
    status: documented
    notes: >
      The current TRAE IDE page says the product follows a local-first and minimal-data
      collection approach. It says codebase files are stored locally, plaintext uploaded
      for indexing is deleted after processing, and Privacy Mode and ignore controls are
      available. The BytePlus enterprise page separately states zero retention, no model
      training on code, and no retained logs. These are current product statements; the
      exact scope of each statement should be checked against the applicable plan terms.
      (Paraphrase.)
    source: https://www.byteplus.com/en/product/trae
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  coding_seat_pricing:
    status: documented
    value:
      free: $0
      pro: $20/month
      pro_plus: $60/month
      ultra: $200/month
    notes: >
      The current international pricing page lists Free at $0, Pro at $20 per month,
      Pro+ at $60 per month, and Ultra at $200 per month on monthly billing. It also
      presents annual billing with a displayed 17 percent saving. The page directs
      enterprise buyers to BytePlus rather than publishing an enterprise seat price.
      (Paraphrase.)
    source: https://www.trae.ai/pricing
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  coding_free_tier:
    status: documented
    notes: >
      The current Free plan is $0 and includes Auto mode only, limited usage, limited
      autocomplete, 5,000 monthly autocomplete uses, and up to two concurrent cloud
      tasks. The page describes this as a free plan, not as an unlimited free tier.
      (Paraphrase.)
    source: https://www.trae.ai/pricing
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  launch_stage_investigation:
    status: documented
    notes: >
      The current TRAE IDE and pricing pages present an operating product with free and
      paid plans. The reviewed TRAE pages do not state GA, preview, or beta for the core
      TRAE product. The BytePlus enterprise page labels CLI and VPC deployment coming
      soon, which is not generalized to the whole product. (Paraphrase.)
    source: https://www.trae.ai/pricing
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"
