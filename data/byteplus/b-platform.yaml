provider: byteplus
bucket: b
product: BytePlus ModelArk
aliases: [ModelArk, Ark, BytePlus Ark, ModelArk Managed Agents]
notes: >
  CORRECTION TO EARLIER ASSUMPTION: BytePlus DOES have a managed agent offering. The
  README's initial "TBD" was wrong. ModelArk documents a "Managed Agents" section with
  agents, skills, tools, sessions, sandboxes, and persistent memory.
  "Managed Agents" is a SECTION within ModelArk (alongside Model invocation, Tool use,
  Inference, Training), not a separately branded product.
  SECOND AGENT PLATFORM: BYTEPLUS AGENTKIT (added 2026-11-23). BytePlus also sells
  AgentKit (www.byteplus.com/en/product/agentkit), an "Enterprise AI Agent Infrastructure
  Platform". It is a SEPARATE product from ModelArk Managed Agents, not a rename: it has
  its own doc set (docs.byteplus.com/en/docs/agentkit), its own console
  (console.byteplus.com/agentkit), its own pay-as-you-go billing, and its own components
  (agent runtime, gateway, identity, memory, knowledge base, observability, evaluation).
  Its "Related cloud product" page lists ModelArk as a dependency it uses (for models),
  alongside VeADK, APMPlus, VPC and PrivateLink. It is a bring-your-own-code runtime
  (VeADK, LangChain, LangGraph, ADK, Strands and AgentCore migration), while ModelArk
  Managed Agents is a prebuilt hosted agent loop. It is the BytePlus counterpart of
  Volcengine AgentKit. (Paraphrase, from the AgentKit docs.)
  PRODUCT-NAME DECISION: the file-level product stays BytePlus ModelArk (Managed Agents).
  AgentKit is NOT listed as an alias, because it is a different product.
  PER-CELL PRODUCT CONVENTION (AgentKit cell-by-cell pass, 2026-11-23): this project
  scores the PROVIDER, so each cell records BytePlus's strongest documented offering for
  that row, the same way AWS cells name AgentCore Runtime / Gateway / Memory separately.
  Rule applied: if ModelArk's evidence supports the row at least as strongly, the ModelArk
  cell stays and AgentKit gets a one-line note. If AgentKit documents the capability where
  ModelArk is unknown or weaker, the cell switches to `product: BytePlus AgentKit` (or an
  AgentKit component name such as BytePlus AgentKit Gateway), cites the AgentKit page,
  and keeps the ModelArk facts in the note. A cell with no `product:` override is
  ModelArk. A few cells name a third BytePlus product (Knowledge Engine, RTC
  Conversational AI).
  STAGE RULE FOR AGENTKIT CELLS: the release notes say "AgentKit is generally available
  for commercial use." (2026-11-16, Asia Pacific (Johor)). That GA applies to AgentKit as
  a product, so `ga` is used only where it clearly covers the capability (the headline
  agent runtime and the launch-stage row). Every other AgentKit cell is `documented`. The
  "Identity and Permission" feature still carries a beta banner on every identity page
  (pages updated as late as 2026-11-18, after the GA entry), so identity cells sourced to
  AgentKit are `preview`.
  MACHINE VERIFICATION: AgentKit has NO llms.txt or .md mirror (checked 2026-11-23:
  docs.byteplus.com/en/docs/agentkit/llms.txt and <page>.md both return the JS app shell;
  www.byteplus.com/llms.txt and ai.byteplus.com/llms.txt do not index AgentKit). All
  AgentKit quotes were verified against bodies rendered in headless Chromium (Playwright)
  on 2026-11-23 and stay UNVERIFIABLE to check_quotes.py. New ModelArk cells cite the
  ai.byteplus.com .md mirror where possible, which CI can verify.
  TOOLING WALL DIAGNOSED, THEN BROKEN. docs.byteplus.com renders article bodies
  client-side: plain HTTP fetches return ~280-300 KB of HTML per page that strips to ~3.3 KB
  of pure navigation chrome, which is why three earlier research passes recorded only
  doc-section titles. Driving headless Chrome via Playwright yields the real content
  (12.5 KB of prose on the overview page alone). Cells below now cite rendered bodies.
  VERIFICATION CAVEAT: because the bodies are JS-rendered, scripts/check_quotes.py cannot
  re-verify these quotes over plain HTTP and reports this provider's pages as
  UNVERIFIABLE rather than failing. So BytePlus quotes carry a weaker automated guarantee
  than every other provider's — they were verified by hand through headless Chrome
  (first 2026-08-04, re-verified 2026-11-23). Re-verification needs the same method. Do
  not mistake the passing CI run for machine-checked provenance here.
  2026-11-23 REFRESH: docs.byteplus.com moved from numeric doc IDs to slug URLs (the old
  IDs 301 to e.g. /en/docs/modelark/overview); sources below now cite the slug URLs.
  Several Managed Agents pages were substantially rewritten between August and November
  (tools, skills, multi-agent, permission policy); quotes were re-taken from the current
  pages. Vendor additions seen since August: self-hosted environments (enterprise
  workers execute bash/file tools on your own infrastructure), a browser sandbox
  template, scheduled agent runs (deployments), background tool tasks, webhooks, and a
  second multi-agent mode allowing up to 3 levels of sub-agents.
  METHOD NOTE for the next refresh: ai.byteplus.com/ark publishes an llms.txt index and a
  Markdown mirror of every ModelArk doc (append .md to the URL), both served over plain
  HTTP. Citing those makes BytePlus quotes machine-verifiable. Adopted only for cells
  added in the 2026-11-23 AgentKit pass (managed_agent_harness); older ModelArk cells
  still cite the docs.byteplus.com slug URLs.
  METHOD NOTE worth keeping: the earlier `unknown` statuses were correct at the time — the
  evidence genuinely was nav-titles-only — but "unreachable" was a property of the toolchain,
  not the vendor. Any provider whose docs are a JS app will look under-documented to an
  HTTP-only researcher. Check the rendering model before concluding a vendor discloses less
  than its competitors.

capabilities:
  launch_stage_investigation:
    product: BytePlus AgentKit
    status: ga
    notes: >
      SWITCHED TO AGENTKIT AND CHANGED documented -> ga (2026-11-23 AgentKit pass). This row
      records the provider's launch-stage evidence trail, and BytePlus's agent platform with
      a stated stage is AgentKit. The release notes (the source below) have a November 16,
      2026 entry: "AgentKit is generally available for commercial use." The release region
      is Asia Pacific (Johor). The February 10, 2026 entry ("AgentKit was released online
      for the first time.") carries Stage Beta. GA covers AgentKit as a product, but NOT
      every component: the "Identity and Permission" feature is still labelled beta on its
      own pages (see agent_workload_identity). The AgentKit Agent Gallery terms also say
      its services are a Beta edition. (Paraphrase of the last two points.)
      CONFLICT TO NOTE: the AgentKit product page (www.byteplus.com/en/product/agentkit)
      still shows "Apply for beta test" buttons. The newer, specific release-notes entry
      wins over a stale button. (Paraphrase.)
      MODELARK MANAGED AGENTS, the other agent platform, still has NO stated stage
      (re-checked 2026-11-23 on the rendered overview page and the ai.byteplus.com/ark/llms.txt
      doc index, each a different page from the source). Neither carries GA, preview,
      beta, or invitation wording for Managed Agents. The beta labels that do exist in
      ModelArk docs belong to other features, such as Structured output (beta), Responses
      API context editing (beta), and an ark-beta-mcp header used for Responses API MCP
      calls. Do NOT attribute them to Managed Agents. Managed Agents has published per-hour
      runtime pricing (see pricing_axes), so it is commercially offered, but that is not a
      stated stage. (Paraphrase.)
      CROSS-PROVIDER OBSERVATION (recorded 2026-08-04, not re-checked): docs.volcengine.com
      (Volcengine 方舟/Ark, the CN-market sibling) served the SAME doc IDs, so BytePlus and
      Volcengine share a documentation platform and almost certainly the same product.
      HISTORY: a refresh dated 2026-11-22 recorded `preview` from the beta-test button; that
      was rejected as stale against the GA entry. The earlier 2026-11-23 pass kept
      `documented` because it scored ModelArk only. AgentKit billing started August 24,
      2026 per the AgentKit Billing Announcement. (Paraphrase.)
    source: https://docs.byteplus.com/en/docs/agentkit/New_feature_release_notes
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  long_running_agents:
    status: documented
    notes: >
      A HEADLINE POSITIONING CLAIM, not an afterthought: Managed Agents "is best suited for
      long-running, stateful asynchronous tasks with multi-turn tool calls."
      Use-case list makes the duration explicit: "Long-running: A single task needs to run
      for minutes to hours, involving multiple tool calls and iterative thinking."
      "checkpoint resume" is named as one of the components ModelArk implements for you.
      Since August the docs also cover background tool tasks (long Bash commands move to
      the background after 60 seconds by default) and scheduled agent runs. (Paraphrase,
      from separate pages: modelark/background-tool-tasks and modelark/schedule-agent-runs.)
      AGENTKIT (2026-11-23 pass; kept ModelArk): AgentKit runtimes cap a single
      synchronous request at 30 minutes (configurable execution timeout added
      2026-11-03), and sandbox instances live up to 24 hours. Async or background
      agent runs are not documented as a runtime feature, so ModelArk's minutes-to-
      hours sessions remain the stronger evidence. (Paraphrase, from different
      pages: https://docs.byteplus.com/en/docs/agentkit/Limits and
      https://docs.byteplus.com/en/docs/agentkit/update-execution-timeout.)
    source: https://docs.byteplus.com/en/docs/modelark/overview
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  authoring_mode:
    status: documented
    value: [code-first (VeADK / AgentKit SDK / CLI), low-code (AgentKit Studio), config-first (ModelArk Managed Agents console and API)]
    product: BytePlus AgentKit Studio + AgentKit CLI; ModelArk Managed Agents
    notes: >
      NEW CELL (2026-11-23 AgentKit pass). Three authoring paths.
      LOW-CODE: "AgentKit Studio is a visual workspace provided by VeADK. It supports
      creating, testing, deploying, and managing agents in a single interface."
      Develop: "Covers configuration of models, prompts, tools, memory, knowledge bases,
      and skills. Also provides multi-agent topology orchestration."
      Studio also has an Intelligent mode that creates agents from a natural-language
      description, and a Fast mode that creates sub-agents at runtime. (Paraphrase, from
      the release notes, a different page.)
      CODE-FIRST: VeADK, or any Python framework through the AgentKit SDK decorators,
      deployed with the AgentKit CLI (see framework_agnosticism, iac_coverage).
      (Paraphrase.)
      CONFIG-FIRST: ModelArk Managed Agents agents are defined in its console or API, with
      no agent code (see managed_agent_harness). (Paraphrase.)
    source: https://docs.byteplus.com/en/docs/agentkit/agentkit-studio-overview
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  managed_agent_runtime:
    product: BytePlus AgentKit Runtime
    status: ga
    notes: >
      SWITCHED FROM ModelArk Managed Agents TO AGENTKIT, AND documented -> ga (2026-11-23
      AgentKit pass). The row hint is the hosting service for YOUR agent code, and that is
      AgentKit's runtime, not ModelArk's prebuilt loop (now recorded under
      managed_agent_harness).
      "An agent runtime (hereinafter referred to as the "runtime") is a hosted runtime
      environment provided by AgentKit for agents." It "provides security isolation and is
      framework- and model-agnostic, supports automatic scaling of associated instances
      based on business traffic, and supports built-in IAM roles to control the permissions
      for the agent runtime to access cloud resources."
      Serverless: "No manual maintenance of compute, networking, storage, or security
      policies is required." Scaling: "You can configure a minimum number of resident
      instances to eliminate cold starts. Idle instances are automatically destroyed when
      there are no requests, reducing costs."
      Build from code or images; hosts HTTP, A2A and MCP protocol agents. Limits page: 20
      runtimes per account per region, 20 instances per runtime, 30 min synchronous
      execution timeout, 16 MB max payload. (Paraphrase, from a different page:
      https://docs.byteplus.com/en/docs/agentkit/Limits.)
      STAGE: the release notes (a different page,
      https://docs.byteplus.com/en/docs/agentkit/New_feature_release_notes) say "AgentKit is
      generally available for commercial use." (2026-11-16, Asia Pacific (Johor)). The
      runtime is AgentKit's headline component and carries no beta label, so the GA entry
      is read as covering it. This is the one inference in the cell; the runtime page itself
      states no stage. (Paraphrase.)
      MODELARK SIDE (kept from the earlier cell; different page:
      https://docs.byteplus.com/en/docs/modelark/overview): Managed Agents is a prebuilt,
      configurable agent framework on ModelArk-managed infrastructure, with no stated stage.
      Per another different page
      (https://docs.byteplus.com/en/docs/modelark/self-hosted-environment-overview), it
      also offers self-hosted environments, where your own workers run the bash and file
      tools while ModelArk hosts inference, orchestration and sessions. (Paraphrase.)
    source: https://docs.byteplus.com/en/docs/agentkit/Agent_runtime_overview
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  managed_agent_harness:
    product: ModelArk Managed Agents
    status: documented
    notes: >
      NEW ROW (2026-11-23). ModelArk Managed Agents is BytePlus's configure-not-code
      harness: "ModelArk Managed Agents is a prebuilt, configurable agent framework provided
      by ModelArk. It runs on ModelArk-managed infrastructure and is best suited for
      long-running, stateful asynchronous tasks with multi-turn tool calls."
      What it pre-assembles: "To build a usable agent based on the model API, you need to
      implement common components yourself, such as AgentLoop, tool calls, context
      management, sandbox scheduling, checkpoint resume, and permission isolation."
      "ModelArk Managed Agents provides complete infrastructure at the agent layer."
      "The platform has a built-in AgentLoop that automatically drives the entire loop."
      Opt-in, beside the raw model API: "use the model API when you need fine-grained
      control over the agent loop; use Managed Agents when you want ModelArk to host the
      agent and you want to focus on business logic."
      You configure the agent (model, system prompt, skills, tools, MCPs) and get a
      reusable agent_id. The harness ships a versioned built-in toolset (bash, read, write,
      edit, glob, grep, web_fetch, web_search), memory stores, vaults and cloud sandboxes;
      see tool_calling and long_term_memory. (Paraphrase.)
      There is no code-export escape hatch like AgentCore Harness's export to Strands. No
      launch stage is stated, hence `documented`. (Paraphrase.)
      AGENTKIT ALSO HAS A HARNESS MODE. Its product page (www.byteplus.com/en/product/agentkit)
      advertises dynamic harness orchestration that deploys from a harness config with no
      agent code. The AgentKit CLI generates a harness configuration file and lists
      runtimes deployed in harness mode (docs.byteplus.com/en/docs/agentkit/CLI_overview).
      No harness user guide turned up in the AgentKit docs, so ModelArk's documented
      harness is the stronger evidence. (Paraphrase of both AgentKit pages.)
      Source is the ModelArk Markdown mirror, which plain HTTP can verify.
    source: https://ai.byteplus.com/ark/region:ap-southeast-1/docs/overview.md
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  voice_agents:
    product: BytePlus RTC Conversational AI
    status: documented
    notes: >
      NEW ROW (2026-11-23). BytePlus's real-time voice agent is not part of ModelArk or
      AgentKit. It is the Conversational AI solution of BytePlus RTC: "This document
      describes how to integrate a basic conversational AI solution with BytePlus RTC and
      enable real-time interaction between a user and an AI agent."
      Mechanism: the user joins an RTC room, then "After the human user has joined the room
      and published audio, call StartVoiceChat from your application server." The AI agent
      joins as a separate RTC user, and the call config wires ASR, LLM and TTS providers
      (the example uses BytePlus ASR, BytePlus ModelArk and BytePlus TTS, or self-hosted
      models). "Only one target user is supported." (Paraphrase except quoted text.)
      The preparation page (a different page:
      https://docs.byteplus.com/en/docs/byteplus-rtc/docs-1315561) says "RTC offers two
      integration solutions: a one-stop integration of ASR, LLM, and TTS services, and
      direct integration via OpenAI RealtimeAPI." It also lists third-party ASR, TTS and LLM
      vendors (Amazon, Google, OpenAI, ElevenLabs, MiniMax).
      The RTC product page (www.byteplus.com/en/product/rtc) claims sub-1s conversational AI
      latency with real-time interruption. (Paraphrase.)
      The BytePlus legal SLA list includes an "SLA for BytePlus RTC Service" (a different
      page: https://docs.byteplus.com/en/docs/legal/docs-service-level-agreements-097b8473).
      Whether it covers Conversational AI was not checked. (Paraphrase.)
      CAVEAT: session limits and a region table for voice agents were not read this pass.
      No stage is stated on the integration page, hence `documented`. AgentKit itself
      documents no voice agent type; VeADK lists voice only as an interaction mode.
      (Paraphrase.)
    source: https://docs.byteplus.com/en/docs/byteplus-rtc/docs-1310560
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  managed_agent_loop:
    product: ModelArk Managed Agents
    status: documented
    notes: >
      "ModelArk Managed Agents provides complete infrastructure at the agent layer. You
      only need to define agent behavior, send user events, and subscribe to result
      streams."
      "The platform has a built-in AgentLoop that automatically drives the entire loop."
      Explicitly positioned as the managed-loop alternative to the model API: "use the
      model API when you need fine-grained control over the agent loop; use Managed Agents
      when you want ModelArk to host the agent and you want to focus on business logic."
      The platform handles: AgentLoop, tool calls, context management, sandbox scheduling,
      checkpoint resume, and permission isolation. Four-step quickstart: create agent,
      create environment, start session, send message.
      (2026-11-23: the vendor reworded the August sentence, which said Managed Agents
      delivers the full infrastructure stack; quote updated.)
      No launch stage stated — hence `documented`, not `ga`.
      AGENTKIT (2026-11-23 pass; kept ModelArk): AgentKit Studio can configure LLM,
      sequential, parallel and loop agents without code, and the product page
      advertises deploying from a harness config, but those deploy into a runtime
      rather than a one-call invoke API. ModelArk remains the evidence for this row
      (see managed_agent_harness). (Paraphrase.)
    source: https://docs.byteplus.com/en/docs/modelark/overview
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  session_management:
    status: documented
    notes: >
      CONFIRMED with a clear object model — agent / environment / session / events are
      distinct resources:
      Agent = "A versioned and reusable intelligent agent configuration asset. It defines
      roles, capabilities, behavior boundaries, and runtime rules of an agent, and serves as
      the template and baseline for all task runs."
      Environment = "The environment configuration for running a session, including network,
      preinstalled dependency packages, environment variables, and artifact storage."
      Session = "An agent instance that runs in an environment and is used to execute a
      specific task. Context, files, and state are isolated from each other. The same agent
      can start multiple parallel sessions."
      Per-session isolation plus parallel sessions per agent is a genuine multi-tenancy
      primitive, comparable to AgentCore's session isolation.
      AGENTKIT (2026-11-23 pass; kept ModelArk): AgentKit runtime sessions are
      identified by a SessionID that your code uses against a Sessions database (see
      short_term_memory). Sandbox instances are created per sessionId and reused for
      the session. AgentKit documents no session lifecycle or event-stream API
      comparable to ModelArk's. (Paraphrase, from a different page:
      https://docs.byteplus.com/en/docs/agentkit/Agent_runtime_overview.)
    source: https://docs.byteplus.com/en/docs/modelark/overview
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  multi_agent_patterns:
    status: documented
    value: [orchestrator / sub-agent delegation (coordinator), persistent multi-level sub-agent threads (multiagent_20261001)]
    notes: >
      PAGE REWRITTEN SINCE AUGUST, and the depth limit changed. Two modes now:
      "ModelArk supports two multi-agent configurations: multiagent_20261001 and
      coordinator."
      coordinator (the August-era model): "The main agent waits for the subagent to
      complete the task and continues processing after receiving the result." Sub-agent
      hierarchy up to 1 level.
      multiagent_20261001 (new): sub-agent threads persist in the session and run
      asynchronously — "After the target thread accepts the task, the dispatcher can
      continue its own work without waiting." Sub-agent sources are predefined agents,
      Self, and runtime-defined inline agents.
      DEPTH: "When using multiagent_20261001, a session can create up to three levels of
      subagents, including predefined agents, Self, and inline agents." The earlier
      one-level cap now applies only to coordinator mode.
      Other limits: "The fixed member list can contain up to 20 items." Sub-agents share
      the session's environment, sandbox, file system and vault credentials but not
      conversation history. Migration is one-way: an agent switched to
      multiagent_20261001 cannot switch back to coordinator.
      AGENTKIT (2026-11-23 pass; kept ModelArk): AgentKit adds cross-agent calls
      over the A2A protocol through the A2A Center (see a2a_protocol). AgentKit
      Studio offers sequential, parallel and loop workflow agents, plus a Fast mode
      whose CreateAgentToolset creates sub-agents dynamically at runtime (release
      notes, 2026-09-04). Identity access rules can authorize middle-tier agents in
      chained calls. (Paraphrase, from different pages under
      docs.byteplus.com/en/docs/agentkit/.)
    source: https://docs.byteplus.com/en/docs/modelark/multi-agent
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  workflow_engine:
    product: BytePlus AgentKit Studio (VeADK workflow agents)
    status: documented
    notes: >
      NEW CELL (2026-11-23 gap pass). AgentKit Studio offers three orchestration-type
      primary agents next to the LLM agent: "sequential, parallel, and loop agents are
      orchestration-type primary agents that contain no model-related configuration and
      schedule sub-agents according to rules."
      Sequential: "It schedules sub-agents one by one in series to complete tasks, like a
      pipeline that only runs from front to back."
      Parallel: "It runs multiple sub-agent tasks concurrently and aggregates the results."
      Loop: "It loops through a multi-step workflow of sub-agents within an iteration
      limit, stopping when a condition is met or the maximum number of iterations is
      reached."
      CAVEATS: these are fixed sequential / parallel / loop compositions (the VeADK, ADK-
      style workflow agents), not a general graph or DAG with conditional edges. The page
      states no durable or resumable execution for them. (Paraphrase.)
      MODELARK SIDE: Managed Agents has no workflow engine. It is a model-driven agent
      loop with sub-agents (see multi_agent_patterns), checkpoint resume inside a
      session, and scheduled runs through deployments. (Paraphrase, from pages under
      https://ai.byteplus.com/ark/region:ap-southeast-1/docs/.)
      Rendered in headless Chromium on 2026-11-23; check_quotes.py reports this page as
      UNVERIFIABLE.
    source: https://docs.byteplus.com/en/docs/agentkit/Building_and_deploying_agents_using_AgentKit_Studio
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  a2a_protocol:
    product: BytePlus AgentKit A2A Center
    status: documented
    notes: >
      NEW CELL (2026-11-23 AgentKit pass). "A2A Center offers unified A2A-protocol-based
      agent access and management. With standard protocol communication powered by the
      underlying gateway, it helps you register, organize, discover, call, and govern agent
      versions."
      "The A2A Center is a capability center in AgentKit for accessing, managing, and
      discovering A2A agents".
      AgentKit runtimes can serve the A2A protocol (alongside HTTP and MCP), and a runtime
      must be registered in an A2A space for cross-agent invocation, one space per runtime.
      The release notes (2026-03-06) describe synchronous and asynchronous communication
      compliant with the standard A2A protocol. (Paraphrase, from different pages:
      https://docs.byteplus.com/en/docs/agentkit/Agent_runtime_overview and the release notes.)
      MODELARK SIDE: Managed Agents documents sub-agents inside one session (see
      multi_agent_patterns) but no A2A protocol support. (Paraphrase.)
    source: https://docs.byteplus.com/en/docs/agentkit/A2A_Center_overview
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  distribution_to_packaged_products:
    product: BytePlus AgentKit -> ArkClaw Enterprise Application Center
    status: documented
    notes: >
      NEW CELL (2026-11-23 gap pass). YES, through the ArkClaw Enterprise Application
      Center. "Enterprise administrators can register A2A-compliant agents in the
      Application Center of ArkClaw Enterprise. This enables these agents to be
      discovered and invoked by Claw instances of employees within the space."
      "Applications sourced from AgentKit: Runtimes and MCPs support registration via API
      key and OAuth JWT authentication."
      Conditions for an AgentKit runtime: within the current BytePlus account's
      permissions, status Available, API key or OAuth inbound authentication, and A2A
      protocol support. Sources are AgentKit, Shared Claw and Custom, so any reachable
      A2A endpoint can also be registered. AgentKit MCP services can be registered the
      same way. Each application gets an access scope (Allow all, Controlled access, Deny
      all). (Paraphrase.)
      LIMITS: registration is an administrator action inside one ArkClaw Enterprise space,
      not a public marketplace. ModelArk Managed Agents agents are not a named source;
      they would need to be fronted by an A2A endpoint (Custom source). The page does not
      state a launch stage. (Paraphrase.)
      Rendered in headless Chromium on 2026-11-23; check_quotes.py reports this page as
      UNVERIFIABLE. See also c-outofbox invoke_custom_agents.
    source: https://docs.byteplus.com/en/docs/ArkClaw/Application_management
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  mcp_server_hosting:
    product: BytePlus AgentKit Gateway (MCP services)
    status: documented
    notes: >
      SWITCHED FROM ModelArk TO AGENTKIT (2026-11-23 AgentKit pass); status unchanged.
      ModelArk only exposes BytePlus-hosted catalog MCP servers. AgentKit hosts YOUR MCP
      server.
      "AgentKit supports three creation methods: Deploy MCP service, Import MCP service, and
      HTTP to MCP, which apply to three scenarios respectively: deploying from scratch,
      connecting existing services, and transforming existing APIs."
      "If no platform-based service is available for direct integration and you want
      AgentKit to manage deployment and access, choose "Deploy MCP service"."
      Deployed services are billed per vCPU, memory and traffic (a different page,
      https://docs.byteplus.com/en/docs/agentkit/Billing_items), with configurable minimum
      and maximum instance counts (release notes, 2026-10-29 and 2026-11-16). Supported MCP
      protocol versions are 2026-07-28, 2025-11-25, 2025-06-18 and 2025-03-26 over
      Streamable HTTP; SSE and STDIO are not supported per the Gateway FAQ. Inbound auth is
      API Key or OAuth JWT, and OAuth 3LO outbound credentials are supported. (Paraphrase.)
      "The MCP service is a paid feature. Charges apply regardless of the creation method."
      MODELARK SIDE (a different page: https://docs.byteplus.com/en/docs/modelark/mcp-remote-mcp):
      the Responses API can call cloud-deployed or remote MCP from an MCP marketplace, over
      streamable HTTP only. Managed Agents declares MCP servers on the agent by URL, with
      credentials from vaults. (Paraphrase.)
    source: https://docs.byteplus.com/en/docs/agentkit/MCP_services
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  mcp_registry:
    product: BytePlus AgentKit Gateway (MCP toolsets) and A2A Center
    status: documented
    notes: >
      NEW CELL (2026-11-23 AgentKit pass). AgentKit Gateway is a governed catalog of MCP
      services, and MCP toolsets curate tools from many services: "An MCP toolset is an
      aggregated entry point for tools exposed to IDEs, CLIs, and agents within the
      AgentKit gateway."
      "Create an MCP toolset when you need an agent to use multiple MCP services
      simultaneously or to control the scope of visible tools by business domain."
      Toolsets support semantic and tag-based tool search, billed per tool index (Features
      page and Billing page). The A2A Center is a separate registry for agents rather than
      MCP servers; see a2a_protocol. (Paraphrase.)
      CAVEAT: these are per-account catalogs of services you register. A
      vendor-curated public MCP catalog is not described on this page.
      MODELARK SIDE (a different page: https://docs.byteplus.com/en/docs/modelark/mcp-remote-mcp):
      ModelArk points Responses API users to an "MCP marketplace" of cloud-deployed MCP
      servers. Its contents are not enumerated there. (Paraphrase.)
    source: https://docs.byteplus.com/en/docs/agentkit/MCP_Overview
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  skills_registry:
    product: BytePlus AgentKit Skill (formerly Skills Center)
    status: documented
    notes: >
      NEW ROW (2026-11-23). AgentKit runs an org-level skill catalog. The vendor renamed
      Skill Center to Skill on 2026-09-24, changing display names only (release notes).
      "By adding a skill to a skills space and integrating the skill into the target agent,
      you can quickly extend the agent's task-handling scope."
      Governance and distribution: "Through skills spaces, skill collections can be
      organized by team, business domain, or runtime environment, and the distribution
      scope of a skill can be controlled."
      "Skills support versioned publishing."
      From different pages: a skills space is a logically isolated space, and agents can
      use only the skills in their associated space
      (https://docs.byteplus.com/en/docs/agentkit/Skills_space). The catalog includes
      platform-preset skills, "independently developed by the platform or officially
      authenticated by mainstream model vendors" (Skills_space page). Skills are
      automatically security-scanned
      for hardcoded secrets and similar risks, and quality-checked before publish. Limits
      are 200 skills and 200 skills spaces per account per region, and 20 skills per space.
      (Paraphrase except quoted text.)
      MODELARK SIDE: Managed Agents lets you upload skills (CreateSkill, up to 50 per
      agent; see agent_skills), but documents no cross-org catalog. (Paraphrase.)
    source: https://docs.byteplus.com/en/docs/agentkit/Skill_Overview
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  agent_gateway:
    product: BytePlus AgentKit Gateway
    status: documented
    notes: >
      NEW ROW (2026-11-23). "AgentKit Gateway provides a unified entry point for agents to
      access external capabilities. It provides features such as authentication, routing,
      protocol conversion, and access governance."
      It covers MCP, model and agent-runtime traffic: "Dedicated gateways are further
      classified into MCP gateways, model gateways, and agent runtime gateways based on the
      type of associated resources."
      "the gateway handling authentication, routing, protocol conversion, and credential
      injection."
      WHAT IT ENFORCES. From different pages: the runtime overview says the gateway is "The
      only egress point for a runtime to call external MCP tools" and that direct runtime
      connections to business backends are not allowed
      (https://docs.byteplus.com/en/docs/agentkit/Agent_runtime_overview). Plugins on
      dedicated gateways do credential transformation, run a custom veFaaS extension for
      auditing, risk control and blocking, and do Identity authentication against
      Cedar-based permission spaces
      (https://docs.byteplus.com/en/docs/agentkit/Dedicated_gateway_plugin_configuration_description).
      The model gateway adds proxy API keys, token and credit quotas, and weighted model
      groups with fallback (see model_routing). Gateways are metered with QPS and bandwidth
      metrics and access logs. (Paraphrase.)
      CAVEAT: the Identity authentication plugin relies on the beta Identity and Permission
      feature. The runtime overview describes agents calling the ModelArk model API
      directly, so routing LLM traffic through the model gateway is not described as
      mandatory. (Paraphrase.)
      ModelArk has no gateway product. (Paraphrase.)
    source: https://docs.byteplus.com/en/docs/agentkit/MCP_Overview
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  openapi_import:
    product: BytePlus AgentKit Gateway (HTTP to MCP)
    status: documented
    notes: >
      NEW CELL (2026-11-23 AgentKit pass). "Gateway-side conversion: AgentKit Gateway reads
      the OpenAPI description file and automatically maps each HTTP interface to an MCP
      tool. This solution enables zero backend modification."
      "Gateway reads the OpenAPI file and automatically generates an MCP tool for each
      combination of path and method (for example, POST /v1/estimate-calories becomes
      estimate_calories)."
      Outbound credentials for the backend are configured on the MCP service, and the
      resulting tools can be grouped into an MCP toolset. (Paraphrase.)
      ModelArk documents no OpenAPI import. (Paraphrase.)
    source: https://docs.byteplus.com/en/docs/agentkit/Integrating_existing_REST_API_OpenAPI_as_MCP_tools
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  tool_least_privilege:
    status: documented
    notes: >
      Dedicated tool permission policy page:
      "Tool permission policies are used to control whether tool calls initiated by an
      agent are executed automatically or paused for confirmation from business
      applications."
      Two policies (always_allow / always_ask), settable per toolset and overridable per
      tool name: "you can also apply more fine-grained overrides to individual tools in
      configs."
      Explicit least-privilege guidance: "For MCP tools, we recommend first narrowing
      configs based on the principle of least privilege, and then deciding whether to
      allow automatic execution."
      DEFAULTS TRAP worth knowing: if you omit default_config entirely, the server saves
      enabled=true and always_allow for both built-in AND MCP toolsets. MCP tools default
      to always_ask only when default_config is provided without a permission_policy.
      (Paraphrase of the page's default matrix. This corrects the August note, which said
      MCP tools simply default to manual confirmation.)
      Policies apply only to server-side tools (built-in and MCP toolsets).
      AGENTKIT (2026-11-23 pass; kept ModelArk): AgentKit Identity access rules gate
      each MCP tool call ("Call permission") and each agent invocation through Cedar
      policies, with a simulated-evaluation tool. That feature is beta, so the
      documented ModelArk per-tool policy stays the evidence. (Paraphrase, from a
      different page:
      https://docs.byteplus.com/en/docs/agentkit/creating-access-rules.)
    source: https://docs.byteplus.com/en/docs/modelark/tool-permission-policy
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  code_interpreter:
    status: documented
    notes: >
      CONFIRMED — it is a code interpreter in substance even though no page carries that
      name: "The cloud sandbox runs in an isolated Linux container provided by ModelArk.
      Runtimes, database clients, and common command-line tools are preinstalled and can
      be used directly by the agent."
      Preinstalled runtimes on the base template: Python 3.12+, Node.js 20+, Go, Rust, Java,
      Ruby, PHP, C/C++. Sandbox specs 1x/2x/4x/8x (2-16 vCPU, 2 GiB per vCPU), selected on
      the environment. Billing describes it as the agent runtime, auto-reclaimed after the
      session ends. (Paraphrase, from separate pages: modelark/configure-cloud-environment
      and modelark/model-pricing.)
      Code execution + filesystem + shell, session-scoped — functionally equivalent to
      AgentCore Code Interpreter and Vertex Code Execution.
      AGENTKIT (2026-11-23 pass; kept ModelArk, equivalent strength): AgentKit
      offers microVM-isolated sandbox templates, including a Code Sandbox with a
      built-in Codex CLI and an AIO Sandbox. They are billed per vCPU-second and GB-
      second, with snapshots and a 24-hour max lifetime. (Paraphrase, from a
      different page: https://docs.byteplus.com/en/docs/agentkit/Tool_type.)
    source: https://docs.byteplus.com/en/docs/modelark/cloud-sandbox-reference
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  browser_use:
    product: BytePlus AgentKit (AIO Sandbox template)
    status: documented
    notes: >
      SWITCHED FROM ModelArk TO AGENTKIT (2026-11-23 AgentKit pass); status unchanged.
      AgentKit ships a browser as a managed sandbox template rather than a headless stack
      the agent must drive through its shell: "AIO Sandbox: An all-in-one runtime
      environment for AI agents. Includes Browser, Terminal, and Code runtime environments."
      Its preset table describes it as "Browser + Terminal + Code in one environment, with
      automatic switching based on the task".
      Sandbox templates are microVM-isolated, created per sessionId, with a 30-minute idle
      timeout by default and a 24-hour maximum lifetime (paraphrase, from a different page:
      https://docs.byteplus.com/en/docs/agentkit/Agent_runtime_overview). The browser
      example connects a VeADK agent to the sandbox through an MCP router tool
      (https://docs.byteplus.com/en/docs/agentkit/Browser_sandbox_tool_example). Sandbox
      templates can also be exposed as an MCP service and use snapshots (release notes).
      (Paraphrase.)
      SCOPE CAVEAT: no live view, session recording or computer-use (screen) API is
      documented on the pages read, so it is still lighter than AgentCore Browser.
      MODELARK SIDE (different page: https://docs.byteplus.com/en/docs/modelark/cloud-sandbox-reference):
      Managed Agents has a browser sandbox template with Chromium, Playwright and
      playwright-cli preinstalled, which the agent drives through its own shell and code
      tools. (Paraphrase.)
    source: https://docs.byteplus.com/en/docs/agentkit/Tool_type
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  short_term_memory:
    product: BytePlus AgentKit Sessions
    status: documented
    notes: >
      NEW CELL (2026-11-23 AgentKit pass). "The Sessions feature is the short-term memory
      management capability provided by AgentKit to store and retrieve session context in
      multi-turn conversations."
      Storage is your own database: "The AgentKit Sessions feature supports connecting to
      BytePlus relational database resources, including RDS PostgreSQL, and RDS MySQL."
      "Use SessionID to distinguish different users or different conversations, avoiding
      context mixing." The platform injects the database connection into the runtime as
      environment variables, and the agent code reads and writes the context. Serverless
      PostgreSQL was added 2026-07-31. (Paraphrase.)
      MODELARK SIDE (a different page: https://docs.byteplus.com/en/docs/modelark/overview):
      Managed Agents keeps session context server-side automatically. Each session has
      isolated context, files and state, plus a persisted event history (see
      session_management). That is fully managed, with no database for you to run, while
      AgentKit's is bring-your-own-database. (Paraphrase.)
    source: https://docs.byteplus.com/en/docs/agentkit/Sessions_overview
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  long_term_memory:
    status: documented
    product: BytePlus AgentKit Memory
    notes: >
      SWITCHED FROM ModelArk Persistent memory TO AGENTKIT MEMORY (2026-11-23 AgentKit
      pass); status unchanged. AgentKit's memory extracts memories automatically, which
      ModelArk's memory stores do not.
      "AgentKit Memory is an enterprise-grade long-term memory management component
      provided by BytePlus for AI agents."
      "Unified memory interface: AgentKit Memory supports integration with backends such as
      mem0 and Viking, reducing replacement and upgrade costs."
      Strategies: "Preset policies: Session summary, user preferences, semantic
      summarization, and support for custom prompt policies."
      Writing: "Automatic and manual triggering; asynchronous extraction that does not
      block conversations; structured storage after LLM compression."
      Retrieval: "Session preloading/on-demand loading; scalar filtering combined with
      hybrid vector retrieval; re-ranking, time decay, and conflict resolution."
      This is the closest BytePlus analogue to AgentCore Memory strategies or Vertex Memory
      Bank. The memory backend (for example Viking) is a separate BytePlus product that
      AgentKit imports. (Paraphrase.)
      MODELARK SIDE (different page: https://docs.byteplus.com/en/docs/modelark/persistent-memory):
      Managed Agents memory stores persist across sessions and mount read-only at
      /mnt/memory/{memory_store_id}/. The agent cannot write them during a run; your
      application writes them through the memory APIs. Limits are 100 KiB per memory,
      2,000 memories per store and 10 stores per session. (Paraphrase.)
    source: https://docs.byteplus.com/en/docs/agentkit/Memory_overview
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  knowledge_base:
    status: documented
    product: BytePlus Knowledge base (Knowledge Engine)
    notes: >
      "The Knowledge Engine is a retrieval-augmented generation (RAG) service provided by
      BytePlus. It can intelligently parse structured and unstructured documents, split
      them into segments, achieve accurate semantic matching through vector retrieval, and
      combine this with large language model reasoning capabilities"
      SOURCE MOVED: the ModelArk product overview no longer lists the knowledge base. It is
      now documented on the ModelArk docs site under Platform functionalities, with the
      console entry under VikingDB and detailed docs under the RAG_Cloud doc set.
      Chunking and embedding-model options are not described on this page.
      AGENTKIT (2026-11-23 pass; kept Knowledge Engine): AgentKit Knowledge is a
      unified retrieval gateway in front of knowledge backends, with native support
      for Viking Knowledge Base. It adds no RAG engine of its own, so the BytePlus
      Knowledge base product stays the evidence. (Paraphrase, from a different page:
      https://docs.byteplus.com/en/docs/agentkit/Knowledge_base_overview.)
    source: https://ai.byteplus.com/ark/region:ap-southeast-1/docs/knowledge-base-index
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  text_to_sql:
    status: unknown
    notes: >
      NEW CELL (2026-11-23 gap pass). No managed text-to-SQL or structured-data agent
      found. The Knowledge Engine page says it can "parse structured and unstructured
      documents", which is document RAG, not SQL over a warehouse. (Paraphrase except the
      quote.)
      SEARCH TRAIL: grep of the full ModelArk Markdown corpus
      (https://ai.byteplus.com/ark/llms-full.txt) for text-to-SQL, Text2SQL, NL2SQL and
      SQL found only SQL code samples. The AgentKit Studio page mentions SQL read-only
      protection for MCP calls in an O&M scenario, which is a guardrail, not a
      text-to-SQL service. The ByteHouse product page (www.byteplus.com/en/product/bytehouse)
      describes analytics only, with no natural-language query feature. AgentKit preset
      skills list no SQL skill. (Paraphrase.)
      Not `none`: no page says it is not offered.
    source: https://ai.byteplus.com/ark/region:ap-southeast-1/docs/knowledge-base-index.md
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  ai_service_tools:
    product: ModelArk Managed Agents built-in tools + BytePlus Info Quest MCP
    status: documented
    notes: >
      NEW CELL (2026-11-23 gap pass). WEB ONLY, plus unspecified multimodal tools. The
      built-in toolset's AI-service tools are Web Fetch ("Fetch content from a specified
      URL.") and Web Search ("Start a web search."). The self-hosted executor table adds a
      Multimodal tools class: "ModelArk writes images, videos, or other tool results to the
      session event stream." No page read names or documents those multimodal tools.
      (Paraphrase except quotes.)
      SEARCH AS MCP (a different page,
      https://ai.byteplus.com/ark/region:ap-southeast-1/docs/InfoQuest.md): "If you need to
      equip your AI model with real-time internet search capabilities, integrating the Info
      Quest MCP service is an efficient solution."
      NOT FOUND AS TOOLS: OCR, speech-to-text, TTS and translation. Audio understanding and
      document understanding are model capabilities called through the model APIs, not
      tools an agent calls. Voice lives in BytePlus RTC
      Conversational AI (see voice_agents). AgentKit sandbox templates (AIO: browser,
      terminal, code) are covered by code_interpreter and browser_use. (Paraphrase.)
    source: https://ai.byteplus.com/ark/region:ap-southeast-1/docs/tools.md
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  first_party_models:
    status: documented
    value: [Dola Seed 2.1 Turbo, Seed 2.0 Pro, Seed 2.0 Lite, Seed 2.0 Mini, Seed 2.0 Code Preview]
    notes: >
      Model family is Seed (NOT Skylark, NOT Doubao — earlier guesses were wrong).
      LLM model IDs on the current pricing page, under provider ByteDance:
      dola-seed-2-1-turbo, seed-2-0-pro-260328, seed-2-0-lite-260428, seed-2-0-mini-260428,
      seed-2-0-code-preview-260328.
      Non-LLM first-party: Dreamina Seedance 2.5 / 2.0 (video), Dola Seedream 5.5 / 5.0 and
      Seedream 4.x (image), SeedEdit 3.0 (image editing).
      Third-party models priced on the same page: DeepSeek V4.1 Flash, V4 Pro and V4 Flash;
      Z.ai GLM-5.3 Flash and GLM-5.2.
      Date-suffixed IDs (e.g. seed-2-0-lite-260428) are pinned model snapshots.
      (2026-11-23: the August Dola Seed 2.0 flagship description no longer appears on this
      page and was removed; GLM-4-7 is no longer listed; Seed 2.0 Lite/Mini snapshots moved
      from 260228 to 260428.)
    source: https://docs.byteplus.com/en/docs/modelark/model-pricing
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  third_party_catalog:
    status: documented
    value: [DeepSeek, Z.ai (GLM), Deemos (Hyper3D), Hitem3D]
    notes: >
      NEW CELL (2026-11-23 gap pass). "ModelArk provides models for text and code, video,
      image, 3D, and embedding workloads." The text-and-code table lists providers
      ByteDance, DeepSeek (deepseek-v4-1-flash, deepseek-v4-1-flash-economy,
      deepseek-v4-pro and deepseek-v4-flash snapshots) and Z.ai (glm-5-3-flash-260828,
      glm-5-2-260617). The 3D table lists Deemos (hyper3d-gen2-260112) and Hitem3D
      (hitem3d-2-0-251223). Video, image and embedding models are ByteDance (Seedance,
      Seedream). (Paraphrase.)
      SMALL CATALOG: no Anthropic, OpenAI, Meta, Mistral, Qwen or Kimi models on the
      list, so the third-party set is two LLM vendors plus two 3D vendors. All listed
      models are in ap-southeast-1; EU is limited to a few Seed models (see
      tool_region_variance). (Paraphrase.)
      AGENTKIT (kept ModelArk): the AgentKit Gateway model service can proxy custom model
      providers, and its release notes added Kuaishou Kling, but that is a proxy to models
      you bring, not a hosted catalog (see model_routing). (Paraphrase.)
    source: https://ai.byteplus.com/ark/region:ap-southeast-1/docs/model-list.md
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  byo_open_weights:
    product: BytePlus ModelArk Model Unit + custom model upload
    status: limited
    notes: >
      STATUS 2026-11-23 (fact-check): `limited`. The Model Unit page (named below) says
      "This is an invitation-only testing capability."
      NEW CELL (2026-11-23 gap pass). PROVISIONED THROUGHPUT YES; ARBITRARY OPEN WEIGHTS
      NOT DOCUMENTED. Model Unit is the dedicated-capacity option: "Uses dedicated
      computing resources to provide resource-guaranteed online inference for fine-tuned
      models." Its supported-models cell includes "Uploaded custom models" alongside
      platform foundation models and fully or LoRA fine-tuned models. Billing is by Model
      Units purchased, monthly prepaid or postpaid by duration. (Paraphrase except quotes.)
      Model Unit page (a different page,
      https://ai.byteplus.com/ark/region:ap-southeast-1/docs/model-unit-overview.md):
      "Model units are mainly used for large-scale inference of fine-tuned models."
      UPLOAD PATH (a different page,
      https://ai.byteplus.com/ark/region:ap-southeast-1/docs/models-and-plans.md): "Import
      a custom model from a TOS artifact into the repository (requires base model,
      quantization mode, and name)". The base-model flag must be the full foundation model
      ID matching the artifact, picked from the model list. So upload is tied to a
      ModelArk base model (for example a fine-tune exported elsewhere). Importing an
      arbitrary Hugging Face model that is not on the ModelArk list is not documented.
      (Paraphrase.)
    source: https://ai.byteplus.com/ark/region:ap-southeast-1/docs/deployment-overview.md
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  tuning:
    product: BytePlus ModelArk model fine-tuning + context cache
    status: documented
    notes: >
      NEW CELL (2026-11-23 gap pass). FINE-TUNING: the Ark CLI's train domain will
      "Create and manage fine-tuning jobs for SFT, LoRA, DPO, and RL workflows; validate
      datasets; preview hyperparameters and costs; and export and deploy model artifacts."
      Dataset schema types include LLMSft, LLMPretrain, LLMDPO, LLMRL, EmbeddingSft,
      ImageGenSft and VideoGenSft, and the fine-tuning type flag lists sft, lora, dpo,
      grpo and pt. Fine-tuned models deploy to Model Unit or LoRA-capable online
      inference (see byo_open_weights). Fine-tuning is billed by computing power, hourly.
      (Paraphrase.)
      DATASETS (a different page,
      https://ai.byteplus.com/ark/region:ap-southeast-1/docs/fine-tuning-dataset-format.md):
      "Currently, model fine-tuning supports uploading or importing JSON format dataset
      files." That page documents SFT and DPO formats for text, vision and embedding models.
      PROMPT CACHING (a different page,
      https://ai.byteplus.com/ark/region:ap-southeast-1/docs/context-cache.md): "context
      caching reuses computation results to avoid repeated processing of the same content
      by the model." Implicit cache is automatic and cannot be disabled; explicit cache is
      created manually for deterministic hits. Cache storage is a priced axis (see
      pricing_axes). (Paraphrase except quotes.)
      DISTILLATION: no distillation service found in the ModelArk docs. (Paraphrase.)
      REGION: Tuning and Dataset is AP-only per the region page (see
      tool_region_variance). (Paraphrase.)
    source: https://ai.byteplus.com/ark/region:ap-southeast-1/docs/ark-cli.md
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  model_routing:
    product: BytePlus AgentKit Gateway (model service / model groups)
    status: documented
    notes: >
      NEW CELL (2026-11-23 AgentKit pass). "A model group combines multiple integrated
      upstream models into a stable call entry point." "The model gateway selects an
      upstream model within the group based on the configured weights. If retries within
      the group fail, the gateway can call the fallback model."
      "When in-group retries fail after retries, the gateway calls the fallback model at
      most once."
      Providers can include ModelArk and custom providers; the 2026-11-10 release notes
      added Kuaishou Kling. Usage can be capped by token or credit quotas per Proxy API Key
      and per model. AgentKit Studio LLM agents also take an ordered fallback model list
      (release notes, 2026-10-08). (Paraphrase.)
      CAVEAT: routing is weight-based with fallback. Cost- or quality-aware automatic
      routing is not described. ModelArk itself documents no router on the pages read.
      (Paraphrase.)
    source: https://docs.byteplus.com/en/docs/agentkit/create-and-manage-model-group
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  openai_compatible_endpoint:
    status: documented
    notes: >
      NEW CELL (2026-11-23 gap pass). "ModelArk model APIs are largely compatible with the
      OpenAI SDK. With minimal code changes, you can integrate ModelArk model services into
      your existing code." The example points the OpenAI Python SDK (version 1.0 or later)
      at base_url https://ark.ap-southeast.bytepluses.com/api/v3 with an ARK_API_KEY, and
      calls chat.completions. Non-OpenAI fields such as thinking go through extra_body.
      LangChain's ChatOpenAI works the same way. (Paraphrase.)
      Caveat on the page: "Community third-party SDKs are not maintained by the BytePlus
      team; this document is for reference only."
      ModelArk also exposes a Responses API, and an Anthropic-style Messages API at a
      separate compatible path (a different page,
      https://ai.byteplus.com/ark/region:ap-southeast-1/docs/messages-api.md): "POST
      https://ark.ap-southeast.bytepluses.com/api/compatible/v1/messages". (Paraphrase
      except the quote.)
      In EU (eu-west-1) only the Chat API and Image generation API are offered (see
      runtime_regions). (Paraphrase.)
    source: https://ai.byteplus.com/ark/region:ap-southeast-1/docs/compatible-with-openai-sdk.md
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  delegated_user_auth:
    status: documented
    notes: >
      NOW CONFIRMED as per-end-user credential vaulting, from the dedicated vaults page:
      "you can use vaults (credential vaults) to store and isolate credentials for each
      application user."
      "This lets the same agent safely serve multiple users and access only the
      third-party resources each user is authorized to use."
      Credential types include mcp_oauth (OAuth 2.0 for MCP servers, with automatic token
      refresh), static_bearer, mcp_static, environment_variable and env_oauth. For
      environment variables the sandbox gets an opaque placeholder replaced at egress:
      "The agent never sees the key."
      CAVEAT the docs volunteer: "Vaults and credentials are shared within a workspace and
      are not isolated separately by API key."
      Closest analogue: AgentCore Identity's token vault / GCP 3LO. This is on-behalf-of-user
      OAuth for tools, not end-user identity propagation into the model call.
      AGENTKIT (2026-11-23 pass; kept ModelArk): AgentKit hosts OAuth Client
      credentials for obtaining short-term tokens on behalf of a user or agent. MCP
      services support OAuth 2.0 three-legged (USER_FEDERATION) outbound
      credentials, added 2026-02-28. All of this sits in the beta Identity and
      Permission feature, so ModelArk's documented vaults stay the evidence.
      (Paraphrase, from a different page:
      https://docs.byteplus.com/en/docs/agentkit/credential-overview.)
    source: https://docs.byteplus.com/en/docs/modelark/use-vaults-authentication
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  tool_calling:
    status: documented
    notes: >
      Three tool families: the built-in base toolset, MCP toolsets, and custom tools.
      Custom tools: "Each tool must be configured with a name, a purpose description, and
      an input parameter schema." Execution is client-side via events: "The business
      application is responsible for performing the actual operation and then returning
      the result to the agent."
      Built-in toolset is versioned: "use the current basic toolset agent_toolset_20260916
      for newly created agents." It contains bash, read, write, edit, glob, grep, web_fetch
      and web_search. (Was agent_toolset_20260701 in August; the page says the versions
      contain the same tools and old values are kept for compatibility.)
      TRAP: "When the main agent does not find a basic toolset configuration, it falls back
      to enabling all basic tools and uses always_allow."
      AGENTKIT (2026-11-23 pass): AgentKit agents call tools through the Gateway
      over MCP. MCP toolsets offer semantic tool search so an agent can discover
      tools (see agent_gateway, mcp_registry). (Paraphrase.)
    source: https://docs.byteplus.com/en/docs/modelark/tools
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  agent_skills:
    status: documented
    notes: >
      A CAPABILITY NO OTHER PROVIDER IN THIS COMPARISON DOCUMENTS as a first-class,
      uploadable artifact — worth its own taxonomy row:
      "Skills are reusable capability packs used to add domain knowledge, operation
      processes, and best practices to an agent. Unlike writing a large number of rules
      directly into system, skills are better suited for reusable and maintainable
      professional capabilities."
      Uploaded through the CreateSkill API, by file or ZIP: "Each request can create only
      one skill, and the skill files must contain exactly one SKILL.md."
      Limits: "A single agent can be configured with at most 50 skills." Up to 500 files
      per version and 30 MiB raw upload per request. Skills are versioned and can be
      version-pinned on the agent.
      (2026-11-23: the August caveat that the API did not validate file formats has been
      removed from the page; the page now states explicit structure
      rules.)
      The sibling product BytePlus AgentKit has its own Skills Center with versioned
      management (docs.byteplus.com/en/docs/agentkit/Product_features), and its product
      page (www.byteplus.com/en/product/agentkit) says it can hot-swap models, tools and
      skills within a session. (Paraphrase, from different pages.)
    source: https://docs.byteplus.com/en/docs/modelark/skills
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  runtime_regions:
    status: documented
    value: ["Johor (ap-southeast-1)", "Dublin (eu-west-1)"]
    notes: >
      TWO REGIONS ONLY — the single most decision-relevant fact about this provider, and it
      contrasts sharply with AgentCore's 20:
      "ModelArk currently supports the following regions" — "Johor, Asia Pacific (AP)",
      Region ID ap-southeast-1, base URL https://ark.ap-southeast.bytepluses.com/api/v3;
      and "Dublin, Europe (EU)", Region ID eu-west-1, base URL
      https://ark.eu-west.bytepluses.com/api/v3.
      EU IS NARROW: "The EU region currently supports the following models" lists only
      seed-2-0-lite, and the EU APIs are Chat API and Image generation API. Managed Agents
      examples and the self-hosted worker endpoint use the AP base URL.
      NOTE ON FAIRNESS: two regions is a real limitation for global deployments, but Johor
      is a strong SEA position — read it against the intended market, not a US-centric
      default. There is NO mainland-China region here; BytePlus is ByteDance's
      international arm.
      HARD ISOLATION between them, a genuine migration cost:
      "An inference endpoint created in a region must be invoked using the region-specific
      base URL. Inference endpoints in one region cannot be called through another region's"
      URL, and "Platform-level resources, such as API keys and model activation status, are
      isolated by region." Same trap as Alibaba Model Studio's non-interchangeable keys.
      Requests can still spill over across regions; see data_residency.
      AGENTKIT (2026-11-23 pass; kept ModelArk): AgentKit is available in ONE region
      only, Asia Pacific (Johor), ap-southeast-1, and the page says other regions
      will come in the future. So BytePlus's code-hosting runtime is single-region,
      and ModelArk's two regions stay the broader answer. (Paraphrase, from a
      different page: https://docs.byteplus.com/en/docs/agentkit/Available_regions.)
    source: https://docs.byteplus.com/en/docs/modelark/region-availability
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  tool_region_variance:
    status: documented
    value:
      online_inference: 2
      chat_and_image_generation_api: 2
      responses_and_messages_api: 1
      managed_agents: 1
      batch_inference: 1
      tuning_and_dataset: 1
      agentkit: 1
    notes: >
      NEW CELL (2026-11-23 gap pass). NO, and BytePlus discloses it. The region page lists
      what EU (eu-west-1) supports: the models are only seed-2-0-lite, and the APIs are
      only Chat API and Image generation API. Its platform table marks Online inference,
      Foundation models, Model activation management, API keys, Usage management and
      Project configuration in both regions, while Batch inference, Tuning and Dataset,
      Playground, PromptPilot, Network configuration and Tokenizer tool are AP only.
      (Paraphrase of the table.)
      "This section lists models and APIs supported in the EU region."
      INFERENCE: Managed Agents (and so its web_search / web_fetch tools, skills, memory
      and sandboxes), the Responses API with its MCP tool and the Messages API are not
      in the EU API list, so they are AP-only. AgentKit (gateway, sandboxes, tools) is
      only in Asia Pacific (Johor) (a different page:
      https://docs.byteplus.com/en/docs/agentkit/Available_regions). So every agent tool is
      in one region. (Paraphrase.)
      DISCREPANCY: the model list (a different page,
      https://ai.byteplus.com/ark/region:ap-southeast-1/docs/model-list.md) says the
      seed-2-0 and seedream-5-0-lite models are also in eu-west-1, which is broader than
      the region page's single EU model. (Paraphrase.)
    source: https://ai.byteplus.com/ark/region:ap-southeast-1/docs/region-availability.md
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  service_limits:
    product: BytePlus AgentKit
    status: documented
    notes: >
      NEW CELL (2026-11-23 AgentKit pass). AgentKit publishes a limits table. Agent runtime:
      20 runtimes per account per region (raisable), 20 instances per runtime, 10 GB max
      image, 30 min synchronous request timeout, 16 MB max payload. Sandbox templates: 20 per
      account per region, 100 concurrent instances per template (raisable), 24-hour max
      instance lifetime. Gateway: 3 dedicated gateway instances per account per region, 1
      of each type. 10 MCP services (raisable), 5 API-key inbound auth entries per MCP
      service or toolset. Skills: 200 skills and 200 skills spaces per account per region, 20
      skills per space. (Paraphrase of the table.)
      Page intro: "This topic introduces certain limits that you may encounter when using
      the AgentKit service."
      MODELARK SIDE (from different pages under docs.byteplus.com/en/docs/modelark/):
      Managed Agents limits include 50 skills per agent, 10 memory stores per session,
      2,000 memories per store, 100 KiB per memory, 20 multi-agent members and 3 sub-agent
      levels. (Paraphrase.)
    source: https://docs.byteplus.com/en/docs/agentkit/Limits
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  data_residency:
    status: documented
    notes: >
      CROSS-REGION SPILLOVER IS STATED, and it matters for EU buyers:
      "Inference requests sent to an inference endpoint are primarily routed to the region
      where the endpoint is created. However, based on overall resource scheduling, some
      requests may be routed to inference resources in other regions."
      The page's routing table gives both directions: "Inference prefers AP, but may spill
      over to EU if needed" and "Inference prefers EU, but may spill over to AP if needed".
      No opt-out from spillover is documented on this page.
      The ModelArk data processing document says Customer Data processing is located in
      Malaysia, Indonesia, and/or the EU/EEA. (Paraphrase, from a different page:
      ai.byteplus.com BytePlus_ModelArk_Data_Processing.)
      AGENTKIT (2026-11-23 pass): AgentKit runs only in Johor (ap-southeast-1). Its
      docs state no cross-region routing or data-processing location of their own. A
      runtime that calls ModelArk models inherits ModelArk's spillover behaviour
      above. (Paraphrase.)
    source: https://docs.byteplus.com/en/docs/modelark/region-availability
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  pricing_axes:
    status: documented
    notes: >
      THREE-PART FORMULA, stated explicitly — the clearest agent-pricing breakdown of any
      provider in this comparison:
      "Managed Agents fee = Model invocation fee + agent runtime fee + tool calling fee"
      Unit prices on the page: agent runtime $0.08/hour, web_search $0.006/request,
      web_fetch free for a limited time; model tokens at the Standard LLM rates.
      BEST-IN-SET IDLE RULE, and a real cost advantage for conversational agents:
      "Billing only applies when the session status is running. No billing applies when the
      status is idle (waiting for the user's next message or tool confirmation),
      rescheduling, or terminated."
      "Runtime is accurate to the second, and bills are generated hourly."
      Compare AWS AgentCore, which also excludes idle but only where "no other background
      process is running" (a different page — the AWS pricing page,
      https://aws.amazon.com/bedrock/agentcore/pricing/).
      Model pricing is per-million-tokens with separate non-audio and audio input rates,
      plus a cache-storage axis: "Cache-storage prices are USD per million tokens per hour."
      AGENTKIT (2026-11-23 pass; kept ModelArk): AgentKit has a different model.
      "AgentKit fees are the sum of resource usage fees and gateway instance fees."
      Runtime is $0.000019/vCPU-second plus $0.000003/GB-second, sandbox is
      $0.00000975/vCPU-second, and traffic is $0.081/GB. Shared or dedicated gateway
      instance fees are separate. (Paraphrase except quoted text, from a different
      page: https://docs.byteplus.com/en/docs/agentkit/Billing_items.) Unlike ModelArk's
      running-only rule, resident minimum instances are billed while idle (another
      different page, https://docs.byteplus.com/en/docs/agentkit/Agent_runtime_overview).
      (Paraphrase.)
    source: https://docs.byteplus.com/en/docs/modelark/model-pricing
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  runtime_sla:
    status: unknown
    notes: >
      CHANGED FROM `none` (2026-11-23). No SLA is documented for ModelArk / Managed Agents.
      The BytePlus legal SLA page lists SLAs for CDN, WAF, DNS, GTM, PrivateZone,
      SealSuite, RTC, GA, Messaging, ByteHouse, MLP, Cloud Products, Viking AI Search, and
      Dramagic — but NOT ModelArk or any AI model inference service (list unchanged on
      2026-11-23). ModelArk is simply absent from the list; the page does not state that
      other services have no SLA, so absence is silence rather than denial, hence
      `unknown` (same treatment as Azure's equivalent case). "SLA for BytePlus Cloud
      Products" may technically cover ModelArk as a cloud product, but it is not
      explicitly named.
      AGENTKIT (2026-11-23 pass): AgentKit is not on the legal SLA list either (re-
      rendered 2026-11-23), and its docs have no SLA page. Its only agreement page
      is the Agent Gallery terms, which call the Gallery a Beta edition. `unknown`
      holds for both platforms. (Paraphrase.)
    source: https://docs.byteplus.com/en/docs/legal/docs-service-level-agreements-097b8473
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  otel_traces:
    status: documented
    product: BytePlus AgentKit Observability (APMPlus)
    notes: >
      CHANGED unknown -> documented AND SWITCHED TO AGENTKIT (2026-11-23 AgentKit pass).
      AgentKit states that its tracing is built on OpenTelemetry: "OpenTelemetry
      instrumentation is built into the AgentKit SDK to enable comprehensive observability
      of the call processes of the" agent (the sentence is truncated on the vendor page).
      "The overall solution covers two core modules: distributed tracing (Tracing) and
      metric monitoring (Metrics)." VeADK: "OpenTelemetry instrumentation is built into the
      VeADK SDK, enabling full observability of the processes where VeADK calls agents, runs
      agents, calls models, and calls tools."
      Span-level coverage, from a different page
      (https://docs.byteplus.com/en/docs/agentkit/Creating_agent_runtimes_in_console):
      AgentKit and the VeADK SDK collect traces and metrics for model calls, tool
      execution, memory retrieval and knowledge base retrieval, based on OpenTelemetry. Per
      another different page
      (https://docs.byteplus.com/en/docs/agentkit/How_existing_agent_migration_works), the
      migration tool attaches request spans and framework bridge spans to the same trace
      through the runtime's OTel/APMPlus pipeline. (Paraphrase.)
      CAVEATS: traces are delivered to BytePlus APMPlus (see apm_integration). Export to a
      third-party OTel collector and GenAI semantic-convention conformance are not stated on
      the pages read. (Paraphrase.)
      MODELARK SIDE (different pages: modelark/overview and ai.byteplus.com/ark/llms.txt):
      Managed Agents documents no OTel or trace export. It persists an append-only event
      stream with replay, plus webhooks. (Paraphrase.)
    source: https://docs.byteplus.com/en/docs/agentkit/Tracking_fields_and_metrics_description
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  apm_integration:
    product: BytePlus AgentKit Observability (APMPlus, TLS)
    status: documented
    notes: >
      NEW CELL (2026-11-23 AgentKit pass). "The runtime instrumentation module
      automatically reports logs, metrics, and traces to APMPlus and TLS, with no
      instrumentation required in business code."
      "When the observability service is disabled, business execution continues normally.
      Only troubleshooting and online evaluation capabilities become unavailable."
      APMPlus (Application Performance Management Plus) and TLS are BytePlus's first-party
      APM and log services. The Related cloud products page also lists CozeLoop for trace
      tracking and evaluation. (Paraphrase.)
      CAVEAT: integrations with third-party APM vendors are not described. ModelArk
      documents online-inference monitoring delivered to a VMP workspace, which is metrics
      only. (Paraphrase.)
    source: https://docs.byteplus.com/en/docs/agentkit/Agent_runtime_overview
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  eval_service:
    status: documented
    product: BytePlus AgentKit Evaluation
    notes: >
      AgentKit, as before; source moved (2026-11-23 AgentKit pass) from the marketing page
      to a doc page that describes the mechanism.
      "AgentKit provides an online evaluation mechanism with three core modules: evaluation
      sets, evaluators, and experiments, covering the full evaluation pipeline from data
      preparation to result analysis."
      "Evaluators score results based on predefined rules using either an LLM or code."
      So LLM-as-judge is documented. "Experiments are responsible for combined execution and
      aggregating result metrics, while also supporting comparative analysis across
      multiple experiments."
      Studio auto-evaluation: "AgentKit Studio automatically assesses the quality of each
      conversation turn, categorizes it into the corresponding evaluation set, and
      generates optimization suggestions based on the accumulated evaluation cases."
      Production traces can be exported into evaluation sets (data backflow, up to 100,000
      records per export task), and the AgentKit CLI manages evaluations. (Paraphrase, from
      different pages: https://docs.byteplus.com/en/docs/agentkit/Data_backflow and
      https://docs.byteplus.com/en/docs/agentkit/CLI_overview.) The product page
      (www.byteplus.com/en/product/agentkit) advertises built-in best-practice evaluators
      for online and offline assessment. (Paraphrase.)
      SCOPE CAVEAT: no dedicated evaluation user guide or evaluator catalog was found in
      the AgentKit doc navigation. Trajectory metrics and CI gating are not described.
      MODELARK SIDE (different page: ai.byteplus.com/ark/llms.txt): no agent eval; the
      Playground's "evaluate model performance" is interactive model trial. PromptPilot is
      listed in the region table for AP. (Paraphrase.)
    source: https://docs.byteplus.com/en/docs/agentkit/Building_and_deploying_agents_using_AgentKit_Studio
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  agent_optimization:
    product: BytePlus AgentKit Studio (auto-evaluation, Harness Sidecar)
    status: documented
    notes: >
      NEW CELL (2026-11-23 AgentKit pass). "AgentKit Studio provides the capability to
      automatically consolidate evaluation data and generate optimization suggestions after
      an agent is deployed to AgentKit, helping developers quickly identify and fix issues
      during the conversation validation phase."
      Harness Sidecar: "Through Harness Sidecar, AgentKit Studio provides enhancement
      services for an agent. These services improve the stability and task success rate of
      the agent without modifying the main code of the agent."
      "Harness Sidecar is an auxiliary service that runs in the same Pod as the main
      container." The page adds that it can proxy and govern model context requests and
      MCP tool calls, with retries transparent to the agent code. (Paraphrase.)
      CAVEATS: the suggestions are generated, not auto-applied. The page also says
      "BytePlus agents do not currently support this optimization feature." That reads as
      if Harness Sidecar targets agents migrated from other frameworks, which is not
      confirmed. No automated prompt or tool-description optimizer comparable to AgentCore
      Optimization is described. (Paraphrase except quoted text.)
    source: https://docs.byteplus.com/en/docs/agentkit/Building_and_deploying_agents_using_AgentKit_Studio
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  feedback_service:
    status: unknown
    notes: >
      NEW CELL (2026-11-23 gap pass). No managed END-USER feedback collection found. The
      closest thing is developer-facing: AgentKit Studio lists "Conversation call trace and
      issue feedback: Use the call trace view and issue feedback entry on the conversation
      page to diagnose single-turn execution issues." That is the builder's own test
      conversation in Studio, not an API for collecting ratings from production users.
      Studio also keeps Good/Bad case evaluation sets. (Paraphrase except the quote.)
      SEARCH TRAIL: AgentKit Observability overview and Data backflow pages (trace export
      to evaluation sets, no user-rating field), the ModelArk Markdown corpus
      (https://ai.byteplus.com/ark/llms-full.txt; feedback hits are only a Seedance
      bad-case quality-diagnostics API and doc boilerplate), and the Managed Agents session
      event reference. (Paraphrase.)
      Rendered in headless Chromium on 2026-11-23; check_quotes.py reports the source as
      UNVERIFIABLE.
    source: https://docs.byteplus.com/en/docs/agentkit/agentkit-studio-overview
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  guardrails:
    status: documented
    product: ModelArk Content filter
    notes: >
      CORRECTION: the August note said no content-safety guardrail was documented. One is:
      "This content filter can detect specific categories of potentially risky content in
      input prompts and output completions, and will implement corresponding measures, such
      as refusing to answer or returning a more benign response."
      It is configured per inference endpoint (online and batch) and enabled by default:
      "To ensure the stability of content security, this feature is enabled by default."
      Even when disabled, "our services still maintain baseline content safety policies".
      SCOPE CAVEAT: the page describes endpoints, not Managed Agents sessions. Whether
      agent sessions run behind the filter is not stated. No PII redaction, denied-topic or
      prompt-injection controls are described. Execution-level control for agents comes
      from tool permission policies (see tool_least_privilege).
      The sibling product BytePlus AgentKit advertises its own content guardrails, which
      detect and block risky user input and model output and support custom policies.
      Detector coverage is not described there. (Paraphrase; source for this sentence is
      the AgentKit product page, www.byteplus.com/en/product/agentkit.)
      AGENTKIT ADDENDUM (2026-11-23 pass; kept ModelArk): AgentKit integrates a
      Guardrails service backed by BytePlus LLM Application Firewall (IAM policy
      LLMShieldFullAccess). Protection takes effect only once it is integrated into
      the agent code, and it provides a security overview and attack logs (a
      different page:
      https://docs.byteplus.com/en/docs/agentkit/Runtime_security_best_practices).
      The firewall's product page (www.byteplus.com/en/product/LLM-FW) claims
      prompt-injection defense aligned to OWASP LLM Top 10, but it still shows an
      "Apply for beta test" button and its docs were not read. Not enough to switch
      the cell. (Paraphrase.)
    source: https://ai.byteplus.com/ark/region:ap-southeast-1/docs/Content_Pre-filter
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  human_in_the_loop:
    status: documented
    notes: >
      Approval gates on tool calls: "always_ask means pausing the session before execution
      and waiting for confirmation from the business application."
      The session goes idle with stop_reason requires_action, and the application answers
      with a user.tool_confirmation event (allow or deny, optional deny_message passed back
      to the agent). Custom tools use the same pause-and-return loop.
      Interrupt/steer is on the overview page. (Paraphrase, from a different page: users
      can send extra user events to a running session or interrupt the current run.)
    source: https://docs.byteplus.com/en/docs/modelark/tools
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  checkpoint_resume:
    status: documented
    notes: >
      "Sandbox state is automatically saved, and long-running tasks natively support
      checkpoint resume."
      Also named among the components you would otherwise build yourself ("checkpoint
      resume"), and in the comparison table: "Native support for long-running tasks, with
      automatic snapshot generation and on-demand startup."
      The mechanism is platform-managed. No user-facing checkpoint API is described on this
      page.
      AGENTKIT (2026-11-23 pass): AgentKit sandbox templates can snapshot an
      instance automatically before it expires, or manually, and restore from the
      snapshot. That covers sandbox state, not agent-run resumption. (Paraphrase,
      from the release notes, a different page.)
    source: https://docs.byteplus.com/en/docs/modelark/overview
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  web_search_tool:
    status: documented
    notes: >
      web_search is part of the built-in base toolset (agent_toolset_20260916), alongside
      web_fetch. The tool table describes it as "Start a web search."
      "The web search tool is billed based on the actual number of calls." The pricing page
      lists $0.006/request. (Paraphrase of the price, from a different page:
      modelark/model-pricing.)
      Can be disabled per agent through configs (the page shows an example that disables
      web_fetch and web_search).
    source: https://docs.byteplus.com/en/docs/modelark/tools
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  agent_payments:
    status: unknown
    notes: >
      NEW ROW (2026-11-23). No agent-payments capability (wallets, x402, spending limits,
      payment execution) was found in either BytePlus agent platform. Checked: the AgentKit
      release notes through 2026-11-20 (the source), the AgentKit Features, Billing and
      Billing FAQ pages, the AgentKit product page, and the full ModelArk doc index
      (ai.byteplus.com/ark/llms.txt, a different page). The only payment wording found
      concerns paying BytePlus bills. BytePlus does not positively say the capability is
      unavailable, so the cell is `unknown`, not `none`. (Paraphrase.)
    source: https://docs.byteplus.com/en/docs/agentkit/New_feature_release_notes
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  agent_workload_identity:
    product: BytePlus AgentKit Identity (agent identity / WorkloadIdentity)
    status: preview
    notes: >
      SWITCHED FROM ModelArk TO AGENTKIT AND CHANGED documented -> preview (2026-11-23
      AgentKit pass). ModelArk never stated whether an agent gets its own principal.
      AgentKit does, but the feature is labelled beta.
      "the AgentKit agent identity management module uses the workload identity
      (WorkloadIdentity) model. In this model, each agent has a stable identity in an
      identity pool, and the identity pool issues a short-term token at runtime."
      "Access policies control permissions, and no long-term keys are generated or used at
      any point." The agent identity is "the Principal in Cedar policies".
      Per a different page (https://docs.byteplus.com/en/docs/agentkit/create-agent-identity),
      each agent created in AgentKit is automatically registered with an identity in the
      default pool and deleted with the agent. (Paraphrase.)
      STAGE, on this page: "The "Identity and Permission" feature of AgentKit is in beta. It
      is visible and available only after being enabled. To apply for a trial, contact
      your account manager." That banner postdates the 2026-11-16 GA entry, hence `preview`.
      NOT IN BETA: every AgentKit runtime can be bound to an IAM role whose temporary
      credentials are injected into the sandbox. (Paraphrase, from a different page:
      https://docs.byteplus.com/en/docs/agentkit/Agent_runtime_overview.)
      MODELARK SIDE (a different page: https://docs.byteplus.com/en/docs/modelark/overview):
      Managed Agents uses BytePlus IAM with zero-trust credential isolation, so keys do not
      enter sandbox processes. A per-agent principal is not stated. (Paraphrase.)
    source: https://docs.byteplus.com/en/docs/agentkit/agent-identity-management-workload-pool
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  private_networking:
    product: BytePlus AgentKit Runtime
    status: documented
    notes: >
      SWITCHED FROM ModelArk TO AGENTKIT (2026-11-23 AgentKit pass); status unchanged.
      AgentKit puts the agent runtime itself into your VPC, which ModelArk does not.
      "Runtime supports two network access methods: Public network and Private network."
      Private network suits "Enterprise internal systems, downstream resources within the
      VPC, and production agents with low requirements for public-network exposure."
      Outbound: a private-network runtime can enable shared public network access or use
      your own egress, for example an EIP or NAT gateway. Associated session, memory and
      knowledge resources must use the same network mode. (Paraphrase.)
      Gateway side: MCP services can be private-network only, and dedicated gateways
      support private network egress to private backends (added 2026-11-06). Cross-VPC
      access uses PrivateLink. (Paraphrase, from different pages:
      https://docs.byteplus.com/en/docs/agentkit/configure-gateway-private-network-egress
      and https://docs.byteplus.com/en/docs/agentkit/Integrating_existing_MCP_Servers_into_AgentKit_Gateway.)
      CAVEAT: a PrivateLink endpoint for invoking the runtime from another VPC or account
      is not described as a runtime feature on the pages read.
      MODELARK SIDE (a different page: https://docs.byteplus.com/en/docs/modelark/self-hosted-environment-overview):
      self-hosted environments run Managed Agents' bash and file tools on your own
      infrastructure, with outbound-polling workers, while ModelArk keeps inference,
      orchestration and sessions. Cloud sandboxes support an egress allowlist of up to 64
      domain names (another different page,
      https://ai.byteplus.com/ark/region:ap-southeast-1/docs/configure-cloud-environment).
      (Paraphrase.)
    source: https://docs.byteplus.com/en/docs/agentkit/Runtime_security_best_practices
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

