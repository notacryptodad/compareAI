      CAVEAT: the free quota covers the gateway instance fee only. It does not waive
      runtime vCPU and memory usage (paraphrase of the billing structure). Savings plans or
      marketplace procurement are not described. ModelArk's web_fetch is free for a
      limited time (see pricing_axes). (Paraphrase.)
    source: https://docs.byteplus.com/en/docs/agentkit/Billing_items
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  versioning_rollout:
    status: documented
    product: BytePlus AgentKit Runtime
    notes: >
      SWITCHED FROM ModelArk TO AGENTKIT (2026-11-23 AgentKit pass); status unchanged.
      AgentKit does platform-side traffic splitting, which ModelArk lacks.
      "AgentKit supports grey release and full release."
      "The traffic ratio for the new version can be set from 10% to 100%. After the
      configured ratio is reached, you need to manually confirm the next operation, such
      as adjusting the ratio, performing a full release, or rolling back."
      "When a grey version exists for an agent runtime, requests are randomly sent to the
      new and old agent runtime versions based on the traffic ratio."
      Rollback: "A rollback will initiate a new release task and roll back online traffic
      to the historical version of the selected release task." "Associated components are
      rolled back at the same time."
      Skills are versioned too, and can be published per skills space for grey release
      (see skills_registry). (Paraphrase.)
      MODELARK SIDE (a different page: https://docs.byteplus.com/en/docs/modelark/start-session):
      Managed Agents versions every agent update and lets the caller pin a session to a
      version for canary or rollback. There is no traffic-splitting alias. (Paraphrase.)
    source: https://docs.byteplus.com/en/docs/agentkit/Releasing_runtimes
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"
