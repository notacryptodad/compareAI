provider: byteplus
bucket: b
product: BytePlus ModelArk
aliases: [ModelArk, Ark, BytePlus Ark]
notes: >
  CORRECTION TO EARLIER ASSUMPTION: BytePlus DOES have a managed agent offering. The
  README's initial "TBD" was wrong. ModelArk documents a "Managed Agents" section with
  agents, skills, tools, sessions, sandboxes, and persistent memory.
  "Managed Agents" is a SECTION within ModelArk (alongside Model invocation, Tool use,
  Inference, Knowledge base, PromptPilot), not a separately branded product.
  TOOLING WALL DIAGNOSED, THEN BROKEN. docs.byteplus.com renders article bodies
  client-side: plain HTTP fetches return ~280-300 KB of HTML per page that strips to ~3.3 KB
  of pure navigation chrome, which is why three earlier research passes recorded only
  doc-section titles. Driving headless Chrome via Playwright yields the real content
  (12.5 KB of prose on the overview page alone). Cells below now cite rendered bodies.
  VERIFICATION CAVEAT: because the bodies are JS-rendered, scripts/check_quotes.py cannot
  re-verify these quotes over plain HTTP and reports this provider's pages as
  UNVERIFIABLE rather than failing. So BytePlus quotes carry a weaker automated guarantee
  than every other provider's — they were verified once, by hand, through headless Chrome
  on 2026-08-04. Re-verification needs the same method. Do not mistake the passing CI run
  for machine-checked provenance here.
  METHOD NOTE worth keeping: the earlier `unknown` statuses were correct at the time — the
  evidence genuinely was nav-titles-only — but "unreachable" was a property of the toolchain,
  not the vendor. Any provider whose docs are a JS app will look under-documented to an
  HTTP-only researcher. Check the rendering model before concluding a vendor discloses less
  than its competitors.

capabilities:
  launch_stage_investigation:
    status: unknown
    notes: >
      NO EXPLICIT STAGE FOUND for ModelArk Managed Agents, verified from two networks.
      An EC2-based agent scanned the rendered and raw HTML: "generally available" x0,
      "GA" x0, "invitational" x0. The 4 "beta" and 1 "preview" tokens present are unrelated
      navigation labels such as "Structured output (beta)" — do NOT attribute them to
      Managed Agents.
      REACHABILITY CONFIRMED FROM BOTH LOCATIONS (HTTP 200); the limit is client-side
      rendering, not network blocking. ~376 KB of HTML strips to ~3.3 KB of navigation.
      A JS-rendered stage tag could exist and would not be visible to either vantage point.
      CROSS-PROVIDER OBSERVATION worth keeping: docs.volcengine.com (Volcengine 方舟/Ark,
      the CN-market sibling) serves the SAME doc IDs — 2553713 is the Managed Agents
      overview on both — so BytePlus and Volcengine share a documentation platform and
      almost certainly the same product. Useful for cross-checking either one.
    source: https://docs.byteplus.com/en/docs/ModelArk/2553713
    verified_on: 2026-08-04
    verified_by: "@notacryptodad"

  long_running_agents:
    status: documented
    notes: >
      A HEADLINE POSITIONING CLAIM, not an afterthought: Managed Agents "is best suited for
      long-running, stateful asynchronous tasks with multi-turn tool calls."
      "checkpoint resume" is named as one of the components ModelArk implements for you.
    source: https://docs.byteplus.com/en/docs/ModelArk/2553713
    verified_on: 2026-08-04
    verified_by: "@notacryptodad"

  managed_agent_runtime:
    product: ModelArk Managed Agents
    status: documented
    notes: >
      NOW VERIFIED FROM THE RENDERED BODY, not nav titles:
      "ModelArk Managed Agents is a prebuilt, configurable agent framework provided by
      ModelArk. It runs on ModelArk-managed infrastructure and is best suited for
      long-running, stateful asynchronous tasks with multi-turn tool calls."
      Positioned explicitly against DIY: "To build a usable agent based on the model API,
      you need to implement common components yourself, such as AgentLoop, tool calls,
      context management, sandbox scheduling, checkpoint resume, and permission isolation."
      TWO-PATH CHOICE, stated plainly — closest analogue to AWS Runtime-vs-Harness:
      "ModelArk currently provides two ways to build agents based on Dola models: use the
      model API when you need fine-grained control over the agent loop; use Managed Agents
      when you want ModelArk to host the agent".
      Quickstart is four steps: "create an agent, create an environment, start a session,
      send a message and receive a streaming response."
      No launch stage stated on the page — hence `documented`, not `ga`.
    source: https://docs.byteplus.com/en/docs/ModelArk/2553713
    verified_on: 2026-08-04
    verified_by: "@notacryptodad"

  session_management:
    status: documented
    notes: >
      CONFIRMED with a clear object model — agent / environment / session are distinct,
      versioned resources:
      Agent = "A versioned and reusable intelligent agent configuration asset. It defines
      roles, capabilities, behavior boundaries, and runtime rules of an agent, and serves as
      the template and baseline for all task runs."
      Environment = "The environment configuration for running a session, including network,
      preinstalled dependency packages, and environment variables. Referenced through
      environment_id."
      Session = "An agent instance that runs in an environment and is used to execute a
      specific task. Context, files, and state are isolated from each other. The same agent
      can start multiple parallel sessions."
      Per-session isolation plus parallel sessions per agent is a genuine multi-tenancy
      primitive, comparable to AgentCore's session isolation.
    source: https://docs.byteplus.com/en/docs/ModelArk/2553713
    verified_on: 2026-08-04
    verified_by: "@notacryptodad"

  multi_agent_patterns:
    status: documented
    value: [orchestrator / sub-agent delegation]
    notes: >
      ORCHESTRATOR-SUBAGENT (supervisor-equivalent), verified from the rendered page:
      "Multi-agent is an advanced capability of ModelArk Managed Agents ... it allows one
      agent (the orchestrator) to delegate tasks to other agents (sub-agents)".
      Sub-agents are independently configured — each has "its own model, system prompt,
      skills, tools, and other settings" — so heterogeneous-model teams are possible.
      EXPLICIT DEPTH LIMIT worth surfacing, since it constrains architecture:
      "An orchestrator agent cannot be selected as a sub-agent of another agent, to prevent
      circular delegation." That caps hierarchies at ONE level — no nested supervisors,
      unlike ADK's nested workflows or MAF's group collaboration.
      Config is declarative via a `multiagent` parameter (type / agents[] / agents[].type /
      agents[].id / agents[].version) — note sub-agents are version-pinned.
    source: https://docs.byteplus.com/en/docs/ModelArk/2553730
    verified_on: 2026-08-04
    verified_by: "@notacryptodad"

  mcp_server_hosting:
    status: documented
    notes: >
      MCP is a first-class tool type: "Tools determine which execution capabilities an agent
      can call in a session. ModelArk Managed Agents currently support the following tool
      types" — and "If you need to integrate external system capabilities wrapped according
      to the MCP protocol, see MCP."
      Also a versioned BUILT-IN toolset, which no other provider here documents this way:
      "After you add agent_toolset_20260701 to an agent, all these tools are enabled by
      default." A date-stamped toolset ID implies deliberate version pinning.
      Custom tools use an event-callback model rather than server hosting: "The business
      side receives tool call events, runs the actual business logic, and returns the tool
      results".
      CAUTION: this establishes MCP CONSUMPTION. Whether ModelArk HOSTS MCP servers (the
      AgentCore Gateway equivalent) is still not established.
    source: https://docs.byteplus.com/en/docs/ModelArk/2553719
    verified_on: 2026-08-04
    verified_by: "@notacryptodad"

  tool_least_privilege:
    status: unknown
    notes: >
      Doc title "Tool permission policy" exists alongside "Agent", "Skills", "Tools" —
      a per-tool policy concept comparable to AgentCore Policy. Unverified depth.
      If real, this is a notable strength for a provider often assumed to be behind.
    source: https://docs.byteplus.com/en/docs/ModelArk/Introduction
    verified_on: 2026-08-04
    verified_by: "@notacryptodad"

  code_interpreter:
    status: documented
    notes: >
      CONFIRMED — it is a code interpreter in substance even though no page carries that
      name: "The cloud-isolated sandbox of the agent, used to execute code, read and write
      files, and run command line tools within a session, and is automatically reclaimed
      after the" session ends.
      Code execution + filesystem + shell, session-scoped and auto-reclaimed — functionally
      equivalent to AgentCore Code Interpreter and Vertex Code Execution.
    source: https://docs.byteplus.com/en/docs/ModelArk/1544106
    verified_on: 2026-08-04
    verified_by: "@notacryptodad"

