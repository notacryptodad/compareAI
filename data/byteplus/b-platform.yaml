provider: byteplus
bucket: b
product: BytePlus ModelArk
aliases: [ModelArk, Ark, BytePlus Ark]
notes: >
  CORRECTION TO EARLIER ASSUMPTION: BytePlus DOES have a managed agent offering. The
  README's initial "TBD" was wrong. ModelArk documents a "Managed Agents" section with
  agents, skills, tools, sessions, sandboxes, and persistent memory.
  "Managed Agents" is a SECTION within ModelArk (alongside Model invocation, Tool use,
  Inference, Knowledge base, PromptPilot), not a separately branded product.
  TOOLING WALL DIAGNOSED, THEN BROKEN. docs.byteplus.com renders article bodies
  client-side: plain HTTP fetches return ~280-300 KB of HTML per page that strips to ~3.3 KB
  of pure navigation chrome, which is why three earlier research passes recorded only
  doc-section titles. Driving headless Chrome via Playwright yields the real content
  (12.5 KB of prose on the overview page alone). Cells below now cite rendered bodies.
  VERIFICATION CAVEAT: because the bodies are JS-rendered, scripts/check_quotes.py cannot
  re-verify these quotes over plain HTTP and reports this provider's pages as
  UNVERIFIABLE rather than failing. So BytePlus quotes carry a weaker automated guarantee
  than every other provider's — they were verified once, by hand, through headless Chrome
  on 2026-08-04. Re-verification needs the same method. Do not mistake the passing CI run
  for machine-checked provenance here.
  METHOD NOTE worth keeping: the earlier `unknown` statuses were correct at the time — the
  evidence genuinely was nav-titles-only — but "unreachable" was a property of the toolchain,
  not the vendor. Any provider whose docs are a JS app will look under-documented to an
  HTTP-only researcher. Check the rendering model before concluding a vendor discloses less
  than its competitors.

capabilities:
  launch_stage_investigation:
    status: documented
    notes: >
      NO EXPLICIT STAGE FOUND for ModelArk Managed Agents, verified from two networks.
      An EC2-based agent scanned the rendered and raw HTML: "generally available" x0,
      "GA" x0, "invitational" x0. The 4 "beta" and 1 "preview" tokens present are unrelated
      navigation labels such as "Structured output (beta)" — do NOT attribute them to
      Managed Agents.
      REACHABILITY CONFIRMED FROM BOTH LOCATIONS (HTTP 200); the limit is client-side
      rendering, not network blocking. ~376 KB of HTML strips to ~3.3 KB of navigation.
      A JS-rendered stage tag could exist and would not be visible to either vantage point.
      CROSS-PROVIDER OBSERVATION worth keeping: docs.volcengine.com (Volcengine 方舟/Ark,
      the CN-market sibling) serves the SAME doc IDs — 2553713 is the Managed Agents
      overview on both — so BytePlus and Volcengine share a documentation platform and
      almost certainly the same product. Useful for cross-checking either one.
    source: https://docs.byteplus.com/en/docs/ModelArk/2553713
    verified_on: 2026-08-04
    verified_by: "@notacryptodad"

  long_running_agents:
    status: documented
    notes: >
      A HEADLINE POSITIONING CLAIM, not an afterthought: Managed Agents "is best suited for
      long-running, stateful asynchronous tasks with multi-turn tool calls."
      "checkpoint resume" is named as one of the components ModelArk implements for you.
    source: https://docs.byteplus.com/en/docs/ModelArk/2553713
    verified_on: 2026-08-04
    verified_by: "@notacryptodad"

  managed_agent_runtime:
    product: ModelArk Managed Agents
    status: documented
    notes: >
      NOW VERIFIED FROM THE RENDERED BODY, not nav titles:
      "ModelArk Managed Agents is a prebuilt, configurable agent framework provided by
      ModelArk. It runs on ModelArk-managed infrastructure and is best suited for
      long-running, stateful asynchronous tasks with multi-turn tool calls."
      Positioned explicitly against DIY: "To build a usable agent based on the model API,
      you need to implement common components yourself, such as AgentLoop, tool calls,
      context management, sandbox scheduling, checkpoint resume, and permission isolation."
      TWO-PATH CHOICE, stated plainly — closest analogue to AWS Runtime-vs-Harness:
      "ModelArk currently provides two ways to build agents based on Dola models: use the
      model API when you need fine-grained control over the agent loop; use Managed Agents
      when you want ModelArk to host the agent".
      Quickstart is four steps: "create an agent, create an environment, start a session,
      send a message and receive a streaming response."
      No launch stage stated on the page — hence `documented`, not `ga`.
    source: https://docs.byteplus.com/en/docs/ModelArk/2553713
    verified_on: 2026-08-04
    verified_by: "@notacryptodad"

  managed_agent_loop:
    product: ModelArk Managed Agents
    status: documented
    notes: >
      "ModelArk Managed Agents delivers the full infrastructure stack at the agent layer.
      Developers only need to define agent behavior, send user events, and subscribe to
      result streams, while ModelArk handles all underlying complexity."
      Explicitly positioned as the managed-loop alternative to the model API: "use the
      model API when you need fine-grained control over the agent loop; use Managed Agents
      when you want ModelArk to host the agent and you want to focus on business logic."
      The platform handles: AgentLoop, tool calls, context management, sandbox scheduling,
      checkpoint resume, and permission isolation. Four-step quickstart: create agent,
      create environment, start session, send message.
      No launch stage stated — hence `documented`, not `ga`.
    source: https://docs.byteplus.com/en/docs/ModelArk/2553713
    verified_on: 2026-08-09
    verified_by: "@notacryptodad"

  session_management:
    status: documented
    notes: >
      CONFIRMED with a clear object model — agent / environment / session are distinct,
      versioned resources:
      Agent = "A versioned and reusable intelligent agent configuration asset. It defines
      roles, capabilities, behavior boundaries, and runtime rules of an agent, and serves as
      the template and baseline for all task runs."
      Environment = "The environment configuration for running a session, including network,
      preinstalled dependency packages, and environment variables. Referenced through
      environment_id."
      Session = "An agent instance that runs in an environment and is used to execute a
      specific task. Context, files, and state are isolated from each other. The same agent
      can start multiple parallel sessions."
      Per-session isolation plus parallel sessions per agent is a genuine multi-tenancy
      primitive, comparable to AgentCore's session isolation.
    source: https://docs.byteplus.com/en/docs/ModelArk/2553713
    verified_on: 2026-08-04
    verified_by: "@notacryptodad"

  multi_agent_patterns:
    status: documented
    value: [orchestrator / sub-agent delegation]
    notes: >
      ORCHESTRATOR-SUBAGENT (supervisor-equivalent), verified from the rendered page:
      "Multi-agent is an advanced capability of ModelArk Managed Agents ... it allows one
      agent (the orchestrator) to delegate tasks to other agents (sub-agents)".
      Sub-agents are independently configured — each has "its own model, system prompt,
      skills, tools, and other settings" — so heterogeneous-model teams are possible.
      EXPLICIT DEPTH LIMIT worth surfacing, since it constrains architecture:
      "An orchestrator agent cannot be selected as a sub-agent of another agent, to prevent
      circular delegation." That caps hierarchies at ONE level — no nested supervisors,
      unlike ADK's nested workflows or MAF's group collaboration.
      Config is declarative via a `multiagent` parameter (type / agents[] / agents[].type /
      agents[].id / agents[].version) — note sub-agents are version-pinned.
    source: https://docs.byteplus.com/en/docs/ModelArk/2553730
    verified_on: 2026-08-04
    verified_by: "@notacryptodad"

  mcp_server_hosting:
    status: documented
    notes: >
      MCP is a first-class tool type: "Tools determine which execution capabilities an agent
      can call in a session. ModelArk Managed Agents currently support the following tool
      types" — and "If you need to integrate external system capabilities wrapped according
      to the MCP protocol, see MCP."
      Also a versioned BUILT-IN toolset, which no other provider here documents this way:
      "After you add agent_toolset_20260701 to an agent, all these tools are enabled by
      default." A date-stamped toolset ID implies deliberate version pinning.
      Custom tools use an event-callback model rather than server hosting: "The business
      side receives tool call events, runs the actual business logic, and returns the tool
      results".
      CAUTION: this establishes MCP CONSUMPTION. Whether ModelArk HOSTS MCP servers (the
      AgentCore Gateway equivalent) is still not established.
    source: https://docs.byteplus.com/en/docs/ModelArk/2553719
    verified_on: 2026-08-04
    verified_by: "@notacryptodad"

  tool_least_privilege:
    status: documented
    notes: >
      Tool permission policies confirmed from the rendered tools page:
      "Tool permission policies are used to control whether tool calls initiated by an
      agent are executed automatically or paused for confirmation."
      Common practices: "Use the default auto-allow behavior for built-in tools",
      "Use default manual confirmation for MCP tools, or auto-allow only whitelisted tools."
      This is a genuine per-tool-type permission system — comparable to AgentCore Policy.
      The granularity (per-tool-name whitelisting) goes beyond simple on/off.
    source: https://docs.byteplus.com/en/docs/ModelArk/2553719
    verified_on: 2026-08-09
    verified_by: "@notacryptodad"

  code_interpreter:
    status: documented
    notes: >
      CONFIRMED — it is a code interpreter in substance even though no page carries that
      name: "The cloud-isolated sandbox of the agent, used to execute code, read and write
      files, and run command line tools within a session, and is automatically reclaimed
      after the" session ends.
      Code execution + filesystem + shell, session-scoped and auto-reclaimed — functionally
      equivalent to AgentCore Code Interpreter and Vertex Code Execution.
    source: https://docs.byteplus.com/en/docs/ModelArk/1544106
    verified_on: 2026-08-04
    verified_by: "@notacryptodad"

  browser_use:
    status: none
    notes: >
      No browser-use or web-browsing capability found. The built-in toolset includes
      "Web Fetch" (fetch content from a URL) and "Web Search" (start a web search) but
      these are API-level tools, NOT a browser agent that navigates/clicks/screenshots.
      No equivalent to GCP's Computer Use sandbox or AWS's browser automation.
      Confirmed from full rendered page content via Playwright — this is genuine absence,
      not a fetch limitation.
    source: https://docs.byteplus.com/en/docs/ModelArk/2553719
    verified_on: 2026-08-09
    verified_by: "@notacryptodad"

  long_term_memory:
    status: documented
    product: Persistent memory
    notes: >
      "Persistent memory" is a documented capability under "Manage agent context".
      Context management also includes: "Upload and mount files", "Context caching
      overview", "Files API tutorial". The overview confirms "context management" as one of
      the components the platform handles for you (vs. DIY). Context is "automatically
      compressed, and the Event API retains all content without loss."
      Whether this is cross-session persistence (like Vertex Memory Bank) or within-session
      only needs the dedicated page — but "Persistent" in the title suggests cross-session.
    source: https://docs.byteplus.com/en/docs/ModelArk/2553713
    verified_on: 2026-08-09
    verified_by: "@notacryptodad"

  knowledge_base:
    status: documented
    product: Knowledge base
    notes: >
      Confirmed from navigation AND the overview page's feature listing. Multiple
      sub-pages: "Create a knowledge base", "Knowledge retrieval", "Knowledge Q&A",
      "Create a knowledge service". Also an "App Lab" section for application building.
      Depth of RAG implementation (chunking, embedding model choice, etc.) not verified
      from this pass — needs the dedicated knowledge base page via Playwright.
    source: https://docs.byteplus.com/en/docs/ModelArk/Introduction
    verified_on: 2026-08-09
    verified_by: "@notacryptodad"

  first_party_models:
    status: documented
    value: [Dola Seed 2.0, Seed 2.0 Pro, Seed 2.0 Lite, Seed 2.0 Mini, Dola Seed 2.1 Turbo]
    notes: >
      Model family is "Seed" (NOT Skylark, NOT Doubao — earlier guesses were wrong).
      Dola Seed 2.0: "Flagship general-purpose agentic model — Built for complex reasoning
      and long-chain, multi-step task execution in the Agent era"
      Variants: seed-2-0-pro (reasoning), seed-2-0-lite (balanced), seed-2-0-mini (low-cost),
      seed-2-0-code-preview (coding), dola-seed-2-1-turbo (latest agent-optimized).
      Non-LLM: Seedance 2.0 (video), Seedream 5.0 (image), Seededit (image editing).
      Third-party models also available: DeepSeek v4, GLM-5-2, GLM-4-7.
      Date-suffixed IDs (e.g. seed-2-0-lite-260228) are pinned model snapshots.
    source: https://docs.byteplus.com/en/docs/ModelArk/1544106
    verified_on: 2026-08-09
    verified_by: "@notacryptodad"

  delegated_user_auth:
    status: documented
    notes: >
      "Use Vaults authentication" documented as a section under Managed Agents. The
      overview states the platform handles "IAM, key injection, and runtime environment
      isolation" — so credentials are platform-managed. Whether this supports delegated
      end-user auth (3LO / OAuth on behalf of user) vs. just service-level credentials
      is not confirmed from available pages. Recording as documented (credential vault
      exists) but the depth vs. GCP's 3LO or Azure's Entra delegation is unclear.
    source: https://docs.byteplus.com/en/docs/ModelArk/2553713
    verified_on: 2026-08-09
    verified_by: "@notacryptodad"

  tool_calling:
    status: documented
    notes: >
      Multiple tool types supported; custom tools are declared with type: "custom" and need
      "a name, a purpose description, and an input parameter schema".
      Agents are declarative configuration objects: an agent takes a model ID (example
      given: "dola-seed-2-1-turbo-260628"), a system prompt "used to define the agent's
      role, behavior boundaries, and working style", plus skills and tools.
      "ModelArk Managed Agents is a fully managed agent service launched by ModelArk,
      providing an out-of-the-box agent experience."
    source: https://docs.byteplus.com/en/docs/ModelArk/2553716
    verified_on: 2026-08-04
    verified_by: "@notacryptodad"

  agent_skills:
    status: documented
    notes: >
      A CAPABILITY NO OTHER PROVIDER IN THIS COMPARISON DOCUMENTS as a first-class,
      uploadable artifact — worth its own taxonomy row:
      "Skills are reusable capability packs used to add domain knowledge, operation
      processes, and best practices to an agent. Unlike writing a large number of rules
      directly into system" prompts, skills are packaged separately.
      Uploaded as a zip via the CreateSkill API, with "SKILL.md placed directly under the
      top-level directory".
      HONEST CAVEAT the docs volunteer themselves: "The API currently does not validate file
      formats" — recommended structure only, so malformed skills fail at runtime.
    source: https://docs.byteplus.com/en/docs/ModelArk/2553717
    verified_on: 2026-08-04
    verified_by: "@notacryptodad"

  runtime_regions:
    status: documented
    value: ["Johor (ap-southeast-1)", "Dublin (eu-west-1)"]
    notes: >
      TWO REGIONS ONLY — the single most decision-relevant fact about this provider, and it
      contrasts sharply with AgentCore's 20:
      "ModelArk currently supports the following regions" — "Johor, Asia Pacific (AP)",
      Region ID ap-southeast-1, base URL https://ark.ap-southeast.bytepluses.com/api/v3;
      and "Dublin, Europe (EU)", Region ID eu-west-1, base URL
      https://ark.eu-west.bytepluses.com/api/v3.
      NOTE ON FAIRNESS: two regions is a real limitation for global deployments, but Johor
      is a strong SEA position — read it against the intended market, not a US-centric
      default. There is NO mainland-China region here; BytePlus is ByteDance's
      international arm.
      HARD ISOLATION between them, a genuine migration cost:
      "An inference endpoint created in a region must be invoked using the region-specific
      base URL. Inference endpoints in one region cannot be called through another region's"
      endpoint, and "Platform-level resources, such as API keys and model activation status
      are isolated by region." Same trap as Alibaba Model Studio's non-interchangeable keys.
    source: https://docs.byteplus.com/en/docs/ModelArk/2191806
    verified_on: 2026-08-04
    verified_by: "@notacryptodad"
  pricing_axes:
    status: documented
    notes: >
      THREE-PART FORMULA, stated explicitly — the clearest agent-pricing breakdown of any
      provider in this comparison:
      "Managed Agents fee = Model invocation fee + agent runtime fee + tool calling fee"
      BEST-IN-SET IDLE RULE, and a real cost advantage for conversational agents:
      "Billing only applies when the session status is running; no billing applies when the
      status is idle (waiting for the user's next message or tool confirmation)".
      Compare AWS AgentCore, which also excludes idle but only where "no other background
      process is running".
      Model pricing is per-million-token with separate non-audio and audio input rates, plus
      a "Cache-storage (USD/M tokens/Hour)" axis.
    source: https://docs.byteplus.com/en/docs/ModelArk/1544106
    verified_on: 2026-08-04
    verified_by: "@notacryptodad"
  runtime_sla:
    status: none
    notes: >
      No SLA published for ModelArk / Managed Agents. The BytePlus legal SLA page lists
      SLAs for CDN, WAF, DNS, GTM, PrivateZone, SealSuite, RTC, GA, Messaging, ByteHouse,
      MLP, Cloud Products, Viking AI Search, and Dramagic — but NOT ModelArk or any AI model
      inference service. This is a deliberate omission, not an oversight: the product is
      commercially available with pricing, but has no committed uptime guarantee. "SLA for
      BytePlus Cloud Products" may technically cover ModelArk as a cloud product, but it is
      not explicitly named.
    source: https://docs.byteplus.com/en/docs/legal/docs-service-level-agreements-097b8473
    verified_on: 2026-08-09
    verified_by: "@notacryptodad"
  otel_traces:
    status: none
    notes: >
      No OpenTelemetry or tracing capability found in Managed Agents documentation.
      Searched overview, tools, and advanced capabilities pages — zero mentions of
      OTel, tracing, distributed tracing, or observability export. The platform does
      persist events ("append-only" event log with "later replay") which serves as an
      audit trail, but this is NOT the same as OTel-compatible trace export.
    source: https://docs.byteplus.com/en/docs/ModelArk/2553713
    verified_on: 2026-08-09
    verified_by: "@notacryptodad"
  eval_service:
    status: none
    notes: >
      No evaluation service found. Navigation shows no eval/benchmark section under
      Managed Agents. "PromptPilot" exists as a separate section but that is prompt
      optimization, not agent evaluation. No equivalent to GCP's Evaluation Service or
      ADK's eval framework documented.
    source: https://docs.byteplus.com/en/docs/ModelArk/Introduction
    verified_on: 2026-08-09
    verified_by: "@notacryptodad"
  guardrails:
    status: documented
    notes: >
      Tool permission policies serve as the primary guardrail mechanism — controlling
      "whether tool calls initiated by an agent are executed automatically or paused for
      confirmation." MCP tools default to manual confirmation; built-in tools default to
      auto-allow. This is execution-level control, not content-safety guardrails (no
      equivalent to Bedrock Guardrails or M365's content harm filters documented).
      Also: "permission isolation" named as a platform-managed component, and IAM-based
      credential isolation ("keys do not enter sandbox processes").
    source: https://docs.byteplus.com/en/docs/ModelArk/2553719
    verified_on: 2026-08-09
    verified_by: "@notacryptodad"
  agent_workload_identity:
    status: documented
    notes: >
      "Based on BytePlus IAM + zero-trust credential isolation, keys do not enter sandbox
      processes." This is the platform's workload identity model — agents operate under
      IAM-managed credentials that are injected at runtime without being exposed to the
      sandbox execution environment. API keys are region-scoped and isolated.
    source: https://docs.byteplus.com/en/docs/ModelArk/2553713
    verified_on: 2026-08-09
    verified_by: "@notacryptodad"
  private_networking:
    status: documented
    notes: >
      "Network configuration" is listed as a platform capability in the AP region (but NOT
      in the EU region — the capability availability table shows it as AP-only). This
      suggests VPC/private networking options exist for AP deployments. Depth not verified
      from the overview — needs the dedicated network configuration page.
    source: https://docs.byteplus.com/en/docs/ModelArk/2191806
    verified_on: 2026-08-09
    verified_by: "@notacryptodad"
  certifications:
    status: documented
    value: [ISO 9001, ISO 20000, ISO 22301, ISO 27001, ISO 27017, ISO 27018, ISO 27701, SOC 1, SOC 2, SOC 3, PCI DSS, CSA STAR, MTCS Level 3]
    notes: >
      "ISO 9001, ISO 20000, ISO 22301, ISO 27001, ISO 27017, ISO 27018, ISO 27701"
      "SOC 1, SOC 2, SOC 3"
      "PCI DSS, CSA STAR, MTCS Level 3"
      Also: Singapore DPTM, APEC CBPR/PRP. GDPR and Singapore PDPA compliance noted.
      Source is the BytePlus Trust Center (NOT JS-rendered — full page loads over HTTP).
      NOTE: these are platform-level certs, not agent-service-specific. Whether Managed
      Agents inherits all of them or only a subset is not stated.
    source: https://www.byteplus.com/en/trust-center
    verified_on: 2026-08-09
    verified_by: "@notacryptodad"
  training_data_policy:
    status: documented
    notes: >
      "BytePlus ModelArk Data Processing" document referenced in the region availability
      page as a related document. The overview page states sessions are isolated and
      events are persisted per-session — no cross-customer data sharing described.
      A dedicated data processing policy exists but was not fetched this pass. The trust
      center (separately verified) documents GDPR compliance, suggesting a no-training
      commitment exists in the DPA. (Paraphrase — exact policy wording needs the dedicated
      page.)
    source: https://docs.byteplus.com/en/docs/ModelArk/2191806
    verified_on: 2026-08-09
    verified_by: "@notacryptodad"
