provider: byteplus
bucket: b
product: BytePlus AgentKit
aliases: [AgentKit, ModelArk Managed Agents, ModelArk]
notes: >
  Refreshed 2026-11-22 against the current BytePlus AgentKit product page and the
  current ModelArk Managed Agents documentation. AgentKit is the current enterprise
  agent-platform product page and explicitly offers beta testing; ModelArk Managed
  Agents is the documented hosted agent runtime underneath the ModelArk documentation
  surface. Do not treat the beta label on AgentKit as proof that every ModelArk feature
  is beta, and do not infer GA where the documentation gives no stage.
  The docs pages are JavaScript-rendered. The cells below were read in headless Chrome;
  plain HTTP fetches return the navigation shell, so check_quotes.py provides the weaker
  UNVERIFIABLE guarantee documented here. All dates below are the current verification
  date, not a claim that the underlying pages were published on that date.

capabilities:
  launch_stage_investigation:
    status: preview
    notes: >
      The current BytePlus AgentKit product page presents an Apply for beta test call to
      action. The ModelArk Managed Agents overview itself does not state GA, preview, or
      beta, so this stage applies to AgentKit's product landing page and must not be
      generalized to every Managed Agents capability. (Paraphrase.)
    source: https://www.byteplus.com/en/product/agentkit
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  managed_agent_runtime:
    product: ModelArk Managed Agents
    status: documented
    notes: >
      The current overview describes ModelArk Managed Agents as a prebuilt, configurable
      framework running on ModelArk-managed infrastructure. It is positioned for
      long-running, stateful asynchronous work with multi-turn tool calls, and the
      platform supplies the agent-layer infrastructure rather than only model inference.
      No launch stage is stated on this documentation page. (Paraphrase.)
    source: https://docs.byteplus.com/en/docs/modelark/overview?redirect=1
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  managed_agent_loop:
    product: ModelArk Managed Agents
    status: documented
    notes: >
      The overview contrasts Managed Agents with the model API: the hosted service
      handles the AgentLoop, event streaming, sandbox scheduling, context compression,
      checkpoint resume, and runtime isolation, while the developer defines agent
      behavior and subscribes to results. It exposes a four-step path of creating an
      agent, creating an environment, starting a session, and sending messages.
      (Paraphrase.)
    source: https://docs.byteplus.com/en/docs/modelark/overview?redirect=1
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  session_management:
    product: ModelArk Managed Agents
    status: documented
    notes: >
      Agent, environment, session, and event are separate documented objects. Agents
      are versioned and reusable; environments define network, packages, variables, and
      storage; sessions isolate context, files, and state and can run in parallel; and
      events are persisted for streaming and replay. (Paraphrase.)
    source: https://docs.byteplus.com/en/docs/modelark/overview?redirect=1
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  long_running_agents:
    product: ModelArk Managed Agents
    status: documented
    notes: >
      BytePlus currently positions Managed Agents for tasks lasting minutes to hours,
      with multiple tool calls, asynchronous execution, persistent filesystem and
      execution state, and checkpoint resume. The client can follow the event stream
      instead of holding an always-on request. (Paraphrase.)
    source: https://docs.byteplus.com/en/docs/modelark/overview?redirect=1
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  multi_tenancy:
    status: documented
    notes: >
      AgentKit's current product page states that its serverless foundation provides
      strict resource and data isolation between tenants. The page does not define the
      tenant model or quotas in enough detail to compare it with a specific cloud IAM
      tenancy design. (Paraphrase.)
    source: https://www.byteplus.com/en/product/agentkit
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  framework_agnosticism:
    status: documented
    notes: >
      AgentKit's product page says it works with all mainstream frameworks and uses open
      protocols and modular design so agents can connect to existing systems. The page
      does not enumerate supported rival SDKs, so no stronger compatibility claim is
      recorded. (Paraphrase.)
    source: https://www.byteplus.com/en/product/agentkit
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  multi_agent_patterns:
    product: ModelArk Managed Agents
    status: documented
    value: [coordinator, multiagent_20261001]
    notes: >
      The current Multi Agent documentation lists coordinator and multiagent_20261001
      configurations. The latter supports predefined agents, self agents, and inline
      agents, with continuous collaboration and up to three subagent levels. Coordinator
      uses one-time delegated threads and supports one subagent level. (Paraphrase.)
    source: https://docs.byteplus.com/en/docs/modelark/multi-agent
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  tool_calling:
    product: ModelArk Managed Agents
    status: documented
    notes: >
      The current tools documentation covers a base toolset, MCP tools, and custom tools.
      Custom tools use a name, description, and JSON Schema input and return through
      application callbacks; the base toolset can run several tools in one turn and
      supports paired tool-use and result events. (Paraphrase.)
    source: https://docs.byteplus.com/en/docs/modelark/tools
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  mcp_server_hosting:
    status: unknown
    notes: >
      Current documentation confirms that Managed Agents can consume MCP tools and the
      AgentKit page describes an MCP-compliant gateway, but the reviewed first-party
      pages do not clearly state that BytePlus hosts customer MCP servers. MCP
      consumption is not recorded as managed server hosting. (Paraphrase.)
    source: https://docs.byteplus.com/en/docs/modelark/tools
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  agent_skills:
    product: ModelArk Managed Agents
    status: documented
    notes: >
      Skills are versioned reusable capability packs attached to an agent separately
      from its system prompt. The current documentation describes custom skill upload and
      mounting, including a zip package containing SKILL.md, and the AgentKit page also
      lists dynamic loading of models, tools, and skills within a session. (Paraphrase.)
    source: https://docs.byteplus.com/en/docs/modelark/skills
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  code_interpreter:
    product: ModelArk Managed Agents
    status: documented
    notes: >
      The current Managed Agents overview says each session includes a sandbox for code
      execution, file read and write, and Bash commands, with resource release when the
      task ends. It also describes sandbox state persistence for long-running work.
      (Paraphrase.)
    source: https://docs.byteplus.com/en/docs/modelark/overview?redirect=1
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  browser_use:
    status: unknown
    notes: >
      The reviewed current Managed Agents and AgentKit pages do not establish a managed
      browser or computer-use capability. Web Fetch and Web Search are not treated as a
      browser agent. (Paraphrase.)
    source: https://docs.byteplus.com/en/docs/modelark/tools
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  web_search_tool:
    product: ModelArk Managed Agents
    status: documented
    notes: >
      The current base toolset lists Web Search and Web Fetch as built-in tools. This
      records the tool surface only and does not claim browser automation. (Paraphrase.)
    source: https://docs.byteplus.com/en/docs/modelark/tools
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  long_term_memory:
    product: Persistent memory
    status: documented
    notes: >
      The current Persistent memory page documents memory stores that persist reusable
      information across sessions. Stores can be mounted when a session is created and
      are read-only to the running agent; the management API supports creating, reading,
      updating, and deleting memories. (Paraphrase.)
    source: https://docs.byteplus.com/en/docs/modelark/persistent-memory
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  memory_namespacing:
    status: documented
    notes: >
      Memory stores provide separate paths and can be split by user, team, or project
      purpose, with up to ten stores mounted on one session. The reviewed page does not
      state automatic end-user identity binding, TTL, or export semantics. (Paraphrase.)
    source: https://docs.byteplus.com/en/docs/modelark/persistent-memory
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  checkpoint_resume:
    product: ModelArk Managed Agents
    status: documented
    notes: >
      The current overview names checkpoint resume as a managed capability for long-running
      tasks and describes automatic saving of sandbox state. (Paraphrase.)
    source: https://docs.byteplus.com/en/docs/modelark/overview?redirect=1
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  agent_workload_identity:
    product: ModelArk Managed Agents
    status: documented
    notes: >
      The current overview describes BytePlus IAM and zero-trust credential isolation,
      with keys kept out of sandbox processes. AgentKit separately advertises unified user
      and agent identities and secretless least-privilege IAM. (Paraphrase.)
    source: https://docs.byteplus.com/en/docs/modelark/overview?redirect=1
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  delegated_user_auth:
    status: unknown
    notes: >
      The reviewed current pages establish IAM and credential isolation, but do not
      establish delegated end-user OAuth, token vault, or on-behalf-of flows. (Paraphrase.)
    source: https://www.byteplus.com/en/product/agentkit
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  tool_least_privilege:
    product: ModelArk Managed Agents
    status: documented
    notes: >
      The current tool permission documentation supports explicit enabled states and
      permission policies including automatic execution and confirmation-required calls.
      It also describes disabling the base toolset and enabling only required tools, which
      is the documented least-privilege pattern. (Paraphrase.)
    source: https://docs.byteplus.com/en/docs/modelark/tool-permission-policy
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  guardrails:
    product: BytePlus AgentKit
    status: documented
    notes: >
      AgentKit's current product page advertises content guardrails that detect and block
      risky user input and model output, with support for custom policies. This is a
      product-page claim; the reviewed page does not provide detailed detector coverage.
      (Paraphrase.)
    source: https://www.byteplus.com/en/product/agentkit
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  tool_audit_trail:
    product: BytePlus AgentKit
    status: documented
    notes: >
      AgentKit's current page advertises end-to-end observability, runtime tracing, and
      usage and performance analytics. It also describes governable and auditable
      workflows. The reviewed page does not specify every audit event or retention period.
      (Paraphrase.)
    source: https://www.byteplus.com/en/product/agentkit
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  otel_traces:
    status: unknown
    notes: >
      AgentKit advertises runtime tracing, but the reviewed first-party page does not say
      OpenTelemetry or GenAI semantic conventions. Vendor-neutral OTel support is therefore
      left unknown. (Paraphrase.)
    source: https://www.byteplus.com/en/product/agentkit
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  cost_attribution:
    product: ModelArk Managed Agents
    status: documented
    notes: >
      The current overview says Managed Agents billing is the sum of consumed tokens,
      agent runtime duration, and tool calls. AgentKit also advertises usage analytics;
      per-tenant and per-session attribution is not specified on the reviewed pages.
      (Paraphrase.)
    source: https://docs.byteplus.com/en/docs/modelark/overview?redirect=1
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  pricing_axes:
    product: ModelArk Managed Agents
    status: documented
    notes: >
      The current overview identifies three consumption components for Managed Agents:
      model tokens, agent runtime duration, and tool-call count. It does not state a
      separate memory charge on the reviewed page. (Paraphrase.)
    source: https://docs.byteplus.com/en/docs/modelark/overview?redirect=1
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  separately_billed_primitives:
    product: ModelArk Managed Agents
    status: documented
    notes: >
      The current documentation explicitly separates token, runtime-duration, and
      tool-call consumption in the Managed Agents bill. Exact rates are on the linked
      regional pricing documentation and are not reproduced here. (Paraphrase.)
    source: https://docs.byteplus.com/en/docs/modelark/model-pricing
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  runtime_sla:
    status: unknown
    notes: >
      No current Managed Agents runtime SLA statement was found on the reviewed product,
      overview, region, or pricing pages. This is not treated as evidence that no SLA
      exists elsewhere. (Paraphrase.)
    source: https://docs.byteplus.com/en/docs/modelark/overview?redirect=1
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  eval_service:
    product: BytePlus AgentKit
    status: documented
    notes: >
      The current AgentKit page advertises built-in best-practice evaluators for online
      and offline assessment and continuous improvement. Dataset, judge, and CI details
      are not stated on the reviewed landing page. (Paraphrase.)
    source: https://www.byteplus.com/en/product/agentkit
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  versioning_rollout:
    product: ModelArk Managed Agents
    status: documented
    notes: >
      The current agent documentation describes agents as versioned resources and requires
      the current version when updating them. The reviewed pages do not establish canary
      deployment or rollback controls, so only versioning is recorded. (Paraphrase.)
    source: https://docs.byteplus.com/en/docs/modelark/define-agent
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  private_networking:
    status: unknown
    notes: >
      The reviewed current AgentKit and Managed Agents pages do not provide enough detail
      to confirm a private-networking implementation for the managed runtime. (Paraphrase.)
    source: https://www.byteplus.com/en/product/agentkit
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  runtime_regions:
    status: documented
    value: ["Johor (ap-southeast-1)", "Dublin (eu-west-1)"]
    notes: >
      The current ModelArk region documentation lists Johor in Asia Pacific and Dublin in
      Europe for the relevant ModelArk service surface. Region-specific endpoints and
      regional resource isolation remain important deployment constraints. (Paraphrase.)
    source: https://docs.byteplus.com/en/docs/modelark/region-availability
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  training_data_policy:
    status: unknown
    notes: >
      The reviewed current ModelArk and AgentKit pages do not establish a complete
      customer-content training, retention, and abuse-monitoring policy. (Paraphrase.)
    source: https://docs.byteplus.com/en/docs/modelark/overview?redirect=1
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  certifications:
    status: unknown
    notes: >
      No current AgentKit or Managed Agents certification scope was established in this
      refresh. Platform-level trust-center claims are not attributed to this runtime
      without an explicit service mapping. (Paraphrase.)
    source: https://www.byteplus.com/en/trust-center
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"
