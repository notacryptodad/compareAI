provider: aws
bucket: c
product: Amazon Q Business
aliases: [Q Business, Amazon Q Business]
notes: >
  Amazon Q Business is no longer open to new customers. AWS says it will continue bug
  fixes and security updates for existing customers, but new feature requests will not
  be considered. AWS recommends Amazon Quick for new generative or agentic AI solutions
  and documents a phased migration path, including Bring Your Own Index. All capability
  rows below describe the existing Q Business product and must not be read as a new-
  customer availability claim. (Paraphrase.)

capabilities:
  packaged_assistant:
    status: none
    product: Amazon Q Business
    notes: >
      The current availability notice explicitly says Amazon Q Business is no longer
      open to new customers. The assistant capability remains documented for existing
      customers, but the product is not a new-customer purchasing option. (Paraphrase.)
    source: https://docs.aws.amazon.com/amazonq/latest/qbusiness-ug/qbusiness-availability-change.html
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  permission_aware_retrieval:
    status: documented
    notes: >
      Q Business provides permissions-aware answers with citations and bases responses on
      content the end user can access. AWS documents IAM Identity Center and IAM for
      managing end-user access. Anonymous applications are a separate documented option
      for public-facing use. (Paraphrase.)
    source: https://docs.aws.amazon.com/amazonq/latest/qbusiness-ug/what-is.html
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  prebuilt_connectors:
    status: documented
    notes: >
      Q Business documents out-of-the-box data-source connections and names Amazon S3,
      Microsoft SharePoint, and Salesforce, with Amazon Kendra available as a retriever.
      The connector guide also documents scheduled sync configuration through the API.
      (Paraphrase.)
    source: https://docs.aws.amazon.com/amazonq/latest/qbusiness-ug/what-is.html
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  guardrails:
    status: documented
    notes: >
      Q Business is built on Amazon Bedrock and can use Bedrock safety and security
      controls. Its documentation also describes response-scope controls and
      hallucination mitigation for supported chat responses. (Paraphrase.)
    source: https://docs.aws.amazon.com/amazonq/latest/qbusiness-ug/what-is.html
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  seat_pricing:
    status: documented
    notes: >
      Q Business charges for user subscriptions and index capacity separately. The
      current tiers page documents Lite and Pro subscriptions plus starter and enterprise
      index types. The availability notice means these are existing-customer terms, not
      a new-customer availability claim. (Paraphrase.)
    source: https://docs.aws.amazon.com/amazonq/latest/qbusiness-ug/tiers.html
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  invoke_custom_agents:
    status: documented
    notes: >
      Q Business supports task-automation applications and routine actions such as time-
      off requests and meeting invitations. The current page does not establish a bridge
      to an AgentCore-hosted custom agent, so no such bridge is asserted. (Paraphrase.)
    source: https://docs.aws.amazon.com/amazonq/latest/qbusiness-ug/what-is.html
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  model_choosable:
    status: unknown
    notes: >
      The current Q Business overview describes a Bedrock-powered assistant but does not
      document an administrator or end-user model-selection control. Preserve unknown
      rather than infer a fixed or selectable model. (Paraphrase.)
    source: https://docs.aws.amazon.com/amazonq/latest/qbusiness-ug/what-is.html
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  index_residency:
    status: documented
    value: [us-east-1, us-west-2, eu-west-1, ap-southeast-2]
    notes: >
      The current supported-regions page lists four Q Business service Regions. It also
      warns that Pro subscriptions in Ireland and Sydney have a limited feature set.
      (Paraphrase.)
    source: https://docs.aws.amazon.com/amazonq/latest/qbusiness-ug/quotas-regions.html
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  admin_analytics:
    status: documented
    notes: >
      Q Business has separate analytics dashboards for application usage and Q Apps. AWS
      says the dashboards are available at no additional charge in all Regions where Q
      Business is offered. (Paraphrase.)
    source: https://docs.aws.amazon.com/amazonq/latest/qbusiness-ug/analytics-dashboard.html
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  dlp_tenant_isolation:
    status: documented
    notes: >
      Q Business enforces access-aware answers based on end-user permissions and documents
      IAM Identity Center and IAM as access-management options. The reviewed official
      overview does not establish a separate PII-masking or DLP product feature, so this
      row records permission-based isolation only. (Paraphrase.)
    source: https://docs.aws.amazon.com/amazonq/latest/qbusiness-ug/what-is.html
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  license_bundling:
    status: unknown
    notes: >
      The current tiers page documents user subscriptions and index capacity, but it does
      not state whether those charges are bundled with AWS commitments or support plans.
      Preserve unknown rather than infer that no bundling exists. (Paraphrase.)
    source: https://docs.aws.amazon.com/amazonq/latest/qbusiness-ug/tiers.html
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  training_data_policy:
    status: documented
    notes: >
      AWS states that Amazon Q Business does not use customer data for service improvement
      or for improving underlying LLMs. (Paraphrase.)
    source: https://docs.aws.amazon.com/amazonq/latest/qbusiness-ug/service-improvement.html
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  index_freshness:
    status: documented
    notes: >
      Q Business data sources use configured sync run schedules through the console or
      CreateDataSource API. The reviewed connector documentation supports scheduled
      ingestion and does not document real-time streaming ingestion. (Paraphrase.)
    source: https://docs.aws.amazon.com/amazonq/latest/qbusiness-ug/supported-connectors.html
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"
