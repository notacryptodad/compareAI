provider: aws
bucket: c
product: Amazon Q Business
aliases: [Q Business, Amazon Q, Amazon Quick]
notes: >
  MOST IMPORTANT FACT ABOUT THIS PRODUCT, and it is the first line of its own docs:
  "Amazon Q Business is no longer open to new customers. For capabilities similar to
  Q Business, explore Amazon Quick."
  Anyone reading a cloud comparison to make a buying decision cannot act on Q Business at
  all — so every capability row below is historical/for-existing-customers context, not a
  purchasable option. Successor is "Amazon Quick"; that product is NOT yet researched here.
  This is exactly the kind of fact a stale comparison table would get catastrophically
  wrong, and it is why the 90/180-day staleness rules exist.

capabilities:
  packaged_assistant:
    status: none
    product: Amazon Q Business
    notes: >
      Recorded `none` for PURCHASABILITY, on a positive vendor statement (the rule for
      `none`): "Amazon Q Business is no longer open to new customers."
      The capability itself is real and documented for existing customers:
      "Amazon Q Business is a fully managed, generative-AI powered assistant that you can
      configure to answer questions, provide summaries, generate content, and complete
      tasks based on your enterprise data."
    source: https://docs.aws.amazon.com/amazonq/latest/qbusiness-ug/what-is.html
    verified_on: 2026-08-04
    verified_by: "@notacryptodad"

  permission_aware_retrieval:
    status: documented
    notes: >
      Strong on paper — this is the row that separates a real enterprise assistant from a
      chatbot, and Q Business leads with it:
      "It allows end users to receive immediate, permissions-aware responses from
      enterprise data sources with citations".
      "Its responses to questions are based on the content that your end user has
      permissions to access. You can use AWS IAM Identity Center or AWS Identity and
      Access Management to manage end user access".
      Caveat: an explicit opt-out exists — "anonymous applications" that "don't require
      user authentication", for public-facing use.
    source: https://docs.aws.amazon.com/amazonq/latest/qbusiness-ug/what-is.html
    verified_on: 2026-08-04
    verified_by: "@notacryptodad"

  prebuilt_connectors:
    status: documented
    notes: >
      "out-of-the-box connections to multiple supported data sources" — the docs page does
      NOT state a connector count; named examples are Amazon S3, SharePoint and Salesforce,
      with Amazon Kendra usable as a retriever.
      Third-party actions via plugins. Integrations and browser extensions surface it in
      Slack, Microsoft Teams and Microsoft Office, and it can be embedded in your own apps.
      Data accessors let verified ISVs retrieve from your index. (Paraphrase.)
    source: https://docs.aws.amazon.com/amazonq/latest/qbusiness-ug/what-is.html
    verified_on: 2026-08-04
    verified_by: "@notacryptodad"

  guardrails:
    status: documented
    notes: >
      Built on Bedrock, so it inherits those controls: "Because Amazon Q Business is built
      on Amazon Bedrock, users can take full advantage of the controls implemented in
      Amazon Bedrock to enforce safety, security, and the responsible use of artificial
      intelligence (AI)." AWS also "implements automated abuse detection".
      Grounding control: you "control whether the responses should only use your enterprise
      data, or use both enterprise data and model knowledge".
      Hallucination mitigation "checks supported chat responses for inconsistencies and
      automatically corrects them in real-time during conversations."
    source: https://docs.aws.amazon.com/amazonq/latest/qbusiness-ug/what-is.html
    verified_on: 2026-08-04
    verified_by: "@notacryptodad"

  seat_pricing:
    status: documented
    notes: >
      TWO-AXIS BILLING, which is unusual for a packaged assistant and easy to miss when
      budgeting: "Amazon Q Business charges you both for user subscriptions to
      applications, and for index capacity."
      Per-seat alone is therefore NOT the whole cost — index capacity is metered separately.
      Tier detail is on a separate subscription-and-index pricing page (not fetched).
    source: https://docs.aws.amazon.com/amazonq/latest/qbusiness-ug/what-is.html
    verified_on: 2026-08-04
    verified_by: "@notacryptodad"

  invoke_custom_agents:
    status: documented
    notes: >
      "You can use Amazon Q Business to create and share task automation applications, or
      perform routine actions like submitting time-off requests and sending meeting
      invites." Third-party actions go through plugins.
      Whether it can invoke an AgentCore-hosted agent is NOT stated — do not assume the
      B->C bridge that Azure documents explicitly.
    source: https://docs.aws.amazon.com/amazonq/latest/qbusiness-ug/what-is.html
    verified_on: 2026-08-04
    verified_by: "@notacryptodad"

  model_choosable:
    status: none
    notes: >
      Built on Bedrock, but no user-selectable model option is documented. The product is
      described as powered by an LLM but no admin or end-user control over model choice is
      stated. Fixed and opaque by evidence of absence — confirmed on re-read 2026-08-09.
    source: https://docs.aws.amazon.com/amazonq/latest/qbusiness-ug/what-is.html
    verified_on: 2026-08-09
    verified_by: "@notacryptodad"

  index_residency:
    status: documented
    value: [us-east-1, us-west-2, eu-west-1, ap-southeast-2]
    notes: >
      Index data resides in the AWS region where the application is deployed. Four regions:
      US East (N. Virginia), US West (Oregon), Europe (Ireland), Asia Pacific (Sydney).
      No cross-region replication by default. Production workloads run across 3 AZs.
    source: https://docs.aws.amazon.com/amazonq/latest/qbusiness-ug/quotas-regions.html
    verified_on: 2026-08-09
    verified_by: "@notacryptodad"
  admin_analytics:
    status: unknown
    notes: >
      Analytics/metrics pages exist (insights-dashboard, metrics) but returned no body
      content — may require auth or JS rendering. CloudTrail logging confirmed for audit.
      Cannot verify feature depth without a reachable fetch.
    source: null
    verified_on: null
  dlp_tenant_isolation:
    status: documented
    notes: >
      "Amazon Q Business supports access control for your data so that the right users can
      access the right content. Its responses to questions are based on the content that
      your end user has permissions to access."
      "You can use AWS IAM Identity Center or AWS Identity and Access Management to manage
      end user access for Amazon Q Business."
      Tenant isolation via IAM Identity Center; permission-aware responses. Guardrails page
      shows blocked phrases, hallucination mitigation, response scope controls. No dedicated
      DLP feature (PII detection/masking) found — security through IAM and shared
      responsibility model.
    source: https://docs.aws.amazon.com/amazonq/latest/qbusiness-ug/what-is.html
    verified_on: 2026-08-09
    verified_by: "@notacryptodad"
  license_bundling:
    status: none
    notes: >
      Q Business is sold as standalone per-user subscription (Lite and Pro tiers) plus index
      capacity. No bundling with AWS commitments (Enterprise Support, Savings Plans, etc.)
      documented. (Paraphrase of tiers page.)
    source: https://docs.aws.amazon.com/amazonq/latest/qbusiness-ug/tiers.html
    verified_on: 2026-08-09
    verified_by: "@notacryptodad"
  training_data_policy:
    status: documented
    notes: >
      "Amazon Q Business does not use customer data for service improvement or for improving
      underlying LLMs."
      Explicit no-training commitment. No opt-out needed — off by default.
      CONTRAST with AgentCore's "may use and store your content to improve your service
      experience" — the two AWS products take opposite positions on this.
    source: https://docs.aws.amazon.com/amazonq/latest/qbusiness-ug/service-improvement.html
    verified_on: 2026-08-09
    verified_by: "@notacryptodad"
  index_freshness:
    status: documented
    notes: >
      Batch/scheduled sync, not real-time. Admins configure sync run schedules via the
      CreateDataSource API or console. No real-time streaming ingestion documented.
      Index charges include "100 hours of data source connector usage (time that it takes to
      scan and index new, updated, or deleted documents)". (Paraphrase.)
    source: https://docs.aws.amazon.com/amazonq/latest/qbusiness-ug/supported-connectors.html
    verified_on: 2026-08-09
    verified_by: "@notacryptodad"
