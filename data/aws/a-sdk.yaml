provider: aws
bucket: a
product: Strands Agents
aliases: [Strands, strands-agents, Strands SDK, Strands harness]
repo: https://github.com/strands-agents/harness-sdk
notes: >
  The repository now contains the Strands harness, Python and TypeScript SDKs, CLI,
  MCP server, vended tools, and evaluation package. The harness is a separate,
  batteries-included agent while the SDKs expose the agent loop and providers.

capabilities:
  sdk_languages:
    status: documented
    value: [python, typescript]
    notes: >
      The current monorepo contains strands-py and strands-ts. The Python SDK requires
      Python 3.10+ and the TypeScript SDK targets Node.js 22+ ESM projects.
      (Paraphrase.)
    source: https://github.com/strands-agents/harness-sdk
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  authoring_mode:
    status: documented
    value: code-first
    notes: >
      The SDK describes a model-driven approach to building agents in code, while the
      harness exposes create_harness/createHarness entry points.
      (Paraphrase.)
    source: https://github.com/strands-agents/harness-sdk
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  multi_agent_patterns:
    status: documented
    notes: >
      The current README lists built-in multi-agent patterns alongside MCP, streaming,
      and structured output. It does not define a fixed named pattern taxonomy on the
      repository page, so no narrower list is asserted here. (Paraphrase.)
    source: https://github.com/strands-agents/harness-sdk
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  local_dev_loop:
    status: documented
    product: strands-cli
    notes: >
      The monorepo includes a strands CLI for prototyping and chatting with a harness
      agent from the terminal. The SDK itself runs in the user's process and has no
      hosted control plane. (Paraphrase.)
    source: https://github.com/strands-agents/harness-sdk
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  mcp_client:
    status: documented
    notes: >
      The Python SDK README documents MCPClient and the monorepo contains strands-mcp.
      MCP support is also listed as a built-in SDK capability. (Paraphrase.)
    source: https://github.com/strands-agents/harness-sdk
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  bundled_tools:
    status: documented
    product: strands-agents-tools
    notes: >
      The current repository documents vended tools for shell, file editing, HTTP
      requests, web fetching, notebooks, Python REPL, sleep, handoff, subagents,
      swarms, and MCP routing. (Paraphrase.)
    source: https://github.com/strands-agents/harness-sdk
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  cross_cloud_model_adapters:
    status: documented
    notes: >
      The SDK documents first-party providers for Amazon Bedrock, Anthropic, Gemini,
      OpenAI, and many other providers, including Ollama, Llama, Mistral, SageMaker,
      Writer, and custom providers. Bedrock remains the default provider, not a
      requirement. (Paraphrase.)
    source: https://github.com/strands-agents/harness-sdk
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  human_in_the_loop:
    product: HumanInTheLoop intervention + Interrupts
    status: documented
    notes: >
      The maintained documentation describes intervention handlers that can pause an
      agent before tool calls and raw interrupts that request human input before the
      agent continues. (Paraphrase.)
    source: https://strandsagents.com/docs/user-guide/sdk/interrupts/
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  policy_hooks:
    status: documented
    notes: >
      Hooks can intercept agent steps to log, validate, or redirect them. The README
      also lists guardrails and steering handlers as built-in controls. (Paraphrase.)
    source: https://github.com/strands-agents/harness-sdk
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  otel_traces:
    status: documented
    notes: >
      Strands documentation describes OpenTelemetry tracing for agent, cycle, model,
      and tool spans, with export through OTLP-compatible observability systems.
      (Paraphrase.)
    source: https://strandsagents.com/docs/user-guide/sdk/observability-evaluation/traces/
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  in_repo_eval:
    status: documented
    product: strands-agents/evals
    notes: >
      The current monorepo links to the separate evals package for evaluation support.
      (Paraphrase.)
    source: https://github.com/strands-agents/harness-sdk
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  oss_license:
    status: documented
    value: Apache-2.0
    notes: >
      The repository identifies the project license as Apache License 2.0.
      (Paraphrase.)
    source: https://github.com/strands-agents/harness-sdk
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  oss_governance:
    status: documented
    value: single-vendor
    notes: >
      The project is maintained in the strands-agents GitHub organization. No
      foundation governance model is stated on the repository page, so this remains a
      vendor-controlled project classification. (Paraphrase.)
    source: https://github.com/strands-agents/harness-sdk
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  oss_release_cadence:
    status: documented
    notes: >
      The releases page maintains independent Python and TypeScript release streams.
      This refresh does not infer a release frequency from the latest tag.
      (Paraphrase.)
    source: https://github.com/strands-agents/harness-sdk/releases
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  oss_runtime_lockin:
    status: none
    notes: >
      The current README describes the SDK as running in the user's process with no
      hosted control plane and supports models from multiple providers and clouds.
      Bedrock is the default provider, but the README documents alternatives.
      (Paraphrase.)
    source: https://github.com/strands-agents/harness-sdk
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  oss_community:
    status: documented
    notes: >
      The repository remains public and exposes GitHub community counters. Exact
      counters are intentionally not copied into this refresh because they change
      continuously and the current page was not captured as a dated snapshot.
      (Paraphrase.)
    source: https://github.com/strands-agents/harness-sdk
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  sdk_telemetry_phone_home:
    status: unknown
    notes: >
      The public README documents tracing and configurable exporters, but the current
      first-party pages reviewed here do not provide a complete, explicit statement
      that covers all SDK telemetry or definitively rules out every phone-home path.
      Preserve unknown rather than infer absence. (Paraphrase.)
    source: https://github.com/strands-agents/harness-sdk
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"
