  service_limits:
    status: documented
    notes: >
      "You can request increases for some quotas, and other quotas cannot be increased."
      FIXED (not adjustable), Runtime: request timeout 15 minutes, payload 100 MB,
      streaming 60 minutes, async jobs 8 hours on microVMs and 14 days on Instances. Image
      size is 2 GB on V1 and 10 GB on V2, environment variables 4 KB per agent, and a
      session gets at most 8 vCPU/32 GB. Memory: 6 strategies per memory resource, 100
      messages per CreateEvent, and 5 CreateEvent calls per second per actor per session.
      (Paraphrase.)
      ADJUSTABLE: 1,000 agents per account, 1,000 versions per agent, 10 endpoints per
      agent, and active sessions of 5,000 (N. Virginia, Oregon) or 2,500 elsewhere. Gateway
      allows 100 targets per gateway and 1,000 tools per target. (Paraphrase.)
      Unlike a terminal revision cap, the version limit is adjustable. Versions are also
      created automatically on every update, so busy pipelines should watch the count.
      (Paraphrase.) The page lists a 365-day maximum for EventExpirationDuration, while the
      2026-11-17 What's New raised short-term retention to 10 years. (Paraphrase.)
      "AgentCore harness is a logical resource." Harness inherits all Runtime quotas.
      (Paraphrase of the last sentence.)
    source: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/bedrock-agentcore-limits.html
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  launch_stage_investigation:
    product: Amazon Bedrock AgentCore
    status: ga
    notes: >
      HEADLINE STAGE: "Amazon Bedrock AgentCore is now generally available" — 2025-10-13 (a
      different page, https://aws.amazon.com/about-aws/whats-new/2025/10/amazon-bedrock-agentcore-available/).
      Convention (2026-11-23 fact-check): this meta-row carries the headline product's stated stage, the same rule as byteplus/b-platform, alibaba/b-platform and aws/d-devtools.
      WHERE AWS STATES STAGE: mostly in the What's New feed and the AgentCore release notes
      (cited), rather than service pages. The release notes carry lines like "Recommendations
      is now Generally Available" and "Failure Insights is now in Public Preview". The full
      timeline is in this file's header. One docs page does state it: the harness page
      (a different page;
      https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/harness.html) says
      "AgentCore harness is available in GA across all regions shown here". The filesystem
      page labels session storage as Preview. (Paraphrase of the last sentence.)
      STALE STAGE ON THE FAQ (another different page;
      https://aws.amazon.com/bedrock/agentcore/faqs/): it still says "The managed harness
      (preview) in AgentCore" five months after harness GA. It also says "AgentCore is
      available in fifteen AWS Regions" while the region table shows 24 columns.
      BEDROCK SIBLINGS: the pages for Chat Completions, Responses, prompt routing, Custom
      Model Import, fine-tuning, distillation, structured KBs and Flows state no stage.
      The prompt-caching table labels models per row as Generally Available or Gated.
      Bedrock Managed Agents, powered by OpenAI, is labelled public preview. Bedrock Agents
      Classic entered maintenance mode on 2026-07-30. (Paraphrase of this paragraph.)
    source: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/release-notes.html
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  pricing_axes:
    status: documented
    value:
      per_vcpu_hour: 0.0895
      per_gb_hour: 0.00945
      applies_to: [Runtime microVMs v1, Browser Tool, Code Interpreter]
      runtime_v2_per_vcpu_hour: 0.1276
      runtime_v2_per_gb_hour: 0.0169
    notes: >
      "flexible, consumption-based pricing with no upfront commitments or minimum fees."
      The pricing page now lists 14 features. There are FOUR DIFFERENT AXES across them —
      the surprise this project exists to surface, and no docs page states it:
      - per-second compute: Runtime microVMs v1, Browser and Code Interpreter at
        $0.0895/vCPU-hour plus $0.00945/GB-hour. NEW since August: Runtime v2 at $0.1276
        per vCPU-hour and $0.0169 per GB-hour (consumption), with a cheaper committed
        baseline "launching by October 2026". Runtime Instances bill the EC2 instance
        plus a management fee. "Billing is calculated per second, using actual CPU
        consumption and peak memory consumed up to that second" (v1 wording). For Browser,
        "I/O wait and idle time is free, if no other background process is running".
        Also: "128MB minimum memory billing applies for memory" and a "1-second minimum".
      - per-request: Web Search $7.00 per 1,000 queries; NEW Web Answer $10 per 1000 tool
        calls; Gateway $0.005/1k API invocations, $0.025/1k Search, $0.02 per 100 tools
        indexed monthly; Identity $0.010 per 1,000 token or API key requests (no charge
        via Runtime or Gateway); Policy $0.000025 per authorization request. Registry: a
        monthly free tier ("First 5,000 records free monthly"), then $0.400 per 1,000
        records, plus Search/List/Get API charges.
      - per-token: Policy natural-language authoring $0.13 per 1,000 tokens; Evaluations
        $0.0024/1k input and $0.012/1k output; custom evaluators $1.50 per 1,000
        evaluations; batch is cheaper.
      - pass-through: Observability "Charged as per Amazon CloudWatch pricing"; Bedrock
        Managed Knowledge Base and Guardrails billed per the Bedrock pricing page; container
        storage (ECR or S3) and network transfer "at standard EC2 rates" are extra.
      Runtime managed session storage is "currently in public preview" and "Usage is not
      charged during public preview".
      Payments: wallet operations are charged at Coinbase's or Privy's published pricing,
      and the rest of the API invocations are "No charge".
    source: https://aws.amazon.com/bedrock/agentcore/pricing/
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  data_residency:
    product: AgentCore cross-region inference (Memory, Policy, Evaluations) + Bedrock CRIS
    status: documented
    notes: >
      STORAGE stays in-region; INFERENCE may not. "For AgentCore Memory, Policy in
      AgentCore (in select regions), and AgentCore Evaluations, cross-region inference
      requests are kept within the AWS Regions that are part of the geography where the
      data originally resides." "Although the data remains stored only in the primary
      region, when using cross-region inference, your input prompts and output results may
      move outside of your primary region."
      GLOBAL EXCEPTIONS: Policy requests from Hyderabad, Malaysia, Thailand, Canada (Central)
      and São Paulo (the page's prose names only the last two; its Policy table lists all
      five), and Evaluations requests from Hyderabad, Malaysia, Mumbai, Seoul, Singapore and Thailand,
      go to all commercial regions. (Paraphrase.) "Starting December 14, 2026, inference
      requests originating in South America (São Paulo) (sa-east-1) also use global
      cross-region inference" for Evaluations.
      "Data originating in AWS GovCloud (US) never leaves the partition and is never routed
      to commercial AWS Regions."
      AUDIT GAP: "Amazon CloudWatch and AWS CloudTrail logs won't specify the AWS Region in
      which data inference occurs." Bedrock model calls differ: there, "CloudTrail logs all
      cross-Region inference requests in your source Region." (a different page;
      https://docs.aws.amazon.com/bedrock/latest/userguide/cross-region-inference.html).
      Abuse-detection copies follow the inference: "To the extent we store data for abuse
      detection, your input prompts and output results will be stored in the destination
      region." (another different page;
      https://docs.aws.amazon.com/bedrock/latest/userguide/geographic-cross-region-inference.html).
      OPT-OUT: for Memory, use a built-in-with-overrides strategy; for Evaluations, use
      custom evaluators. (Paraphrase.)
    source: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/cross-region-inference.html
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  training_data_policy:
    product: Amazon Bedrock (model inference); AgentCore has no service-wide statement
    status: documented
    notes: >
      STATUS CHANGE 2026-11-23: unknown -> documented, scored on the sibling family that
      runs the model calls. Bedrock FAQ (cited): "No, AWS and the third-party model
      providers will not use any inputs to or outputs from Amazon Bedrock to train Amazon
      Nova, Amazon Titan, or any third-party models." "With Amazon Bedrock, your content is
      not used to improve the base models and is not shared with any model providers."
      RETENTION (a different page;
      https://docs.aws.amazon.com/bedrock/latest/userguide/data-retention.html): "Amazon
      Bedrock gives you explicit control over whether the prompts and outputs from your
      inference requests are retained." Mode none means "Zero data retention." Mode default
      follows each model's policy. (Paraphrase of the last sentence.)
      ABUSE MONITORING (another different page;
      https://docs.aws.amazon.com/bedrock/latest/userguide/abuse-detection.html): "For
      Anthropic Claude Fable 5, Claude Fable 5.1, and Claude Fable 5.2, Amazon Bedrock
      retains all traffic for up to 30 days for automated offline abuse detection." For
      most OpenAI models, "classifier-flagged traffic will be retained for up to 30 days for
      automated offline abuse detection." "Retained inputs and outputs are stored and
      processed by AWS and are not shared with third-party model providers."
      AGENTCORE CAVEAT: in August the AgentCore overview said AgentCore may use and store
      your content to improve your service experience, for your use only. That sentence is
      gone, and no replacement was located. The AgentCore data-protection page (another
      different page;
      https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/data-protection.html)
      only says "Customer content is not used to provide and maintain the AgentCore Gateway
      service." An earlier pass reported a CloudWatch docs line that AgentCore is outside
      the AI services opt-out policy; it was not re-located on 2026-11-23. (Paraphrase of
      this paragraph except the quote.) So model inference is covered, while AgentCore's
      own handling of stored memory and traces is unstated. (Paraphrase.)
    source: https://aws.amazon.com/bedrock/faqs/
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  separately_billed_primitives:
    status: documented
    notes: >
      CONFIRMED, and it is the classic agent-platform cost surprise: Gateway, Memory,
      Identity, Policy, Registry, Evaluations, Web Search, Web Answer and the sandbox tools
      each meter independently, on top of Runtime compute — one agent turn can bill on 5+
      lines. Memory alone has several axes. CHANGED since August: short-term memory moved
      from $0.25 per 1,000 events to consumption pricing. It is now $1.00 per GB ingested,
      $0.20 per GB retrieved and $0.10 per GB-month stored. Long-term storage is still $0.75
      built-in or $0.25 self-managed per 1,000 records/month, and retrieval $0.50 per 1,000.
      Harness no longer appears on the pricing page. The August quote calling it free of
      extra charge is gone from this page. The harness docs page (a different page;
      https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/harness.html) says
      "There is no separate harness charge."
    source: https://aws.amazon.com/bedrock/agentcore/pricing/
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  free_tier_commitments:
    product: AgentCore pricing (+ Bedrock Provisioned Throughput, AWS Marketplace)
    status: documented
    notes: >
      FREE TIER: account-level credits only, plus two service-specific free tiers. "New
      AWS customers receive up to $200 in Free Tier credits." "Registry comes with a Free
      Tier, where every month your first 5,000 records, first 1,000,000 Search API calls,
      and first 2,000,000 combined Get and List API calls are free of charge." Web Search
      gives 5,000 free queries a month (see web_search_tool). (Paraphrase of the last
      sentence.)
      COMMITMENTS: the default is "flexible, consumption-based pricing with no upfront
      commitments or minimum fees." Runtime v2 lists a cheaper "committed baseline,
      launching by October 2026"; the page still says this as of 2026-11-23. On Runtime
      Instances, "Your EC2 Savings Plans, Reserved Instances, and On-Demand Capacity
      Reservations apply to the compute — not to the management fee." Bedrock Provisioned
      Throughput offers 1-month and 6-month terms (a different page;
      https://docs.aws.amazon.com/bedrock/latest/userguide/prov-throughput.html): "The
      longer the commitment duration, the more discounted the hourly price becomes."
      MARKETPLACE: Gateway has an AWS Marketplace connector, and "Customers can now also
      procure and deploy A2A servers on AgentCore Runtime through AWS Marketplace" (another
      different page;
      https://aws.amazon.com/about-aws/whats-new/2025/11/marketplace-a2a-server-bedrock-agentcore-runtime/).
    source: https://aws.amazon.com/bedrock/agentcore/pricing/
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  runtime_sla:
    status: documented
    value: 99.9%
    notes: >
      AgentCore inherits the Amazon Bedrock SLA. Per the FAQs page:
      "The SLA for Amazon Bedrock applies to AgentCore." The Bedrock SLA commits to 99.9%
      monthly uptime, with credits 10% (99.0–99.9%), 25% (95.0–99.0%), 100% (<95.0%).
      Availability measured per 5-minute interval on API requests; only HTTP 500s count as
      errors (throttling/4xx excluded). Claim requires AWS Support case within 2 billing
      cycles. The public SLA makes no latency commitment. (Paraphrase.)
      (The numeric terms come from the Bedrock SLA page, a DIFFERENT source,
      https://aws.amazon.com/bedrock/sla/; that page is
      "Last Updated: October 4, 2023" and was re-read 2026-11-23. The 99.9%, 10/25/100%,
      5-minute interval and second-billing-cycle terms were confirmed.)
    source: https://aws.amazon.com/bedrock/agentcore/faqs/
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  long_running_agents:
    status: documented
    notes: >
      "AgentCore Runtime supports both real-time interactions and long-running workloads,
      enabling complex agent reasoning and asynchronous workloads that might involve
      multi-agent collaboration or extended problem-solving sessions. Sessions run for up to
      8 hours on microVMs, or up to 14 days on Instances."
      CHANGED since August: the max is now split by compute type, 8 hours on microVMs and
      14 days on Instances. "Instances support persistent, multi-day sessions,
      GPU-accelerated workloads". There is a dedicated page for asynchronous and
      long-running agents.
      AWS's What's New post of 2026-08-06 announced Runtime Instances as generally
      available, with sessions of up to 14 days. The microVM runtime is for sessions of up
      to 8 hours. (Paraphrase.)
    source: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/agents-tools-runtime.html
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  knowledge_base:
    product: Amazon Bedrock Managed Knowledge Base (AgentCore Gateway connector)
    status: ga
    notes: >
      STATUS CHANGE 2026-11-23: none -> GA. AWS now offers managed RAG wired into
      AgentCore. From the cited page: "Amazon Bedrock AgentCore exposes a managed knowledge
      base as a native Gateway connector — you attach it to your AgentCore Gateway and your
      agents discover and query it with standard Model Context Protocol (MCP) calls". It has
      two tools, AgenticRetrieveStream (multi-step agentic retrieval with a cited answer)
      and Retrieve (single hybrid search).
      LAUNCH STAGE from the AgentCore release notes (a DIFFERENT source; July 2026
      section; https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/release-notes.html): "Amazon Bedrock Managed Knowledge Base is now Generally Available". The
      notes name six native connectors (S3, SharePoint, Confluence, Google Drive, OneDrive,
      Web Crawler), hybrid search and reranking.
      CAVEAT: the knowledge base itself is an Amazon Bedrock resource billed on Bedrock
      pricing. It is NOT one of the 13 services on the AgentCore overview page; AgentCore
      exposes it through Gateway. The August `none` was correct for the August lineup.
    source: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/gateway-target-connector-managed-kb.html
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  text_to_sql:
    product: Amazon Bedrock Knowledge Bases (structured data stores)
    status: documented
    notes: >
      "Amazon Bedrock Knowledge Bases allows you to connect to structured data stores, which
      contain data that conforms to a predefined schema." Queries run through Retrieve or
      RetrieveAndGenerate. A standalone GenerateQuery call "converts natural language
      queries into SQL queries that are appropriate to the data source being queried."
      ENGINE: "Amazon Bedrock Knowledge Bases uses Amazon Redshift as the query engine for
      querying your data store." (a different page;
      https://docs.aws.amazon.com/bedrock/latest/userguide/knowledge-base-prereq-structured.html).
      Data can sit in Redshift or the AWS Glue Data Catalog. (Paraphrase.)
      LIMIT: for GenerateQuery, "Queries must be written in English." (another different
      page; https://docs.aws.amazon.com/bedrock/latest/userguide/knowledge-base-generate-query.html).
      For agents: the AgentCore Managed Knowledge Base connector covers document RAG (see
      knowledge_base). To reach a structured KB, an agent calls the Bedrock API or a
      Gateway target. (Paraphrase.)
    source: https://docs.aws.amazon.com/bedrock/latest/userguide/knowledge-base-build-structured.html
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  ai_service_tools:
    product: AgentCore Gateway built-in connectors (+ Harness built-in tools)
    status: documented
    notes: >
      The built-in list is short. "Amazon Bedrock AgentCore lets you add the following
      built-in connectors as targets in your gateway: Amazon Bedrock Managed Knowledge Bases
      Web Search Tool Web Answer AWS Step Functions AWS Marketplace".
      NO prebuilt OCR, speech or translation tools. Textract, Transcribe or Translate must
      be wired in yourself as Smithy, OpenAPI or Lambda targets. (Paraphrase.) The FAQ (a
      different page; https://aws.amazon.com/bedrock/agentcore/faqs/) lists AWS services as
