provider: aws
bucket: b
product: Amazon Bedrock AgentCore
aliases: [AgentCore, Bedrock AgentCore]
notes: >
  "an agentic platform for building, deploying, and operating highly effective agents
  securely at scale using any framework and foundation model."
  13 modular services "that you can use together or independently".
  LAUNCH STAGES RESOLVED from the AWS What's New announcement feed, which the service docs
  never reference. Found via the What's New JSON search API
  (aws.amazon.com/api/dirs/items/search?item.directoryId=whats-new-v2&q=AgentCore) —
  the HTML doc pages state no stage at all, so three earlier research passes recorded
  everything as stage-unknown. Per-service timeline:
    2025-07-16  AgentCore enters PREVIEW
    2025-10-13  AgentCore base is GENERALLY AVAILABLE
    2025-12-02  Policy + Evaluations announced as preview
    2026-03-03  Policy reaches GA
    2026-03-31  Evaluations reaches GA
    2026-04-09  AWS Agent Registry announced in PREVIEW
    2026-04-30  Optimization announced in PREVIEW
    2026-06-17  Harness reaches GA
    2026-07     Recommendations, A/B Testing, Batch Evaluations, Web Search Tool, Managed
                Knowledge Base reach GA; Failure Insights enters public preview (release notes)
    2026-08-06  Runtime Instances reach GA (What's New)
    2026-08-18  Payments reaches GA (What's New)
    2026-08-31  AWS Agent Registry reaches GA (What's New; also in release notes)
    2026-09-18  Next-generation Runtime (platform version V2) available; default 2026-11-12
    2026-11-10  Web Search API (InvokeWebSearch) reaches GA (What's New)
  STILL PREVIEW as of 2026-11-23 (stated on the pricing page or release notes): Optimization
  Insights, Runtime managed session storage, Evaluations dataset evaluation and dataset
  generation. Browser Web Bot Auth (preview 2025-10-30) was not re-checked.
  2026-11-23 REFRESH: the region table grew to 24 columns (adds US West (N. California),
  Asia Pacific (Hyderabad), China (Beijing), China (Ningxia)). Policy now authors in
  Dogwood as well as Cedar. The Payments "(preview)" label is gone from the region table.
  METHOD LESSON: a vendor's launch stage may live ONLY in its announcement feed. Checking
  docs + pricing is not enough; check the What's New feed too.

capabilities:
  managed_agent_runtime:
    product: AgentCore Runtime
    status: ga
    notes: >
      "A secure, serverless runtime environment purpose-built for deploying and scaling
      dynamic AI agents and tools ... fast cold starts for real-time interactions,
      extended runtime support for asynchronous agents, true session isolation,
      built-in identity, and support for multi-modal and multi-agent agentic workloads."
      Tied for widest region coverage — 24 regions incl. GovCloud and China, matched by Gateway,
      Identity, Built-in Tools and Observability (region detail: agentcore-regions.html).
      LAUNCH STAGE (from the What's New feed, a DIFFERENT source from the docs page cited
      below; https://aws.amazon.com/about-aws/whats-new/2025/10/amazon-bedrock-agentcore-available/):
      "Amazon Bedrock AgentCore is now generally available" — 2025-10-13, after
      entering preview 2025-07-16.
      2026-11-23: the region table now splits Runtime into microVMs (all 24 regions incl.
      China and GovCloud) and Instances (15 regions; EC2-backed, in your account). A
      next-generation microVM runtime (platform version V2) launched 2026-09-18 per
      What's New (https://aws.amazon.com/about-aws/whats-new/2026/09/new-agentcore-runtime-generally-available/),
      with faster cold starts and elastic memory. That post says "Today, AWS
      announces the availability of the next generation of AgentCore Runtime" and names five
      launch regions; it does not use GA wording.
      INSTANCES STAGE (What's New 2026-08-06, a DIFFERENT source;
      https://aws.amazon.com/about-aws/whats-new/2026/08/aws-bedrock-agentcore-runtime-instances-generally-available/):
      "AgentCore runtime instances are now generally available". It launched in 9 regions
      and the region table now shows 15. "You are charged for the management of the compute
      provisioned, in addition to your Amazon EC2 costs."
    source: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/what-is-bedrock-agentcore.html
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  managed_agent_loop:
    product: AgentCore Harness
    status: ga
    notes: >
      NEW service not present in earlier AgentCore lineups. "A managed agent loop that
      lets you define and invoke AI agents with a single API call. Specify a model,
      system prompt, and tools inline." "Each session runs in an isolated microVM with
      filesystem and shell access." Bring-your-own container supported.
      Works with "Amazon Bedrock, OpenAI, Google Gemini, and any OpenAI-compatible
      model provider."
      NOT in all regions: 16 of 24 as of 2026-11-23; absent from N. California, Milan,
      Spain, Malaysia, Hyderabad, Thailand and both China regions. GovCloud was ADDED since
      August. Region facts throughout this file come from agentcore-regions.html,
      NOT from the overview page cited on each cell — see the runtime_regions row.
      LAUNCH STAGE: "AgentCore harness is now generally available" — 2026-06-17, per the What's New feed (a DIFFERENT source from the docs page cited below); the same wording is in the release notes, https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/release-notes.html. The most recently
      GA'd AgentCore service, which explains why it was absent from earlier lineups.
    source: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/what-is-bedrock-agentcore.html
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  managed_agent_harness:
    product: AgentCore Harness
    status: ga
    notes: >
      The textbook case for this row. "The managed agent harness in AgentCore turns that
      work into configuration. You declare what your agent does (model, tools, skills,
      instructions); AgentCore handles the environment, compute, memory, identity,
      networking, and observability that turn the config into a running agent."
      "Every harness session is stateful by default and runs in a secure, isolated microVM
      per session (backed by AgentCore runtime)." "The harness is powered by Strands
      Agents". Escape hatch: "export to Strands code and run it on AgentCore runtime when
      configuration isn’t enough." Pricing: "There is no separate harness charge. You pay
      only for the underlying AgentCore capabilities you use."
      LAUNCH STAGE (this page): "AgentCore harness is available in GA across all regions
      shown here". The release notes (a DIFFERENT page;
      https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/release-notes.html) say
      "The managed AgentCore harness is now generally available in all AWS Regions where
      AgentCore is supported." The region table shows 16 of 24 (see managed_agent_loop).
      Same product as managed_agent_loop; this row records the configure-not-code harness.
    source: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/harness.html
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  authoring_mode:
    product: AgentCore Harness (configuration) and AgentCore Runtime (code)
    status: documented
    notes: >
      BOTH modes, split across two AgentCore services. From the cited comparison page:
      "For nearly every feature, the pattern is the same: Harness - configuration, no code.
      Runtime - you write code, usually with the AgentCore SDK plus your framework."
      On the harness, "You declare what the agent is (model, system prompt, tools, memory,
      limits) as configuration, and AgentCore runs the loop." The harness can export to
      Strands code (see managed_agent_harness).
      NO visual agent builder in AgentCore. Visual authoring lives in sibling services.
      Amazon Bedrock Flows (a different page;
      https://docs.aws.amazon.com/bedrock/latest/userguide/flows.html) lets you "quickly
      build complex generative AI workflows using a visual builder". AWS Step Functions
      Workflow Studio can add harness steps (see workflow_engine). (Paraphrase of the last
      sentence.)
      The older console-configured agent product is closing. Amazon Bedrock Agents "will no
      longer be open to new customers starting on July 30, 2026" (a different page;
      https://docs.aws.amazon.com/bedrock/latest/userguide/agents-classic-maintenance-mode.html),
      and AWS recommends migrating to the AgentCore harness.
    source: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/harness-vs-runtime.html
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  multi_agent_patterns:
    product: AgentCore (Runtime code-defined agents; Harness subagent tool)
    status: documented
    notes: >
      AWS's own migration guide rates AgentCore's multi-agent support as partial. Its
      capability table maps Bedrock Agents Classic multi-agent collaboration to: "Limited.
      The supervisor pattern is possible by exposing agents as MCP tools (agent-as-tool).
      Routing mode multi-agent is not straightforward today. Full multi-agent collaboration
      requires custom framework code." The code-defined path on AgentCore supports
      "Multi-agent collaboration and supervisor patterns" through your own framework.
      HARNESS: a built-in subagent tool "Lets the agent delegate a self-contained task to a
      fresh child agent and receive its result." "The child is not a separately configured
      harness." (a different page;
      https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/harness-tools.html).
      So the harness offers parent-child delegation, but no configured agent teams.
      (Paraphrase.) Cross-agent calls can also use A2A on Runtime (see a2a_protocol).
      SIBLING FAMILY CLOSING: Bedrock Agents Classic had a managed supervisor/collaborator
      model, but "You can no longer sign up for Amazon Bedrock Agents (now Amazon Bedrock
      Agents Classic)." (a different page;
      https://docs.aws.amazon.com/bedrock/latest/userguide/agents-multi-agent-collaboration.html).
    source: https://docs.aws.amazon.com/bedrock/latest/userguide/agents-classic-maintenance-mode.html
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  workflow_engine:
    product: AWS Step Functions (AgentCore harness integration); Amazon Bedrock Flows
    status: documented
    notes: >
      AgentCore itself has no graph or DAG engine. The harness does not run non-agent-loop
      patterns; on Runtime you write them yourself (harness-vs-runtime.html feature grid).
      (Paraphrase.) The durable workflow engine is a sibling AWS service. From the cited
      What's New post (2026-06-03): "AWS Step Functions is a visual workflow service that
      orchestrates AWS services with built-in error handling, parallel execution, and human
      approval steps." With the harness integration, "You can run multiple agents in
      parallel or in sequence at different decision points in a single workflow and add
      human approval before critical actions." It also says "Agent context can be persisted
      across invocations using a session ID that works within or across workflow
      executions." At that date the post called the harness "currently in preview"; the
      harness reached GA on 2026-06-17 (see managed_agent_harness). The post states no
      separate stage for the integration.
      The reverse direction exists too. "Amazon Bedrock AgentCore Gateway includes a
      built-in Step Functions connector." (a different page;
      https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/gateway-target-connector-step-functions.html),
      so agents can start state machines as MCP tools.
      Amazon Bedrock Flows (a different page;
      https://docs.aws.amazon.com/bedrock/latest/userguide/flows.html) is the
      prompt-chaining option: "build workflows by linking prompts, foundational models, and
      other AWS services to create end-to-end solutions".
    source: https://aws.amazon.com/about-aws/whats-new/2026/06/aws-step-functions-agentcore/
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  voice_agents:
    product: AgentCore Runtime bidirectional streaming (+ Amazon Nova 2 Sonic)
    status: documented
    notes: >
      CAVEAT: no first-class managed voice-agent TYPE was found in AgentCore. Voice is a
      hosting pattern for agent code you write and deploy to Runtime. There is no voice
      agent you configure, and no voice-specific session-limit or region table.
      (Paraphrase.) What is documented: Runtime bidirectional streaming "is essential for
      interactive applications such as conversational voice agents". WebSocket "supports
      text-based streaming, structured message exchange, and audio streaming with no
      additional infrastructure required". WebRTC "is well-suited for voice agents in
      browser and mobile applications". Per the WebRTC page, WebRTC needs VPC network mode
      and a TURN relay; Kinesis Video Streams managed TURN is one option. (Paraphrase.)
      The speech-to-speech model is Amazon Nova 2 Sonic (Nova user guide, a DIFFERENT
      page; https://docs.aws.amazon.com/nova/latest/nova2-userguide/using-conversational-speech.html):
      "Amazon Nova 2 Sonic enables real-time conversational AI with speech input and output."
      Amazon Connect's AI agents for contact centers were not assessed here; that is a
      contact-center product rather than an AgentCore agent type. (Paraphrase.)
    source: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/runtime-bidirectional-streaming.html
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  session_management:
    product: AgentCore Runtime sessions (+ Amazon Bedrock Managed Agents, powered by OpenAI, preview)
    status: documented
    notes: >
      Sessions are implicit. "A new session is created on the first invoke with a unique
      runtimeSessionId provided by your application." A session is Active, Idle or Stopped.
      Stop happens "due to inactivity (default 15 minutes), reaching max compute lifetime
      (default 8 hours), an explicit stop by invoking the StopRuntimeSession API, or if the
      compute is deemed unhealthy based on health checks." "The session transitions back to
      Active on the next invocation and a new compute is provisioned". There is no separate
      create-session call or session event-log API on Runtime. (Paraphrase of the last
      sentence.)
      NEW: session endpoints. "A session endpoint is an authenticated HTTPS URL that
      addresses one runtime session." (a different page;
      https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/runtime-session-endpoints.html).
      It carries HTTP, gRPC and WebSocket traffic to servers inside the session, on allowed
      ports only. (Paraphrase.)
      SIBLING WITH AN EXPLICIT SESSION/EVENT API: Amazon Bedrock Managed Agents, powered by
      OpenAI. "This feature is in public preview." (a different page;
      https://docs.aws.amazon.com/bedrock/latest/userguide/bedrock-managed-agents-openai.html).
      "You create a session, provide instructions and an execution environment, and submit
      messages." It reports idle, in_progress and failed states, and messages are posted
      as events (sessions page,
      https://docs.aws.amazon.com/bedrock/latest/userguide/bedrock-managed-agents-openai-sessions.html).
      (Paraphrase of the last sentence.)
    source: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/runtime-sessions.html
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  multi_tenancy:
    product: AgentCore Runtime (+ AgentCore Memory namespaces)
    status: documented
    notes: >
      Session isolation is strong; tenant mapping is mostly yours. "Each session in
      AgentCore Runtime receives its own dedicated microVM with isolated compute, memory,
      and filesystem resources." After a session, "the entire microVM is terminated and
      memory is sanitized".
      CAVEAT: "For agent runtimes on platform version V1 or on Instances, AgentCore does not
      enforce session-to-user mappings." Platform version V2 on microVMs pins a session
      created with a user identity to that user. Even so, "On every platform version and
      compute type, your client backend must maintain the relationship between users and
      their session IDs." There is no tenant object in Runtime. (Paraphrase of the last
      sentence.)
      Memory adds tenant scoping. Flexible namespace variables (What's New 2026-08-28, a
      different page;
      https://aws.amazon.com/about-aws/whats-new/2026/08/agentcorememory-flexible-namespaces)
      scope "long-term memories along any application-specific dimension - such as
      organization, tenant, team, or environment". See memory_namespacing.
    source: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/runtime-sessions.html
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  framework_agnosticism:
    status: documented
    value: [CrewAI, LangGraph, LlamaIndex, Google ADK, OpenAI Agents SDK, Strands Agents, custom]
    notes: >
      Runtime "works with custom frameworks and any open-source framework, including
      CrewAI, LangGraph, LlamaIndex, Google ADK, OpenAI Agents SDK, and Strands Agents"
      and "popular protocols like MCP and A2A". Explicitly supports a RIVAL cloud's SDK
      (Google ADK) — notable for the A×B portability grid.
    source: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/what-is-bedrock-agentcore.html
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  a2a_protocol:
    product: AgentCore Runtime
    status: ga
    notes: >
      Added at platform GA: "AgentCore Runtime builds on its preview capabilities of
      industry-leading eight-hour execution windows and complete session isolation by
      adding support for the Agent-to-Agent (A2A) protocol, with broader A2A support coming
      soon across all AgentCore services." The same post opens "Amazon Bedrock AgentCore is
      now generally available". So A2A is GA on Runtime; other services were described as
      coming soon as of 2025-10-13.
      The AgentCore docs have a page for it, "Deploy A2A servers in AgentCore Runtime"
      (a different page; https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/runtime-a2a.html):
      AgentCore "acts as a proxy between clients and
      your A2A server" (that page, quoted separately).
    source: https://aws.amazon.com/about-aws/whats-new/2025/10/amazon-bedrock-agentcore-available/
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  distribution_to_packaged_products:
    product: AWS Agent Registry -> Amazon Quick
    status: documented
    notes: >
      YES, through the registry. "Today, Amazon Quick announces integration with AWS Agent
      Registry, enabling users to discover and use resources from their organization's AWS
      Agent Registry directly within Amazon Quick." "AWS Agent Registry supports MCP servers
      and agents, which users can now search and browse directly within Amazon Quick." "Once
      enabled, these resources can be shared with teams for use across chat, agents, apps,
      flows, and deep research." The stated aim: "This integration bridges the gap between
      technical teams who build agents with Amazon Bedrock AgentCore and business users who
      work in Amazon Quick."
      MECHANICS: a Quick admin connects the registry, and users enable an agent "with a few
      clicks". So the path is build, register, then enable in Quick, with no separate
      publish step. (Paraphrase of the last sentence.) Six regions at launch (N. Virginia,
      Oregon, Sydney, Tokyo, Frankfurt, Ireland). The post states no launch stage.
      A second channel is AWS Marketplace. "Customers can now also procure and deploy A2A
      servers on AgentCore Runtime through AWS Marketplace" (a different page;
      https://aws.amazon.com/about-aws/whats-new/2025/11/marketplace-a2a-server-bedrock-agentcore-runtime/).
    source: https://aws.amazon.com/about-aws/whats-new/2026/08/aws-agent-registry-agents-mcp-servers-quick/
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  first_party_models:
    product: Amazon Nova (on Amazon Bedrock)
    status: documented
    value: [Nova 2 Lite, Nova 2 Sonic, Nova 2.5 Sonic, Nova Micro, Nova Lite, Nova Pro, Nova Multimodal Embeddings, Nova Reel]
    notes: >
      Amazon's own family is Nova, served on Bedrock. From the cited model-card index:
      "Nova 2 Lite is Amazon's cost-efficient multimodal model for simple automation,
      document processing, and customer support across text, images, and video." "Nova 2.5
      Sonic is Amazon's latest speech-to-speech foundation model with improved reasoning,
      instruction following, and tool calling for real-time, agentic voice applications."
      Nova Canvas is now described in the past tense ("Nova Canvas was Amazon's image
      generation model.").
      FRONTIER TIER IS PREVIEW: the Nova 2 launch (What's New 2025-12-02, a different page;
      https://aws.amazon.com/about-aws/whats-new/2025/12/nova-2-foundation-models-amazon-bedrock/)
      named "Amazon Nova 2 Pro (Preview), our most intelligent model for highly complex,
      multistep tasks." Nova 2 Pro has no card on the cited index as of 2026-11-23.
      (Paraphrase.) Custom frontier models: "We are excited to announce the general
      availability of Nova Forge, a new service to build your own frontier models using
      Nova." (a different page;
      https://aws.amazon.com/about-aws/whats-new/2025/12/amazon-nova-forge-frontier-models-nova/).
      Nova Forge runs on SageMaker AI.
      Positioning note: AWS sells Nova on price-performance. Its strongest models on Bedrock
      are third-party (Anthropic, OpenAI). (Paraphrase.)
    source: https://docs.aws.amazon.com/bedrock/latest/userguide/model-cards-amazon.html
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  third_party_catalog:
    status: documented
    notes: >
      "any foundation model in or outside of Amazon Bedrock including OpenAI, Google's
      Gemini, Anthropic's Claude, Amazon Nova, Meta Llama, and Mistral models"
    source: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/what-is-bedrock-agentcore.html
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  byo_open_weights:
    product: Amazon Bedrock Custom Model Import + Provisioned Throughput
    status: ga
    notes: >
      STATUS CHANGE 2026-11-23 (fact-check, symmetry with Azure): documented -> ga. "Amazon
      Bedrock Custom Model Import now generally available" (a different page, the 2024-10
      What's New post,
      https://aws.amazon.com/about-aws/whats-new/2024/10/amazon-bedrock-custom-model-import/).
      BYO weights: Custom Model Import loads open-source models you customized elsewhere,
      such as Mistral AI or Llama. (Paraphrase.) "You can use a model that you import with
      on demand throughput." Narrow footprint: "Custom model import is supported in the
      following regions: eu-central-1 us-east-1 us-east-2 us-west-2". "You can't use Custom
      Model Import with the following Amazon Bedrock features. Batch inference
      CloudFormation". The page now steers you to check the catalog first for stock open
      weights. (Paraphrase.)
      PROVISIONED THROUGHPUT (a different page;
      https://docs.aws.amazon.com/bedrock/latest/userguide/prov-throughput.html): "You can
      purchase Provisioned Throughput to provision a higher level of throughput for a model
      at a fixed cost." "If you customized a model, you must purchase Provisioned
      Throughput to be able to use it." Terms are no commitment, 1 month or 6 months.
      Cross-region inference does not combine with it: "Inference profiles currently don't
      support Provisioned Throughput." (another different page;
      https://docs.aws.amazon.com/bedrock/latest/userguide/cross-region-inference.html).
      Full self-hosting of open weights is on Amazon SageMaker AI (JumpStart and
      endpoints), outside Bedrock. (Paraphrase.)
    source: https://docs.aws.amazon.com/bedrock/latest/userguide/model-customization-import-model.html
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  tuning:
    product: Amazon Bedrock model customization and prompt caching
    status: ga
    notes: >
      STATUS CHANGE 2026-11-23 (fact-check, symmetry with GCP): documented -> ga. All three
      have a stated GA in What's New (different pages): "Fine-tuning for Anthropic's Claude
      3 Haiku in Amazon Bedrock is now generally available"
      (https://aws.amazon.com/about-aws/whats-new/2024/11/fine-tuning-anthropics-claude-3-haiku-amazon-bedrock/),
      "Amazon Bedrock Model Distillation is now generally available"
      (https://aws.amazon.com/about-aws/whats-new/2025/05/amazon-bedrock-model-distillation-generally-available/)
      and "Amazon Bedrock announces general availability of prompt caching"
      (https://aws.amazon.com/about-aws/whats-new/2025/04/amazon-bedrock-general-availability-prompt-caching/).
      All three are offered.
      FINE-TUNING: "With Amazon Bedrock, you can train a foundation model to improve
      performance on specific tasks (known as fine-tuning)." The cited table lists Nova
      (incl. Nova 2 Lite), Titan, Claude 3 Haiku and Llama 3.x models. Most are in one
      region, us-east-1 or us-west-2. (Paraphrase.) Reinforcement fine-tuning also exists;
      it improves a model "through feedback signals called rewards" (a different page;
      https://docs.aws.amazon.com/bedrock/latest/userguide/reinforcement-fine-tuning.html).
      DISTILLATION (another different page;
      https://docs.aws.amazon.com/bedrock/latest/userguide/model-distillation.html): "Model
      distillation is the process of transferring knowledge from a larger more intelligent
      model (known as teacher) to a smaller, faster, cost-efficient model (known as
      student)."
      PROMPT CACHING (another different page;
      https://docs.aws.amazon.com/bedrock/latest/userguide/prompt-caching.html): "Prompt
      caching is an optional feature that you can use with supported models on Amazon
      Bedrock to reduce inference response latency and input token costs." It comes in
      implicit and explicit types. TTLs of 5 minutes and 1 hour apply to recent Claude
      models. (Paraphrase.)
      The fine-tuning, RFT and distillation docs pages state no stage; the prompt-caching
      page labels the stage per model (Generally Available or Gated). (Paraphrase.)
    source: https://docs.aws.amazon.com/bedrock/latest/userguide/custom-model-fine-tuning.html
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  model_routing:
    product: Amazon Bedrock intelligent prompt routing + AgentCore Gateway model fallback
    status: documented
    notes: >
      Two mechanisms, plus cross-region inference.
      COST/QUALITY ROUTING (cited page): "Amazon Bedrock intelligent prompt routing provides
      a single serverless endpoint to efficiently route requests between different
      foundational models within the same model family." "It can dynamically predict the
      response quality of each model for each request, and then route the request to the
      model with the best response quality." Limits: the router stays inside one model
      family, and the supported list is older Nova and Llama models. (Paraphrase.)
      FALLBACK (What's New 2026-10-22, a different page;
      https://aws.amazon.com/about-aws/whats-new/2026/10/agentcore-gateway-invokemodel-fallback/):
      "With model fallback, the gateway automatically routes a request to an alternative
      model or provider when the primary destination is throttled, out of capacity, or
      unreachable". "A built-in circuit breaker skips destinations that are currently
      failing". It is available where Gateway is, "(except those in China)". This can
      cross providers, unlike prompt routing. (Paraphrase.)
      Global cross-region inference is another lever; AWS lists it at about 10% savings
      over geographic profiles. (Paraphrase.)
    source: https://docs.aws.amazon.com/bedrock/latest/userguide/prompt-routing.html
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  openai_compatible_endpoint:
    product: Amazon Bedrock (bedrock-runtime and bedrock-mantle endpoints)
    status: documented
    notes: >
      YES, both Chat Completions and Responses. "The OpenAI Chat Completions API generates
      conversational responses using Amazon Bedrock models." There are two endpoints:
      bedrock-runtime (path /openai/v1, SigV4 or a Bedrock API key) and bedrock-mantle
      (compatibility). "Use the bedrock-runtime endpoint for new applications." (Paraphrase
      of the endpoint list.)
      GAP: "bedrock-runtime doesn't implement the OpenAI-compatible GET /models operation",
      so client.models.list() fails there.
      RESPONSES API (a different page;
      https://docs.aws.amazon.com/bedrock/latest/userguide/inference-responses-api.html):
      "Amazon Bedrock provides the OpenAI Responses API on both the bedrock-runtime and
      bedrock-mantle endpoints." The two differ: "Requests on bedrock-runtime are always
      synchronous, server-side tools aren't available, and only the default project is
      supported." On the agent side, Harness accepts "any OpenAI-compatible model provider"
      (overview page, https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/what-is-bedrock-agentcore.html). No stage is stated on these pages.
    source: https://docs.aws.amazon.com/bedrock/latest/userguide/inference-chat-completions.html
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  tool_calling:
    product: Amazon Bedrock (Responses, Chat Completions, Converse, InvokeModel)
    status: documented
    notes: >
      "Amazon Bedrock supports three modes of tool use, depending on which API you call and
      which model family you use". Client-side tool use is "Available with the Responses,
      Chat Completions, Converse, and InvokeModel APIs." In server-side mode, "You register
      a Lambda function or AgentCore Gateway, and Amazon Bedrock invokes the tool on the
      model's behalf." It is "Currently available on the Responses API." The third mode is
      Anthropic-defined tools (computer use, bash, text editor, memory). (Paraphrase.)
      PARALLEL CALLS: the Bedrock tool-use pages do not state parallel tool-call support;
      it is model-dependent. (Paraphrase.) Gateway does handle concurrency: "A client can
      initiate multiple tools/call requests within the same session, even while an
      elicitation is pending." (a different page;
      https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/gateway-mcp-elicitation.html).
    source: https://docs.aws.amazon.com/bedrock/latest/userguide/tool-use.html
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  mcp_server_hosting:
    product: AgentCore Gateway
    status: documented
    notes: >
      "convert your APIs, Lambda functions, and existing services into Model Context
      Protocol (MCP)-compatible tools and also connect to pre-existing MCP servers."
      Integrations named: Salesforce, Zoom, JIRA, Slack.
      Available in all 24 regions in the region table, incl. GovCloud and China.
    source: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/what-is-bedrock-agentcore.html
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  mcp_registry:
    product: AWS Agent Registry
    aliases: [AgentCore Registry]
    status: ga
    notes: >
      STATUS CHANGE 2026-11-23: preview -> GA. From the 2026-08-31 What's New announcement
      (a DIFFERENT source from the docs page cited below;
      https://aws.amazon.com/about-aws/whats-new/2026/08/aws-agent-registry-generally-available/): "AWS Agent Registry is now
      generally available." GA added CloudFormation/Terraform/CDK provisioning, tagging,
      cross-account sharing via AWS RAM, and org-wide auto-detection of AgentCore Runtimes
      and Gateways. The same post says "You can also discover and use registry resources
      from Amazon Bedrock AgentCore, Amazon Quick, and Kiro IDE" and that "The console pairs
      semantic and keyword search with a dedicated browse experience". Carried over from
      preview: "manual and URL-based record creation, approval workflows, semantic and
      keyword search, and AWS CloudTrail audit trails". "The registry is also exposed as an
      MCP server that builders can query directly from their IDEs." At GA the post listed
      "five AWS Regions". The AgentCore release notes (August 2026, another DIFFERENT source;
      https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/release-notes.html) also
      announce GA and are the source for encryption: "AWS Agent Registry is now generally
      available, with auto-detection and customer managed key encryption" and "Encrypt
      registry data at rest with a customer managed key from AWS KMS that you own and
      control." The What's New post does not mention customer managed keys. The pricing page no longer mentions a preview period; it now
      lists a monthly free tier, then $0.400 per 1,000 records.
      Overview page (cited): "A centralized catalog for discovering and managing agents,
      MCP servers, tools, skills and custom resources across your organization." Works with
      resources "deployed on AWS, On-Prem or on any other Cloud environment".
      REGIONS: 10 of 24 as of 2026-11-23 (was 5). Four more were added 2026-10-28 (Ohio,
      Frankfurt, London, Canada Central), and GovCloud (US-West) on 2026-11-06.
      The region table says AWS Agent Registry; the service table says Registry.
      History: preview announced 2026-04-09.
    source: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/what-is-bedrock-agentcore.html
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  skills_registry:
    product: AWS Agent Registry
    status: ga
    notes: >
      Same service as mcp_registry. Skills are a first-class record type, not just a tag.
      "you can publish MCP servers, tools, agents, agent skills, and custom resources into a
      searchable registry, control access through an approval workflow". "Skill records can
      carry a full skill package, which you upload or synchronize from Amazon S3 or GitHub."
      The page suggests organising registries by resource type, such as a "skill registry".
      (Paraphrase.) Discovery is through hybrid search, browsing and a native MCP endpoint,
      and access is controlled by IAM or JWT. (Paraphrase.)
      The release notes (a DIFFERENT page;
      https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/release-notes.html) say
      "AWS Agent Registry now stores and serves skill packages." The package format is
      "a .zip archive that contains the skill’s SKILL.md and the files that the skill
      uses". The same page carries the stage: "AWS Agent Registry is now generally
      available." (August 2026). No separate stage is stated for skill packages.
      Separate from the AWS-curated skills catalog that Harness can attach.
    source: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/registry.html
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  agent_skills:
    product: AgentCore Harness (Skills)
    status: ga
    notes: >
      "Agent Skills are bundles of markdown and scripts that give the agent domain
      knowledge on demand." "Each skill follows the open AgentSkills.io standard" (SKILL.md
      plus optional scripts, references and assets). Metadata goes into the system prompt
      and full instructions load on demand. (Paraphrase.) "The harness supports four skill
      sources": AWS Skills from the AWS Agent Toolkit, Git (HTTPS), your own S3 bucket, and
      a filesystem path. "Skills are fetched once per session on the first invocation."
      Skills can be set on the harness or overridden per invocation. (Paraphrase.)
      On Runtime, skills are custom code (harness-vs-runtime.html grid). (Paraphrase.) For
      storing and sharing skill packages, see skills_registry (AWS Agent Registry).
      STAGE: skills are a harness feature, and the harness page (a different page;
      https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/harness.html) says
      "AgentCore harness is available in GA across all regions shown here". The harness GA
      entry in the release notes (another different page,
      https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/release-notes.html)
      names skills among what GA adds: "the AWS-curated skills catalog with a one-toggle
      setup".
    source: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/harness-skills.html
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  agent_gateway:
    product: AgentCore Gateway
    status: ga
    notes: >
      CHANGED from a pure MCP tool gateway. It now describes itself as a "fully managed AI
      gateway that provides a single, secure entry point for agentic traffic—connecting
      agents to tools, to other agents, and to large language models (LLMs)". "Rather than
      serving only as an MCP tool gateway, Gateway routes and secures any agentic traffic
      through one endpoint". This covers MCP tools, "passthrough targets (including
      Agent-to-Agent (A2A) traffic)", and "a unified, model-based routing endpoint" for
      inference.
      WHAT IT ENFORCES: auth, in both directions ("inbound authentication (verifying agent
      identity) and outbound authentication (connecting to tools)"), plus credential
      injection and semantic tool selection. Gateway rules route by caller IAM principal
      or path, for A/B tests and fallback. (Paraphrase.)
      POLICY: Policy in AgentCore attaches policy engines to gateways and "intercepts all
      agent traffic through Amazon Bedrock AgentCore Gateways and evaluates each request
      against defined policies in the policy engine before allowing tool access" (a
      DIFFERENT page; https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/policy.html).
      LIMIT: "Policy evaluation applies only to MCP tools." (another DIFFERENT page;
      https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/use-gateway-with-policy.html).
      Per the release notes, passthrough targets offer "unified authentication, policy
      enforcement, and observability", and "You can provide an API schema to enable policy
      engine features such as guardrails." A Runtime can be set to accept invocations only
      from the gateway, so callers cannot bypass it (release notes,
      https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/release-notes.html).
      (Paraphrase of the last sentence.)
      VERDICT: yes, a policy enforcement point for agent traffic. Its policy depth is
      strongest for MCP tool calls. (Paraphrase.)
      LAUNCH STAGE: Gateway shipped in the platform GA (2025-10-13 What's New,
      https://aws.amazon.com/about-aws/whats-new/2025/10/amazon-bedrock-agentcore-available/):
      "Amazon Bedrock AgentCore is now generally available". The newer passthrough and
      inference targets have no separately stated stage.
    source: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/gateway.html
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  openapi_import:
    product: AgentCore Gateway (OpenAPI targets)
    status: documented
    notes: >
      "Gateway supports OpenAPI 3.0 specifications for defining API targets." Later on the
      same page: "OpenAPI versions 3.0 and 3.1 are supported (Swagger 2.0 is not
      supported)". "The Gateway translates incoming MCP requests into HTTP requests to
      these APIs and handles the response formatting." So OpenAPI import yields MCP tools.
      (Paraphrase.)
      CONSTRAINTS: "The OpenAPI specification must include operationId fields for all
      operations that you want to expose as tools." "Only application/json content type
      is fully supported". "Complex schema features like oneOf, anyOf, and allOf are not
      supported". Smithy models and API Gateway stages are sibling target types.
      (Paraphrase.)
      Bedrock Agents Classic action groups also took OpenAPI schemas (a different page;
      https://docs.aws.amazon.com/bedrock/latest/userguide/agents-api-schema.html), but
      that product is closed to new customers.
    source: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/gateway-schema-openapi.html
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  long_term_memory:
    product: AgentCore Memory
    status: ga
    notes: >
      STATUS CHANGE 2026-11-23: documented -> GA. The 2025-10-13 What's New post (a
      DIFFERENT source from the docs page cited below; https://aws.amazon.com/about-aws/whats-new/2025/10/amazon-bedrock-agentcore-available/)
      says "Amazon Bedrock AgentCore is now generally available" and names Memory: "AgentCore
      Memory now offers a self-managed strategy that gives you complete control over your
      memory extraction and consolidation pipelines."
      Overview page (cited):
      "short-term memory for multi-turn conversations and long-term memory that persists
      across sessions, with the ability to not only share memory stores across agents but
      also learn from experiences."
      Framework integrations: LangGraph, LangChain, Strands, LlamaIndex.
      16 of 24 regions; not in N. California, Milan, Spain, Malaysia, Hyderabad, Thailand,
      China. GovCloud was ADDED since August (region table).
    source: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/what-is-bedrock-agentcore.html
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  short_term_memory:
    product: AgentCore Memory
    status: documented
    notes: '"short-term memory for multi-turn conversations"'
    source: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/what-is-bedrock-agentcore.html
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  memory_namespacing:
    product: AgentCore Memory
    status: documented
    notes: >
      NAMESPACING: "This lets you isolate memories by session and by actor." "Using the
      actor ID helps the system know which user the memory belongs to, keeping each user's
      data separate and organized." Long-term records live under a strategy namespace path.
      "The slash prevents prefix collisions in multi-tenant applications". Up to five
      custom namespace keys per memory, such as a tenant ID. (Paraphrase; What's New
      2026-08-28.)
      TTL (a different page;
      https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/long-term-record-ttl.html):
      "By default, long-term memory records do not expire." The TTL is
      "recordExpiryDurationDays - The number of days (minimum 31) after which records
      expire." Short-term events now keep up to 10 years: "Amazon Bedrock AgentCore Memory
      now lets you keep short-term memory events for up to 10 years, up from one year."
      (What's New 2026-11-17, another different page;
      https://aws.amazon.com/about-aws/whats-new/2026/11/amazon-bedrock-agentcore-memory-10-year-retention).
      The quotas page still lists a 365-day maximum event expiration, so the docs disagree.
      (Paraphrase.)
      DELETION: "The DeleteMemoryRecord API removes individual memory records from your
      AgentCore Memory" (another different page;
      https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/long-term-delete-memory-records.html).
      Events have a DeleteEvent API too. (Paraphrase.)
      EXPORT: no bulk export or per-user erase API is documented. You list and retrieve
      records yourself. (Paraphrase.)
    source: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/memory-organization.html
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  checkpoint_resume:
    product: AgentCore Runtime session storage (preview) and capacity provider volumes
    status: documented
    notes: >
      FILESYSTEM CHECKPOINTS, not agent-loop checkpoints. Two managed options: "Session
      storage (Preview) - Per-session storage on microVM runtimes that persists across
      stop/resume cycles." and "Capacity provider volumes - Amazon EBS volumes on Instances
      runtimes". Session storage "Survives stop/resume; 14-day idle expiry; resets on
      version update". It is still preview; Instances is GA (see managed_agent_runtime).
      (Paraphrase of the last sentence.) Without it, "By default, the compute (microVM)
      associated with a session is ephemeral." (a different page;
      https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/runtime-sessions.html).
      After a stop or crash, "The session transitions back to Active on the next invocation
      and a new compute is provisioned" (same page). Replaying the agent's own state after
      a failure is up to your framework, for example with a checkpointer on AgentCore
      Memory. (Paraphrase.)
      Durable retries at the workflow level come from Step Functions (see
      workflow_engine). (Paraphrase.)
    source: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/runtime-filesystem-configurations.html
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  agent_workload_identity:
    product: AgentCore Identity
    status: ga
    notes: >
      STATUS CHANGE 2026-11-23: documented -> GA. The 2025-10-13 What's New post (a
      DIFFERENT source from the docs page cited below; https://aws.amazon.com/about-aws/whats-new/2025/10/amazon-bedrock-agentcore-available/)
      says "Amazon Bedrock AgentCore is now generally available" and names Identity:
      "AgentCore Identity now offers identity-aware authorization, secure vault storage for
      refresh tokens, and native integration with additional OAuth-enabled services".
      Overview page (cited):
      "A secure, scalable agent identity, access and authentication management service
      which is compatible with existing identity providers, eliminating needs for user
      migration or rebuilding authentication flows."
      All 24 regions incl. GovCloud and China.
    source: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/what-is-bedrock-agentcore.html
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  delegated_user_auth:
    product: AgentCore Identity
    status: documented
    notes: >
      IdP/credential providers named: Amazon Cognito, Okta, Microsoft Azure Entra ID,
      Auth0. Exact OBO/3LO mechanics not verified from this page.
    source: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/what-is-bedrock-agentcore.html
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  tool_least_privilege:
    product: Policy in AgentCore
    status: ga
    notes: >
      "deterministic control to ensure agents operate within defined boundaries and
      business rules". CHANGED since August: rules are authored "using natural language or
      a policy language — Dogwood", "which is compatible with Cedar (AWS's open-source policy
      language)" (was natural language or Cedar). "Integrates with AgentCore Gateway, to
      intercept every tool call before execution."
      22 of 24 regions, absent only from China. GovCloud was ADDED since August.
      LAUNCH STAGE: "Policy in Amazon Bedrock AgentCore is now generally available" —
      2026-03-03, per the What's New feed (a DIFFERENT source from the docs page below), https://aws.amazon.com/about-aws/whats-new/2026/03/policy-amazon-bedrock-agentcore-generally-available/.
      Announced as preview 2025-12-02, so roughly a 3-month preview.
    source: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/what-is-bedrock-agentcore.html
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  code_interpreter:
    product: AgentCore Code Interpreter
    status: ga
    notes: >
      STATUS CHANGE 2026-11-23: documented -> GA. The 2025-10-13 GA What's New post does
      not name Code Interpreter. The AgentCore release notes (a DIFFERENT source from the docs page
      cited below; https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/doc-history.html, April 2026) do, with GA wording: "AgentCore Identity, Runtime, Code
      Interpreter, Browser Tool, Gateway, Policy, and Observability are now generally
      available in São Paulo (GRU)." That wording is per-region, but it states the stage.
      Overview page (cited):
      "An isolated sandbox environment for agents to execute code."
      Languages: "Python, JavaScript and TypeScript".
      The region table groups it under a built-in-tools row present in all 24 regions
      (region detail from agentcore-regions.html).
    source: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/what-is-bedrock-agentcore.html
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  browser_use:
    product: AgentCore Browser
    status: ga
    notes: >
      STATUS CHANGE 2026-11-23: documented -> GA. The 2025-10-13 GA What's New post does
      not name Browser. The AgentCore release notes (a DIFFERENT source from the docs page
      cited below; https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/doc-history.html, April 2026) do, with GA wording: "AgentCore Identity, Runtime, Code
      Interpreter, Browser Tool, Gateway, Policy, and Observability are now generally
      available in São Paulo (GRU)." That wording is per-region, but it states the stage.
      Overview page (cited):
      "A fast and secure cloud-based browser runtime environment to enable AI agents to
      interact with web applications, fill forms, navigate websites, and extract
      information in a fully managed environment."
      Works with "Playwright and BrowserUse".
      Grouped under the region table's built-in-tools row — all 24 regions
      (region detail from agentcore-regions.html).
    source: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/what-is-bedrock-agentcore.html
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  otel_traces:
    product: AgentCore Observability
    status: ga
    notes: >
      STATUS CHANGE 2026-11-23: documented -> GA. The 2025-10-13 What's New post (a
      DIFFERENT source from the docs page cited below; https://aws.amazon.com/about-aws/whats-new/2025/10/amazon-bedrock-agentcore-available/)
      says "Amazon Bedrock AgentCore is now generally available" and names Observability:
      "AgentCore Observability now delivers complete visibility into end-to-end agent
      execution and operational metrics across all AgentCore services through dashboards
      powered by Amazon CloudWatch, and it is OTEL compatible".
      Overview page (cited):
      "detailed visualizations of each step in the agent workflow ... inspect an agent's
      execution path, audit intermediate outputs, and debug performance bottlenecks."
      Emits "standardized OpenTelemetry (OTEL)-compatible format" — works with any
      OTel-compatible stack. All 24 regions.
      The pricing page (a different page; https://aws.amazon.com/bedrock/agentcore/pricing/)
      adds: "The telemetry data is ingested and stored
      in your Amazon CloudWatch account."
    source: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/what-is-bedrock-agentcore.html
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  apm_integration:
    status: documented
    value: Amazon CloudWatch
    notes: '"AgentCore Observability powered by Amazon CloudWatch"'
    source: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/what-is-bedrock-agentcore.html
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  cost_attribution:
    product: Amazon Bedrock cost attribution (+ AgentCore resource tags)
    status: documented
    notes: >
      MODEL TOKENS, from Bedrock (cited page): "Amazon Bedrock provides multiple ways to
      attribute model inference usage and costs to specific users, teams, applications,
      environments, or experiments." The mechanisms are IAM principal attribution,
      application inference profiles, Projects, Workspaces and per-request metadata tagging
      with invocation logs. Billed-dollar data goes to Cost Explorer or CUR 2.0.
      (Paraphrase.) To slice by agent, tenant or session, tag each request yourself.
      (Paraphrase.)
      AGENTCORE: no per-agent or per-session cost report was found. You tag resources
      (a different page; https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/tagging.html):
      "Tags enable you to categorize your AWS resources in different ways, for example, by
      purpose, owner, or environment." Gateway rate limits can cap tokens per agent, per the
      FAQ. Step Functions execution history shows token usage for harness steps.
      (Paraphrase of the last two sentences.)
    source: https://docs.aws.amazon.com/bedrock/latest/userguide/cost-management.html
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  eval_service:
    product: AgentCore Evaluations
    status: ga
    notes: >
      "measures how well your agents and tools execute tasks, handle edge cases, and
      maintain output reliability." Supports "evaluations on sessions, traces, and spans
      generated from Strands Agent or LangGraph frameworks, and instrumented using
      OpenTelemetry or OpenInference" — note the framework restriction. The release notes
      add TypeScript agent framework support (September 2026).
      22 of 24 regions, absent only from China (was 16 in August).
      LAUNCH STAGE: "Amazon Bedrock AgentCore Evaluations is now generally available" —
      2026-03-31, per the What's New feed (a DIFFERENT source from the docs page below), https://aws.amazon.com/about-aws/whats-new/2026/03/agentcore-evaluations-generally-available/.
      Announced as preview 2025-12-02. Batch Evaluations went GA in July 2026. Dataset
      evaluation and dataset generation are "in public preview" (release notes, November, https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/release-notes.html). The pricing page (a different page, https://aws.amazon.com/bedrock/agentcore/pricing/) lists "Includes CI/CD integration with configurable
      quality thresholds" and "Production monitoring with sampling rules and dashboard
      aggregation", and says "Model usage costs are included for built-in evaluators".
    source: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/what-is-bedrock-agentcore.html
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  versioning_rollout:
    product: AgentCore Runtime and Harness versions/endpoints (+ Optimization A/B testing)
    status: documented
    notes: >
      VERSIONS AND ALIASES: "Each AgentCore Runtime in Amazon Bedrock AgentCore is
      automatically versioned". "Versions are immutable once created". "Endpoints can point
      to specific versions, allowing you to maintain different environments (e.g.,
      development, staging, production)". DEFAULT follows the latest version; named
      endpoints move only when you update them. (Paraphrase.)
      ROLLBACK (a different page;
      https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/runtime-session-endpoints.html):
      a runtime endpoint lets you "keep development and production on different versions
      and promote or roll back without changing callers." The harness works the same way:
      "Harness versioning works the same way as AgentCore Runtime versioning" (another
      different page;
      https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/harness-versioning.html).
      CANARY: an endpoint has no traffic weights. Traffic splitting comes from Gateway rules
      and Optimization A/B tests, and per the release notes "A/B Testing is now Generally
      Available" (another different page;
      https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/release-notes.html).
      (Paraphrase except the quote.) Default caps are 1,000 versions and 10 endpoints per
      agent, both adjustable (see service_limits).
    source: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/agent-runtime-versioning.html
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  agent_optimization:
    product: AgentCore Optimization
    status: ga
    notes: >
      STATUS CHANGE 2026-11-23: preview -> GA for the core of the service. The AgentCore release notes (https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/release-notes.html, a DIFFERENT source from the docs page below; July 2026 section) state
      "Recommendations is now Generally Available" and "A/B Testing is now Generally
      Available". These are two of the three things the overview lists: "AI-generated
      recommendations, versioned configuration bundles, and A/B testing." No stage is
      stated for configuration bundles.
      STILL PREVIEW: Insights. The pricing page (https://aws.amazon.com/bedrock/agentcore/pricing/) says "Insights (Preview)" and "Free during
      public preview"; the release notes say "Failure Insights is now in Public Preview".
      "Supports system prompt and tool description optimization with traffic splitting
      through AgentCore Gateway for A/B testing."
      21 of 24 regions; absent from China and GovCloud.
      History: "launches capabilities for optimizing agent performance in preview" — 2026-04-30, What's New, https://aws.amazon.com/about-aws/whats-new/2026/05/bedrock-agentcore-optimization-preview/.
      RECONCILED 2026-11-23 with a parallel refresh that kept the whole row `preview` on
      the pricing page's Insights wording. The pricing page (a different page) applies the
      preview label to Insights only: "Insights is free during public preview; pricing will
      be announced before general availability". Recommendations and A/B tests carry no
