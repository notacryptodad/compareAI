provider: aws
bucket: b
product: Amazon Bedrock AgentCore
aliases: [AgentCore, Bedrock AgentCore, AWS AgentCore]
notes: >
  Current AWS documentation lists 13 modular AgentCore services that can be used
  together or independently: Harness, Runtime, Memory, Gateway, Identity, Code
  Interpreter, Browser, Observability, Payments, Evaluations, Optimization, Policy,
  and Registry. Launch stages are service-specific. Runtime, Harness, Policy,
  Evaluations, Payments, and AWS Agent Registry have explicit AWS general-availability
  announcements; Optimization remains public preview in current pricing documentation.
  (Paraphrase.)

capabilities:
  managed_agent_runtime:
    product: AgentCore Runtime
    status: ga
    notes: >
      AgentCore Runtime is a serverless runtime with isolated sessions, scale-to-zero,
      and support for real-time and asynchronous agent workloads. AWS announced the
      next-generation Runtime as available and says new runtimes use it by default in
      supported Regions. AWS also separately announced Runtime Instances as generally
      available for managed EC2-backed workloads with sessions up to 14 days. This row
      covers both Runtime compute types and keeps their different limits explicit.
      (Paraphrase.)
    source: https://aws.amazon.com/about-aws/whats-new/2026/09/new-agentcore-runtime-generally-available/
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  managed_agent_loop:
    product: AgentCore Harness
    status: ga
    notes: >
      Harness is a managed agent loop for declaring the model, tools, skills, and
      instructions without writing orchestration code. AWS announced the managed
      harness as generally available on 2026-06-17. It supports isolated sessions,
      filesystem and shell access, memory, and model-provider choice. (Paraphrase.)
    source: https://aws.amazon.com/about-aws/whats-new/2026/06/amazon-bedrock-agentcore-harness-generally-available//
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  framework_agnosticism:
    status: documented
    value: [CrewAI, LangGraph, LlamaIndex, Google ADK, OpenAI Agents SDK, Strands Agents, custom]
    notes: >
      Runtime documentation names custom and open-source frameworks including CrewAI,
      LangGraph, LlamaIndex, Google ADK, OpenAI Agents SDK, and Strands Agents, plus
      MCP and A2A protocols. (Paraphrase.)
    source: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/what-is-bedrock-agentcore.html
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  third_party_catalog:
    status: documented
    notes: >
      Runtime documentation lists foundation models inside and outside Bedrock,
      including OpenAI, Google Gemini, Anthropic Claude, Amazon Nova, Meta Llama, and
      Mistral. (Paraphrase.)
    source: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/what-is-bedrock-agentcore.html
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  mcp_server_hosting:
    product: AgentCore Gateway
    status: documented
    notes: >
      Gateway converts APIs, Lambda functions, and existing services into MCP-compatible
      tools and connects pre-existing MCP servers. AWS names integrations such as
      Salesforce, Zoom, Jira, and Slack. (Paraphrase.)
    source: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/what-is-bedrock-agentcore.html
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  mcp_registry:
    product: AWS Agent Registry
    status: ga
    notes: >
      AWS Agent Registry is a private governed catalog for agents, tools, skills, MCP
      servers, and custom resources. AWS announced it as generally available in August
      2026, with semantic and keyword search, approval workflows, infrastructure as
      code, cross-account sharing, and integrations with AgentCore, Amazon Quick, and
      Kiro. The current AWS announcement lists five Regions, while the current Region
      table also includes AWS GovCloud (US-West) after a November expansion. (Paraphrase.)
    source: https://aws.amazon.com/about-aws/whats-new/2026/08/aws-agent-registry-generally-available/
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  long_term_memory:
    product: AgentCore Memory
    status: documented
    notes: >
      Memory supports short-term multi-turn context and long-term memory that persists
      across sessions. The current Region table expands Memory beyond the earlier
      limited list, including AWS GovCloud (US-West); use the table as the authority for
      the current regional footprint. (Paraphrase.)
    source: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/what-is-bedrock-agentcore.html
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  short_term_memory:
    product: AgentCore Memory
    status: documented
    notes: >
      The current service overview explicitly includes short-term memory for multi-turn
      conversations. (Paraphrase.)
    source: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/what-is-bedrock-agentcore.html
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  agent_workload_identity:
    product: AgentCore Identity
    status: documented
    notes: >
      Identity provides agent identity, access, and authentication management and works
      with existing identity providers. The current Region table lists Identity across
      all supported table Regions, including China and GovCloud. (Paraphrase.)
    source: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/what-is-bedrock-agentcore.html
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  delegated_user_auth:
    product: AgentCore Identity
    status: documented
    notes: >
      The overview names Amazon Cognito, Okta, Microsoft Azure Entra ID, and Auth0 as
      example identity and credential providers. It does not establish a single OBO or
      3LO mechanism on this page. (Paraphrase.)
    source: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/what-is-bedrock-agentcore.html
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  tool_least_privilege:
    product: Policy in AgentCore
    status: ga
    notes: >
      Policy provides deterministic controls for agent-tool interactions, with rules
      authored in natural language or Dogwood, which is compatible with Cedar. AWS
      announced Policy as generally available on 2026-03-03. Policy integrates with
      Gateway to evaluate tool calls before execution. (Paraphrase.)
    source: https://aws.amazon.com/about-aws/whats-new/2026/03/policy-amazon-bedrock-agentcore-generally-available/
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  code_interpreter:
    product: AgentCore Code Interpreter
    status: documented
    notes: >
      Code Interpreter provides an isolated sandbox for agents to execute code and
      supports Python, JavaScript, and TypeScript. The current Region table groups it
      under AgentCore Built-in Tools. (Paraphrase.)
    source: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/what-is-bedrock-agentcore.html
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  browser_use:
    product: AgentCore Browser
    status: documented
    notes: >
      Browser is a managed cloud browser runtime for navigating web applications,
      filling forms, and extracting information. AWS names Playwright and BrowserUse as
      supported automation frameworks. (Paraphrase.)
    source: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/what-is-bedrock-agentcore.html
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  otel_traces:
    product: AgentCore Observability
    status: documented
    notes: >
      Observability provides workflow visualizations and audit/debug views and emits
      standardized OpenTelemetry-compatible telemetry. The pricing page states that
      telemetry is ingested, stored, and queried in the customer's CloudWatch account.
      (Paraphrase.)
    source: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/what-is-bedrock-agentcore.html
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  apm_integration:
    status: documented
    value: Amazon CloudWatch
    notes: >
      AgentCore Observability is integrated with Amazon CloudWatch for monitoring and
      telemetry storage. (Paraphrase.)
    source: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/what-is-bedrock-agentcore.html
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  eval_service:
    product: AgentCore Evaluations
    status: ga
    notes: >
      Evaluations measures agent and tool execution quality across sessions, traces, and
      spans. AWS announced Evaluations as generally available on 2026-03-31. Current
      pricing documentation adds built-in evaluators, sampling, CI/CD thresholds, and
      custom evaluations. (Paraphrase.)
    source: https://aws.amazon.com/about-aws/whats-new/2026/03/agentcore-evaluations-generally-available/
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  agent_optimization:
    product: AgentCore Optimization
    status: preview
    notes: >
      Optimization provides Insights, Recommendations, and Experiments for improving
      agent configurations. AWS pricing still states that Insights is free during public
      preview and that pricing will be announced before general availability. Do not
      upgrade this capability to GA without a later AWS stage announcement. (Paraphrase.)
    source: https://aws.amazon.com/bedrock/agentcore/pricing/
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  agent_payments:
    product: AgentCore Payments
    status: ga
    notes: >
      Payments lets agents access paid APIs, MCP servers, and content through wallet
      providers and open payment protocols, with spending limits and observability.
      AWS announced AgentCore Payments as generally available in August 2026. (Paraphrase.)
    source: https://aws.amazon.com/about-aws/whats-new/2026/08/bedrock-agentcore-payments-ga/
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  web_search_tool:
    product: AgentCore Web Search API and Web Search tool
    status: ga
    notes: >
      AWS announced the Web Search API as generally available in November 2026. The API
      returns ranked results from the Amazon-operated web index, supports domain and
      publication-time filters, and is also available as an MCP tool through AgentCore
      Gateway. The announcement lists six API Regions; the current Region table records
      the separate Web Search Tool footprint. (Paraphrase.)
    source: https://aws.amazon.com/about-aws/whats-new/2026/11/amazon-bedrock-agentcore-web-search-api/
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  runtime_regions:
    status: documented
    value:
      runtime_microvms: 24
      runtime_instances: 16
      gateway_identity_builtin_tools_observability: 24
      memory: 16
      payments: 12
      policy: 22
      evaluations: 22
      optimization: 21
      registry: 9
      web_search_tool: 6
      web_search_api: 5
      web_answer: 1
    notes: >
      Counts are derived from the current AWS Region table, which now includes China
      Regions and newly added commercial and GovCloud coverage. The table distinguishes
      Runtime microVMs from Runtime Instances and lists Web Search Tool, Web Search API,
      and Web Answer separately. Counts are not a uniform AgentCore-wide Region count.
      (Paraphrase.)
    source: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/agentcore-regions.html
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  pricing_axes:
    status: documented
    value: [per_second_compute, per_instance_hour, per_request, per_token, pass_through]
    notes: >
      Current pricing is modular and consumption-based with no upfront commitments or
      minimum fees. Runtime now has microVM consumption pricing and EC2-backed Instances
      pricing; Gateway, Identity, Policy, Registry, Evaluations, Web Search, Memory,
      Observability, and sandbox tools have their own request, token, record, or
      CloudWatch-related billing dimensions. Managed session storage remains in public
      preview at no charge. (Paraphrase.)
    source: https://aws.amazon.com/bedrock/agentcore/pricing/
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  training_data_policy:
    status: unknown
    notes: >
      The current AgentCore overview, pricing page, and release notes reviewed here
      describe services and billing but do not provide a complete current customer-data
      training or service-improvement policy. Preserve unknown rather than carry forward
      an older unverified claim. (Paraphrase.)
    source: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/what-is-bedrock-agentcore.html
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  separately_billed_primitives:
    status: documented
    notes: >
      The current pricing page bills AgentCore features independently. Runtime compute,
      Gateway, Identity outside Runtime or Gateway, Memory, Observability, Evaluations,
      Optimization's underlying services, Registry, Web Search, Policy, Browser, Code
      Interpreter, and related storage or network charges can appear on separate billing
      dimensions. (Paraphrase.)
    source: https://aws.amazon.com/bedrock/agentcore/pricing/
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  runtime_sla:
    status: unknown
    notes: >
      The current AgentCore FAQ page reviewed for this refresh does not state a current
      runtime uptime percentage or other AgentCore-specific SLA commitment. Preserve
      unknown rather than carry forward a Bedrock SLA figure that the current source does
      not expose. (Paraphrase.)
    source: https://aws.amazon.com/bedrock/agentcore/faqs/
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  long_running_agents:
    status: documented
    notes: >
      Serverless Runtime sessions support workloads up to 8 hours. The generally
      available Runtime Instances compute type supports sessions up to 14 days and is
      intended for sustained, resource-intensive, or specialized-hardware workloads.
      (Paraphrase.)
    source: https://aws.amazon.com/about-aws/whats-new/2026/08/aws-bedrock-agentcore-runtime-instances-generally-available/
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  knowledge_base:
    status: unknown
    notes: >
      The current AgentCore overview lists Memory and does not document a native AgentCore
      knowledge-base service or document-retrieval feature. Absence on this overview is not
      a positive unsupported statement, so preserve unknown; Bedrock Knowledge Bases is a
      separate service and is not scored here. (Paraphrase.)
    source: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/what-is-bedrock-agentcore.html
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  guardrails:
    status: documented
    notes: >
      Policy creates deterministic controls around agent-tool interactions and can use
      information providers such as Bedrock Guardrails for signals used in decisions.
      This is an AgentCore Policy integration, not a claim that standalone Bedrock
      Guardrails is an AgentCore service. (Paraphrase.)
    source: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/policy.html
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  private_networking:
    status: ga
    notes: >
      AWS's AgentCore general availability announcement says all AgentCore services have
      support for VPC, AWS PrivateLink, CloudFormation, and resource tagging. Current
      documentation also describes VPC and PrivateLink paths for supported services.
      (Paraphrase.)
    source: https://aws.amazon.com/about-aws/whats-new/2025/10/amazon-bedrock-agentcore-available/
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  iac_coverage:
    status: documented
    notes: >
      CloudFormation support is documented for AgentCore services in the GA announcement.
      The current Registry GA announcement additionally names Terraform and the AWS CDK
      for Registry management; this row does not generalize those IaC tools to every
      AgentCore service. (Paraphrase.)
    source: https://aws.amazon.com/about-aws/whats-new/2026/08/aws-agent-registry-generally-available/
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  certifications:
    status: documented
    value:
      certified: [HIPAA eligible, "FedRAMP (Class C and Class D)", SOC 2, "ISO 27001:2022", "ISO 27017:2015",
                  "ISO 27018:2019", "ISO 27701:2019", "ISO 22301:2019", "ISO 20000-1:2018",
                  "ISO 9001:2015", CSA STAR]
      self_assessed_pending_audit: [BIO, C5, CISPE, CPSTIC, "ENS High", FINMA, GNS, GSMA,
                                    HITRUST, IRAP, ISMAP, MTCS, OSPAR, PCI, Pinakes, PiTuKri]
    notes: >
      AWS now lists AgentCore as HIPAA eligible, FedRAMP Class C and Class D, SOC 2,
      multiple ISO standards, and CSA STAR compliant. AWS separately says the remaining
      programs are internally assessed and await third-party audit cycles, so they remain
      separated here from attested/compliant programs. (Paraphrase.)
    source: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/compliance-validation.html
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"
