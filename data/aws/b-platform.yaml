      Insights as the preview exception. The Insights docs page (a different page, https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/insights.html) says
      "Legacy Insights preview is deprecated". New report-style Insights jobs stopped on
      2026-10-16, and current Insights run inside online or batch evaluations. That page
      states no stage for the current Insights. (Paraphrase of the last two sentences.)
