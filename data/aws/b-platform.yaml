      2025-12-02, a different page;
      https://aws.amazon.com/about-aws/whats-new/2025/12/nova-2-foundation-models-amazon-bedrock/).
    source: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/gateway-target-connectors.html
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  guardrails:
    status: documented
    notes: >
      AgentCore Policy provides guardrails integration — not the same service as standalone
      Bedrock Guardrails, but integrated:
      "Policy in Amazon Bedrock AgentCore enables developers to define and enforce security
      controls for AI agent interactions with tools by creating a protective boundary around
      agent operations."
      "you can also consult information providers, such as Guardrails, that emit a signal at
      evaluation time — such as a content-safety or prompt-attack score — and make decisions
      based on the emitted score."
      Policy uses Cedar language or natural language for deterministic enforcement, and the
      page now also covers authoring in Dogwood. Content safety/prompt-injection scoring
      comes via the Guardrails provider integration.
    source: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/policy.html
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  human_in_the_loop:
    product: AgentCore Harness inline functions + Gateway MCP elicitation
    status: documented
    notes: >
      HARNESS: inline functions are "Tool schemas that execute on the client side, not on
      the harness VM." "The harness pauses when the tool is called and returns the call to
      your code, which decides what to do and sends a result back. This is the pattern for
      human-in-the-loop approvals and custom integrations."
      GATEWAY (a different page;
      https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/gateway-mcp-elicitation.html):
      "Elicitation is an MCP feature that allows an MCP server to request additional
      information from the client during a tool call." "AgentCore Gateway forwards
      elicitation requests from MCP server targets to your clients".
      WORKFLOW: Step Functions can "add human approval before critical actions" around
      harness steps (What's New, another different page;
      https://aws.amazon.com/about-aws/whats-new/2026/06/aws-step-functions-agentcore/).
      No managed approval queue or reviewer UI exists in AgentCore; your client handles
      the pause. (Paraphrase.)
    source: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/harness-tools.html
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  tool_audit_trail:
    product: AgentCore Gateway + AWS CloudTrail (+ AgentCore Observability)
    status: documented
    notes: >
      "Using the information collected by CloudTrail, you can determine the request that
      was made to Gateway, who made the request, when it was made, and additional
      details." There are management events and data events.
      COST AND OPT-IN (a different page;
      https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/enabling-cloudtrail-data-event-logging.html):
      tool calls are data events. "Data event logging incurs additional charges." "You must
      explicitly enable data events as they are not captured by default." So per-call
      audit is off until you build a trail.
      Spans for each tool call also land in CloudWatch through Observability (see
      otel_traces). Harness, Registry, Browser and Web Search API calls have their own
      CloudTrail pages. Whether each record names the end user on whose behalf the call
      ran was not verified here. (Paraphrase of this paragraph.)
    source: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/gateway-cloudtrail.html
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  private_networking:
    status: ga
    notes: >
      Arrived WITH platform GA, and the wording ties the two together — from the
      2025-10-13 What's New announcement (a DIFFERENT source from the docs page cited
      below): "With general availability, all AgentCore services now have support for
      Virtual Private Cloud (VPC), AWS PrivateLink, AWS CloudFormation, and resource
      tagging."
      So VPC + PrivateLink span ALL AgentCore services as of GA, not a subset — stronger
      than the per-service qualifier that applies to Gateway/Identity VPC egress (2026-04).
    source: https://aws.amazon.com/about-aws/whats-new/2025/10/amazon-bedrock-agentcore-available/
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  iac_coverage:
    status: documented
    notes: >
      Same GA announcement establishes CloudFormation coverage across all services:
      "all AgentCore services now have support for ... AWS CloudFormation, and resource
      tagging." CDK/Terraform not addressed by this source; only CloudFormation is named.
      Per the AgentCore release notes (a DIFFERENT source), the aws-bedrockagentcore CDK
      L2 constructs graduated from alpha to stable in aws-cdk-lib, with the Policy submodule
      still alpha. Registry GA (2026-08-31 What's New) added CloudFormation, Terraform and
      CDK provisioning for registries.
    source: https://aws.amazon.com/about-aws/whats-new/2025/10/amazon-bedrock-agentcore-available/
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  certifications:
    status: documented
    value:
      certified: [HIPAA eligible, "FedRAMP (Class C and Class D)", SOC 2, "ISO 27001:2022", "ISO 27017:2015",
                  "ISO 27018:2019", "ISO 27701:2019", "ISO 22301:2019", "ISO 20000-1:2018",
                  "ISO 9001:2015", CSA STAR]
      self_assessed_pending_audit: [BIO, C5, CISPE, CPSTIC, "ENS High", FINMA, GNS, GSMA,
                                    HITRUST, IRAP, ISMAP, MTCS, OSPAR, PCI, Pinakes, PiTuKri]
    notes: >
      MOST COMPLETE COMPLIANCE DISCLOSURE OF ANY PROVIDER IN THIS COMPARISON, and it makes a
      distinction the others do not — attested versus self-assessed:
      ATTESTED: "Amazon Bedrock AgentCore is HIPAA eligible and FedRAMP (Class C and Class
      D), SOC 2 and ISO (27001:2022, 27017:2015, 27018:2019, 27701:2019, 22301:2019,
      20000-1:2018, 9001:2015) and CSA STAR compliant." (FedRAMP Class D added since August.)
      NOT YET AUDITED — read this carefully before relying on it: "AWS has completed its
      internal assessment to validate that Amazon Bedrock AgentCore aligns with the following
      AWS compliance programs: BIO, C5, CISPE, CPSTIC, ENS High, FINMA, GNS, GSMA, HITRUST,
      IRAP, ISMAP, MTCS, OSPAR, PCI, Pinakes and PiTuKri. Our third-party auditors will
      review and test Amazon Bedrock AgentCore during the next audit cycles".
      So PCI and HITRUST are INTERNAL SELF-ASSESSMENT ONLY at this date, not third-party
      attested. A comparison that lumps both lists together would mislead a compliance
      reviewer — hence the split `value` above.
      Audit reports via AWS Artifact. The self-assessed list is unchanged as of 2026-11-23.
    source: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/compliance-validation.html
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  sovereign_cloud:
    product: AgentCore in AWS GovCloud (US-West) and AWS China Regions
    status: documented
    notes: >
      GOV: "Amazon Bedrock AgentCore brings enterprise-grade agentic AI capabilities to
      workloads with elevated compliance needs in the AWS GovCloud (US-West) Region." (What's
      New 2026-05-05, cited.) The region table now shows GovCloud (US-West) for every
      service except Runtime Instances, Payments, Optimization, the Web Search API and Web
      Answer. (Paraphrase; see runtime_regions.) Data in GovCloud "never leaves the
      partition" (a different page;
      https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/cross-region-inference.html).
      CHINA: Beijing and Ningxia are in the region table with Runtime microVMs, Gateway,
      Identity, Built-in Tools and Observability only. (Paraphrase.)
      EUROPEAN SOVEREIGN CLOUD: the AgentCore region table has no AWS European Sovereign
      Cloud column. The Bedrock and AgentCore endpoint pages in the AWS General Reference
      list no ESC endpoint, and the What's New feed has no Bedrock or AgentCore launch
      there as of 2026-11-23. AWS does not positively say it is unavailable, so treat ESC as unavailable
      but unconfirmed. (Paraphrase.)
    source: https://aws.amazon.com/about-aws/whats-new/2026/05/bedrock-agentcore-launch-aws-govcloud-us/
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  web_search_tool:
    product: AgentCore Web Search (Web Search API and Web Search Tool connector)
    status: ga
    notes: >
      Two GA surfaces, each with a vendor-stated stage:
      - Web Search Tool, a Gateway connector called over MCP. The AgentCore release notes
        (a DIFFERENT source; July 2026;
        https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/release-notes.html) say "Web Search Tool is now
        Generally Available". "Built on Amazon's search infrastructure, it combines a
        proprietary web index with structured knowledge graph data."
      - Web Search API (InvokeWebSearch). The What's New post of 2026-11-10 (another
        DIFFERENT source;
        https://aws.amazon.com/about-aws/whats-new/2026/11/amazon-bedrock-agentcore-web-search-api/)
        says "Today, AWS announces the general availability of the Web Search API on Amazon
        Bedrock AgentCore". It adds "The API returns ranked results from the
        Amazon-operated web index behind Web Search on AgentCore." Billing is "$7 per 1,000
        queries, the same rate as Web Search through AgentCore Gateway, with no gateway
        charges".
      Cited page: "Amazon Bedrock AgentCore Web Search lets you search the web from your own
      code with the InvokeWebSearch API." "To narrow the results, you can filter them by
      domain and by publication time." "The API authorizes callers with IAM only. A gateway
      can also authorize callers with a JSON Web Token (JWT)." Default quota: "each account
      can send up to 10 InvokeWebSearch requests per second in each Region". Acceptable use
      requires you to "retain and display the source citations and links".
      REGIONS: the API is in 6 regions (N. Virginia, Ohio, Oregon, Sydney, Tokyo, Ireland).
      "The connector is also available in AWS GovCloud (US-West). The API isn't." So the
      tool is in 7 regions, matching the region table.
      FREE TIER (release notes, November 2026): "the first 5,000 web search queries each
      month at no charge for every AWS account", shared by the API and the tool, except
      in AWS GovCloud (US).
      A separate Web Answer connector (cited answers) is GA in US East (N. Virginia) only,
      at $10 per 1,000 tool calls (release notes and pricing page). (Paraphrase.)
    source: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/web-search-api.html
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"
