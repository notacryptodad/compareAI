provider: gcp
bucket: d
product: Gemini Code Assist
aliases: [Code Assist, Duet AI for Developers]
notes: >
  Gemini Code Assist is Google Cloud's AI coding assistant. Available in Standard
  ($19/seat/mo annual) and Enterprise ($45/seat/mo annual) tiers, plus a free tier for
  individuals. Supports VS Code, JetBrains, Android Studio, Cloud Shell Editor, and
  Cloud Workstations. Includes Gemini CLI quota. Enterprise adds code customization
  (private repo indexing) and IP indemnification.

capabilities:
  ide_integration:
    status: documented
    value: [VS Code, JetBrains, Android Studio, Cloud Shell Editor, Cloud Workstations]
    notes: >
      Five supported environments. VS Code and JetBrains are the primary third-party IDEs.
      Android Studio integration is especially deep (mobile-specific suggestions). Cloud
      Shell Editor and Cloud Workstations are Google Cloud's hosted environments with
      pre-installed Code Assist.
    source: https://cloud.google.com/products/gemini/code-assist
    verified_on: 2026-08-09
    verified_by: "@notacryptodad"

  cli_agent:
    status: documented
    notes: >
      Gemini CLI usage is included in Code Assist subscriptions. The Gemini CLI is a
      separate tool (open source) that provides terminal-based AI assistance. Code Assist
      subscribers get CLI quota as part of their plan — no separate billing. The CLI
      supports agentic workflows, tool use, and MCP.
    source: https://cloud.google.com/products/gemini/code-assist
    verified_on: 2026-08-09
    verified_by: "@notacryptodad"

  agentic_coding:
    status: documented
    notes: >
      Agentic chat mode in Code Assist supports multi-step task execution with tool use.
      The agent can read files, run commands, and make edits across multiple files.
      Combined with MCP support, the agent can access external tools and data sources.
      Gemini CLI adds full agentic coding from the terminal.
    source: https://cloud.google.com/products/gemini/code-assist
    verified_on: 2026-08-09
    verified_by: "@notacryptodad"

  model_choice_coding:
    status: documented
    value: [Gemini 2.5 Pro, Gemini 2.5 Flash]
    notes: >
      Uses Gemini models — 2.5 Pro for complex tasks, 2.5 Flash for speed. Model
      selection is automatic based on task type. Unlike Copilot, users cannot bring
      arbitrary third-party models. The model choice is within the Gemini family only.
    source: https://cloud.google.com/products/gemini/code-assist
    verified_on: 2026-08-09
    verified_by: "@notacryptodad"

  model_choosable:
    status: documented
    notes: >
      Limited choice — within Gemini model family only. Not comparable to Copilot's
      open marketplace of 12+ models from multiple providers. Users get Gemini models
      appropriate to their task; the system auto-routes.
    source: https://cloud.google.com/products/gemini/code-assist
    verified_on: 2026-08-09
    verified_by: "@notacryptodad"

  mcp_support_coding:
    status: documented
    notes: >
      MCP support in agentic chat mode. Code Assist can connect to MCP servers for
      extended context and tool access. Available in VS Code and the Gemini CLI.
      Supports both local and remote MCP servers.
    source: https://cloud.google.com/products/gemini/code-assist
    verified_on: 2026-08-09
    verified_by: "@notacryptodad"

  codebase_indexing:
    status: documented
    notes: >
      Two levels: Standard tier uses large context windows for local codebase awareness
      (no server-side indexing). Enterprise tier adds "code customization" — private repos
      are indexed server-side, re-indexed every 24 hours, enabling suggestions grounded in
      the organization's codebase. Enterprise indexing supports GitHub, GitLab, and
      Bitbucket repos.
    source: https://cloud.google.com/products/gemini/code-assist
    verified_on: 2026-08-09
    verified_by: "@notacryptodad"

  code_review:
    status: documented
    notes: >
      Code review capabilities available. Code Assist can explain code, suggest
      improvements, and review changes. However, a dedicated PR-level review feature
      (like Copilot's automated PR review that runs on every PR) is not as prominently
      documented. The focus is on in-IDE review rather than CI/CD-integrated review.
    source: https://cloud.google.com/products/gemini/code-assist
    verified_on: 2026-08-09
    verified_by: "@notacryptodad"

  code_data_retention:
    status: documented
    notes: >
      Strong enterprise data guarantees: "Your data is your data." Code Assist does not
      use customer code for model training. Enterprise tier adds VPC Service Controls
      (VPC-SC) support for network-level data isolation. IP indemnification is included
      in Enterprise tier for code suggestions. Prompts and responses are not stored beyond
      the session.
    source: https://cloud.google.com/products/gemini/code-assist
    verified_on: 2026-08-09
    verified_by: "@notacryptodad"

  coding_seat_pricing:
    status: documented
    value:
      standard_annual: $19/seat/month
      standard_monthly: $22.80/seat/month
      enterprise_annual: $45/seat/month
      enterprise_monthly: $54/seat/month
      free: $0
    notes: >
      Three tiers. Free for individuals (limited). Standard at $19/seat/month (annual
      commitment) or $22.80 (monthly). Enterprise at $45/seat/month (annual) or $54
      (monthly). Enterprise adds code customization, VPC-SC, IP indemnification, and
      admin controls.
    source: https://cloud.google.com/products/gemini/code-assist
    verified_on: 2026-08-09
    verified_by: "@notacryptodad"

  coding_free_tier:
    status: documented
    notes: >
      Free tier available for individual developers. Includes code completion, chat, and
      basic features. No seat commitment required. Upgrade to Standard or Enterprise for
      team features, higher limits, and code customization.
    source: https://cloud.google.com/products/gemini/code-assist
    verified_on: 2026-08-09
    verified_by: "@notacryptodad"

  launch_stage_investigation:
    status: documented
    notes: >
      Gemini Code Assist has been generally available since its rename from Duet AI
      (2024). No "preview" label on the current product. Individual features within it
      (like agentic mode, MCP support) may have their own maturity levels, but the core
      product is GA and commercially available.
    source: https://cloud.google.com/products/gemini/code-assist
    verified_on: 2026-08-09
    verified_by: "@notacryptodad"
