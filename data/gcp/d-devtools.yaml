provider: gcp
bucket: d
product: Antigravity
aliases:
  - Antigravity IDE
  - Antigravity CLI
  - Gemini Code Assist
  - Gemini Code Assist Standard
  - Gemini Code Assist Enterprise
  - Gemini CLI
  - Code Assist
  - Duet AI for Developers
notes: >
  Google Cloud's current developer-tool transition is from Gemini Code Assist to Antigravity.
  Google says new Gemini Code Assist Standard and Enterprise subscriptions stopped being
  available on 2026-10-09, while existing subscriptions continue under the stated renewal
  and contract dates. The sunset page directs future agentic coding users to Antigravity,
  which is included in Gemini Enterprise editions. (Paraphrase.)

capabilities:
  ide_integration:
    status: documented
    value: [Antigravity IDEs, VS Code, JetBrains, Android Studio]
    notes: >
      Current Google documentation lists Antigravity IDEs and Android Studio among Gemini
      Enterprise AI developer tools. The migration page also identifies Antigravity IDE
      extensions for VS Code and JetBrains. (Paraphrase.)
    source: https://docs.cloud.google.com/gemini/enterprise/docs/locations
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  cli_agent:
    status: documented
    value: [Antigravity CLI, Gemini CLI]
    notes: >
      Google directs future agentic coding toward Antigravity CLI. Gemini CLI remains documented
      as an open-source local or Cloud Shell agent with a ReAct loop and local or remote MCP
      servers, but the current page warns that Gemini CLI is not optimized for the latest Gemini
      models. (Paraphrase.)
    source: https://docs.cloud.google.com/gemini/docs/codeassist/gemini-cli
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  agentic_coding:
    status: documented
    notes: >
      Existing Gemini Code Assist agent mode supports multi-step tasks, built-in tools, MCP
      servers, plans, and approval of tool use, but its current documentation labels the feature
      Preview. Google separately says future agentic coding assistance will be delivered through
      Antigravity. No separate Antigravity launch stage is asserted here. (Paraphrase.)
    source: https://docs.cloud.google.com/gemini/docs/codeassist/agent-mode
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  model_choice_coding:
    status: documented
    value: [Gemini 3.x]
    notes: >
      The current Code Assist transition page says support will be limited to the Gemini 3.x
      model family. The current Gemini Enterprise product page describes automated routing among
      available models rather than a fixed model selection promise. (Paraphrase.)
    source: https://docs.cloud.google.com/gemini/docs/codeassist/sunset
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  model_choosable:
    status: documented
    notes: >
      Gemini Enterprise describes automatic model routing, while third-party model choice is
      identified as early access on the current product page. The reviewed material does not
      establish unrestricted end-user choice across all models. (Paraphrase.)
    source: https://cloud.google.com/gemini-enterprise
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  mcp_support_coding:
    status: documented
    notes: >
      Current Gemini Code Assist agent-mode documentation supports configuring MCP servers, and
      Gemini CLI documentation describes both local and remote MCP servers. These claims apply
      to the existing Code Assist and Gemini CLI documentation while Google's developer-tool
      transition to Antigravity proceeds. (Paraphrase.)
    source: https://docs.cloud.google.com/gemini/docs/codeassist/agent-mode
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  codebase_indexing:
    status: unknown
    notes: >
      Existing Gemini Code Assist Enterprise documentation supports code customization from
      private GitHub, GitLab, and Bitbucket repositories. The current transition documentation
      does not establish that this capability is available under Antigravity on the same terms,
      so the current product row remains unknown. (Paraphrase.)
    source: https://docs.cloud.google.com/gemini/docs/codeassist/overview
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  code_review:
    status: unknown
    notes: >
      The reviewed current Antigravity and Gemini Enterprise pages do not document a dedicated
      pull-request or CI-integrated code-review feature. The prior Gemini Code Assist description
      is not carried forward as current Antigravity evidence. (Paraphrase.)
    source: https://cloud.google.com/gemini-enterprise
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  code_data_retention:
    status: documented
    notes: >
      The current Gemini Enterprise product page states that customer data, including prompts,
      outputs, and model tuning, is not used to train Google's models or another customer's
      models. Existing Code Assist security documentation separately says prompts and responses
      are stateless and not stored in Google Cloud by default. (Paraphrase.)
    source: https://cloud.google.com/gemini-enterprise
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  coding_seat_pricing:
    status: unknown
    notes: >
      New Gemini Code Assist Standard and Enterprise subscriptions can no longer be purchased
      after 2026-10-09, and the current Antigravity transition pages do not provide a standalone
      comparable seat price. Existing Code Assist pricing is not carried forward as current
      Antigravity pricing. (Paraphrase.)
    source: https://docs.cloud.google.com/gemini/docs/codeassist/sunset
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  coding_free_tier:
    status: unknown
    notes: >
      The current transition documentation does not establish a current free Antigravity tier.
      The older individual Gemini Code Assist offering is not treated as evidence for the new
      product because Google has moved the agentic coding path to Antigravity. (Paraphrase.)
    source: https://docs.cloud.google.com/gemini/docs/codeassist/sunset
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  launch_stage_investigation:
    status: documented
    notes: >
      Gemini Code Assist Standard and Enterprise are in a sunset and migration period: new
      subscriptions are closed, existing subscriptions have published renewal limits, and
      Antigravity is the stated future route for agentic coding. The reviewed first-party pages
      identify early-access features but do not give one overall Antigravity stage label, so GA
      is not inferred. (Paraphrase.)
    source: https://docs.cloud.google.com/gemini/docs/codeassist/sunset
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"
