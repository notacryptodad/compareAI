provider: gcp
bucket: a
product: Agent Development Kit (ADK)
aliases: [ADK, google-adk, adk-python, Agents CLI]
repo: https://github.com/google/adk-python
docs: https://adk.dev/
notes: >
  ADK remains Google's open-source, code-first agent framework. The current ADK site lists
  Python, TypeScript, Go, Java, and Kotlin, and now presents graph workflows and Agents CLI
  as first-class parts of the developer experience. The Python repository's current release
  history is at v2.15.0 (2026-11-19). (Paraphrase.)

capabilities:
  sdk_languages:
    status: documented
    value: [python, typescript, go, java, kotlin]
    notes: >
      The current ADK homepage lists Python, TypeScript, Go, Java, and Kotlin. (Paraphrase.)
    source: https://adk.dev/
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  authoring_mode:
    status: documented
    value: code-first
    notes: >
      ADK is presented as an open-source agent development framework whose examples are
      written as code and whose site supports local development and deployment workflows.
      (Paraphrase.)
    source: https://adk.dev/
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  workflow_engine:
    status: documented
    product: Graph Workflows
    notes: >
      ADK 2.0 introduces graph-based workflows for deterministic execution paths alongside
      adaptive AI reasoning. The current site describes this as a new ADK 2.0 capability.
      (Paraphrase.)
    source: https://adk.dev/
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  multi_agent_patterns:
    status: documented
    product: Multi-agent orchestration
    notes: >
      The current ADK site describes growth from single agents to multi-agent orchestration,
      but does not prescribe a named supervisor or swarm topology. (Paraphrase.)
    source: https://adk.dev/
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  human_in_the_loop:
    status: documented
    notes: >
      ADK's current site describes workflows that can handle human input as part of complex
      agentic systems. The page does not state a separate launch stage for this capability.
      (Paraphrase.)
    source: https://adk.dev/
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  local_dev_loop:
    status: documented
    product: Agents CLI
    notes: >
      The current ADK site promotes Agents CLI for scaffolding, building, testing, evaluating,
      and deploying agents, and provides setup guides for starting locally. (Paraphrase.)
    source: https://adk.dev/
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  mcp_client:
    status: documented
    notes: >
      ADK's first-party documentation and language APIs include MCP tooling. The available
      evidence supports ADK agents consuming MCP tools; it does not establish one identical
      MCP feature set across all five language implementations. (Paraphrase.)
    source: https://adk.dev/
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  openapi_import:
    status: documented
    notes: >
      ADK documentation includes custom-tool integrations for connecting agents to external
      services. The current homepage does not itself state a launch stage for OpenAPI import,
      so this remains documented rather than GA. (Paraphrase.)
    source: https://adk.dev/
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  cross_cloud_model_adapters:
    status: documented
    notes: >
      The ADK FAQ says the framework can work with almost any generative AI model and provides
      adapters for other model providers and locally running models. (Paraphrase.)
    source: https://adk.dev/
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  in_repo_eval:
    status: documented
    notes: >
      ADK is described as supporting performance evaluation, and the current site presents
      evaluation as part of the framework and developer lifecycle. A separate vendor-hosted
      evaluation service is outside this SDK row. (Paraphrase.)
    source: https://adk.dev/
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  oss_license:
    status: documented
    value: Apache-2.0
    notes: >
      The official google/adk-python repository identifies the project as Apache-2.0 licensed.
      (Paraphrase.)
    source: https://github.com/google/adk-python
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  oss_governance:
    status: documented
    value: single-vendor
    notes: >
      The repository is maintained in Google's official GitHub organization. No foundation or
      multi-vendor governance model is stated in the reviewed first-party repository material.
      (Paraphrase.)
    source: https://github.com/google/adk-python
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  oss_release_cadence:
    status: documented
    notes: >
      The official release page currently shows ADK Python v2.15.0 dated 2026-11-19. The
      repository's current release history, rather than a fixed cadence claim, is the reliable
      evidence for this refresh. (Paraphrase.)
    source: https://github.com/google/adk-python/releases
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  oss_runtime_lockin:
    status: none
    notes: >
      ADK's current FAQ says agents can be containerized and run on the builder's own
      infrastructure, or deployed to Google Cloud services. Google Cloud deployment is
      therefore documented as an option rather than a stated requirement. (Paraphrase.)
    source: https://adk.dev/
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  oss_community:
    status: documented
    notes: >
      The official repository remains active and has a current release stream, but this
      refresh does not record a precise star or contributor count because those values change
      continuously and are not stable product evidence. (Paraphrase.)
    source: https://github.com/google/adk-python
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  sdk_telemetry_phone_home:
    status: documented
    notes: >
      ADK is open source and its current public documentation describes deployment and
      observability choices, but the reviewed homepage does not establish a complete current
      statement about default telemetry for every language package. The prior no-phone-home
      claim is therefore not strengthened here. (Paraphrase.)
    source: https://github.com/google/adk-python
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"
