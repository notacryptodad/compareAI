      Agent Studio — "All configuration files for created agents are stored in the
      us-west1 region." (a different page,
      https://docs.cloud.google.com/gemini-enterprise-agent-platform/agent-studio/design-agents);
      Agent Gateway for GKE Preview is europe-west1 and us-central1 only (release notes);
      Gemini 4 Carbon is limited to select regions; Code Execution EU / in-country residency
      conflicts are in data_residency. Model availability per region is on each model
      page. (Paraphrase except quoted text.)
    source: https://docs.cloud.google.com/gemini-enterprise-agent-platform/resources/agent-locations
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  service_limits:
    product: Agent Runtime
    status: documented
    notes: >
      TERMINAL (non-adjustable) LIMITS: "Gemini Enterprise Agent Platform enforces a maximum
      of 6,000 revisions per project per region" and 950 revisions per agent; "These limits
      are not adjustable." Older revisions are auto-pruned, but "if there are not enough
      eligible revisions to delete (for example, if all revisions are serving traffic),
      attempts to create new revisions fail." — the same failure mode as Azure's revision cap.
      ADJUSTABLE QUOTAS (quotas page, a different page,
      https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/quotas): "The
      following quotas apply to Agent Runtime for a given project in each region" —
      defaults include 100 Agent Runtime resources, 90 query/stream-query requests per
      minute, 10 concurrent BidiStreamQuery connections, 100 session writes and 300 event
      appends per minute, 100 Memory Bank writes and 300 reads per minute, 1,000 sandbox
      entities, and 60 A2A post / 600 get requests per minute.
      Other fixed ceilings: Code Execution 100 MB request/response and 14-day state (see
      code_interpreter); Skill Registry 10 MB zipped / 500 MB unzipped (see
      skills_registry); session user IDs up to 128 characters. (Paraphrase except quoted text.)
    source: https://docs.cloud.google.com/gemini-enterprise-agent-platform/scale/runtime/manage-revisions-and-traffic
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  launch_stage_investigation:
    product: Gemini Enterprise Agent Platform (Agent Runtime, formerly Vertex AI Agent Engine)
    status: ga
    notes: >
      HEADLINE STAGE: "Vertex AI Agent Engine is now generally available (GA)." — 2025-03-04,
      under the pre-rename name (a different page,
      https://docs.cloud.google.com/vertex-ai/generative-ai/docs/release-notes). Convention (2026-11-23 fact-check): this meta-row carries the headline product's stated stage, the same rule as byteplus/b-platform, alibaba/b-platform and aws/d-devtools.
      WHERE GCP STATES STAGES (2026-11-23 sweep): (1) this Agent Platform release-notes feed
      for 2026 events, e.g. "Agent Observability is generally available (GA)"; (2) the
      legacy Vertex AI release notes for 2025 events, filed under old names (Agent Engine,
      Agent Builder); (3) Pre-GA banners on individual pages — Managed Agents API, A2A on
      Agent Runtime, bidirectional streaming, revisions and traffic splitting, Agent Studio
      design agents, Skill Registry, semantic governance, custom-weights deployment; (4)
      per-version "Launch stage" rows on Gemini model pages; (5) the Conversational
      Analytics API's own release notes; (6) the 2026-07-29 blog's collective newly-GA
      wording (see eval_service).
      NEGATIVE RESULTS (checked, no stage found): the scale overview, Agent Runtime, ADK,
      sessions, memory-bank, sandbox and pricing pages; no GA entry for Code Execution in
      either feed; no Agent Runtime SLA (see runtime_sla); token management policies are
      "coming soon" (early access only); Gemini Distillation Service is Early Access.
      (Paraphrase except quoted text.)
    source: https://docs.cloud.google.com/gemini-enterprise-agent-platform/release-notes
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  pricing_axes:
    status: documented
    notes: >
      RESOURCE-BASED, not just tokens: "Gemini platform products to Scale have a unified
      pricing structure, using 3 resource types: Compute, Memory and Storage."
      "Runtime and Sandbox environments, including Code Execution and Computer Use, are
      billed on Agent Compute (vCPU-hours) and Agent Memory (GiB-hours) resource usage."
      Listed rates: Agent Compute $0.085/vCPU-h, Agent Memory $0.009/GiB-h; "For Runtime,
      idle time spent waiting for the next prompt between turns is not billed."
      Memory Bank: storage $0.30/GiB-month plus read/write operations billed as Agent
      Compute; model tokens for memory generation billed separately. Agent Gateway and
      Semantic Governance Policies are also metered as Agent Compute.
      Model calls are billed per token under their own model SKUs (paraphrase).
      SOURCE CHANGE 2026-11-23: the old source (scale page) does not state pricing; this
      cell now cites the pricing page. The August note's token-based-only, no-flat-rate
      framing was incomplete.
    source: https://cloud.google.com/products/gemini-enterprise-agent-platform/pricing
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  separately_billed_primitives:
    status: documented
    notes: >
      EVERYTHING METERS AS AGENT COMPUTE / MEMORY / STORAGE, but each primitive has its own
      conversion rate. Runtime and sandboxes: vCPU-hours and GiB-hours (see pricing_axes).
      Agent Gateway: "Agent Compute vCPU-h ($0.085) corresponds to 15,000 API calls or
      Authorization requests processed via Agent Gateway" (billing from 2026-07-13).
      Memory Bank and Sessions: storage at $0.30/GiB-month plus read operations (per 3
      million) and write operations (per 1 million); "Sessions billing on this pricing
      structure will commence on September 1st, 2026." For Memory Bank, "model tokens used
      for memory generation and embeddings are billed separately under their respective
      model SKUs". Semantic governance: "1 Agent Compute vCPU-h ($0.085) for every 15,000
      agent-model response evaluations" plus evaluation-model tokens (billing "later in
      2026"). Skill Registry: storage plus operations, "Skills Registry billing will
      commence on September 1st, 2026." Model tokens, grounding and explicit context-cache
      storage bill under their own SKUs. (Paraphrase except quoted text.)
    source: https://cloud.google.com/products/gemini-enterprise-agent-platform/pricing
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  free_tier_commitments:
    status: documented
    notes: >
      COMMITMENTS: the Agent Compute / Memory / Storage table has "Gemini Enterprise Flexible
      Savings Plan - 1 Year" and "Gemini Enterprise Flexible Savings Plan - 3 Year" columns
      (Agent Compute $0.0765 and $0.068 per vCPU-h vs $0.085 on demand); the page also
      offers "discounted rates for prepaid resources". For models, Provisioned Throughput
      is a fixed-term subscription (1-week, 1-month, 3-month and 1-year plans per the
      consumption-options page).
      FREE TIER: the Vertex AI release notes (2025-11-07, a different page,
      https://docs.cloud.google.com/vertex-ai/generative-ai/docs/release-notes) say "Use the
      new free tier with Vertex AI Agent Engine Runtime." alongside Express mode GA; the
      current Agent Platform pricing page does not restate a runtime free-tier allowance, so
      its size is unconfirmed.
      MARKETPLACE: self-deployed partner model licences are bought through Cloud
      Marketplace (see byo_open_weights); no Marketplace listing for Agent Runtime itself
      was located. (Paraphrase except quoted text.)
    source: https://cloud.google.com/products/gemini-enterprise-agent-platform/pricing
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  runtime_sla:
    status: unknown
    notes: >
      NO AGENT RUNTIME SLA FOUND — hence `unknown` (cross-provider rule: documented only if
      an SLA covers the agent runtime itself). CAVEAT: the cited SLA covers the MODEL API,
      not the agent runtime: "Covered Service" means
      "the generateContent and streamGenerateContent methods of Gemini Online Inference
      API on Gemini Enterprise Agent Platform." 99.5% Monthly Uptime, or 95% for models
      "designated for shorter availability". Provisioned Throughput adds a 99% Monthly
      Latency Target Attainment SLO: covered service is "streamGenerateContent methods of
      Gemini Online Inference API on Gemini Enterprise Agent Platform under Provisioned
      Throughput consumption model for a Covered Model from a Covered Endpoint"; "Covered
      Models" means Gemini 2.5 Pro, Gemini 2.5 Flash, and Gemini 2.5 Flash-lite, and
      "Covered Endpoint" means the Global Endpoint. Latency targets are p50 output tokens
      per second over 5-minute intervals (60 / 80 / 110 TPS, excluding long context);
      latency credits are 10% at 95-99%, 25% at 90-95%, 50% below 90%. Still model
      inference, not the agent runtime. (Paraphrase except quoted text.)
      Financial credits (uptime): 10% at 99.0-99.5%, 25% at 95-99%, 50% below 95%.
      Claim window: notify support "within 30 days", with log files showing downtime.
      Measured per calendar month per Project.
      REMOVED 2026-11-23: the August note also claimed a 99.9% Agent Search API SLA on
      this page; that text is not on this page, so it is no longer asserted here. No
      Agent Runtime-specific SLA was found.
    source: https://cloud.google.com/vertex-ai/generative-ai/sla
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  long_running_agents:
    status: documented
    notes: >
      EXPLICIT CAP NOW DOCUMENTED: "Agent Runtime now supports long-running operations (up
      to 7 days)." — 2026-04-22, Gemini Enterprise Agent Platform release notes (the August
