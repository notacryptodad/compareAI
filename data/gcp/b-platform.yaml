provider: gcp
bucket: b
product: Gemini Enterprise Agent Platform
aliases:
  - Vertex AI Agent Engine
  - Vertex AI Reasoning Engine
  - Agent Platform Runtime
  - Agent Engine
notes: >
  RENAMED — and a rebrand still visibly in progress. "Vertex AI Agent Engine" does NOT
  appear anywhere on the current overview or deploy pages. The umbrella name is now
  "Gemini Enterprise Agent Platform"; the runtime is called both "Agent Runtime" and
  "Agent Platform Runtime" on the same page, and shortened to "Agent Platform" in prose.
  LAUNCH STAGES RESOLVED — but NOT from the product docs. The overview, deploy and scale
  pages carry no GA/Preview label for any service. The stages live in the VERTEX AI
  RELEASE NOTES, still published under the old Vertex AI path even though the product was
  renamed to Gemini Enterprise Agent Platform:
    2025-03-04  "Vertex AI Agent Engine is now generally available (GA)."
    2025-07-08  Memory Bank enters Preview
    2025-09-10  Code Execution enters Preview
    2025-11-07  Agent Runtime Express mode reaches GA
    2025-12-16  Sessions and Memory Bank reach GA
  So the platform has been GA since March 2025 — three earlier research passes recorded it
  as stage-unknown because the docs never say so.
  METHOD LESSON, same as AWS: launch stage may exist ONLY in a release-notes or
  announcement feed, and may be filed under the product's OLD name after a rename.
  The locations page separately says in-country regions are "in GA with allowlist" —
  recorded as `limited`, since GA-behind-an-allowlist is gated in practice.
  Docs last updated 2026-07-31 UTC.
  URL HISTORY (a live example of why check_links.py exists): content was read at
  /vertex-ai/generative-ai/docs/agent-engine/overview, which now 301-redirects to
  /gemini-enterprise-agent-platform/scale — sources below use the canonical target.
  cloud.google.com also 301-redirects to docs.cloud.google.com. Legacy "Vertex AI"
  naming still survives in some feature labels.

capabilities:
  data_residency:
    status: documented
    notes: >
      PER-SERVICE RESIDENCY GAP, and Code execution is the outlier — this is the kind of
      detail that breaks a compliance design late:
      Memory Bank, Sessions and Runtime: "At-rest DRZ supported" in BOTH the US/EU
      multi-regions AND all five in-country regions.
      Code execution: "At-rest DRZ supported in US" but "At-rest DRZ not supported in EU",
      and "At-rest DRZ not supported" in-country at all.
      So an EU-resident agent that needs sandboxed code execution cannot keep that data
      in-region. Note also that this table covers at-rest data-residency only and makes no
      machine-learning-processing (MLP) claims, unlike the Gemini Enterprise tables.
    source: https://docs.cloud.google.com/gemini/enterprise/docs/locations
    verified_on: 2026-08-04
    verified_by: "@notacryptodad"

  managed_agent_runtime:
    product: Agent Runtime
    status: ga
    notes: >
      "Deploy, operate, and scale agentic applications." Agent Platform is described as a
      fully managed environment for developers (paraphrase). Four pillars:
      "Serverless efficiency",
      "Context management", "Continuous quality improvement", "Secure sandbox execution".
      Status genuinely unlabelled on the page — do not infer GA.
      LAUNCH STAGE (from the Vertex AI release notes, a DIFFERENT source from the page
      cited below): "Vertex AI Agent Engine is now generally available (GA)." — 2025-03-04.
      Also "The following features are now available in GA: Express mode support for
      Vertex AI Agent Engine Runtime." — 2025-11-07.
    source: https://docs.cloud.google.com/gemini-enterprise-agent-platform/scale
    verified_on: 2026-08-04
    verified_by: "@notacryptodad"

  framework_agnosticism:
    status: documented
    value: [ADK, LangGraph, LangChain, LlamaIndex, AG2, A2A, custom]
    notes: >
      Per-framework deployment guides exist for ADK ("Use an Agent Development Kit (ADK)
      agent with Agent Platform Runtime"), LangGraph, LangChain, LlamaIndex ("LlamaIndex
      Query Pipeline agent"), AG2, Agent2Agent (A2A), and custom ("Use a custom agent
      with Agent Platform Runtime").
      NOTABLE GAP: CrewAI is NOT mentioned anywhere on the page — AWS AgentCore names it
      explicitly. Also no guide for a rival cloud's SDK (no Strands, no MS Agent
      Framework), unlike AgentCore which lists Google ADK.
      Status unknown because no GA/preview label is given.
    source: https://docs.cloud.google.com/gemini-enterprise-agent-platform/scale
    verified_on: 2026-08-04
    verified_by: "@notacryptodad"

  short_term_memory:
    product: Sessions
    status: ga
    notes: >
      "Store individual interactions between users and agents."
      Security matrix: VPC-SC, CMEK, data residency at rest, HIPAA, Access Transparency,
      Access Approval all Yes.
      LAUNCH STAGE: "Vertex AI Agent Engine Sessions and Memory Bank are now Generally
      Available." — 2025-12-16, Vertex AI release notes (a DIFFERENT source from below).
    source: https://docs.cloud.google.com/gemini-enterprise-agent-platform/scale
    verified_on: 2026-08-04
    verified_by: "@notacryptodad"

  long_term_memory:
    product: Memory Bank
    status: ga
    notes: >
      Memory Bank stores and retrieves information from sessions to personalize agent
      interactions (paraphrase — the page's exact tagline omits terminal punctuation and
      could not be substring-matched).
      Residency caveat worth surfacing: ML processing "occurs within the specific region
      or multi-region of the model endpoint used by Agent Platform Memory Bank" — i.e.
      residency is inherited from the model endpoint, not independently configurable.
      LAUNCH STAGE: GA as of 2025-12-16 — "Vertex AI Agent Engine Sessions and Memory Bank
      are now Generally Available." Entered preview earlier: "Vertex AI Agent Engine Memory
      Bank is now available in Preview." — 2025-07-08. Both from the Vertex AI release notes
      (a DIFFERENT source from the page cited below), so a ~5-month preview.
    source: https://docs.cloud.google.com/gemini-enterprise-agent-platform/scale
    verified_on: 2026-08-04
    verified_by: "@notacryptodad"

  code_interpreter:
    product: Code Execution (Sandbox)
    status: preview
    notes: >
      Code Execution runs code in a secure, isolated, managed sandbox environment
      (paraphrase). Sandbox also covers "Computer Use" and "Custom containers (BYOC)".
      LAUNCH STAGE — STILL PREVIEW, and this is the sharpest contrast in the comparison:
      "Agent Engine Code Execution , now in Preview, lets your agent run code in an isolated
      sandbox environment." — 2025-09-10, Vertex AI release notes (a DIFFERENT source from
      the page cited below).
      AWS AgentCore Code Interpreter has been GA since 2025-10-13. Google's equivalent is
      still preview ~11 months later, AND it is the one service with no EU at-rest
      residency (see data_residency). Two independent reasons for caution on this row.
      Billing note from the same feed: "On January 28, 2026, Sessions, Memory Bank, and Code
      Execution will begin charging for usage."
    source: https://docs.cloud.google.com/gemini-enterprise-agent-platform/scale
    verified_on: 2026-08-04
    verified_by: "@notacryptodad"

  browser_use:
    product: Computer Use (Sandbox)
    status: documented
    notes: >
      Listed under Sandbox alongside Code Execution and BYOC. Depth not verified from
      this page — no Playwright/BrowserUse equivalent named as AWS does.
    source: https://docs.cloud.google.com/gemini-enterprise-agent-platform/scale
    verified_on: 2026-08-04
    verified_by: "@notacryptodad"

  knowledge_base:
    product: RAG Engine
    status: documented
    notes: >
      RAG Engine plus "Agent Retrieval (formerly Vector Search 2.0) - Intelligent
      Retrieval for AI Applications". A "Migrate from Vector Search 1.0" guide exists —
      so Vector Search 2.0 is a breaking-ish successor worth flagging to users.
    source: https://docs.cloud.google.com/gemini-enterprise-agent-platform/scale
    verified_on: 2026-08-04
    verified_by: "@notacryptodad"

  mcp_registry:
    product: Skill Registry
    status: documented
    notes: >
      Present in navigation. Whether it is MCP-compatible is NOT stated — do not equate
      with AgentCore Registry or Foundry Toolbox without verification.
    source: https://docs.cloud.google.com/gemini-enterprise-agent-platform/scale
    verified_on: 2026-08-04
    verified_by: "@notacryptodad"

  mcp_server_hosting:
    product: Agent Gateway
    status: documented
    notes: >
      "Agent Gateway" appears in navigation; its MCP relationship is unverified.
    source: https://docs.cloud.google.com/gemini-enterprise-agent-platform/scale
    verified_on: 2026-08-04
    verified_by: "@notacryptodad"

  eval_service:
    product: Evaluation Service
    status: documented
    notes: >
      Present, plus Example Store. Security gap worth surfacing: "Agent evaluation" and
      "Example Store" are the only two services marked No for VPC Service Controls, CMEK,
      and data residency at rest — a real compliance constraint.
    source: https://docs.cloud.google.com/gemini-enterprise-agent-platform/scale
    verified_on: 2026-08-04
    verified_by: "@notacryptodad"

  otel_traces:
    status: documented
    notes: >
      Runtime described as having "built-in observability"; tracing, logging and
      monitoring guides exist. OTel conformance not stated.
    source: https://docs.cloud.google.com/gemini-enterprise-agent-platform/scale
    verified_on: 2026-08-04
    verified_by: "@notacryptodad"

  feedback_service:
    product: Feedback service
    status: documented
    notes: >
      "Collect, manage, and trace user qualitative feedback alongside system events and
      telemetry." No direct AWS/Azure equivalent found yet — candidate new taxonomy row
      in d6.
    source: https://docs.cloud.google.com/gemini-enterprise-agent-platform/scale
    verified_on: 2026-08-04
    verified_by: "@notacryptodad"

  private_networking:
    status: documented
    notes: >
      Security matrix: VPC Service Controls = Yes for Agent Runtime, Sessions, Memory
      Bank, Code Execution; No for Agent evaluation and Example Store.
      CMEK follows the same pattern. Access Transparency / Access Approval = Yes for
      Agent Runtime, Sessions, Memory Bank ONLY (not Code Execution).
    source: https://docs.cloud.google.com/gemini-enterprise-agent-platform/scale
    verified_on: 2026-08-04
    verified_by: "@notacryptodad"

  certifications:
    status: documented
    notes: >
      Partial evidence: the enterprise security matrix's HIPAA row reads Yes for all six
      services (Agent Runtime, Agent evaluation, Sessions, Memory Bank, Example Store,
      Code Execution). Table reading, not a sentence on the page.
      Broader cert list (SOC 2, ISO, PCI) not on this page.
    source: https://docs.cloud.google.com/gemini-enterprise-agent-platform/scale
    verified_on: 2026-08-04
    verified_by: "@notacryptodad"

  runtime_regions:
    status: limited
    value:
      multi_regions: [global, us, eu]
      in_country_allowlist: [ca, in, asia-northeast1 (JP), sg, europe-west2 (UK)]
    notes: >
      A COMPLETELY DIFFERENT GEOGRAPHIC MODEL from AWS and Azure — multi-regions rather than
      a long region list, so raw region counts are NOT comparable across these providers:
      - Multi-regions: us = "API availability in the United States"; eu = "API
        availability in the European Union"; plus a global option, recommended unless you
        have security or regulatory reasons to localize, since global is described as giving
        "better end-user response times, the latest model versions, and the most up-to-date
        features."
      - In-country: CA, IN, JP (asia-northeast1), SG, UK (europe-west2).
      STATUS IS `limited` ON EXPLICIT VENDOR WORDING — the in-country regions are
      "Using these locations is in GA with allowlist", obtained by contacting your Google
      account team. GA *with allowlist* is precisely the `limited` case: generally available
      in name, gated in practice. Only 3 of 8 locations are self-serve.
      NOTE THE TRADE-OFF Google states outright: localizing costs you latency AND model
      recency — "the latest model versions" are on global. No other provider here admits a
      feature penalty for data residency.
      Endpoints differ by prefix: eu-discoveryengine.googleapis.com /
      us-discoveryengine.googleapis.com.
      Caveat: the page notes at-rest residency in these locations is subject to limitations,
      and that in-country regions may be more constrained. (Paraphrase.)
    source: https://docs.cloud.google.com/gemini/enterprise/docs/locations
    verified_on: 2026-08-04
    verified_by: "@notacryptodad"
