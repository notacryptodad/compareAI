    verified_by: "@notacryptodad"

  agent_payments:
    product: Agent Payments Protocol (AP2) — open protocol, no managed service
    status: unknown
    notes: >
      PROTOCOL ONLY. Google announced AP2 as "an open protocol developed with leading
      payments and technology companies to securely initiate and transact agent-led
      payments across platforms", usable "as an extension of the Agent2Agent (A2A)
      protocol and Model Context Protocol (MCP)"; crypto rails come via the jointly launched (with Coinbase, Ethereum Foundation,
      MetaMask and others)
      "A2A x402 extension". The AP2 site (a different page, https://ap2-protocol.org/) describes it as "an
      open protocol for the emerging Agent Economy" with samples for card and x402 flows,
      and lists an AP2 v0.2 release and a FIDO Alliance donation.
      NO FIRST-PARTY MANAGED PAYMENTS CAPABILITY on Gemini Enterprise Agent Platform was
      located: the Agent Platform release notes have no payments entry through 2026-11-23,
      and the Managed Agents API, Agent Gateway and Agent Identity pages describe no wallet,
      spending-limit or payment-execution feature (compare AWS AgentCore Payments, GA).
      Google does not positively state that a managed service is unavailable, so the cell
      is `unknown` rather than `none`; AP2 support means you can implement the protocol in
      your own ADK/A2A agent. (Paraphrase except quoted text.)
    source: https://cloud.google.com/blog/products/ai-machine-learning/announcing-agents-to-payments-ap2-protocol
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  guardrails:
    product: Safety Filters + Model Armor + Sensitive Data Protection
    status: documented
    notes: >
      Multi-layered safety system documented:
      1. Default settings — an independent layer "designed to prevent the generation of
      content related to Child Sexual Abuse Material (CSAM) or Copyrighted Content
      (Recitation)."
      2. Configurable content filters — thresholds per harm category (e.g.
      BLOCK_LOW_AND_ABOVE, BLOCK_MEDIUM_AND_ABOVE, BLOCK_ONLY_HIGH); "Only available for
      response filtering, not prompt filtering."
      3. Model Armor — "Prompt injection and jailbreak filtering, content filters,
      sensitive data protection, and malware detection and safe browsing."
      4. Sensitive Data Protection (DLP API) — redaction, masking or tokenization with
      predefined and custom infoType detectors.
      5. Gemini as a filter — a second call to a fast Gemini model to judge safety against
      your own policies.
      Model Armor on Agent Gateway: "Model Armor for Agent Gateway in General Availability"
      per the Agent Platform release notes, 2026-06-24 (a DIFFERENT source from the page cited
      below, https://docs.cloud.google.com/gemini-enterprise-agent-platform/release-notes).
      GATEWAY POLICY LAYER (Agent Gateway overview, also a different page,
      https://docs.cloud.google.com/gemini-enterprise-agent-platform/govern/gateways/agent-gateway-overview): Model Armor
      "scans user prompts and tool responses in real time to block prompt injection
      attacks, sensitive data leaks, and harmful content"; semantic governance policies
      are "Rules written in plain language that control how agents use tools"; plus IAM
      Unified Access Policies and token management policies. Caveat: "Support for token
      management policies and extension bindings is coming soon." — not available yet.
      CORRECTED 2026-11-23: the August note said non-configurable filters block CSAM and
      PII and listed a separate jailbreak classifier; the current page names CSAM and
      copyright (Recitation) only and has no standalone jailbreak classifier.
    source: https://docs.cloud.google.com/gemini-enterprise-agent-platform/govern/safety
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  tool_least_privilege:
    product: Agent Gateway IAM Unified Access Policies (+ semantic governance)
    status: ga
    notes: >
      LAUNCH STAGE (release notes, 2026-08-31): "IAM Unified Access Policies are generally
      available (GA)" — "Agent Gateway uses Identity-Aware Proxy and Access policies to
      govern agentic communication between agent principals and destination resources".
      PER-TOOL POLICY (UAP overview, a different page,
      https://docs.cloud.google.com/gemini-enterprise-agent-platform/govern/policies/iam-overview-uap):
      allow/deny rules with CEL conditions on tool names, HTTP methods and paths; guidance:
      "Use specific tool names or paths in CEL conditions rather than wildcards." Policies
      bind to a project or a single gateway, with a dry-run (audit-only) mode before
      enforcement; Principal Access Boundary can be applied to an agent identity.
      INTENT-BASED LAYER (Preview, a different page,
      https://docs.cloud.google.com/gemini-enterprise-agent-platform/govern/policies/semantic-governance-overview):
      semantic governance "evaluates each proposed tool call, allowing only tool calls that
      don't violate specified policies or deviate from user intent." Per-agent identities
      (see agent_workload_identity) are the principals. (Paraphrase except quoted text.)
    source: https://docs.cloud.google.com/gemini-enterprise-agent-platform/release-notes
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  human_in_the_loop:
    product: ADK Tool Confirmation + Computer use safety confirmations
    status: documented
    notes: >
      COMPUTER USE (this page): when the model's safety_decision flags an action, "your
      application must prompt the end-user for confirmation before executing the
      function_call". The release notes (2026-10-30, a different page,
      https://docs.cloud.google.com/gemini-enterprise-agent-platform/release-notes) mark the
      Computer use tool GA and say "This release introduces comprehensive Human-in-the-Loop
      (HITL) safety governance", with admin-mandated confirmation policies via an org
      constraint.
      GENERAL TOOLS (ADK, a different page, https://adk.dev/tools-custom/confirmation/):
      "The Tool Confirmation feature in the Agent Development Kit (ADK) allows an ADK Tool to
      pause its execution and interact with a user or other system for confirmation or to
      gather structured data before proceeding." — boolean or structured confirmations,
      including remote confirmation over REST.
      Status `documented` rather than `ga`: the GA statement covers computer-use
      confirmations only; general interrupt/approve/resume is an SDK feature with no stage,
      and no managed approval-gate service was found on Agent Gateway or semantic
      governance (they allow or deny, they do not pause for a human).
      (Paraphrase except quoted text.)
    source: https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/computer-use
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  tool_audit_trail:
    product: Agent Gateway access logs + Cloud Audit Logs
    status: documented
    notes: >
      GATEWAY: "Capture enriched Layer 7 and Layer 8 OpenTelemetry traces and access logs in
      Cloud Logging and Cloud Trace for complete auditability." — every governed agent-to-
      tool/MCP/A2A call passes through Agent Gateway.
      ON WHOSE BEHALF (identity delegation page, a different page,
      https://docs.cloud.google.com/gemini-enterprise-agent-platform/govern/identity-delegation-architecture):
      for delegated 3LO calls, "audit logs record both the agent identity and the user
      identity".
      Cloud Audit Logs cover Agent Platform APIs (Admin Activity always on; Data Access
      opt-in), and UAP dry-run violations are written to Cloud Audit Logs.
      CAVEAT (logging page, a different page,
      https://docs.cloud.google.com/gemini-enterprise-agent-platform/scale/runtime/logging):
      "Cloud Logging is not supported for child resources of Agent Runtime, such as Agent
      Platform Sessions" (also Memory Bank, Code Execution, Example Store) — application
      logs only. Tool calls that bypass the gateway are only as auditable as your own
      tracing. (Paraphrase except quoted text.)
    source: https://docs.cloud.google.com/gemini-enterprise-agent-platform/govern/gateways/agent-gateway-overview
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  iac_coverage:
    status: documented
    notes: >
      Terraform is documented for the governance plane: with Agent Registry GA (2026-06-18),
      "Terraform scripts for Application Default Credentials (ADC) have graduated to General
      Availability. You can use Terraform to configure and manage your agents, MCP servers,
      endpoints, and bindings."
      Terraform coverage of Agent Runtime deployments themselves is not stated in this
      entry. No CloudFormation equivalent (GCP-native). (Paraphrase.)
      RUNTIME DEPLOYMENTS VIA AGENTS CLI (Agent Runtime page, a different page,
      https://docs.cloud.google.com/gemini-enterprise-agent-platform/build/runtime): "The
      Agents CLI is the unified command-line interface and skill set for the
      Agent Platform", providing automated infrastructure that "Uses Terraform for
      streamlined resource management." and CI/CD pipelines — "Automated deployment
      workflows leveraging Cloud Build." Complete Terraform resource coverage of every
      Agent Platform service is not stated. (Paraphrase except quoted text.)
      SOURCE CHANGE 2026-11-23: previously cited the scale page, which does not mention
      Terraform.
    source: https://docs.cloud.google.com/gemini-enterprise-agent-platform/release-notes
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  training_data_policy:
    status: documented
    notes: >
      "Google won't use your data to train or fine-tune any AI/ML models without your prior
      permission or instruction." per the "Training Restriction" in the Service Specific
      Terms. "This applies to all managed models on Gemini Enterprise Agent Platform,
      including GA and pre-GA models." Same commitment as Azure and AWS Q Business.
      RETENTION EXCEPTIONS on the same page (relevant to zero-data-retention, not to
      training): Google "may log prompts to detect potential abuse" for customers under the
      Google Cloud Platform Terms of Service; "Zero data retention may not be possible when
      using some Advanced AI features."; Grounding with Google Search stores derived query
      logs for up to three days — "There is no way to disable the storage of this
      information if you use Grounding with Google Search." — and Grounding with Google
      Maps has a similar non-disableable storage rule. (Paraphrase except quoted text.)
      MERGE NOTE 2026-11-23: both refreshes cite this page; reconciled into one cell.
      SOURCE CHANGE 2026-11-23: previously cited the Cloud Data Processing Addendum, which
      does not itself contain a training restriction; this page does.
    source: https://docs.cloud.google.com/gemini-enterprise-agent-platform/resources/zero-data-retention
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"
