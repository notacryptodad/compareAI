provider: gcp
bucket: b
product: Gemini Enterprise Agent Platform
aliases:
  - Vertex AI Agent Engine
  - Vertex AI Reasoning Engine
  - Agent Runtime
  - Agent Platform Runtime
  - Agent Engine
  - ReasoningEngine
notes: >
  RENAMED. The umbrella name is "Gemini Enterprise Agent Platform"; the runtime is
  called both "Agent Runtime" and "Agent Platform Runtime", and shortened to
  "Agent Platform" in prose. The rename is now formally recorded in the platform's OWN
  release notes (docs.cloud.google.com/gemini-enterprise-agent-platform/release-notes,
  2026-04-22 "Initial release of Gemini Enterprise Agent Platform"): "Agent Engine is now
  Agent Runtime.", Agent Builder Sessions -> Agent Platform Sessions, Memory Bank ->
  Agent Platform Memory Bank.
  API RESOURCE NAME: per the Agent Runtime page (build/runtime), "the name of the resource
  in the API reference is ReasoningEngine to maintain backwards compatibility."
  LAUNCH STAGES live in release-notes feeds, NOT the product docs (the overview, deploy,
  scale and sandbox pages carry no GA/Preview label for any service). Two feeds:
  (a) the legacy VERTEX AI release notes (old product name) for 2025 events:
    2025-03-04  "Vertex AI Agent Engine is now generally available (GA)."
    2025-07-08  Memory Bank enters Preview
    2025-09-10  Code Execution enters Preview
    2025-11-07  Agent Runtime Express mode reaches GA
    2025-12-16  Sessions and Memory Bank reach GA
  (b) the Gemini Enterprise Agent Platform release notes for 2026 events:
    2026-04-22  Agent Identity GA; Agent Gateway Private Preview; Agent Registry Public
                Preview; Agent Runtime long-running operations (up to 7 days)
    2026-05-19  Managed Agents API Preview; Skill Registry public preview
    2026-05-26  Computer use / custom container sandboxes Preview
    2026-06-18  Agent Gateway GA; Agent Registry GA; Agent Observability GA
    2026-06-24  Model Armor for Agent Gateway GA
    2026-09-09  Computer Use and Shell sandboxes GA
    2026-11-11  Agent Gateway for cross-cloud Limited Preview
  METHOD LESSON, same as AWS: launch stage may exist ONLY in a release-notes or
  announcement feed, and may be filed under the product's OLD name after a rename.
  REGIONS: the platform's own "Supported locations for agents in Agent Platform" page
  (resources/agent-locations) lists 23 self-serve regions plus us/eu/global endpoints.
  The "in GA with allowlist" wording on the Gemini Enterprise locations page applies to
  Gemini Enterprise / Gemini Notebook in-country locations, not to Agent Runtime — so
  runtime_regions is `documented` (it was `limited` before the 2026-11-23 merge).
  Scale page last updated 2026-11-20 UTC (re-read 2026-11-23).
  URL HISTORY: content was originally read at
  /vertex-ai/generative-ai/docs/agent-engine/overview, which 301-redirects to
  /gemini-enterprise-agent-platform/scale — sources below use the canonical target.
  cloud.google.com also 301-redirects to docs.cloud.google.com. Legacy "Vertex AI"
  naming still survives in some feature labels.

capabilities:
  data_residency:
    status: documented
    notes: >
      REGIONAL AT-REST RESIDENCY, per the platform's own locations page: "Supported
      locations for agent infrastructure features provide data-at-rest residency for your
      data (including agent source code, deployment packages, session history, memory bank
      entries, and metadata) in the selected location." The features covered include
      Runtime, Sessions, Memory Bank, sandboxes (Code Execution, shell execution, Agent
      Platform Computer Use, custom container images) and Agent Gateway. ML
      processing follows the model: it "is governed by the location and endpoint configured
      for that model." CMEK caveats: "You can't use CMEK if your Runtime is configured to
      use a multi-regional endpoint", nor for Memory Bank/Sessions on the global endpoint.
      CONFLICTING CODE-EXECUTION RESIDENCY, from the "Agent Runtime limitations" table on the
      Gemini Enterprise locations page (a different page,
      docs.cloud.google.com/gemini/enterprise/docs/locations), which covers the us/eu
      multi-regions and CA/IN/JP/SG/UK in-country regions:
      Memory Bank and Sessions, and Runtime: "At-rest DRZ supported" in BOTH the US/EU
      multi-regions AND the in-country regions.
      Code execution: "At-rest DRZ supported in US" but "At-rest DRZ not supported in EU",
      and "At-rest DRZ not supported" in-country at all.
      THE TWO PAGES DISAGREE and neither resolves it: the agent-locations page lists Code
      Execution among the features with at-rest residency in every listed region and
      multi-region, while the Gemini Enterprise table says EU and in-country (CA/IN/JP/SG/UK)
      code-execution residency is not supported. Treat EU / in-country code-execution
      residency as unconfirmed until Google reconciles them. That table covers at-rest
      residency only and makes no machine-learning-processing (MLP) claims.
      SOURCE CHANGE 2026-11-23 (merge): now cites the Agent Platform locations page in
      addition to the Gemini Enterprise page. (Paraphrase except quoted text.)
    source: https://docs.cloud.google.com/gemini-enterprise-agent-platform/resources/agent-locations
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  authoring_mode:
    product: Agent Studio (low-code) + Agent Development Kit (code-first)
    status: documented
    value: [code-first, low-code]
    notes: >
      BOTH MODES. LOW-CODE: "Agent Studio is a low-code visual designer within the Google
      Cloud console that simplifies agent development." "You can visually map agent
      workflows, test responses in real time, and experiment with different configurations
      before deploying or transitioning to code." Agents are created "using prompts or the
      flow builder" and can be deployed to Agent Runtime. The design-agents feature carries
      a Preview banner (Pre-GA Offerings Terms), and "All configuration files for created
      agents are stored in the us-west1 region."
      CODE-FIRST (ADK page, a different page,
      https://docs.cloud.google.com/gemini-enterprise-agent-platform/build/adk): "Agent
      Development Kit (ADK) is an open-source agent development framework that lets you
      build, debug, and deploy reliable AI agents at enterprise scale." "ADK is available
      in Python, TypeScript, Go, and Java." The ADK page states no stage.
      Status `documented`: the low-code designer is Preview and the code-first path is
      unlabelled. (Paraphrase except quoted text.)
    source: https://docs.cloud.google.com/gemini-enterprise-agent-platform/agent-studio/design-agents
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  multi_agent_patterns:
    product: Agent Development Kit (ADK) + A2A on Agent Runtime
    status: documented
    value: [sub-agent delegation, sequential, parallel, loop, graph workflows, A2A]
    notes: >
      Multi-agent orchestration lives in ADK, the platform's first-party SDK: "It natively
      supports multi-agent architectures, allowing developers to compose specialized teams
      of agents that can collaborate and delegate tasks." and "Users can leverage flexible
      orchestration to define predictable pipelines using workflow agents or rely on
      agent-coordinated dynamic routing for more adaptive behavior."
      ADK's template workflow agents are sequential, parallel and loop, now superseded by
      graph-based and dynamic workflows (see workflow_engine). Cross-agent calls on the
      platform go through A2A (see a2a_protocol) or IAM-shared agents — the share-agent
      page (a different page,
      https://docs.cloud.google.com/gemini-enterprise-agent-platform/govern/share-agent)
      notes "In a multi-agent system, one agent might need to call another agent for
      information or to delegate a sub-task." Agent Observability renders a multi-agent
      topology view. No named supervisor/swarm pattern catalogue is published on Agent
      Platform itself, and no stage is stated. (Paraphrase except quoted text.)
    source: https://docs.cloud.google.com/gemini-enterprise-agent-platform/build/adk
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  workflow_engine:
    product: ADK workflows (graph-based, resumable) + Agent Studio flow builder
    status: documented
    notes: >
      THE WORKFLOW ENGINE IS IN THE SDK, executed on Agent Runtime — no separate managed
      durable-workflow service was located on Agent Platform. ADK's template workflow
      agents "determine the execution sequence according to their type, such as
      sequential, parallel, or loop, without consulting an AI model for assistance with the
      orchestration", and "template workflows have been superseded by more flexible
      workflow structures, including graph-based workflows".
      RESUMABLE (ADK Resume page, a different page, https://adk.dev/runtime/resume/): "The
      Resume feature of ADK allows an agent workflow to pick up where it left off, avoiding
      the need to restart the entire workflow." (ADK Python 1.16+.)
      DURABILITY on the managed side comes from Agent Runtime long-running operations (up to
      7 days) and the GA deferred tier for autonomous agent scheduling — see
      long_running_agents. The low-code alternative is the Agent Studio flow builder
      (Preview; see authoring_mode). No stage is stated on the ADK pages.
      (Paraphrase except quoted text.)
    source: https://adk.dev/agents/workflow-agents/
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  managed_agent_runtime:
    product: Agent Runtime
    status: ga
    notes: >
      "Deploy, operate, and scale agentic applications." Agent Platform is described as a
      fully managed environment for developers (paraphrase). Four pillars:
      "Serverless efficiency",
      "Context management", "Continuous quality improvement", "Secure sandbox execution".
      Status genuinely unlabelled on the page — do not infer GA from it.
      LAUNCH STAGE (from the Vertex AI release notes, a DIFFERENT source from the page
      cited below, https://docs.cloud.google.com/vertex-ai/generative-ai/docs/release-notes):
      "Vertex AI Agent Engine is now generally available (GA)." — 2025-03-04.
      Also, under "now available in GA" (2025-11-07): "Express mode support for
      Vertex AI Agent Engine Runtime."
      2026-04-22 (Agent Platform release notes, also a different page,
      https://docs.cloud.google.com/gemini-enterprise-agent-platform/release-notes): "Agent Runtime now
      supports long-running operations (up to 7 days)." plus sub-second cold starts and
      custom-built containers.
      2026-07-29 Google Cloud blog ("What's new in Gemini Enterprise Agent Platform", also
      a different page,
      https://cloud.google.com/blog/products/ai-machine-learning/whats-new-in-gemini-enterprise-agent-platform) restates availability: "some of our most popular capabilities are
      available for everyone, from Agent Runtime to Agent Identity", closing with "these
      newly generally available features".
      CONTAINERS / ANY LANGUAGE (Agent Runtime page, a different page,
      https://docs.cloud.google.com/gemini-enterprise-agent-platform/build/runtime):
      "Agent Runtime supports deploying agents written in any programming language and
      agent framework, as long as the agent application can be containerized and conforms
      to the runtime contract".
    source: https://docs.cloud.google.com/gemini-enterprise-agent-platform/scale
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  managed_agent_harness:
    product: Managed Agents API (Antigravity harness)
    status: preview
    notes: >
      SAME PRODUCT AS managed_agent_loop — scored identically (preview). The Managed Agents
      API is how GCP exposes its pre-assembled harness: an agent is created from
      configuration on top of a Google-built base agent. "The base_agent is the core
      orchestration harness that provides the agent with reasoning capabilities and access
      to the execution environment." It "can inject skills and libraries into the
      environment and has access to service-side tools for code execution, file system
      operations, and search with grounding." Only one harness is offered: "When creating
      an agent, only one value is supported for base_agent" — antigravity-preview-05-2026.
      LAUNCH STAGE: the page carries the Pre-GA banner ("This product is a Pre-GA
      offering") and notes "During the Preview period, provisioning the first agent in your
      project can take between two and three minutes." Released in Preview 2026-05-19 per
      the Agent Platform release notes; still Pre-GA on 2026-11-23. No second, GA harness
      (an AgentCore-Harness-style configurable loop) was located on Agent Platform.
    source: https://docs.cloud.google.com/gemini-enterprise-agent-platform/build/managed-agents/create-manage
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  managed_agent_loop:
    product: Managed Agents API
    status: preview
    notes: >
      "Managed Agents API on Agent Platform lets you build managed, autonomous agents with
      a single API call."
      Powered by the "Antigravity harness" — each agent runs with a sandbox environment
      where it "reasons, plans, uses agent skills, executes code, searches the web, and
      reads and writes files." You configure via the Agents API (control plane): "create
      agents from configurations and configure their execution environments, including
      mounting external data sources and defining network allowlists."
      The Interactions API is the runtime interface for communicating with deployed agents.
      LAUNCH STAGE: explicitly PREVIEW — "These Pre-GA products are in various stages of
      internal testing and review" with a warning "do not use proprietary, sensitive, or
      other confidential data with these products." Released in Preview on 2026-05-19 per the Agent Platform
      release notes; still Pre-GA on 2026-11-23. So GCP DOES have a managed loop, but it's
      behind AWS (GA) and Azure (GA) on maturity.
    source: https://docs.cloud.google.com/gemini-enterprise-agent-platform/build/managed-agents
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  voice_agents:
    product: Gemini Live API (+ Agent Runtime bidirectional streaming)
    status: documented
    notes: >
      "Gemini Live API enables low-latency, real-time voice and video interactions with
      Gemini." Google positions it for agents: it "can be used to build real-time voice and
      video agents" and "offers a comprehensive set of features for building robust voice
      and video agents" — barge-in, affective dialog, proactive audio, tool use, audio
      transcriptions, 30 prebuilt HD voices, 24 languages, over a "Stateful WebSocket
      connection (WSS)". The model table marks gemini-3.8-live and
      gemini-live-2.5-flash-native-audio "Generally available" for "Low-latency voice
      agents."; the release notes (2026-09-24, a different page,
      https://docs.cloud.google.com/gemini-enterprise-agent-platform/release-notes) add
      "Gemini 3.8 Live is generally
      available."
      SESSION LIMITS (start-manage-session page, a different page,
      https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/live-api/start-manage-session):
      "Without context window compression, audio-only sessions are limited to 15 minutes,
      and audio-video sessions are limited to 2 minutes due to token limits." and "The
      default maximum length of a conversation session is 10 minutes" (reconnect with
      session resumption to continue).
      CAVEAT — it is a speech-to-speech MODEL session API, not a separate hosted agent
      resource. Hosting a voice agent on the managed runtime goes through Agent Runtime
      bidirectional streaming, which is Preview (page banner on
      https://docs.cloud.google.com/gemini-enterprise-agent-platform/scale/runtime/bidirectional-streaming,
      "for real-time use cases like audio or video interaction"). STATUS 2026-11-23
      (fact-check, symmetry with aws/b-platform): `documented`, not `ga`. The GA statements
      cover the Live API models, not a voice agent type, and the Runtime-hosted path is
      preview; AWS (Nova Sonic plus Runtime streaming) is scored the same way. Per-region availability was not read
      for this cell. (Paraphrase except quoted text.)
    source: https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/live-api
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  framework_agnosticism:
    status: documented
    value: [ADK, LangGraph, LangChain, LlamaIndex, AG2, CrewAI, A2A, custom]
    notes: >
      Per-framework deployment guides exist for ADK ("Use an Agent Development Kit (ADK)
      agent with Agent Platform Runtime"), LangGraph, LangChain, LlamaIndex ("LlamaIndex
      Query Pipeline agent"), AG2, Agent2Agent (A2A), and custom ("Use a custom agent
      with Agent Platform Runtime") — per the scale page's navigation.
      SUPPORT TIERS (Agent Runtime page, a different page,
      https://docs.cloud.google.com/gemini-enterprise-agent-platform/build/runtime): "Full
      integration" for ADK; "Agent Platform SDK integration" (managed templates) for
      LangChain, LangGraph, AG2 and LlamaIndex; "Custom template" for CrewAI and custom
      frameworks. Beyond that, "Agent Runtime supports deploying agents written in any
      programming language and agent framework, as long as the agent application can be
      containerized and conforms to the runtime contract".
      CORRECTED 2026-11-23 (merge): the earlier note said CrewAI was not mentioned; it
      is absent from the scale page but named on the Agent Runtime page, at the
      custom-template tier only (AWS AgentCore names it explicitly too). Still no guide
      for a rival cloud's SDK (no Strands, no MS Agent Framework), unlike AgentCore which
      lists Google ADK.
      No GA/preview label is given for the guides — hence `documented`.
    source: https://docs.cloud.google.com/gemini-enterprise-agent-platform/scale
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  session_management:
    product: Agent Platform Sessions
    status: ga
    notes: >
      "Agent Platform Sessions maintains the history of interactions between a user and
      agents." Lifecycle operations listed on the page: start new sessions, resume an
      existing session, append events to save progress, list a user's active sessions, and
      delete sessions and their data. For ADK agents, "Once you deploy your ADK agent to
      Gemini Enterprise Agent Platform, session management is handled automatically."; other
      frameworks call the Sessions API directly. Sessions support VPC Service Controls.
      EVENT STREAM: streaming is on the invocation side — Agent Runtime stream query,
      bidirectional streaming (Preview, see voice_agents) and the Managed Agents
      Interactions API, which streams server-sent events and continues a conversation via
      previous_interaction_id (preview, see managed_agent_loop).
      LAUNCH STAGE: "Vertex AI Agent Engine Sessions and Memory Bank are now Generally
      Available." — 2025-12-16, Vertex AI release notes (a different page,
      https://docs.cloud.google.com/vertex-ai/generative-ai/docs/release-notes).
      Quotas (append events 300/min, session writes 100/min per region) are in
      service_limits. (Paraphrase except quoted text.)
    source: https://docs.cloud.google.com/gemini-enterprise-agent-platform/scale/sessions
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  multi_tenancy:
    product: Sessions + Memory Bank IAM Conditions
    status: documented
    notes: >
      PER-END-USER DATA ISOLATION VIA IAM CONDITIONS, not per-tenant compute. "By default,
      sessions Identity and Access Management permissions are at the project-level." With
      IAM Conditions, "You can control access to sessions based on the userId string within
      the Session resource using the API attribute aiplatform.googleapis.com/sessionUserId
      with an expression written in Common Expression Language." and "You can restrict
      access to your sessions and events so that a user can only access their own
      information".
      Memory Bank does the same by scope (a different page,
      https://docs.cloud.google.com/gemini-enterprise-agent-platform/scale/memory-bank/iam-conditions):
      "Memory Bank lets you control access to memories and memory revision resources based
      on their scope attributes."
      Context caching guidance (a different page,
      https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/context-cache/context-cache-overview):
      "When you run background agents or multi-tenant proxies, align cache boundaries with
      end-user permissions so an agent can't reuse cached credentials or data across
      users." Agent Garden (a different page,
      https://docs.cloud.google.com/gemini-enterprise-agent-platform/build/agent-garden) links
      a "Multi-tenant agentic AI Terraform blueprint" from Cloud Architecture Center.
      CAVEAT: no statement of per-session compute isolation (an AgentCore-style microVM per
      session) was found on the Agent Runtime, scale or runtime-contract pages; tenancy
      above the user level is the Google Cloud project. (Paraphrase except quoted text.)
    source: https://docs.cloud.google.com/gemini-enterprise-agent-platform/scale/sessions/iam-conditions
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  distribution_to_packaged_products:
    product: Gemini Enterprise (register ADK agents from Agent Runtime)
    status: documented
    notes: >
      YES — agents built on Agent Runtime can be published into Gemini Enterprise (bucket C):
      "This page explains how administrators register ADK agents from Agent Runtime for use
      in the Gemini Enterprise web app." Requirement: "You must host and maintain your ADK
      agents on Agent Runtime for them to function within Gemini Enterprise." The
      connection is VPC-SC compliant, cross-project agents are supported, and "ADK agents
      receive the user's email address from Gemini Enterprise." Caveat: "To secure ADK
      agents, developers must configure Model Armor using the REST API within their agent's
      application code." Gemini Enterprise can also import MCP servers and A2A agents from
      Agent Registry (see mcp_registry). No stage stated on this page.
      (Paraphrase except quoted text.)
    source: https://docs.cloud.google.com/gemini/enterprise/docs/register-and-manage-an-adk-agent
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  first_party_models:
    product: Gemini models on Agent Platform
    status: documented
    value: [Gemini 4 Neon, Gemini 4 Hydrogen, Gemini 4 Carbon, Gemini 4 Argon, Gemini 3.8 Flash, Gemini 3.8 Live, Gemma, Veo, Lyria]
    notes: >
      Release notes, 2026-11-18: Gemini 4 Neon "is generally available (GA) in Gemini
      Enterprise Agent Platform." Gemini 4 Carbon (GA, November 2026): "Gemini 4 Carbon is
      Google's frontier model for complex, real-world tasks across coding, finance, legal,
      cybersecurity, and science". The models overview (a different page,
      https://docs.cloud.google.com/gemini-enterprise-agent-platform/models) lists Google
      models as "Flagship models developed by Google, including Gemini, Gemma, Veo, and
      Lyria."
      CAVEAT (Gemini 4 Carbon page, a different page,
      https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/gemini/4-carbon):
      "Gemini 4 Carbon is available to verified enterprise customers in select regions."
      Per-model launch stage is given on each model page's version table (e.g. GA for
      gemini-4-carbon and gemini-3.8-flash). (Paraphrase except quoted text.)
      STATUS 2026-11-23 (fact-check, symmetry with aws and azure): `documented`, because
      stages and access differ by model (Carbon is gated to verified customers); the
      per-model stages are kept in this note.
    source: https://docs.cloud.google.com/gemini-enterprise-agent-platform/release-notes
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  third_party_catalog:
    product: Model Garden (partner and open models as MaaS)
    status: documented
    value: [Anthropic Claude, OpenAI GPT, xAI Grok, Meta Muse, Mistral, AI21 Jamba, DeepSeek, Llama, GLM, gpt-oss, Gemma]
    notes: >
      "Gemini Enterprise Agent Platform supports a curated list of models developed by
      Google partners." "Partner models are serverless so there's no need to provision or
      manage infrastructure." "Anthropic's Claude and Mistral models are examples of
      third-party managed models that are available to use on Gemini Enterprise Agent
      Platform." The partner table lists OpenAI GPT 6.x, Meta Muse, AI21 Jamba and some Grok
      models as Preview; Claude (Haiku/Sonnet/Opus/Fable 4.x-5.5), Mistral and Grok 4.6/4.7
      rows carry no stage label — hence `documented` for the catalog as a whole.
      Caveat: "Anthropic enforces policies that prohibit certain resellers from reselling
      their products."
      OPEN MODELS AS MaaS (a different page,
      https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/maas/use-open-models):
      "Gemini Enterprise Agent Platform supports a curated list of open models as managed
      models." — DeepSeek V4.1 Flash, Gemma 4, GLM 5.2, gpt-oss 120B, Llama 4 Maverick/Scout.
      (Paraphrase except quoted text.)
    source: https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/partner-models/use-partner-models
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  byo_open_weights:
    product: Model Garden self-deployed models + Provisioned Throughput
    status: documented
    notes: >
      SELF-DEPLOY: "Model Garden lets you self-deploy and serve open, partner, and custom
      models on Gemini Enterprise Agent Platform." Unlike MaaS, "self-deployed models run
      securely within your Google Cloud project and VPC network, giving you full control
      over the deployment environment." Proprietary partner models can be self-deployed
      under licences bought through Cloud Marketplace, on on-demand hardware or existing
      reservations/CUDs.
      CUSTOM WEIGHTS (a different page,
      https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/model-garden/deploy-models-with-custom-weights):
      "Deploy models with custom weights is a Preview offering." — upload artifacts to
      Cloud Storage for supported base models (Llama, Gemma, Qwen, etc.).
      PROVISIONED THROUGHPUT (a different page,
      https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/provisioned-throughput):
      "Provisioned Throughput is a fixed-cost, fixed-term subscription available in several
      term-lengths that reserves throughput for supported generative AI models on Gemini
      Enterprise Agent Platform." It also covers some open models (Gemma 4, per release
      notes). Status `documented`: self-deploy pages carry no stage; custom weights is
      Preview. (Paraphrase except quoted text.)
    source: https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/model-garden/self-deployed-models
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  tuning:
    product: Gemini tuning (SFT, preference, RLFT) + context caching
    status: ga
    notes: >
      LAUNCH STAGE (release notes, 2026-10-19): "Supervised fine-tuning for Gemini 3 models
      is available in General Availability" (Gemini 3.5 Flash, 3.5 Flash Lite, 3.1 Flash
      Lite), with CMEK for tuning jobs and tuned models.
      METHODS (tuning page, a different page,
      https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/tuning): "Agent
      Platform supports supervised fine-tuning, preference tuning, and reinforcement
      learning fine-tuning to customize foundation models." RLFT supports up to 16 weighted
      reward functions; open models can be tuned via Model Garden.
      DISTILLATION is gated: the release notes (2026-05-08) say "We're introduction Gemini
      Distillation Service in Early Access." [sic].
      PROMPT CACHING (context caching page, a different page,
      https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/context-cache/context-cache-overview):
      "All Google Cloud projects have implicit caching enabled by default." The implicit-cache
      discount now depends on the model: 95% for Gemini 4 and later, 90% for Gemini 3 and
      2.5, 75% for Gemini 2 and earlier (reworded by the vendor since 2026-11-23,
      re-verified 2026-11-25). (Paraphrase.)
      Explicit caching adds storage costs by time stored. Claude models have their own
      prompt-caching page. `ga` reflects SFT; preference tuning, RLFT and distillation
      carry their own (earlier) stages. (Paraphrase except quoted text.)
    source: https://docs.cloud.google.com/gemini-enterprise-agent-platform/release-notes
    verified_on: 2026-11-25
    verified_by: "@notacryptodad"

  model_routing:
    product: Consumption options (Provisioned Throughput spillover, Priority / Flex / Deferred tiers)
    status: documented
    notes: >
      COST-TIERING AND OVERFLOW, NOT A MODEL ROUTER. "Gemini Enterprise Agent Platform
      provides six consumption options tailored to different traffic patterns and business
      needs" — Provisioned Throughput, Standard / Priority / Flex PayGo, the Deferred tier
      and batch inference. The recommended pattern: "Cover baseline traffic with Provisioned
      Throughput." Traffic above the PT baseline (spillover) "is handled by Standard
      pay-as-you-go" by default, with Priority PayGo as the premium option. Deferred-tier
      requests do not fall back to Standard PayGo (release notes).
      NO PROMPT-LEVEL MODEL ROUTER FOUND: the Agent Platform models navigation, the Agent
      Platform release notes and the Vertex AI release notes were searched for the terms
      router, routing, fallback and Model Optimizer with no managed model-selection router;
      legacy Vertex model-optimizer URLs return 404. Cross-model fallback is left to the SDK
      (ADK, bucket A). (Paraphrase except quoted text.)
    source: https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/deploy/consumption-options
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  openai_compatible_endpoint:
    product: OpenAI compatibility (Chat Completions / Responses)
    status: documented
    notes: >
      "Gemini models are accessible using the OpenAI libraries (Python, TypeScript, and
      JavaScript) along with the REST API." Auth caveat: "Only Google Cloud Auth is
      supported using the OpenAI library in Gemini Enterprise Agent Platform." The client
      points base_url at .../locations/LOCATION/endpoints/openapi with an OAuth access token;
      reasoning_effort maps to Gemini thinking_level. Partner models also use it — Meta Muse
      is served through the OpenAI-compatible Responses API, and Gemini 4 models list "the OpenAI compatibility Chat Completions API" among
      their surfaces (release notes, a different page,
      https://docs.cloud.google.com/gemini-enterprise-agent-platform/release-notes). No
      stage is stated on the compatibility page. (Paraphrase except quoted text.)
    source: https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/start/openai
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  short_term_memory:
    product: Sessions
    status: ga
    notes: >
      "Store individual interactions between users and agents."
      Security matrix: VPC-SC, CMEK, data residency at rest, HIPAA, Access Transparency,
      Access Approval all Yes.
      LAUNCH STAGE: "Vertex AI Agent Engine Sessions and Memory Bank are now Generally
      Available." — 2025-12-16, Vertex AI release notes (a DIFFERENT source from below,
      https://docs.cloud.google.com/vertex-ai/generative-ai/docs/release-notes).
      2026-06-17 (Agent Platform release notes): global and multi-regional endpoints for
      Sessions and Memory Bank went GA; CMEK can't be used on the global endpoint.
      (Paraphrase of that entry.)
    source: https://docs.cloud.google.com/gemini-enterprise-agent-platform/scale
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  long_term_memory:
    product: Agent Platform Memory Bank
    status: ga
    notes: >
      Memory Bank stores and retrieves information from sessions to personalize agent
      interactions (paraphrase — the page's exact tagline omits terminal punctuation).
      Residency caveat worth surfacing: ML processing "occurs within the specific region
      or multi-region of the model endpoint used by Agent Platform Memory Bank" — i.e.
      residency is inherited from the model endpoint, not independently configurable.
      LAUNCH STAGE: GA as of 2025-12-16 — "Vertex AI Agent Engine Sessions and Memory Bank
      are now Generally Available." Entered preview earlier: "Vertex AI Agent Engine Memory
      Bank is now available in Preview." — 2025-07-08. Both from the Vertex AI release notes
      (a DIFFERENT source from the page cited below,
      https://docs.cloud.google.com/vertex-ai/generative-ai/docs/release-notes), so a ~5-month preview.
      2026 additions (Agent Platform release notes): IngestEvents API GA (2026-07-08),
      memory profiles GA (2026-07-15), memory revisions. (Paraphrase.)
    source: https://docs.cloud.google.com/gemini-enterprise-agent-platform/scale
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  tool_calling:
    product: Gemini function calling (+ Managed Agents service-side tools)
    status: documented
    notes: >
      Function calling "provides the LLM with definitions of external tools"; the model
      returns structured calls that your application executes. PARALLEL CALLS are
      documented: "If the model had proposed several parallel function calls, the
      application must provide all of the responses back to the model." The Live API adds
      asynchronous function calling, partner models (Claude, Grok, Muse, open MaaS models)
      document their own function calling, and the Managed Agents API harness has
      service-side tools for code execution, file system and search (see
      managed_agent_harness). No stage label on the function-calling page.
      (Paraphrase except quoted text.)
    source: https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/tools/function-calling
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  memory_namespacing:
    product: Agent Platform Memory Bank
    status: documented
    notes: >
      PER-SCOPE NAMESPACES: "For each scope, Memory Bank maintains an isolated collection
      of memories." A scope is an arbitrary dictionary such as user ID (optionally plus
      session ID); retrieval is similarity search scoped to an identity.
      TTL: "Set a time to live (TTL) on memories to ensure stale information is
      automatically deleted." A default TTL can be configured on the instance.
      ACCESS: "Use IAM conditions to restrict which principals can read or write specific
      scopes' memories." (memoryScope CEL attribute — see multi_tenancy).
      DELETION: memories can be deleted directly, consolidation removes contradicted
      memories, and Sessions can be deleted with their data. EXPORT: no bulk export API was
      found on the Memory Bank overview, setup or generate-memories pages — list/get per
      scope is the available path. Memory Bank itself is GA (see long_term_memory); these
      sub-features carry no separate stage. (Paraphrase except quoted text.)
    source: https://docs.cloud.google.com/gemini-enterprise-agent-platform/scale/memory-bank
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  checkpoint_resume:
    product: Sandbox snapshots + ADK Resume + Sessions
    status: documented
    notes: >
      SANDBOX CHECKPOINTS: "Sandbox snapshots in Gemini Enterprise Agent Platform let you
      save the current state of a sandbox and restore it later." Listed benefit: "Create
      checkpoints during a long-running agent task to allow recovery if something goes
      wrong." Snapshots are retained for a TTL; restore fails across a different
      architecture, runtime version or container image.
      AGENT WORKFLOW RESUME (ADK, a different page, https://adk.dev/runtime/resume/): "The
      Resume feature of ADK allows an agent workflow to pick up where it left off, avoiding
      the need to restart the entire workflow."
      CONVERSATION RESUME: Sessions supports resuming an existing session, and the Managed
      Agents Interactions API resumes via previous_interaction_id and environment reuse.
      No automatic resume-after-crash performed by Agent Runtime itself is stated; resume
      is SDK- or sandbox-driven. No stage on the snapshots page. (Paraphrase except quoted text.)
    source: https://docs.cloud.google.com/gemini-enterprise-agent-platform/scale/sandbox/manage-snapshots
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  code_interpreter:
    product: Code Execution (Sandbox)
    status: preview
    notes: >
      "Run code in a secure, isolated, and managed sandbox environment" (the scale page's
      Code Execution tagline). The page itself carries no stage label.
      LAUNCH STAGE — STILL PREVIEW on the latest vendor statement found:
      Agent Engine Code Execution, "now in Preview, lets your agent run code in an isolated
      sandbox environment." — 2025-09-10, Vertex AI release notes (a DIFFERENT source from
      the page cited below, https://docs.cloud.google.com/vertex-ai/generative-ai/docs/release-notes). No GA announcement for Code Execution appears in either the
      Vertex AI or the Agent Platform release notes as of 2026-11-23 — even though sibling
      sandboxes went GA: "Computer Use and Shell sandboxes in Gemini Enterprise Agent
      Platform are now generally available (GA)." — 2026-09-09, Agent Platform release
      notes (https://docs.cloud.google.com/gemini-enterprise-agent-platform/release-notes).
      Treat Code Execution as preview until Google says otherwise. Re-checked
      2026-11-23 (merge): the 2026-07-29 "What's new in Gemini Enterprise Agent Platform"
      blog's (https://cloud.google.com/blog/products/ai-machine-learning/whats-new-in-gemini-enterprise-agent-platform) newly-GA list (Memory Bank, Agent Runtime, Agent Identity, Agent Gateway,
      Agent Registry, Agent Evaluation, Agent Observability) does not name Code Execution,
      and the Code Execution overview page carries no stage label — so `preview` stands
      over a `documented` alternative because the last vendor stage statement is Preview.
      LIMITS (Code Execution overview page, a different page,
      https://docs.cloud.google.com/gemini-enterprise-agent-platform/scale/sandbox/code-execution-overview): "Sandboxes support file
      input and output up to 100MB for the entire request or response." and "Sandboxes
      maintain their execution state (memory) for up to 14 days." (TTL configurable);
      "The sandbox offers a limited file system and no network access."
      AWS states AgentCore Code Interpreter GA only in per-region wording (AgentCore release notes, April 2026 São Paulo region-expansion entry);
      Google's equivalent is still preview, AND it is the one service with no EU at-rest
      residency (see data_residency).
      Billing: Runtime and sandbox environments (including Code Execution) bill on Agent
      Compute vCPU-hours and Agent Memory GiB-hours per the pricing page (paraphrase).
    source: https://docs.cloud.google.com/gemini-enterprise-agent-platform/scale
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  browser_use:
    product: Agent Platform Computer Use (Sandbox)
    status: ga
    notes: >
      "Agent Platform Computer Use sandboxes provide a secure, isolated browser
      environment that your agents can interact with." Control is via API requests or a
      "standard Chrome DevTools Protocol (CDP) connection, letting you use browser
      automation tools (such as Playwright) to automate the browser." — so a Playwright
      path IS now documented (it was not on 2026-08-04).
      LAUNCH STAGE (from the Agent Platform release notes, a DIFFERENT source from the page
      cited below, https://docs.cloud.google.com/gemini-enterprise-agent-platform/release-notes):
      Computer use (Preview) "Enables agents to automate browser-based tasks
      within an isolated web browser environment." — 2026-05-26; then "Computer Use and
      Shell sandboxes in Gemini Enterprise Agent Platform are now generally available
      (GA)." — 2026-09-09. The Computer Use page itself has no stage label.
      STATUS CHANGE 2026-11-23: documented -> ga.
    source: https://docs.cloud.google.com/gemini-enterprise-agent-platform/scale/sandbox/computer-use
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  knowledge_base:
    product: RAG Engine
    status: documented
    notes: >
      RAG Engine plus "Agent Retrieval (formerly Vector Search 2.0) - Intelligent
      Retrieval for AI Applications". The navigation links to a migration guide from
      Vector Search 1.0, so Vector Search 2.0 is a breaking-ish successor worth flagging
      to users. (Paraphrase except the quoted nav label.)
    source: https://docs.cloud.google.com/gemini-enterprise-agent-platform/scale
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  web_search_tool:
    product: Grounding with Google Search (+ Web Grounding for Enterprise)
    status: ga
    notes: >
      "If you want to connect your model with world knowledge, a wide possible range of
      topics, or up-to-date information on the Internet, then use Grounding with Google
      Search." Supported on current Gemini 4 / 3.x models.
      LAUNCH STAGE (Vertex AI release notes, a different page,
      https://docs.cloud.google.com/vertex-ai/generative-ai/docs/release-notes): "Grounding
      Gemini with Google Search is GA" (2024); "Web Grounding for Enterprise is now
      Generally available." (2025) — the compliance variant whose index is "a subset of
      what's available on Google Search and suitable for customers in highly-regulated
      industries" (Web Grounding for Enterprise page, a different page,
      https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/grounding/web-grounding-enterprise).
      Also offered: Parallel and Exa web search grounding, a Claude web-search tool page, and
      web search inside the Managed Agents harness. Retention caveat for Google Search
      grounding logs: see training_data_policy. (Paraphrase except quoted text.)
    source: https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/grounding/grounding-with-google-search
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  text_to_sql:
    product: Conversational Analytics API (BigQuery / Looker data agents)
    status: ga
    notes: >
      SIBLING FAMILY (Gemini data agents, not Agent Platform proper). LAUNCH STAGE,
      2026-06-23: "The Conversational Analytics API is generally available (GA) for
      BigQuery and Looker." Conversation logging (2026-11-17) and agent observability
      (2026-11-02) for BigQuery sources are also GA.
      WHAT IT DOES (overview, a different page,
      https://docs.cloud.google.com/gemini/data-agents/conversational-analytics-api/overview):
      "The API uses natural language to answer questions about structured data in BigQuery,
      Looker, Data Studio, and database data sources" — AlloyDB, Spanner and Cloud SQL
      sources are Preview in v1beta; data agents get SQL, Python and visualization tools.
      FOR CUSTOM AGENTS (BigQuery MCP page, a different page,
      https://docs.cloud.google.com/bigquery/docs/use-bigquery-mcp): "You can use the
      BigQuery remote MCP server to perform tasks such as running queries, getting
      metadata, and listing resources." (Paraphrase except quoted text.)
    source: https://docs.cloud.google.com/gemini/data-agents/conversational-analytics-api/release-notes
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  ai_service_tools:
    product: Gemini built-in tools + Google Cloud remote MCP servers
    status: documented
    notes: >
      Grounding tools on this page: Google Search, Google Maps ("Use Google Maps data with
      your model to provide more accurate and context-aware responses to your prompts,
      including geospatial context."), Agent Search, RAG Engine, Elasticsearch, your own
      search API, Web Grounding for Enterprise and Parallel web search.
      BUILT-IN MODEL TOOLS (release notes, a different page,
      https://docs.cloud.google.com/gemini-enterprise-agent-platform/release-notes): Gemini 4
      models "Supports function calling, code execution, computer use, URL context, and
      Agentic video understanding." The same feed records "Agent Platform remote MCP server
      for General Availability." and the BigQuery remote MCP server exposes queries as tools
      (see text_to_sql). Speech, TTS and translation are separate Gemini models (Live API,
      3.8 Flash TTS, 3.5 Live Translate) rather than packaged tools. Stage varies by tool,
      so `documented`. (Paraphrase except quoted text.)
    source: https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/grounding/overview
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  a2a_protocol:
    product: Agent Runtime + Agent Registry
    status: preview
    notes: >
      HOSTING IS PREVIEW: "Agent Runtime lets you develop and deploy agents using the
      Agent2Agent (A2A) protocol." The page carries a Preview banner citing the Pre-GA
      Offerings Terms (paraphrase). Agents are built from an AgentCard, an AgentExecutor and an
      optional ADK LlmAgent.
      REGISTRY SUPPORT IS GA: in the Agent Platform release notes (a different page,
      https://docs.cloud.google.com/gemini-enterprise-agent-platform/release-notes), the
      2026-06-18 entry "Agent Registry is generally available (GA)" lists "A2A v1 support:
      Agent Registry supports Agent-to-Agent (A2A) protocol version 1.0", alongside the
      existing 0.3 schema (paraphrase of the last clause). The GA covers cataloguing A2A
      agents in Agent Registry, not serving them on Agent Runtime.
      GATEWAY: the 2026-11-11 entry for Agent Gateway for cross-cloud (Limited Preview)
      routes agents' "LLM, MCP, and A2A traffic" through local Agent Gateway proxies.
      Status `preview` because the vendor labels the Runtime A2A capability Preview;
      compare AWS AgentCore Runtime and Azure Agent Service, both GA for A2A.
    source: https://docs.cloud.google.com/gemini-enterprise-agent-platform/build/runtime/create-an-a2a-agent
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  mcp_registry:
    product: Agent Registry
    status: ga
    notes: >
      "Agent Registry is generally available (GA)" — "Agent Registry is a centralized
      catalog for discovering and registering agents and Model Context Protocol (MCP)
      servers." — 2026-06-18. It entered Public Preview on 2026-04-22. The GA entry adds A2A v1
      support and Terraform management of "agents, MCP servers, endpoints, and bindings",
      with known limitations: Access Transparency / Access Approval aren't available for
      Agent Registry configurations, and data-residency detective controls are limited.
      (Paraphrase except quoted text.)
      PRODUCT CHANGE 2026-11-23: this row previously pointed at Skill Registry (nav only,
      MCP relationship unverified). Skill Registry is a separate skills repository —
      "Manage and discover agent skills with the Skill Registry, in public preview."
      (2026-05-19) — and is NOT the MCP registry. Agent Registry is the MCP-server
      catalog, and Gemini Enterprise imports MCP servers and A2A agents from it.
      SCOPE NOW INCLUDES SKILLS: the Agent Registry overview (a different page,
      docs.cloud.google.com/agent-registry/overview) says it lets you "register, discover,
      and govern agentic components, including AI agents, Model Context Protocol (MCP)
      servers and tools, endpoints, and standalone skills", so skills are also catalogued
      in Agent Registry itself, alongside the separate Skill Registry preview.
      STATUS CHANGE 2026-11-23: documented -> ga.
    source: https://docs.cloud.google.com/gemini-enterprise-agent-platform/release-notes
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  skills_registry:
    product: Agent Registry (standalone skills) + Skill Registry (preview)
    status: documented
    notes: >
      "Skill Registry serves as a secure, private, and low-latency repository for managing
      agent skills." Each skill is a self-contained package (instructions, executable code,
      documentation); agents can "dynamically discover and load the most relevant
      capabilities based on user intent". Two API entities: a mutable Skill and an
      immutable Skill revision. Uploads are zip packages that must contain a SKILL.md with
      YAML front matter (name up to 64 chars, description up to 1024), validated
      asynchronously; limits include 10 MB zipped / 500 MB unzipped and 10,000 items. A
      built-in gcp-skill-registry skill lets agents create, search for and manage skills.
      (Paraphrase except quoted text.)
      LAUNCH STAGE: the page carries a Preview banner (Pre-GA Offerings Terms); the Agent
      Platform release notes (2026-05-19; a different page,
      https://docs.cloud.google.com/gemini-enterprise-agent-platform/release-notes) say
      "Manage and discover agent skills with the
      Skill Registry, in public preview."
      GOVERNANCE OVERLAP: the page notes "You can centrally manage and govern standalone
      skills within Agent Registry" (Agent Registry itself is GA — see mcp_registry), so
      GCP has two skill catalog surfaces; the dedicated Skill Registry is the preview one.
      STATUS 2026-11-23 (fact-check): `documented`, not `preview`. The Agent Registry route
      carries no preview label: "Agent Registry lets you package and manually register
      standalone skills" (a different page,
      https://docs.cloud.google.com/agent-registry/register-skills). Agent Registry's GA
      entry covers agents and MCP servers, not skills, so `ga` doesn't apply either.
    source: https://docs.cloud.google.com/gemini-enterprise-agent-platform/build/skill-registry
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  agent_skills:
    product: Skill Registry (+ skills injected by the Managed Agents harness)
    status: preview
    notes: >
      UPLOADABLE SKILL PACKS EXIST: "Skill Registry serves as a secure, private, and
      low-latency repository for managing agent skills." Skills are zip packages containing
      a SKILL.md with YAML front matter, stored as immutable revisions (detail in
      skills_registry). The Managed Agents base agent "can inject skills and libraries into
      the environment" (create-manage page, a different page,
      https://docs.cloud.google.com/gemini-enterprise-agent-platform/build/managed-agents/create-manage).
      Governance (Preview, a different page,
      https://docs.cloud.google.com/gemini-enterprise-agent-platform/govern/policies/govern-agent-skills):
      "Semantic governance policy can govern the entire skill lifecycle." — list_skills,
      load_skill, load_skill_resource and run_skill_script calls in ADK.
      LAUNCH STAGE: the Skill Registry page carries a Preview banner; release notes
      (2026-05-19, a different page,
      https://docs.cloud.google.com/gemini-enterprise-agent-platform/release-notes):
      "Manage and discover agent skills with the Skill Registry, in public preview."
      (Paraphrase except quoted text.)
    source: https://docs.cloud.google.com/gemini-enterprise-agent-platform/build/skill-registry
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  openapi_import:
    product: ADK OpenAPIToolset
    status: documented
    notes: >
      IN THE SDK, NOT A MANAGED IMPORT. ADK supports "automatically generating callable
      tools directly from an OpenAPI Specification (v3.x)": "Use OpenAPIToolset to
      instantly create agent tools" (one RestApiTool per operation). Agents built this way
      deploy to Agent Runtime. On the managed side, Agent Registry registers endpoints
      alongside agents and MCP servers, and Agent Gateway mediates REST traffic, but no
      Agent Platform service that converts an OpenAPI spec into tools (an
      AgentCore-Gateway-style import) was located in the Agent Platform build, govern or
      release-notes pages. No stage stated. (Paraphrase except quoted text.)
    source: https://adk.dev/tools-custom/openapi-tools/
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  mcp_server_hosting:
    product: Agent Gateway
    status: documented
    notes: >
      Agent Gateway is a governance layer for MCP traffic, NOT an MCP-server host:
      "Agent Gateway is the governance and security enforcement layer for Google Cloud
      agent governance." It lets admins enforce least-privilege postures for interactions
      "between human users and agents, agents and Model Context Protocol (MCP) tools, or
      among autonomous agents themselves." Agent Registry acts as "the central directory
      for all approved agents, tools, Model Context Protocol (MCP) servers, and endpoints".
      A first-party managed HOST for customer-written MCP servers (an AgentCore-Gateway- or
      Foundry-style deploy-your-MCP-server-here service) is not stated on this page — treat this
      row as governance/routing of MCP traffic only. Agent Gateway went GA 2026-06-18 and
      cross-cloud Agent Gateway is Limited Preview (2026-11-11), per the Agent Platform
      release notes (a DIFFERENT source); status kept `documented` because the row's
      hosting claim itself is not what went GA.
      Protocols mediated: "Model Context Protocol (MCP), Agent-to-Agent (A2A), REST, or
      gRPC"; governance spans "managed runtimes, Google Kubernetes Engine (GKE) clusters,
      Cloud Run services, and non-Google Cloud Kubernetes clusters" — the last via "Agent
      Gateway for cross-cloud (Limited Preview)" (that wording is on this page).
    source: https://docs.cloud.google.com/gemini-enterprise-agent-platform/govern/gateways/agent-gateway-overview
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  agent_gateway:
    product: Agent Gateway
    status: ga
    notes: >
      LAUNCH STAGE (release notes, 2026-06-18, "Agent Gateway in General Availability"):
      "It secures and governs connectivity for all agentic interactions, whether they occur
      between users and agents, agents and tools, or among agents themselves." Model Armor
      on Agent Gateway went GA 2026-06-24 ("This feature is generally available"); IAM
      Unified Access Policies went GA 2026-08-31, with "Agent Gateway uses Identity-Aware Proxy and
      Access policies to govern agentic communication between agent principals and
      destination resources". 2026-09-09: VPC Service Controls perimeter enforcement.
      Agent Gateway for GKE is in Preview (2026-11-12, europe-west1 and us-central1 only),
      and cross-cloud is Limited Preview (2026-11-11): agents on EKS, AKS, OpenShift or bare
      metal "route their LLM, MCP, and A2A traffic through local Agent Gateway proxies" which
      "enforce access and Model Armor safety policies".
      WHAT IT ENFORCES (overview page, a different page,
      https://docs.cloud.google.com/gemini-enterprise-agent-platform/govern/gateways/agent-gateway-overview):
      ingress (client-to-agent) and egress (agent-to-anywhere) policy enforcement point;
      agent auth via Agent Identity (SPIFFE ID, mTLS and DPoP) and OAuth 2.0 / WIF handled
      through the Agent Identity Auth Manager; IAM Unified Access Policies (default deny,
      CEL conditions on tool names, HTTP methods and URL paths); Model Armor prompt and
      tool-response scanning; semantic governance policies — "Rules written in plain
      language that control how agents use tools" — which since 2026-10-26 also evaluate tool
      calls from Anthropic, OpenAI, Mistral and self-hosted OpenAI-compatible models
      (streamed responses unsupported); OpenTelemetry traces and access logs to Cloud
      Logging and Cloud Trace. Protocols mediated: "Model Context Protocol (MCP),
      Agent-to-Agent (A2A), REST, or gRPC".
      CAVEATS: "Support for token management policies and extension bindings is coming
      soon." — token budgets and custom authorization engines are early-access only. The
      overview also says Agent Gateway is available for agents on Agent Platform and GKE,
      with Cloud Run and non-Google Kubernetes in Limited Preview. Billed as Agent Compute
      per the pricing page. Unlike AWS AgentCore Gateway (tool/MCP exposure), this is a
      traffic-governance proxy, not an MCP host — see mcp_server_hosting.
      (Paraphrase except quoted text.)
    source: https://docs.cloud.google.com/gemini-enterprise-agent-platform/release-notes
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  eval_service:
    product: Agent Evaluation (Evaluation Service)
    status: ga
    notes: >
      LAUNCH STAGE from the Google Cloud blog "What's new in Gemini Enterprise Agent
      Platform" (2026-07-29, a different page,
      cloud.google.com/blog/products/ai-machine-learning/whats-new-in-gemini-enterprise-agent-platform):
      it lists "Agent Evaluation: Continuously monitor and evaluate agent performance in
      production with online evaluation monitors that proactively identify performance
      degradation and behavioral drift." with metric options "pre-built, custom Python,
      LLM-as-a-judge, or adaptive rubrics co-developed with Google DeepMind", and closes
      "get started with these newly generally available features today." CAVEAT: the GA
      wording is collective — it covers the capabilities the post presents as newly
      available, and Agent Evaluation's own section carries no stage wording — and no
      matching GA entry is in the Agent Platform release notes.
      STATUS CHANGE 2026-11-23 (merge): documented -> ga.
      The scale page's navigation lists "Continuous evaluation with Online Monitors"
      alongside offline evaluations.
      Present, plus Example Store — "Leveraging the Example Store and Evaluation Service to
      test, monitor, and trace agent behavior". Security matrix CHANGED since 2026-08-04:
      "Agent evaluation" is now Yes for VPC Service Controls, CMEK and data residency at
      rest (it was No in August). "Example Store" is now the ONLY service marked No for all
      three — still a real compliance constraint if you rely on Example Store.
      Agent evaluation remains No for Access Transparency and Access Approval.
      (Table reading.)
    source: https://docs.cloud.google.com/gemini-enterprise-agent-platform/scale
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  otel_traces:
    product: Agent Observability
    status: ga
    notes: >
      "Agent Observability is generally available (GA)" — 2026-06-18. That entry:
      "OpenTelemetry tracing is now enabled by default for newly deployed Agent Development
      Kit (ADK) agents on Agent Engine". 2026-08-13: ADK 2.6.0+ agents on Agent Runtime
      can emit gen_ai metrics that "follow OpenTelemetry's generative AI semantic
      conventions". So OTel is now explicitly the trace format (in August the scale page
      only said the runtime has built-in observability). Agent Observability had entered Preview on 2026-04-22.
      STATUS CHANGE 2026-11-23: documented -> ga; source moved from the scale page to the
      release notes, where the stage is stated.
      SEMCONV CAVEAT (Agent Runtime tracing page, a different page,
      https://docs.cloud.google.com/gemini-enterprise-agent-platform/scale/runtime/tracing): "The example span is experimental and subject to change
      so you shouldn't rely on the format to be stable for now", and ADK tracing is enabled
      with OTEL_SEMCONV_STABILITY_OPT_IN=gen_ai_latest_experimental — GA covers the
      service, not a stable GenAI span schema. (Paraphrase except the quoted sentence.)
    source: https://docs.cloud.google.com/gemini-enterprise-agent-platform/release-notes
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  cost_attribution:
    product: Custom metadata labels + inference request metadata logs
    status: documented
    notes: >
      LABELS: "Information about labels is forwarded to the logging and billing system that
      lets you break down your usage and billed charges by label." "Agent Platform supports
      two kinds of labels: request body labels, which reach Cloud Billing, and header
      labels, which appear in inference request metadata logs." Labels attach to
      generateContent, interactions.create and rawPredict calls, so per-agent / per-tenant
      breakdown works if your agent sets them (partner models use an X-Vertex-AI-Labels
      header).
      PER-REQUEST LOGS (release notes, 2026-10-30, a different page,
      https://docs.cloud.google.com/gemini-enterprise-agent-platform/release-notes):
      inference request metadata logging is GA; "Each entry records the model, region,
      consumption option, token counts, Provisioned Throughput usage, latency and error
      code." Agent Observability dashboards show token usage per agent.
      GAP: automatic attribution to agent identities and shared token budgets are in token
      management policies, which are not yet available (a different page,
      https://docs.cloud.google.com/gemini-enterprise-agent-platform/govern/policies/token-management-overview):
      "Support for token management policies is coming soon." (Paraphrase except quoted text.)
    source: https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/capabilities/add-labels-to-api-calls
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  apm_integration:
    product: Agent Observability (Cloud Monitoring, Cloud Trace, Cloud Logging)
    status: ga
    notes: >
      "Agent Runtime automatically collects and processes operational metrics for deployed
      agents." "You can use Agent Runtime using Cloud Monitoring without any additional
      setup or configuration." Built-in metrics: request count, latencies, container CPU and
      memory allocation; ADK 2.6.0+ adds GenAI-semconv metrics; PromQL and alerting
      supported. Logs go to Cloud Logging and traces to Cloud Trace (see otel_traces).
      LAUNCH STAGE (release notes, 2026-06-18, a different page,
      https://docs.cloud.google.com/gemini-enterprise-agent-platform/release-notes): "Agent
      Observability is generally available (GA)". The observability overview (a different
      page, https://docs.cloud.google.com/gemini-enterprise-agent-platform/optimize/observability/overview)
      notes agents "must be configured to send telemetry data in the OpenTelemetry format to
      storage systems in Google Cloud Observability." Agent Gateway's Cloud Trace
      integration is Preview. (Paraphrase except quoted text.)
    source: https://docs.cloud.google.com/gemini-enterprise-agent-platform/scale/runtime/monitoring
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  agent_optimization:
    product: ADK adk optimize (GEPA) + Prompt Optimizer
    status: documented
    notes: >
      "Automate agent optimization using the ADK's built-in adk optimize command." "This
      command applies the GEPA algorithm to iteratively refine root system instructions by
      evaluating them against your test suite." It sits in the "Quality Flywheel"
      (evaluate, cluster failures, optimize) alongside Agent Evaluation (see eval_service).
      PROMPT-LEVEL (prompt optimizer page, a different page,
      https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/prompts/prompt-optimizer):
      zero-shot, few-shot and data-driven optimizers; "While Prompt Optimizer is generally
      available", its SDK library is experimental.
      A/B testing is possible via revision traffic splitting (Preview — see
      versioning_rollout). Unlike AWS AgentCore Optimization, no managed service that
      proposes and A/B-tests tool-description changes was found; agent optimization runs in
      the SDK. Status `documented`: the agent-optimization page states no stage.
      (Paraphrase except quoted text.)
    source: https://docs.cloud.google.com/gemini-enterprise-agent-platform/optimize/evaluation/optimize-agent
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  feedback_service:
    product: Feedback service
    status: documented
    notes: >
      "Collect, manage, and trace user qualitative feedback alongside system events and
      telemetry." No direct AWS/Azure equivalent found yet — candidate new taxonomy row
      in d6.
    source: https://docs.cloud.google.com/gemini-enterprise-agent-platform/scale
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  versioning_rollout:
    product: Agent Runtime revisions and traffic splitting
    status: preview
    notes: >
      Revisions are immutable snapshots of an agent, created whenever versioned fields
      (package, env, secrets, scaling, identity, agent card, etc.) change. "You can then
      split traffic between the different active revisions. Traffic splitting lets you test
      and gradually increase traffic to new revisions" — i.e. canary and rollback by
      shifting traffic. Archiving is one-way: "When a revision is archived, it is
      permanently retired from serving traffic and cannot be restored."
      LAUNCH STAGE: the page carries a Preview banner (Pre-GA Offerings Terms) and "At this
      time, revisions and traffic splitting are available through the v1beta1 API".
      Hard revision caps are in service_limits; changing an Agent Gateway binding archives
      every earlier revision. (Paraphrase except quoted text.)
    source: https://docs.cloud.google.com/gemini-enterprise-agent-platform/scale/runtime/manage-revisions-and-traffic
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  private_networking:
    status: documented
    notes: >
      Security matrix (CHANGED since 2026-08-04): VPC Service Controls = Yes for Agent
      Runtime, Agent evaluation, Sessions, Memory Bank, Code Execution; No for Example Store
      only (Agent evaluation was No in August). CMEK follows the same pattern, with the
      caveat that "For deployed agents on Agent Runtime, CMEK is supported only on
      single-region endpoints and isn't supported on multi-regional endpoints" (us or eu).
      Access Transparency / Access Approval = Yes for Agent Runtime, Sessions, Memory
      Bank ONLY.
      Private connectivity: a guide to "Use a Private Service Connect interface with Agent
      Platform Runtime" to connect an agent to your VPC. That PSC page (a different page,
      https://docs.cloud.google.com/gemini-enterprise-agent-platform/scale/runtime/private-service-connect-interface)
      adds: "Agent Runtime supports Private Service Connect interface (PSC interface) and
      DNS peering to enable private and secure egress traffic", with traffic that "travels
      securely within Google's network, never traversing the public internet"; internet
      egress then needs an explicit path in your VPC (e.g. a proxy VM). The Agent Platform release notes
      (a DIFFERENT source, https://docs.cloud.google.com/gemini-enterprise-agent-platform/release-notes)
      add that "Agent Gateway now enforces VPC Service Controls
      perimeter rules for agent communications." (2026-09-09), and sandboxes gained
      VPC-SC and PSC support on 2026-09-09.
    source: https://docs.cloud.google.com/gemini-enterprise-agent-platform/scale
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  certifications:
    status: documented
    notes: >
      Partial evidence: the enterprise security matrix's HIPAA row reads Yes for all six
      services (Agent Runtime, Agent evaluation, Sessions, Memory Bank, Example Store,
      Code Execution). Table reading, not a sentence on the page.
      Broader cert list (SOC 2, ISO, PCI) not on this page.
    source: https://docs.cloud.google.com/gemini-enterprise-agent-platform/scale
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  sovereign_cloud:
    product: Google Distributed Cloud air-gapped (Gemini on GDC) + Assured Workloads
    status: documented
    notes: >
      MODELS YES, AGENT PLATFORM UNCONFIRMED. "Gemini is now available on GDC." — GDC
      air-gapped lets customers "Operate fully disconnected, while still integrating
      Google's AI capabilities", and lists Translation, Speech-to-Text and OCR as built-in AI
      solutions.
      SOVEREIGN CLOUD (a different page, https://cloud.google.com/sovereign-cloud): "Build
      with Gemini and the Gemini platform using guaranteed in-region machine learning
      processing, Confidential Computing, and Model Armor".
      ASSURED WORKLOADS (a different page,
      https://docs.cloud.google.com/assured-workloads/docs/supported-products): the
      supported-products-by-data-boundary table lists "Generative AI on Vertex AI"
      (aiplatform.googleapis.com, the same API as Agent Runtime) under many control
      packages; the table is filter-driven, so per-package coverage was not parsed.
      CAVEAT: none of these pages states that Agent Runtime, Sessions, Memory Bank or Agent
      Gateway run on GDC air-gapped; treat the hosted agent platform as public-cloud only
      until Google says otherwise. No stage stated. (Paraphrase except quoted text.)
    source: https://cloud.google.com/distributed-cloud-air-gapped
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  runtime_regions:
    status: documented
    value:
      regions: 23
      region_list: [us-east1, us-east4, us-west1, us-central1, europe-west1, europe-west2, europe-west3, europe-west4, europe-west6, europe-west8, europe-southwest1, asia-east1, asia-east2, asia-northeast1, asia-northeast3, asia-south1, asia-southeast1, asia-southeast2, australia-southeast2, me-west1, northamerica-northeast1, northamerica-northeast2, southamerica-east1]
      multi_regions: [us, eu]
    notes: >
      23 SELF-SERVE REGIONS plus multi-regional endpoints, per "Supported locations for
      agents in Agent Platform". The table covers "Runtime", "Sessions", "Agent Platform
      Memory Bank", sandboxes and Agent Gateway in every listed region, each with "v1 is
      supported for GA features. v1beta1 is supported for Preview features." Exceptions:
      "Memory Bank is not supported in this region." for asia-southeast2,
      australia-southeast2 and northamerica-northeast2; "Agent Gateway is not supported in
      this region." for asia-east2, asia-northeast3 and asia-southeast2. Multi-regional: Memory Bank, Sessions, Runtime,
      "and Code Execution support multi-regional
      endpoints. Memory Bank and Sessions also support global endpoints." No allowlist or
      account-team gating is stated for any runtime region — hence `documented`.
      STATUS CHANGE 2026-11-23 (merge): limited -> documented, and source moved here from
      the Gemini Enterprise locations page (a different page,
      docs.cloud.google.com/gemini/enterprise/docs/locations). That page's in-country
      wording — "Using these locations is in GA with allowlist. To get access to these
      locations for use with Gemini Enterprise or Gemini Notebook for business, contact
      your Google account team." — gates Gemini Enterprise / Gemini Notebook (bucket C),
      not Agent Runtime, so it does not justify `limited` here. Its "Agent Runtime
      limitations" table (us/eu multi-regions and CA, IN, JP, SG, UK in-country) remains
      relevant for residency — see data_residency. That page also recommends global,
      which "provides better end-user response times, the latest model versions, and the
      most up-to-date features" — a Gemini Enterprise trade-off statement.
      Runtime is NOT listed for the global endpoint; global applies to Memory Bank and
      Sessions only, which the Agent Platform release notes (a different page,
      https://docs.cloud.google.com/gemini-enterprise-agent-platform/release-notes) mark GA:
      "Memory Bank and Sessions support for multi-regional and global endpoints is now in
      General Availability (GA)." The agent-locations table lists regions per feature;
      per-region launch stage of other services is not stated beyond the v1/v1beta1
      API-version rule. (Paraphrase except quoted text.)
    source: https://docs.cloud.google.com/gemini-enterprise-agent-platform/resources/agent-locations
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  tool_region_variance:
    status: documented
    notes: >
      YES, IT VARIES, and the platform's locations table discloses some of it. Per feature:
      "Memory Bank is not supported in this region." (asia-southeast2, australia-southeast2,
      northamerica-northeast2) and "Agent Gateway is not supported in this region."
      (asia-east2, asia-northeast3, asia-southeast2); Runtime, Sessions and the sandboxes
