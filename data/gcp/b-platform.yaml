provider: gcp
bucket: b
product: Gemini Enterprise Agent Platform
aliases:
  - Vertex AI Agent Engine
  - Vertex AI Reasoning Engine
  - Agent Runtime
  - Agent Platform Runtime
  - ReasoningEngine
notes: >
  The current product name is Gemini Enterprise Agent Platform. Agent Runtime is the managed
  runtime name, while ReasoningEngine remains the API resource name for backwards
  compatibility. The platform now documents Agent Identity, Agent Registry, Agent Gateway,
  Evaluation Service, Agent Observability, Sessions, Memory Bank, and sandbox services.
  (Paraphrase.)

capabilities:
  data_residency:
    status: documented
    notes: >
      Current Agent Platform location documentation says supported infrastructure locations
      provide at-rest residency for agent source code, deployment packages, session history,
      Memory Bank entries, and metadata. It lists regional, multi-regional, and global endpoint
      behavior, with separate ML-processing rules for the selected model endpoint. (Paraphrase.)
    source: https://docs.cloud.google.com/gemini-enterprise-agent-platform/resources/agent-locations
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  managed_agent_runtime:
    product: Agent Runtime
    status: ga
    notes: >
      Google Cloud's July 2026 first-party announcement says the newly generally available
      Agent Platform capabilities include Agent Runtime. The current runtime documentation
      describes it as fully managed and supports deployment, operation, scaling, custom
      containers, IAM, and VPC Service Controls. (Paraphrase.)
    source: https://cloud.google.com/blog/products/ai-machine-learning/whats-new-in-gemini-enterprise-agent-platform
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  managed_agent_loop:
    product: Managed Agents API
    status: preview
    notes: >
      Managed Agents API on Agent Platform is explicitly a Pre-GA offering for limited testing
      and evaluation, not commercial or production use. It provides an Agents API control plane,
      an Interactions API data plane, and isolated sandboxes with configurable external data and
      network access. (Paraphrase.)
    source: https://docs.cloud.google.com/gemini-enterprise-agent-platform/build/managed-agents
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  framework_agnosticism:
    status: documented
    value: [ADK, LangGraph, LangChain, LlamaIndex, AG2, CrewAI, A2A, custom]
    notes: >
      Current Agent Runtime documentation supports containerized agents in any language or
      framework that meets the runtime contract. It provides integrations for ADK, LangChain,
      LangGraph, LlamaIndex, AG2, and A2A, and a custom-template path for CrewAI and other
      frameworks. (Paraphrase.)
    source: https://docs.cloud.google.com/gemini-enterprise-agent-platform/build/runtime
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  short_term_memory:
    product: Sessions
    status: documented
    notes: >
      Sessions are a current Agent Platform service for storing individual interactions and
      maintaining conversation state. The current scale documentation lists session management,
      IAM Conditions, regional endpoints, and global endpoints. (Paraphrase.)
    source: https://docs.cloud.google.com/gemini-enterprise-agent-platform/scale
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  long_term_memory:
    product: Agent Platform Memory Bank
    status: documented
    notes: >
      Memory Bank is the current long-term-memory service for storing and retrieving user
      preferences and facts across sessions. The current documentation includes memory profiles,
      generation, ingestion, retrieval, revisions, IAM Conditions, and regional residency
      guidance. (Paraphrase.)
    source: https://docs.cloud.google.com/gemini-enterprise-agent-platform/scale/memory-bank
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  code_interpreter:
    product: Code Execution
    status: documented
    notes: >
      Code Execution provides a secure, isolated, managed sandbox. Current documentation states
      that sandboxes support file input and output up to 100 MB per request or response and can
      retain execution state for up to 14 days with configurable TTL. The reviewed page does not
      label the service GA or Preview, so this row remains documented. (Paraphrase.)
    source: https://docs.cloud.google.com/gemini-enterprise-agent-platform/scale/sandbox/code-execution-overview
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  browser_use:
    product: Agent Platform Computer Use
    status: documented
    notes: >
      Agent Platform currently lists Computer Use under its sandbox services. The reviewed
      documentation confirms the product area but does not provide enough current detail to
      claim a browser implementation, Playwright support, or a launch stage. (Paraphrase.)
    source: https://docs.cloud.google.com/gemini-enterprise-agent-platform/scale
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  knowledge_base:
    product: Agent Retrieval
    status: documented
    notes: >
      The current Agent Platform product navigation includes Agent Retrieval for retrieval
      workloads. This refresh does not infer a specific vector-search version or claim a
      launch stage without a current capability page that states it. (Paraphrase.)
    source: https://docs.cloud.google.com/gemini-enterprise-agent-platform/scale
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  mcp_registry:
    product: Agent Registry
    status: documented
    notes: >
      Agent Registry is the current first-party registry for agents, MCP servers, tools,
      endpoints, and skills. It supports discovery and governance and supplies identifiers used
      by Agent Gateway and IAM policies. (Paraphrase.)
    source: https://docs.cloud.google.com/agent-registry/overview
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  mcp_server_hosting:
    product: Agent Gateway
    status: documented
    notes: >
      Agent Gateway is the governance and security enforcement layer for agent traffic. Current
      documentation says it mediates MCP, A2A, REST, and gRPC traffic and can govern agents and
      MCP servers on Agent Runtime and GKE; Cloud Run and cross-cloud support are Limited
      Preview. This is gateway governance, not evidence that Google hosts arbitrary MCP server
      code as a managed server product. (Paraphrase.)
    source: https://docs.cloud.google.com/gemini-enterprise-agent-platform/govern/gateways/agent-gateway-overview
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  eval_service:
    product: Agent Evaluation
    status: ga
    notes: >
      Google's first-party announcement identifies Agent Evaluation as one of the newly
      generally available Agent Platform capabilities. It describes online production
      evaluation monitors and prebuilt, custom-Python, LLM-as-a-judge, and adaptive-rubric
      metrics. (Paraphrase.)
    source: https://cloud.google.com/blog/products/ai-machine-learning/whats-new-in-gemini-enterprise-agent-platform
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  otel_traces:
    status: documented
    notes: >
      Agent Runtime tracing uses Cloud Trace and OpenTelemetry instrumentation. Current docs
      describe spans for LLM and tool operations and expose the latest GenAI semantic
      conventions as experimental, so this row does not claim stable OTel semantic-convention
      conformance. (Paraphrase.)
    source: https://docs.cloud.google.com/gemini-enterprise-agent-platform/scale/runtime/tracing
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  feedback_service:
    product: Feedback service
    status: documented
    notes: >
      Agent Platform currently documents a Feedback service for collecting, managing, and
      tracing qualitative user feedback alongside system events and telemetry. (Paraphrase.)
    source: https://docs.cloud.google.com/gemini-enterprise-agent-platform/scale
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  private_networking:
    status: documented
    notes: >
      Agent Runtime supports a Private Service Connect interface and DNS peering for private
      egress to VPC, on-premises, and multi-cloud resources. The current documentation says the
      path stays within Google's network and that explicit VPC egress configuration is required
      for internet access. (Paraphrase.)
    source: https://docs.cloud.google.com/gemini-enterprise-agent-platform/scale/runtime/private-service-connect-interface
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  certifications:
    status: documented
    notes: >
      The current Agent Platform security matrix marks HIPAA support for Agent Runtime, Agent
      evaluation, Sessions, Memory Bank, Example Store, and Code Execution. The reviewed page
      does not provide a complete SOC 2, ISO, or PCI list for the platform. (Paraphrase.)
    source: https://docs.cloud.google.com/gemini-enterprise-agent-platform/scale
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  runtime_regions:
    status: documented
    value:
      regional_examples: [us-east1, us-east4, us-west1, us-central1, europe-west1, europe-west4, asia-northeast1, asia-southeast1]
      multi_regions: [global, us, eu]
    notes: >
      Agent Platform infrastructure now has a regional location table covering US, European,
      Asian, Middle Eastern, North American, and South American regions, plus multi-regional and
      global endpoints. The page states that v1 supports GA features and v1beta1 supports
      Preview features; Memory Bank is unavailable in some marked regions and Agent Gateway is
      unavailable in some others. This is not the same location model as Gemini Enterprise's
      in-country allowlist. (Paraphrase.)
    source: https://docs.cloud.google.com/gemini-enterprise-agent-platform/resources/agent-locations
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  pricing_axes:
    status: documented
    notes: >
      The current Agent Runtime documentation links to separate Gemini Enterprise Agent
      Platform pricing. The reviewed scale and runtime pages establish usage-based platform
      services but do not provide a complete current breakdown of every runtime, memory,
      sandbox, and tool billing axis in the page text. (Paraphrase.)
    source: https://cloud.google.com/products/gemini-enterprise-agent-platform/pricing
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  runtime_sla:
    status: documented
    notes: >
      No new runtime-specific SLA wording was established in the current pages reviewed for
      this refresh. The existing SLA evidence is retained separately from the runtime feature
      documentation. (Paraphrase.)
    source: https://cloud.google.com/vertex-ai/generative-ai/sla
    verified_on: 2026-08-09
    verified_by: "@notacryptodad"

  long_running_agents:
    status: documented
    notes: >
      The current first-party announcement says Agent Runtime supports agents that run
      continuously for up to seven days. This is a current product-page capability statement;
      it is not treated as a launch-stage claim. (Paraphrase.)
    source: https://cloud.google.com/blog/products/ai-machine-learning/whats-new-in-gemini-enterprise-agent-platform
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  agent_workload_identity:
    status: documented
    notes: >
      Agent Identity provides a per-agent SPIFFE-based cryptographic identity, X.509
      credentials, IAM integration, and audit attribution. Agent Runtime documentation also
      describes agent identity as an option distinct from service accounts. (Paraphrase.)
    source: https://docs.cloud.google.com/gemini-enterprise-agent-platform/govern/agent-identity-overview
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  delegated_user_auth:
    status: documented
    notes: >
      The current Agent Identity documentation supports user-delegated authority through
      three-legged OAuth and describes an auth manager for acquiring, managing, and securing
      delegated end-user tokens. (Paraphrase.)
    source: https://docs.cloud.google.com/gemini-enterprise-agent-platform/govern/agent-identity-overview
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  guardrails:
    product: Model Armor + Agent Gateway policies
    status: documented
    notes: >
      Agent Gateway documentation describes Model Armor prompt and tool-response inspection,
      semantic governance policies, IAM unified access policies, and token-management policies.
      Token-management policies and extension bindings are explicitly marked as coming soon;
      this row therefore does not claim all gateway policy types are GA. (Paraphrase.)
    source: https://docs.cloud.google.com/gemini-enterprise-agent-platform/govern/gateways/agent-gateway-overview
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  iac_coverage:
    status: documented
    notes: >
      The current Agent Runtime page documents Agents CLI automation using Terraform and CI/CD
      workflows using Cloud Build. The reviewed evidence supports Terraform and Cloud Build,
      but does not establish complete resource coverage for every Agent Platform service.
      (Paraphrase.)
    source: https://docs.cloud.google.com/gemini-enterprise-agent-platform/build/runtime
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  training_data_policy:
    status: documented
    notes: >
      The current Google Cloud terms and Gemini Enterprise documentation remain the relevant
      first-party evidence for customer-data handling. The current platform pages reviewed here
      do not restate a separate Agent Platform-specific training-use guarantee, so this row is
      not expanded beyond the existing Google Cloud policy evidence. (Paraphrase.)
    source: https://cloud.google.com/terms/data-processing-addendum
    verified_on: 2026-08-09
    verified_by: "@notacryptodad"
