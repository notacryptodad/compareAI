    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  agent_workload_identity:
    product: Agent Identity
    status: ga
    notes: >
      A DEDICATED AGENT IDENTITY, not just service accounts: "Agent Identity provides a
      strongly attested, cryptographic identity for each agent that is based on the SPIFFE
