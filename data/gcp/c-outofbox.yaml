provider: gcp
bucket: c
product: Gemini Enterprise
aliases: [Agentspace, Google Agentspace, Gemini Enterprise Agent Gallery, Gemini Enterprise app]
notes: >
  Gemini Enterprise is Google's current intranet search, assistant, and agent product. The
  current overview describes permission-aware enterprise search, prebuilt connectors, custom
  agents, and the Agent Gallery. Current documentation now separates Business from Standard,
  Plus, Pay-as-you-go, and Frontline editions. (Paraphrase.)

capabilities:
  packaged_assistant:
    status: documented
    notes: >
      Gemini Enterprise is positioned as an intranet search and AI assistant that can answer
      questions, create content, handle tasks, and host agents over connected enterprise data.
      (Paraphrase.)
    source: https://docs.cloud.google.com/gemini/enterprise/docs
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  permission_aware_retrieval:
    status: documented
    notes: >
      The current overview states that Gemini Enterprise enforces access-controlled search
      results and generative answers, with SSO and user-level access as part of its trust model.
      (Paraphrase.)
    source: https://docs.cloud.google.com/gemini/enterprise/docs
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  prebuilt_connectors:
    status: documented
    notes: >
      The current overview names Confluence, Jira, Microsoft SharePoint, and ServiceNow as
      examples of prebuilt third-party connectors. The current connector documentation also
      lists Google data sources, third-party data sources, ingestion, federation, and actions,
      with individual launch-stage labels varying by connector. No total connector count is
      inferred. (Paraphrase.)
    source: https://docs.cloud.google.com/gemini/enterprise/docs/connectors/create-data-store
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  invoke_custom_agents:
    status: documented
    notes: >
      Gemini Enterprise can host custom AI agents and provides an Agent Gallery. The current
      gallery supports Google-made agents, organizational agents, Marketplace agents, and
      custom agents built through Workflow Builder. This evidence does not claim that every
      external agent protocol or framework is supported by the packaged product. (Paraphrase.)
    source: https://docs.cloud.google.com/gemini/enterprise/docs/agent-gallery
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  seat_pricing:
    status: unknown
    notes: >
      The current official editions page enumerates Business, Standard, Plus, Pay-as-you-go,
      and Frontline editions and describes prepaid-credit or invoiced billing, but it does not
      publish the seat prices needed for a current comparable value. Prices are therefore left
      unknown rather than carried forward from the older page. (Paraphrase.)
    source: https://docs.cloud.google.com/gemini/enterprise/docs/editions
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  license_bundling:
    status: documented
    notes: >
      The current editions page describes Gemini Enterprise as editions licensed through a
      Google Cloud project or, for Business, a separate SaaS application. It does not support
      the previous claim that the product is bundled with Google Workspace editions, so that
      claim has been removed. (Paraphrase.)
    source: https://docs.cloud.google.com/gemini/enterprise/docs/editions
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  authoring_mode:
    status: documented
    value: both
    notes: >
      Gemini Enterprise combines no-code Workflow Builder agents with a gallery that can run
      prebuilt, organizational, Marketplace, and Google-made agents. The current gallery page
      documents creation of chat agents and multi-step workflows. (Paraphrase.)
    source: https://docs.cloud.google.com/gemini/enterprise/docs/agent-gallery
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  model_choosable:
    status: documented
    notes: >
      Current Gemini Enterprise documentation gives administrators model availability controls
      and documents automated routing on the product page. The location table lists current
      Google models and partner models, but it does not establish unrestricted end-user model
      selection. Some model availability is location- and edition-dependent. (Paraphrase.)
    source: https://docs.cloud.google.com/gemini/enterprise/docs/locations
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  index_freshness:
    status: documented
    notes: >
      The current connector documentation distinguishes ingestion from federation. Ingestion
      copies source data into a search index, while federated connectors query the source without
      copying it into the Vertex AI Search index. The documentation does not provide one global
      freshness SLA for all connectors. (Paraphrase.)
    source: https://docs.cloud.google.com/gemini/enterprise/docs/connectors/create-data-store
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  index_residency:
    status: documented
    value: [global, us, eu, br, ca, in, asia-northeast1, sg, europe-west2]
    notes: >
      Current Gemini Enterprise location documentation lists global, US, and EU multi-regions
      plus Brazil, Canada, India, Japan, Singapore, and the United Kingdom as in-country
      locations with allowlist access. It documents at-rest residency and model-processing
      limitations by location, including models that route to global when unavailable in the
      selected location. (Paraphrase.)
    source: https://docs.cloud.google.com/gemini/enterprise/docs/locations
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  admin_analytics:
    status: documented
    notes: >
      Gemini Enterprise Analytics provides adoption, usage and quality, agent, value, and
      user-level metrics. Current documentation says metrics refresh about every six hours;
      search analytics are Public Preview for US/EU apps and GA for global apps, while the
      User Level tab requires an allowlist. (Paraphrase.)
    source: https://docs.cloud.google.com/gemini/enterprise/docs/view-analytics
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  dlp_tenant_isolation:
    status: documented
    notes: >
      Current editions documentation identifies VPC Service Controls, CMEK, data residency,
      Access Transparency, and Cloud Audit Logs as enterprise controls. Gemini Enterprise also
      supports IAM and source-system ACLs for access control. Model Armor can screen prompts,
      connector data, and responses, but its integration does not de-identify or mask data; it
      blocks according to the configured enforcement policy. (Paraphrase.)
    source: https://docs.cloud.google.com/gemini/enterprise/docs/editions
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  guardrails:
    product: Model Armor
    status: documented
    notes: >
      Model Armor is supported for all Gemini Enterprise editions at no additional cost. The
      current integration supports inspect-and-block or inspect-only enforcement, prompt and
      response templates, connector-data screening, audit logs, and configurable fail-open or
      fail-closed behavior when Model Armor is unavailable. (Paraphrase.)
    source: https://docs.cloud.google.com/gemini/enterprise/docs/enable-model-armor
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"

  training_data_policy:
    status: documented
    notes: >
      The current Gemini Enterprise editions page says customer prompts, responses, and
      enterprise data are not used to train foundation models and describes this as part of
      Google Cloud enterprise privacy terms. (Paraphrase.)
    source: https://docs.cloud.google.com/gemini/enterprise/docs/editions
    verified_on: 2026-11-22
    verified_by: "@notacryptodad"
