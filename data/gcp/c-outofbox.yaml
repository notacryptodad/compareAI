provider: gcp
bucket: c
product: Gemini Enterprise
aliases: [Agentspace, Google Agentspace, Gemini Enterprise Agent Gallery]
notes: >
  "Gemini Enterprise is an intranet search, AI assistant, and agentic platform."
  Note the three-in-one framing — it is the only bucket-C entry here that presents itself
  as a *platform* as well as an assistant, which blurs the B/C line for this provider
  (its agent platform is separately branded Gemini Enterprise Agent Platform, see
  gcp/b-platform.yaml).
  Renamed from Agentspace. No GA/preview/experimental label anywhere on the overview page,
  consistent with Google's house style across all its agent docs — hence `documented`.
  Page last updated 2026-08-03 UTC.
  URL NOTE: cloud.google.com/gemini-enterprise/docs 301-redirects to
  docs.cloud.google.com/gemini/enterprise/docs (note the path change, gemini-enterprise ->
  gemini/enterprise). Several plausible URL shapes 404.

capabilities:
  packaged_assistant:
    status: documented
    notes: >
      Purchasable, unlike AWS's Q Business. Positioned as intranet search + assistant +
      agent host in one product, offering a single multimodal search interface.
      (Paraphrase.)
    source: https://docs.cloud.google.com/gemini/enterprise/docs
    verified_on: 2026-08-04
    verified_by: "@notacryptodad"

  permission_aware_retrieval:
    status: documented
    notes: >
      Yes — described as "permissions-aware access to enterprise information", with the
      ability to "Enforce access-controlled search results and generative answers at
      scale". Trust attributed to "SSO and user-level access".
      Admin docs additionally cover IAM roles, app-level access controls, and mapping
      external identities for custom data sources — that last one matters for
      non-Google-identity estates and is a gap in several competitors.
    source: https://docs.cloud.google.com/gemini/enterprise/docs
    verified_on: 2026-08-04
    verified_by: "@notacryptodad"

  prebuilt_connectors:
    status: documented
    notes: >
      LARGEST CONNECTOR CATALOG OF THE THREE BUCKET-C PRODUCTS RESEARCHED, and the only one
      that also accepts custom MCP servers.
      Overview names "prebuilt connectors for commonly-used third-party applications like
      Confluence, Jira, Microsoft SharePoint, and ServiceNow".
      Navigation shows a much wider catalog: Google sources (Drive, Gmail, Chat, Calendar,
      BigQuery, Cloud Storage, Cloud SQL, Spanner, Firestore, Bigtable, AlloyDB) and dozens
      of third-party (Box, Dropbox, Salesforce, Slack, Notion, Zendesk, GitHub/GitLab,
      Microsoft OneDrive/Outlook/Teams, Zoho, others), plus custom connectors and custom
      MCP servers.
      CAVEAT: the wide catalog is a NAV-derived count; only the four named above appear in
      overview prose. Do not publish a connector total from this evidence.
      Notable that it indexes Microsoft 365 sources — a cross-cloud reach Microsoft's own
      Copilot does not reciprocate for Google Workspace.
    source: https://docs.cloud.google.com/gemini/enterprise/docs
    verified_on: 2026-08-04
    verified_by: "@notacryptodad"

  invoke_custom_agents:
    status: documented
    notes: >
      Strongest custom-agent story in bucket C. It can "host custom AI agents that apply
      generative AI contextually", and admins can "Use out-of-the-box agents, available to
      you in the Agent Gallery".
      Registration covers Dialogflow, A2A, ADK and A2UI agents, plus Marketplace and Agent
      Registry imports.
      A2A support means it can receive agents built OUTSIDE Google — the only bucket-C
      product here documenting an open-protocol path in. Compare Azure, which documents the
      bridge from its own platform side but via Microsoft-specific protocols.
    source: https://docs.cloud.google.com/gemini/enterprise/docs
    verified_on: 2026-08-04
    verified_by: "@notacryptodad"

  seat_pricing:
    status: documented
    value:
      business: USD 21/seat/month
      standard: USD 30/seat/month (annual)
      plus: USD 30+/seat/month (annual)
    notes: >
      Gemini Business: $21/seat/month — "Great for individuals, small businesses, and teams
      up to 300—no IT setup needed." 30-day free trial.
      Gemini Enterprise Standard and Plus: "Starting at $30 per seat per month" (annual).
      "Looking for advanced features and enterprise-grade compliance? Contact sales about
      Gemini Enterprise app - Standard or Plus editions."
      Business lacks "some security and management capabilities and offers less cloud
      storage" per press reports.
      Notable: a SEPARATE product from Google Workspace Gemini features (which are now
      included in Workspace Business/Enterprise plans at no extra charge since Jan 2025).
    source: https://cloud.google.com/gemini-enterprise/business
    verified_on: 2026-08-09
    verified_by: "@notacryptodad"

  license_bundling:
    status: documented
    notes: >
      Gemini Enterprise is available as part of Google Workspace editions. Standard, Plus,
      Pay-as-you-go, and Frontline editions documented — implying Workspace bundling rather
      than standalone purchase. "Get subscriptions and assign licenses" language confirms
      seat-based assignment within the Workspace admin console.
      This is the same bundling model as Microsoft's M365 Copilot (add-on to existing
      Workspace license) and a direct commercial competitor.
    source: https://docs.cloud.google.com/gemini/enterprise/docs
    verified_on: 2026-08-09
    verified_by: "@notacryptodad"

  authoring_mode:
    status: documented
    value: both
    notes: >
      Agent Gallery provides out-of-the-box agents (no-code consumption) while custom
      agents can be built and registered (code path) — both routes documented.
    source: https://docs.cloud.google.com/gemini/enterprise/docs
    verified_on: 2026-08-04
    verified_by: "@notacryptodad"

  model_choosable:
    status: documented
    notes: >
      Model selection IS available — the locations page shows per-model availability:
      Gemini 3.5 Flash, Gemini 3.1 Pro, Gemini 3.6 Flash listed with different residency
      constraints per region. Administrators can toggle specific models (e.g. "turn on the
      Gemini 3.6 Flash toggle"). This is model-choosable at the ADMIN level (which models
      are available to users), not end-user model selection. Similar to M365 Copilot where
      the underlying model is managed but admins control rollout.
    source: https://docs.cloud.google.com/gemini/enterprise/docs/locations
    verified_on: 2026-08-09
    verified_by: "@notacryptodad"
  index_freshness:
    status: documented
    notes: >
      Two data ingestion modes documented: federation (live queries to source) and
      indexing (copy into search index). "Data federation gets the required information
      directly from the original data source without copying it into the Vertex AI Search
      index. Data ingestion (indexing) copies data into the Vertex AI Search index,
      enabling features like Knowledge Graph and Natural Language Processing."
      Federation = real-time freshness; indexing = connector sync schedule.
      Analytics metrics "refreshed about every 6 hours" — suggests near-real-time for
      search but not instant. No explicit SLA on index freshness.
    source: https://cloud.google.com/agentspace/agentspace-enterprise/docs/introduction-to-connectors-and-data-stores
    verified_on: 2026-08-09
    verified_by: "@notacryptodad"
  index_residency:
    status: documented
    value: [global, us, eu, ca, in, asia-northeast1, sg, europe-west2]
    notes: >
      Same locations as the platform tier. "When ingesting data, you need to select the
      region where you want to store the data, such as global, the US, or the EU."
      "Data stored in the US or EU regions require data encryption." CMEK available for
      US/EU multi-regions only. In-country regions (CA, IN, JP, SG, UK) available with
      allowlist. The global location "provides better end-user response times, the latest
      model versions, and the most up-to-date features."
      API endpoints differ: eu-discoveryengine.googleapis.com / us-discoveryengine.googleapis.com.
    source: https://cloud.google.com/agentspace/docs/locations
    verified_on: 2026-08-09
    verified_by: "@notacryptodad"
  admin_analytics:
    status: documented
    notes: >
      "Analytics give you insight into the usage trends, search quality, and end-user
      engagement of your app. The console provides an interactive dashboard experience
      powered by Looker." Metrics include: daily/weekly/monthly active users, search
      session counts, per-search and per-session metrics. Filterable by date range, query,
      device type, data store. Comparison mode available (baseline vs. comparison period).
      "For data stores in US and EU multi-regions, viewing search analytics is in Public
      preview. Search analytics are GA for global data stores."
      Analytics can be disabled at app creation with disableAnalytics: true.
    source: https://cloud.google.com/agentspace/agentspace-enterprise/docs/view-analytics
    verified_on: 2026-08-09
    verified_by: "@notacryptodad"
  dlp_tenant_isolation:
    status: documented
    notes: >
      Multi-layered security: VPC Service Controls integration ("enacts security measures"
      including blocking public internet access and gating access via Access Context
      Manager), CMEK for US/EU multi-regions, Access Transparency, and IAM-based tenant
      isolation. VPC-SC "primarily aims to prevent data exfiltration by creating a secure
      service perimeter around your projects and resources." Actions to external services
      blocked by default under VPC-SC, requiring allowlisting.
      Model Armor provides DLP-adjacent screening: "blocks any response from the Gemini
      Enterprise assistant that triggers Sensitive Data Protection (SDP) filters."
    source: https://docs.cloud.google.com/gemini/enterprise/docs/use-vpc-service-controls
    verified_on: 2026-08-09
    verified_by: "@notacryptodad"
  guardrails:
    product: Model Armor
    status: documented
    notes: >
      "Model Armor is a Google Cloud service that enhances the security and safety of your
      AI applications by proactively screening the prompts and responses given by the
      Gemini Enterprise assistant." Available on all editions at no additional cost.
      Enforcement types: Inspect-and-block (default) or Inspect-only.
      Fail modes: FAIL_CLOSED (block all when Model Armor unavailable, default) or
      FAIL_OPEN (allow through). "Gemini Enterprise provides a Service Level Agreement.
      When Gemini Enterprise is configured to use Model Armor, blocked queries don't count
      as SLA violations."
      Document screening: attached documents screened against configured policies.
      Audit logging via Data Access logs for screening verdicts.
    source: https://docs.cloud.google.com/gemini/enterprise/docs/enable-model-armor
    verified_on: 2026-08-09
    verified_by: "@notacryptodad"
  training_data_policy:
    status: documented
    notes: >
      Covered by Google Cloud's Data Processing Addendum (DPA) — customer data processed
      by Gemini Enterprise is not used to train or improve Google's foundation models.
      Same commitment as the platform tier (bucket B) and consistent with Azure/AWS Q
      Business. No separate Gemini Enterprise-specific policy page found.
    source: https://cloud.google.com/terms/data-processing-addendum
    verified_on: 2026-08-09
    verified_by: "@notacryptodad"
