provider: gcp
bucket: c
product: Gemini Enterprise
aliases: [Agentspace, Google Agentspace, Gemini Enterprise Agent Gallery, Gemini Enterprise app]
notes: >
  "Gemini Enterprise is an intranet search, AI assistant, and agentic platform."
  Note the three-in-one framing — it is the only bucket-C entry here that presents itself
  as a *platform* as well as an assistant, which blurs the B/C line for this provider
  (its agent platform is separately branded Gemini Enterprise Agent Platform, see
  gcp/b-platform.yaml).
  Renamed from Agentspace. Product name "Gemini Enterprise" still current as of
  2026-11-23. The old cloud.google.com/agentspace/agentspace-enterprise/docs/* pages now
  404; their content lives under docs.cloud.google.com/gemini/enterprise/docs/* (e.g.
  .../connectors/introduction-to-connectors-and-data-stores, .../view-analytics).
  SUB-FEATURE RENAMES since August (per the Gemini Enterprise release notes): Agent
  Designer -> Workflow Builder (GA 2026-09-03); NotebookLM Enterprise -> Gemini Notebook
  Enterprise (2026-07-16) -> Gemini Notebook for business (2026-11-12).
  NEW SCOPE: Standard/Plus/Pay-as-you-go editions now include "AI developer tools"
  (Antigravity 2.0, Antigravity CLI, Android Studio) — GA 2026-08-18 per the Gemini
  Enterprise release notes — which is Google's successor
  to Gemini Code Assist (see gcp/d-devtools.yaml).
  No GA/preview/experimental label on the overview page, consistent with Google's house
  style — hence `documented` unless a release note states the stage.
  Overview page last updated 2026-11-10 UTC.
  URL NOTE: cloud.google.com/gemini-enterprise/docs 301-redirects to
  docs.cloud.google.com/gemini/enterprise/docs (note the path change, gemini-enterprise ->
  gemini/enterprise). cloud.google.com/agentspace/docs/locations now redirects to
  docs.cloud.google.com/gemini/enterprise/docs/locations.

capabilities:
  packaged_assistant:
    status: documented
    notes: >
      Purchasable, unlike AWS's Q Business. Positioned as intranet search + assistant +
      agent host in one product, offering "a single, multimodal search interface".
      Editions: Business, plus "Standard, Plus, Pay-as-you-go, and Frontline Editions".
      (Paraphrase except quoted text.)
    source: https://docs.cloud.google.com/gemini/enterprise/docs
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  permission_aware_retrieval:
    status: documented
    notes: >
      Yes — described as "permissions-aware access to enterprise information", with the
      ability to "Enforce access-controlled search results and generative answers at
      scale". Trust attributed to "SSO and user-level access".
      Admin docs (navigation on a different page — the connectors overview) additionally
      cover app-level access controls and mapping external identities for custom data
      sources — that last one matters for non-Google-identity estates. The release notes
      add (2026-08-20) that Google Identity is supported for third-party data sources
      with external IdPs such as Entra ID or Okta via OIDC/SAML. (Paraphrase.)
    source: https://docs.cloud.google.com/gemini/enterprise/docs
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  prebuilt_connectors:
    status: documented
    notes: >
      LARGEST CONNECTOR CATALOG OF THE THREE BUCKET-C PRODUCTS RESEARCHED, and the only one
      that also accepts custom MCP servers.
      Overview names "prebuilt connectors for commonly-used third-party applications like
      Confluence, Jira, Microsoft SharePoint, and ServiceNow".
      Navigation on a different page (the connectors overview,
      https://docs.cloud.google.com/gemini/enterprise/docs/connectors/introduction-to-connectors-and-data-stores)
      shows a much wider catalog:
      Google sources (Drive, Gmail, Chat, Calendar, Sites, BigQuery, Cloud SQL, Spanner,
      AlloyDB) and well over a hundred third-party entries (Box, Dropbox, Salesforce, Slack,
      Notion, Zendesk, GitHub/GitLab, Microsoft OneDrive/Outlook/Teams/SharePoint, Zoho,
      many newer partner data stores), plus "Connect a custom MCP server" and custom
      connectors. Many partner data stores added since August are Public Preview per the
      release notes; custom MCP server data stores went GA on 2026-08-07.
      CAVEAT: the wide catalog is a NAV-derived count; only the four named above appear in
      overview prose. Do not publish a connector total from this evidence.
      Notable that it indexes Microsoft 365 sources.
    source: https://docs.cloud.google.com/gemini/enterprise/docs
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  web_search_tool:
    status: documented
    notes: >
      Built in, admin-controlled, with a residency-compliant option. In the Enable web
      grounding section admins pick "Google search (not Data Residency compliant) to use
      the standard Google Search index for grounding." or "Enterprise web search (Data
      Residency compliant) to use the enterprise-grade and compliant web index." A
      default web search state toggle sets whether new queries use web search by default;
      "Users can always change this setting manually for each search."
      The Compare editions page (a different page,
      https://docs.cloud.google.com/gemini/enterprise/docs/editions) ticks Ground with
      Google Search and Web Grounding for every edition. COMPLIANCE CAVEAT: the compliance
      page (https://docs.cloud.google.com/gemini/enterprise/docs/compliance-security-controls,
      a different page) footnotes that data residency, CMEK, VPC-SC and Access
      Transparency "Doesn't apply when Grounding with Google Search is enabled."
      (Paraphrase except quoted text.)
    source: https://docs.cloud.google.com/gemini/enterprise/docs/configure-assistant
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  ai_service_tools:
    status: documented
    notes: >
      First-party generative services are exposed as admin-toggled web-app features
      rather than as a tool API: "When enabled, users can generate images in the web
      app." (choice of image model; Gemini 3 Pro image and Gemini 3.1 Flash image are
      each stated as "generally available (GA) and is turned off by default"), "When
      enabled, users can generate videos in the web app.", and speech-to-text dictation
      ("users can dictate their prompts into the web app, using the mic icon in the chat
      box"). Also canvas / app builder and Gemini Notebook for business.
      Made-by-Google agents on the Compare editions page (a different page,
      https://docs.cloud.google.com/gemini/enterprise/docs/editions): Deep Research (all
      editions) and Data Insights. No OCR or translation tool is named on these pages.
      (Paraphrase except quoted text.)
    source: https://docs.cloud.google.com/gemini/enterprise/docs/manage-web-app-features
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  invoke_custom_agents:
    status: documented
    notes: >
      Strongest custom-agent story in bucket C. It can "host custom AI agents that apply
      generative AI contextually", and admins can "Use out-of-the-box agents, available to
      you in the" Agent Gallery.
      Registration (navigation on a different page — the connectors overview) covers
      Dialogflow, A2A, ADK and A2UI agents, plus Google Cloud Marketplace A2A agents and
      Agent Registry imports.
      A2A support means it can receive agents built OUTSIDE Google — the only bucket-C
      product here documenting an open-protocol path in. Compare Azure, which documents the
      bridge from its own platform side but via Microsoft-specific protocols.
    source: https://docs.cloud.google.com/gemini/enterprise/docs
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  seat_pricing:
    status: documented
    value:
      business: USD 21/seat/month
      standard: USD 30/seat/month (starting)
      plus: USD 30+/seat/month
    notes: >
      Gemini Enterprise Business edition: "Starting at $21 per seat per month". 30-day
      trial — "Great for individuals, small businesses, and teams up to 300—no IT setup
      needed."
      "Looking for advanced features and enterprise-grade compliance? Contact sales about
      Gemini Enterprise Standard or Plus editions."
      Standard/Plus price is NOT on this page any more; the Antigravity pricing page (a
      different page, https://antigravity.google/pricing) states "Standard/Plus plans starting at $30 USD per seat per month"
      for eligible Gemini Enterprise customers, plus a pay-as-you-go plan with a $0 seat fee.
      Notable: a SEPARATE product from Google Workspace Gemini features.
      REMOVED 2026-11-23: the August note's press-report claim about Business-edition
      limitations was not from this page and has been dropped.
    source: https://cloud.google.com/gemini-enterprise/business
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  license_bundling:
    status: documented
    notes: >
      Editions: Business, and "Standard, Plus, Pay-as-you-go, and Frontline Editions".
      BUNDLE CHANGE since August (from the Gemini Enterprise and Gemini Code Assist release
      notes, a different page,
      https://docs.cloud.google.com/gemini/enterprise/docs/release-notes): "AI developer tools is generally available (GA) for Gemini
      Enterprise Standard, Plus, and Pay-as-you-go editions with an invoiced Cloud Billing
      account." (2026-08-18) — i.e. Antigravity coding tools are now bundled into Gemini
      Enterprise seats, while new Standard/Plus subscriptions no longer include a Gemini
      Code Assist entitlement (from 2026-10-09). Licenses are assigned in the Google Cloud
      console ("Get subscriptions and assign licenses" is in the admin navigation on the
      connectors overview page,
      https://docs.cloud.google.com/gemini/enterprise/docs/connectors/introduction-to-connectors-and-data-stores).
      CORRECTED 2026-11-23: the August note said Gemini Enterprise is available as part of
      Google Workspace editions; the overview page does not say that, and the Antigravity
      FAQ says Workspace plans don't include Antigravity plans. Removed.
      DELIVERY MODEL BY EDITION (Compare editions page, a different page,
      https://docs.cloud.google.com/gemini/enterprise/docs/editions): "Gemini
      Enterprise Business edition is a software as a service (SaaS) application accessible
      through the web at business.gemini.google." with "no project numbers or project-level
      IAM roles to manage"; Business is 1-500 users, while Standard, Plus, Pay-as-you-go
      and Frontline are administered per Google Cloud project, and Pay-as-you-go usage is
      paid from prepaid credits (self-serve billing) or the monthly invoice (invoiced
      billing). (Paraphrase except quoted text.)
    source: https://docs.cloud.google.com/gemini/enterprise/docs
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  addon_surcharges:
    status: documented
    notes: >
      POOLED QUOTAS + OPTIONAL OVERAGE, not per-connector fees. License editions include
      a pooled quota per feature; with pay-as-you-go usage above quota turned on, "Usage
      above your pooled quotas is charged at pay-as-you-go rates." Without it, usage of a
      feature stops at quota until reset. The Pay-as-you-go edition is "An edition with no
      license fee and no pooled quota."
      Compare editions page (a different page,
      https://docs.cloud.google.com/gemini/enterprise/docs/editions): pooled storage and
      indexing of 25 / 30 / 75 GiB per user (Business / Standard / Plus), connector
      breadth gated by edition rather than priced per connector, and partner (Anthropic) model use in AI
      developer tools "is billed as pay-as-you-go usage".
      INCLUDED: "Model Armor is supported on all Gemini Enterprise editions at no
      additional cost." (a different page,
      https://docs.cloud.google.com/gemini/enterprise/docs/enable-model-armor).
      No per-connector or per-index surcharge is stated on these pages. (Paraphrase
      except quoted text.)
    source: https://docs.cloud.google.com/gemini/enterprise/docs/manage-costs-overview
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  authoring_mode:
    status: documented
    value: both
    notes: >
      Agent Gallery provides out-of-the-box agents ("Use out-of-the-box agents") while
      custom agents can be built and registered (code path). No-code path is now Workflow
      Builder — per the release notes (a different page,
      https://docs.cloud.google.com/gemini/enterprise/docs/release-notes), "Workflow Builder (formerly known
      as Agent Designer) is generally available (GA) in Gemini Enterprise." (2026-09-03).
      Both routes documented.
      Agent Gallery page (a different page,
      https://docs.cloud.google.com/gemini/enterprise/docs/agent-gallery): filter
      categories are Made by Google, From your organization, Your agents and Marketplace;
      the + New agent button opens Workflow Builder, which builds chat agents and
      workflows — "multi-step automated workflows configured with triggers and connector
      actions." (Paraphrase except quoted text.)
    source: https://docs.cloud.google.com/gemini/enterprise/docs
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  model_choosable:
    status: documented
    notes: >
      Model selection IS available and now includes THIRD-PARTY models. The locations page
      lists per-model availability for Gemini 4 Neon / Hydrogen / Carbon / Argon, Gemini
      3.8 / 3.7 / 3.6 / 3.5 Flash, Gemini 3.1 Pro, Gemini 2.5 Pro, and Anthropic Claude
      Opus 5.5 and Claude Sonnet 5.5, each with different residency constraints.
      Admin-gated: "To make Claude Opus 5.5 available to users in the Gemini Enterprise app,
      administrators must turn on the Claude Opus 5.5 toggle in the Enable third-party
      models section." Gemini models have per-model toggles (e.g. "Administrators can turn
      on or turn off the Gemini 3.8 Flash toggle in the Gemini Enterprise app.").
      Per the release notes (a different page,
      https://docs.cloud.google.com/gemini/enterprise/docs/release-notes, 2026-10-15), once enabled "users can select
      the model in the model selector" — so this is admin-curated END-USER choice, broader
      than in August (Gemini-only, admin toggles).
    source: https://docs.cloud.google.com/gemini/enterprise/docs/locations
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  index_freshness:
    status: documented
    notes: >
      Two data connection modes: "Data federation directly retrieves information from the
      specified data source." — no copy, but "because the data is not indexed, search
      quality might be lower." "Data ingestion (indexing) copies data into the Gemini
      Enterprise index." — better quality, more storage and time.
      Ingestion freshness is set by SYNC SCHEDULES: full syncs of identity + entity data
      "can be scheduled simultaneously for every 3 hours, 6 hours, 12 hours, 1 day, or 3
      days"; identity data alone can sync as often as every 30 minutes; "By default, an
      incremental sync is performed every 3 hours." Incremental syncs don't capture
      deletions or identity changes.
      So: federation = query-time freshness; indexing = 3-hour default lag at best for
      content. No explicit SLA on index freshness.
      SOURCE CHANGE 2026-11-23: the Agentspace-era URL 404s; content moved here (wording
      now says "Gemini Enterprise index" instead of Vertex AI Search index).
    source: https://docs.cloud.google.com/gemini/enterprise/docs/connectors/introduction-to-connectors-and-data-stores
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  conversation_history:
    status: documented
    notes: >
      ADMIN-SET RETENTION: in the Chat history retention period section admins "can
      select 1, 30, 60, 90, 120, or 180 days (the default is 60 days)." "Chat sessions
      older than the selected retention period are automatically deleted." — age is
      counted from chat creation, so recently-used chats can vanish without warning.
      The release notes (a different page,
      https://docs.cloud.google.com/gemini/enterprise/docs/release-notes, 2026-03-11)
      label this control "generally available (GA)".
      PERSONALIZATION (feature management page, a different page,
      https://docs.cloud.google.com/gemini/enterprise/docs/manage-web-app-features): with
      memory and customization on, "Gemini Enterprise uses past conversations and saved
      memory settings to generate personalized and relevant responses."; session sharing
      lets users share conversations. No stage stated for memory — hence `documented`
      for the row. (Paraphrase except quoted text.)
    source: https://docs.cloud.google.com/gemini/enterprise/docs/configure-assistant
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  index_residency:
    status: documented
    value: [global, us, eu, br, ca, in, asia-northeast1, sg, europe-west2]
    notes: >
      Same locations as the platform tier, plus Brazil. Multi-regions us ("API
      availability in the United States") and eu, and in-country regions "API availability
      in Brazil", Canada, India, Japan, Singapore and the UK — "Using these locations is in
      GA with allowlist." Brazil (br) is NEW since August. CMEK requires the US or EU
      multi-region ("CMEK is also not available in the global region."). The global
      location "provides better end-user response times, the latest model versions, and
      the most up-to-date features."
      API endpoints differ: eu-discoveryengine.googleapis.com / us-discoveryengine.googleapis.com.
      The connectors overview (a different page) adds that the region is chosen when
      ingesting data and that US/EU-stored data requires encryption. (Paraphrase.)
      SOURCE CHANGE 2026-11-23: cloud.google.com/agentspace/docs/locations now redirects
      here.
    source: https://docs.cloud.google.com/gemini/enterprise/docs/locations
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  admin_analytics:
    status: documented
    notes: >
      "Analytics give you insight into the usage trends, search quality, and end-user
      engagement of your app. The console provides an interactive dashboard experience
      powered by Looker." "Metrics are refreshed about every 6 hours".
      Tabs: Adoption, Usage and Quality, Agent (Google-made, Gemini Notebook and
      custom-registered agents), Value (cost savings), and User Level — "You must be on an
      allowlist to see data on the User Level tab."
      Stage is split by location: "For apps in US and EU multi-regions, viewing search
      analytics is in Public preview. Search analytics are GA for global apps." — hence
      `documented` for the row as a whole.
      SOURCE CHANGE 2026-11-23: the Agentspace-era URL 404s; content moved here. NEW since
      August: Agent, Value and User Level tabs. REMOVED: the August note's
      disableAnalytics detail is not on this page.
    source: https://docs.cloud.google.com/gemini/enterprise/docs/view-analytics
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  feedback_service:
    status: documented
    notes: >
      Built-in thumbs feedback on the search widget: "When the feedback feature is turned
      on, the widget rendered on your web page displays Thumbs up and Thumbs down
      buttons." A thumbs-down prompts for a reason and comments. Feedback surfaces on the
      app's Analytics page (not as telemetry spans). Residency caveat: "If your app is
      located in the global region, then the widget feedback is visible to your Google
      Cloud administrator and Google." In a multi-region only the admin sees it.
      (Paraphrase except quoted text.)
    source: https://docs.cloud.google.com/gemini/enterprise/docs/configure-feedback
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  dlp_tenant_isolation:
    status: documented
    notes: >
      VPC Service Controls integration: once the perimeter restricts the Discovery Engine
      API, "VPC Service Controls enacts the following security measures": the API "can no
      longer be accessed from the public internet", UI access is blocked except via ingress
      rules, and creating new data stores is blocked until an admin allows the data sources
      and egress domains. Access Context Manager gates access by attributes.
      "VPC Service Controls primarily aims to prevent data exfiltration by creating a
      secure service perimeter around your projects and resources."
      CMEK for US/EU multi-regions (key rotation GA 2026-09-14 per the release notes).
      DLP: the Model Armor page (a different page) says Gemini Enterprise blocks assistant
      responses that trigger Sensitive Data Protection detectors, and the release notes
      (2026-08-31) add Sensitive Data Protection content policies for connectors, apps and
      notebooks. (Paraphrase for the cross-page items.)
      EDITIONS SUMMARY (Compare editions page, a different page,
      https://docs.cloud.google.com/gemini/enterprise/docs/editions): Gemini Enterprise
      supports VPC Service Controls, CMEK, data residency (us, eu, global), Access
      Transparency and Cloud Audit Logs. (Paraphrase — the page's link markup breaks
      verbatim matching.)
    source: https://docs.cloud.google.com/gemini/enterprise/docs/use-vpc-service-controls
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  guardrails:
    product: Model Armor
    status: documented
    notes: >
      "Model Armor is a Google Cloud service that enhances the security and safety of your
      AI applications by proactively screening the prompts and responses given by the
      Gemini Enterprise assistant." Data from out-of-the-box data stores is screened with
      the same template. "Model Armor is supported on all Gemini Enterprise editions at no
      additional cost."
      Enforcement types: Inspect and block (the console default) or Inspect only.
      Fail modes: FAIL_CLOSED (default) or FAIL_OPEN. Gemini Enterprise provides a Service
      Level Agreement, and "When Gemini Enterprise is configured to use Model Armor, blocked
      queries don't count as SLA violations"
      Caveat: "Model Armor does not remove or alter personally identifiable information
      (PII) or mask sensitive data."
      Uploaded images and documents are also screened. Audit logging via Data Access logs.
    source: https://docs.cloud.google.com/gemini/enterprise/docs/enable-model-armor
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  tool_audit_trail:
    status: documented
    notes: >
      Two layers. (1) Usage audit logs in Cloud Logging — they "provide detailed
      information about who performed what action, when, and from where." Logged service
      paths include SearchService.Search and AssistantService.Assist / StreamAssist, with
      agent identity fields (agent, agent_kind, spiffe_id) and the answer's steps.actions.
      Prompt/response content is logged only when "Enable logging of prompt inputs and
      response outputs" is turned on; otherwise sensitive text is elided.
      (2) Traces (a different page,
      https://docs.cloud.google.com/gemini/enterprise/docs/access-traces-and-spans): each
      user turn is a root span with child execute_tool and invoke_connector spans —
      i.e. per-tool-call records — once the OpenTelemetry instrumentation observability
      setting is on (traces/metrics are Public Preview per the release notes).
      Admin and data-access operations also go to Cloud Audit Logs under
      discoveryengine.googleapis.com (https://docs.cloud.google.com/gemini/enterprise/docs/audit-logging).
      (Paraphrase except quoted text.)
    source: https://docs.cloud.google.com/gemini/enterprise/docs/set-up-usage-audit-logs
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  training_data_policy:
    status: documented
    notes: >
      Service Specific Terms, "Training Restriction": "Google will not use Customer Data to
      train or fine-tune any AI/ML models without Customer's prior permission or
      instruction." This sits in the AI/ML Services section; the list of services that
      count as AI/ML Services is published at cloud.google.com/terms/services (not re-read
      here), and Gemini Enterprise has its own section in these terms. The Gemini
      Enterprise Business marketing page also says "You control your data; we don’t train
      on it" (a different page, https://cloud.google.com/gemini-enterprise/business).
      Consistent with the platform tier (bucket B) and with
      Azure/AWS Q Business.
      SOURCE CHANGE 2026-11-23: previously cited the Cloud Data Processing Addendum, which
      does not itself contain a training restriction.
      PRODUCT-PAGE CONFIRMATION (Compare editions page, a different page,
      docs.cloud.google.com/gemini/enterprise/docs/editions): "Customer prompts,
      responses, and enterprise data are not used to train foundation models. Governed by
      Google Cloud enterprise privacy terms."
    source: https://cloud.google.com/terms/service-terms
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  certifications:
    status: documented
    value: [HIPAA, FedRAMP, ISO 27001, ISO 27017, ISO 27018, ISO 27701, SOC 1, SOC 2, SOC 3, PCI DSS, BSI C5:2020]
    notes: >
      The compliance page says the agentic AI service formerly known as Agentspace (part
      of Standard and Plus) and Gemini Notebook Enterprise "have many of the following
      certifications": HIPAA, FedRAMP, ISO 27001, ISO 27017, ISO 27018, ISO 27701, SOC 1,
      SOC 2, SOC 3, PCI DSS and BSI C5:2020 — and points to the per-standard Google Cloud
      pages to confirm. Confirmed on those pages (each a different page): ISO 27001
      (https://cloud.google.com/security/compliance/iso-27001) and SOC 2
      (https://cloud.google.com/security/compliance/soc-2) in-scope lists include
      "Gemini Enterprise (including Agentspace)"; ISO 42001
      (https://cloud.google.com/security/compliance/iso-42001) lists Gemini Enterprise.
      EXCLUSIONS: Antigravity in Gemini Enterprise doesn't support FedRAMP, IL4/IL5, ITAR,
      ISO (incl. 27001 and 42001) or SOC 1/2/3; AlphaEvolve doesn't support ITAR, FedRAMP
      or IL4/IL5. Business edition is not named on the page. (Paraphrase except quoted
      text.)
    source: https://docs.cloud.google.com/gemini/enterprise/docs/compliance-security-controls
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  sovereign_cloud:
    status: documented
    product: Assured Workloads
    notes: >
      VIA ASSURED WORKLOADS DATA BOUNDARIES (public cloud), not a separate sovereign
      region. The supported-products page lists Gemini Enterprise
      (discoveryengine.googleapis.com) under the Data Boundary for CJIS, FedRAMP Moderate,
      FedRAMP High, IL2, IL4 and IRS 1075, and under regional boundaries including EU, UK,
      Japan, Canada, Australia, India, Singapore, Switzerland, Brazil and US. NOT listed
      under IL5, ITAR, Healthcare and Life Sciences, Canada Protected B, EU or KSA with
      Access Justifications, or Switzerland with EU Support. Footnote: "Gemini Enterprise
      includes support for the Web Grounding for Enterprise feature." The release notes
      (a different page, https://docs.cloud.google.com/gemini/enterprise/docs/release-notes,
      2026-08-31) add federated data stores inside Assured Workloads folders "to meet
      FedRAMP High standards", stated "generally available (GA)".
      Google's sovereign cloud page (https://cloud.google.com/sovereign-cloud, a different
      page) also offers enterprise search on air-gapped Google Distributed Cloud, but does
      not name Gemini Enterprise as available there. (Paraphrase except quoted text.)
    source: https://docs.cloud.google.com/assured-workloads/docs/supported-products
    verified_on: 2026-11-23
    verified_by: "@notacryptodad"

  launch_stage_investigation:
    product: Gemini Enterprise
    status: ga
    notes: >
      HEADLINE STAGE (July 31, 2025 entry, "Gemini Enterprise: General Availability"):
      "Gemini Enterprise is generally available (GA)." Status follows the launch-stage convention (taxonomy hint): the row carries the headline product's stated stage.
      Stages live in the release notes, not product pages (overview carries none).
